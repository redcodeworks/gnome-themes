ramp = [[0,"#0a1e24"],[34.67,"#0a1e24"],[55.33,"#162a2d"],[66.33,"#2e403d"],
        [86.67,"#495950"],[156,"#acb595"],[179,"#acb595"],[250,"#ecf0c1"],
        [255,"#ecf0c1"]]
fg = "#ecf0c1"
top = "#ecf0c1"
accent_fg = "#0a1e2c"
view = "#0a1e24"
[shell.dark.fam]
blue = ["#3584e4","#1dd3ee"]
red = ["#c01c28","#ff4d83"]
orange = ["#ff7800","#8f8b6f"]
green = ["#26a269","#1f8c3b"]
[shell.dark.exact]
"#cd9309" = "#1fc95b"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#acb595"      # web-login title, dim text
"#54545a" = "#2e403d"      # notification/message card: surface
"#45454a" = "#223535"      # message card stacked behind the front one: bg and surface mixed 50 %

