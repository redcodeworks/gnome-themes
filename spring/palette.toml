title = "Spring"
gtk_name = "Spring"
shell_name = "Spring-Shell"
credit = "Spring (colours of the Ptyxis built-in 'Spring'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Spring.yml)"
default_accent = "blue"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#0a1e24"],[53,"#162a2d"],[66,"#2e403d"],
        [91,"#495950"],[145,"#768370"],[238,"#ecf0c1"],[255,"#ecf0c1"]]
fg = "#ecf0c1"
top = "#ecf0c1"
