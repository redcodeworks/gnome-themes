red = ["#cc0000","#ff4d83"]
orange = ["#f57900","#1fc95b"]
green = ["#4e9a06","#1f8c3b"]
[dark.exact]
"#26ab62" = "#1f8c3b"
"#26a269" = "#1f8c3b"      # GTK4 stock success green
"#3584e4" = "#1dd3ee"
"#eeeeec" = "#ecf0c1"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
