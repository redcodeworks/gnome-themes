# SPDX-License-Identifier: MIT
# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #000000 5.5% towards fg
# derived: dark.surface derived: #000000 16.0% towards fg
# derived: dark.surface_high derived: #000000 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #e5c07c (it equals the default accent; keeps accent tokens unique)
title = "One Half Black"
gtk_name = "One-Half-Black"
shell_name = "One-Half-Black-Shell"
credit = "One Half Black (colours of the Ptyxis built-in 'One Half Black'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/One%20Half%20Black.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#000000"],[53,"#0c0c0d"],[66,"#232424"],
        [91,"#3e3e40"],[145,"#6a6b6e"],[238,"#dcdfe4"],[255,"#dcdfe4"]]
fg = "#dcdfe4"
top = "#dcdfe4"
accent_fg = "#000000"
view = "#000000"
[dark.fam]
blue = ["#15539e","#e5c07b"]
red = ["#cc0000","#e06c75"]
orange = ["#f57900","#e5c07c"]
green = ["#4e9a06","#98c379"]
[dark.exact]
"#26ab62" = "#98c379"
"#26a269" = "#98c379"      # GTK4 stock success green
"#3584e4" = "#e5c07b"
"#eeeeec" = "#dcdfe4"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#000000"],[34.67,"#000000"],[55.33,"#0c0c0d"],[66.33,"#232424"],
        [86.67,"#3e3e40"],[156,"#9ea0a4"],[179,"#9ea0a4"],[250,"#dcdfe4"],
        [255,"#dcdfe4"]]
fg = "#dcdfe4"
top = "#dcdfe4"
accent_fg = "#000000"
view = "#000000"
[shell.dark.fam]
blue = ["#3584e4","#e5c07b"]
red = ["#c01c28","#e06c75"]
orange = ["#ff7800","#e29678"]
green = ["#26a269","#98c379"]
[shell.dark.exact]
"#cd9309" = "#e5c07c"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9ea0a4"      # web-login title, dim text
"#54545a" = "#232424"      # notification/message card: surface
"#45454a" = "#181818"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#e06c75"
fg = "#000000"
[accents.dark.green]
color = "#98c379"
fg = "#000000"
[accents.dark.yellow]
color = "#e5c07b"
fg = "#000000"
[accents.dark.blue]
color = "#61afef"
fg = "#000000"
[accents.dark.magenta]
color = "#c678dd"
fg = "#000000"
[accents.dark.cyan]
color = "#56b6c2"
fg = "#000000"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#000000"
bg = "#0c0c0d"
surface = "#232424"
surface_high = "#3e3e40"
popover = "#3e3e40"
fg = "#dcdfe4"
red = "#e06c75"
green = "#98c379"
yellow = "#e5c07c"
accent = "#e5c07b"
accent_fg = "#000000"
warning_fg = "#000000"
secondary_sidebar = "#0c0c0d"
