# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #282828 5.5% towards fg
# derived: dark.surface derived: #282828 16.0% towards fg
# derived: dark.surface_high derived: #282828 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #282828 -> #282830 (the text colour varies per accent: the default needs its own token)
title = "Tender"
gtk_name = "Tender"
shell_name = "Tender-Shell"
credit = "Tender (colours of the Ptyxis built-in 'Tender'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Tender.yml)"
default_accent = "blue"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#282828"],[53,"#333333"],[66,"#484848"],
        [91,"#5f5f5f"],[145,"#878787"],[238,"#eeeeee"],[255,"#eeeeee"]]
fg = "#eeeeee"
top = "#eeeeee"
accent_fg = "#282830"
view = "#282828"
[dark.fam]
blue = ["#15539e","#b3deef"]
red = ["#cc0000","#c5152f"]
orange = ["#f57900","#ffc24b"]
green = ["#4e9a06","#c9d05c"]
[dark.exact]
"#26ab62" = "#c9d05c"
"#26a269" = "#c9d05c"      # GTK4 stock success green
"#3584e4" = "#b3deef"
"#eeeeec" = "#eeeeee"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#282828"],[34.67,"#282828"],[55.33,"#333333"],[66.33,"#484848"],
        [86.67,"#5f5f5f"],[156,"#b6b6b6"],[179,"#b6b6b6"],[250,"#eeeeee"],
        [255,"#eeeeee"]]
fg = "#eeeeee"
top = "#eeeeee"
accent_fg = "#282830"
view = "#282828"
[shell.dark.fam]
blue = ["#3584e4","#b3deef"]
red = ["#c01c28","#c5152f"]
orange = ["#ff7800","#e26c3d"]
green = ["#26a269","#c9d05c"]
[shell.dark.exact]
"#cd9309" = "#ffc24b"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b6b6b6"      # web-login title, dim text
"#54545a" = "#484848"      # notification/message card: surface
"#45454a" = "#3e3e3e"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#c5152f"
fg = "#eeeeee"
[accents.dark.green]
color = "#c9d05c"
