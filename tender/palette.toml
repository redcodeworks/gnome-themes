[accents.dark.yellow]
color = "#ffc24b"
fg = "#282830"
[accents.dark.blue]
color = "#b3deef"
fg = "#282830"
[accents.dark.magenta]
color = "#d3b987"
fg = "#282830"
[accents.dark.cyan]
color = "#73cef4"
fg = "#282830"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#282828"
bg = "#333333"
surface = "#484848"
surface_high = "#5f5f5f"
