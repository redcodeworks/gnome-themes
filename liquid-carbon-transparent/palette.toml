# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #000000 5.5% towards fg
# derived: dark.surface derived: #000000 16.0% towards fg
# derived: dark.surface_high derived: #000000 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
title = "Liquid Carbon Transparent"
gtk_name = "Liquid-Carbon-Transparent"
shell_name = "Liquid-Carbon-Transparent-Shell"
credit = "Liquid Carbon Transparent (colours of the Ptyxis built-in 'Liquid Carbon Transparent'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Liquid%20Carbon%20Transparent.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#000000"],[53,"#0a0b0b"],[66,"#1c1f1f"],
        [91,"#313636"],[145,"#545d5d"],[238,"#afc2c2"],[255,"#afc2c2"]]
fg = "#afc2c2"
top = "#afc2c2"
accent_fg = "#000000"
view = "#000000"
[dark.fam]
blue = ["#15539e","#7ac4cc"]
red = ["#cc0000","#ff3030"]
orange = ["#f57900","#ccac00"]
green = ["#4e9a06","#559a70"]
[dark.exact]
"#26ab62" = "#559a70"
"#26a269" = "#559a70"      # GTK4 stock success green
"#3584e4" = "#7ac4cc"
"#eeeeec" = "#afc2c2"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#000000"],[34.67,"#000000"],[55.33,"#0a0b0b"],[66.33,"#1c1f1f"],
        [86.67,"#313636"],[156,"#7e8b8b"],[179,"#7e8b8b"],[250,"#afc2c2"],
        [255,"#afc2c2"]]
fg = "#afc2c2"
top = "#afc2c2"
accent_fg = "#000000"
view = "#000000"
[shell.dark.fam]
blue = ["#3584e4","#7ac4cc"]
red = ["#c01c28","#ff3030"]
orange = ["#ff7800","#e66e18"]
green = ["#26a269","#559a70"]
[shell.dark.exact]
"#cd9309" = "#ccac00"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#7e8b8b"      # web-login title, dim text
"#54545a" = "#1c1f1f"      # notification/message card: surface
"#45454a" = "#131515"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff3030"
fg = "#000000"
[accents.dark.green]
color = "#559a70"
fg = "#000000"
[accents.dark.yellow]
color = "#ccac00"
fg = "#000000"
[accents.dark.blue]
color = "#0099cc"
fg = "#000000"
[accents.dark.magenta]
color = "#cc69c8"
fg = "#000000"
[accents.dark.cyan]
color = "#7ac4cc"
fg = "#000000"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#000000"
bg = "#0a0b0b"
surface = "#1c1f1f"
surface_high = "#313636"
popover = "#313636"
fg = "#afc2c2"
red = "#ff3030"
green = "#559a70"
yellow = "#ccac00"
accent = "#7ac4cc"
accent_fg = "#000000"
warning_fg = "#000000"
secondary_sidebar = "#0a0b0b"
