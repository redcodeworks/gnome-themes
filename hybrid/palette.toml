# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #141414 5.5% towards fg
# derived: dark.surface derived: #141414 16.0% towards fg
# derived: dark.surface_high derived: #141414 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #de9360 (it equals the default accent; keeps accent tokens unique)
title = "Hybrid"
gtk_name = "Hybrid"
shell_name = "Hybrid-Shell"
credit = "Hybrid (colours of the Ptyxis built-in 'Hybrid'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Hybrid.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#141414"],[53,"#1b1c1c"],[66,"#282b2b"],
        [91,"#383c3d"],[145,"#51595a"],[238,"#94a3a5"],[255,"#94a3a5"]]
fg = "#94a3a5"
top = "#94a3a5"
accent_fg = "#141414"
view = "#141414"
[dark.fam]
blue = ["#15539e","#de935f"]
red = ["#cc0000","#a54242"]
orange = ["#f57900","#de9360"]
green = ["#4e9a06","#8c9440"]
[dark.exact]
"#26ab62" = "#8c9440"
"#26a269" = "#8c9440"      # GTK4 stock success green
"#3584e4" = "#de935f"
"#eeeeec" = "#94a3a5"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#141414"],[34.67,"#141414"],[55.33,"#1b1c1c"],[66.33,"#282b2b"],
        [86.67,"#383c3d"],[156,"#707a7c"],[179,"#707a7c"],[250,"#94a3a5"],
        [255,"#94a3a5"]]
fg = "#94a3a5"
top = "#94a3a5"
accent_fg = "#141414"
view = "#141414"
[shell.dark.fam]
blue = ["#3584e4","#de935f"]
red = ["#c01c28","#a54242"]
orange = ["#ff7800","#c26a50"]
green = ["#26a269","#8c9440"]
[shell.dark.exact]
"#cd9309" = "#de9360"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#707a7c"      # web-login title, dim text
"#54545a" = "#282b2b"      # notification/message card: surface
"#45454a" = "#222424"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#a54242"
fg = "#141414"
[accents.dark.green]
color = "#8c9440"
fg = "#141414"
[accents.dark.yellow]
color = "#de935f"
fg = "#141414"
[accents.dark.blue]
color = "#5f819d"
fg = "#141414"
[accents.dark.magenta]
color = "#85678f"
fg = "#141414"
[accents.dark.cyan]
color = "#5e8d87"
fg = "#141414"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#141414"
bg = "#1b1c1c"
surface = "#282b2b"
surface_high = "#383c3d"
popover = "#383c3d"
fg = "#94a3a5"
red = "#a54242"
green = "#8c9440"
yellow = "#de9360"
