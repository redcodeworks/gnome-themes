# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Hybrid'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Hybrid.yml.
title = "Hybrid"
gtk_name = "Hybrid"
shell_name = "Hybrid-Shell"
credit = "Hybrid (colours of the Ptyxis built-in 'Hybrid'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Hybrid.yml)"
ptyxis = "Hybrid"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Hybrid' (bulk-built by tools/bulk-scheme.py)."
default_accent = "yellow"

[dark]
bg_deep = "#141414"
fg = "#94a3a5"
selection = "#2e3131"   # DERIVED
red = "#a54242"
orange = "#c26a50"   # DERIVED
yellow = "#de935f"
green = "#8c9440"
cyan = "#5e8d87"
blue = "#5f819d"
magenta = "#85678f"
purple = "#85678f"   # = magenta
# palette Color8 (bright black) = #373b41: a candidate for `comment`
[dark.ansi]
red = "#a54242"
green = "#8c9440"
yellow = "#de935f"
blue = "#5f819d"
magenta = "#85678f"
cyan = "#5e8d87"
[dark.terminal]
source = "Hybrid"   # Ptyxis built-in id
black = "#282a2e"   # Ptyxis Color0
white = "#969896"   # Ptyxis Color7
bright_black = "#373b41"   # Ptyxis Color8
bright_red = "#cc6666"   # Ptyxis Color9
bright_green = "#b5bd68"   # Ptyxis Color10
bright_yellow = "#f0c674"   # Ptyxis Color11
bright_blue = "#81a2be"   # Ptyxis Color12
bright_magenta = "#b294bb"   # Ptyxis Color13
bright_cyan = "#8abeb7"   # Ptyxis Color14
bright_white = "#c5c8c6"   # Ptyxis Color15
