# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #121212 5.5% towards fg
# derived: dark.surface derived: #121212 16.0% towards fg
# derived: dark.surface_high derived: #121212 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.green nudged to #a6e22f (it equals the default accent; keeps accent tokens unique)
title = "Hardcore"
gtk_name = "Hardcore"
shell_name = "Hardcore-Shell"
credit = "Hardcore (colours of the Ptyxis built-in 'Hardcore'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Hardcore.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#121212"],[53,"#1a1a1a"],[66,"#292929"],
        [91,"#3a3a3a"],[145,"#565656"],[238,"#a0a0a0"],[255,"#a0a0a0"]]
fg = "#a0a0a0"
top = "#a0a0a0"
accent_fg = "#121212"
view = "#121212"
[dark.fam]
blue = ["#15539e","#a6e22e"]
red = ["#cc0000","#f92672"]
orange = ["#f57900","#fd971f"]
green = ["#4e9a06","#a6e22f"]
[dark.exact]
"#26ab62" = "#a6e22f"
"#26a269" = "#a6e22f"      # GTK4 stock success green
"#3584e4" = "#a6e22e"
"#eeeeec" = "#a0a0a0"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#121212"],[34.67,"#121212"],[55.33,"#1a1a1a"],[66.33,"#292929"],
        [86.67,"#3a3a3a"],[156,"#787878"],[179,"#787878"],[250,"#a0a0a0"],
        [255,"#a0a0a0"]]
fg = "#a0a0a0"
top = "#a0a0a0"
accent_fg = "#121212"
view = "#121212"
[shell.dark.fam]
blue = ["#3584e4","#a6e22e"]
red = ["#c01c28","#f92672"]
orange = ["#ff7800","#fb5e48"]
green = ["#26a269","#a6e22f"]
[shell.dark.exact]
"#cd9309" = "#fd971f"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#787878"      # web-login title, dim text
"#54545a" = "#292929"      # notification/message card: surface
"#45454a" = "#222222"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
