# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Hardcore'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Hardcore.yml.
title = "Hardcore"
gtk_name = "Hardcore"
shell_name = "Hardcore-Shell"
credit = "Hardcore (colours of the Ptyxis built-in 'Hardcore'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Hardcore.yml)"
ptyxis = "Hardcore"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Hardcore' (bulk-built by tools/bulk-scheme.py)."
default_accent = "green"

[dark]
bg_deep = "#121212"
fg = "#a0a0a0"
selection = "#2e2e2e"   # DERIVED
red = "#f92672"
orange = "#fb5e48"   # DERIVED
yellow = "#fd971f"
green = "#a6e22e"
cyan = "#5e7175"
blue = "#66d9ef"
magenta = "#9e6ffe"
purple = "#9e6ffe"   # = magenta
# palette Color8 (bright black) = #505354: a candidate for `comment`
[dark.ansi]
red = "#f92672"
green = "#a6e22e"
yellow = "#fd971f"
blue = "#66d9ef"
magenta = "#9e6ffe"
cyan = "#5e7175"
[dark.terminal]
source = "Hardcore"   # Ptyxis built-in id
black = "#1b1d1e"   # Ptyxis Color0
white = "#ccccc6"   # Ptyxis Color7
bright_black = "#505354"   # Ptyxis Color8
bright_red = "#ff669d"   # Ptyxis Color9
bright_green = "#beed5f"   # Ptyxis Color10
bright_yellow = "#e6db74"   # Ptyxis Color11
bright_cyan = "#a3babf"   # Ptyxis Color14
bright_white = "#f8f8f2"   # Ptyxis Color15
