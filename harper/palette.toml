# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #010101 5.5% towards fg
# derived: dark.surface derived: #010101 16.0% towards fg
# derived: dark.surface_high derived: #010101 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #d6da26 (it equals the default accent; keeps accent tokens unique)
title = "Harper"
gtk_name = "Harper"
shell_name = "Harper-Shell"
credit = "Harper (colours of the Ptyxis built-in 'Harper'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Harper.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#010101"],[53,"#0a0a0a"],[66,"#1c1b1a"],
        [91,"#302f2d"],[145,"#514f4c"],[238,"#a8a49d"],[255,"#a8a49d"]]
fg = "#a8a49d"
top = "#a8a49d"
accent_fg = "#010101"
view = "#010101"
[dark.fam]
blue = ["#15539e","#d6da25"]
red = ["#cc0000","#f8b63f"]
orange = ["#f57900","#d6da26"]
green = ["#4e9a06","#7fb5e1"]
[dark.exact]
"#26ab62" = "#7fb5e1"
"#26a269" = "#7fb5e1"      # GTK4 stock success green
"#3584e4" = "#d6da25"
"#eeeeec" = "#a8a49d"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#010101"],[34.67,"#010101"],[55.33,"#0a0a0a"],[66.33,"#1c1b1a"],
        [86.67,"#302f2d"],[156,"#797671"],[179,"#797671"],[250,"#a8a49d"],
        [255,"#a8a49d"]]
fg = "#a8a49d"
top = "#a8a49d"
accent_fg = "#010101"
view = "#010101"
[shell.dark.fam]
blue = ["#3584e4","#d6da25"]
red = ["#c01c28","#f8b63f"]
orange = ["#ff7800","#e7c832"]
green = ["#26a269","#7fb5e1"]
[shell.dark.exact]
"#cd9309" = "#d6da26"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#797671"      # web-login title, dim text
"#54545a" = "#1c1b1a"      # notification/message card: surface
"#45454a" = "#131212"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#f8b63f"
fg = "#010101"
[accents.dark.green]
color = "#7fb5e1"
fg = "#010101"
[accents.dark.yellow]
color = "#d6da25"
fg = "#010101"
[accents.dark.blue]
color = "#489e48"
fg = "#010101"
[accents.dark.magenta]
color = "#b296c6"
fg = "#010101"
[accents.dark.cyan]
color = "#f5bfd7"
fg = "#010101"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#010101"
bg = "#0a0a0a"
surface = "#1c1b1a"
surface_high = "#302f2d"
popover = "#302f2d"
fg = "#a8a49d"
red = "#f8b63f"
green = "#7fb5e1"
yellow = "#d6da26"
accent = "#d6da25"
