# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #0000a4 5.5% towards fg
# derived: dark.surface derived: #0000a4 16.0% towards fg
# derived: dark.surface_high derived: #0000a4 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #ffffb7 (it equals the default accent; keeps accent tokens unique)
title = "Borland"
gtk_name = "Borland"
shell_name = "Borland-Shell"
credit = "Borland (colours of the Ptyxis built-in 'Borland'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Borland.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#0000a4"],[53,"#0e0e9f"],[66,"#292996"],
        [91,"#47478c"],[145,"#7a7a7b"],[238,"#ffff4e"],[255,"#ffff4e"]]
fg = "#ffff4e"
top = "#ffff4e"
accent_fg = "#0000a4"
view = "#0000a4"
[dark.fam]
blue = ["#15539e","#ffffb6"]
red = ["#cc0000","#ff6c60"]
orange = ["#f57900","#ffffb7"]
green = ["#4e9a06","#a8ff60"]
[dark.exact]
"#26ab62" = "#a8ff60"
"#26a269" = "#a8ff60"      # GTK4 stock success green
"#3584e4" = "#ffffb6"
"#eeeeec" = "#ffff4e"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#0000a4"],[34.67,"#0000a4"],[55.33,"#0e0e9f"],[66.33,"#292996"],
        [86.67,"#47478c"],[156,"#b7b766"],[179,"#b7b766"],[250,"#ffff4e"],
        [255,"#ffff4e"]]
fg = "#ffff4e"
top = "#ffff4e"
accent_fg = "#0000a4"
view = "#0000a4"
[shell.dark.fam]
blue = ["#3584e4","#ffffb6"]
red = ["#c01c28","#ff6c60"]
orange = ["#ff7800","#ffb68b"]
green = ["#26a269","#a8ff60"]
[shell.dark.exact]
"#cd9309" = "#ffffb7"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b7b766"      # web-login title, dim text
"#54545a" = "#292996"      # notification/message card: surface
"#45454a" = "#1c1c9a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff6c60"
fg = "#0000a4"
[accents.dark.green]
color = "#a8ff60"
fg = "#0000a4"
[accents.dark.yellow]
color = "#ffffb6"
fg = "#0000a4"
[accents.dark.blue]
color = "#96cbfe"
fg = "#0000a4"
[accents.dark.magenta]
color = "#ff73fd"
fg = "#0000a4"
[accents.dark.cyan]
color = "#c6c5fe"
fg = "#0000a4"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#0000a4"
bg = "#0e0e9f"
surface = "#292996"
surface_high = "#47478c"
popover = "#47478c"
fg = "#ffff4e"
red = "#ff6c60"
green = "#a8ff60"
yellow = "#ffffb7"
accent = "#ffffb6"
accent_fg = "#0000a4"
warning_fg = "#0000a4"
secondary_sidebar = "#0e0e9f"
