# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #101010 5.5% towards fg
# derived: dark.surface derived: #101010 16.0% towards fg
# derived: dark.surface_high derived: #101010 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #7c7c9a (it equals the default accent; keeps accent tokens unique)
title = "Wryan"
gtk_name = "Wryan"
shell_name = "Wryan-Shell"
credit = "Wryan (colours of the Ptyxis built-in 'Wryan'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Wryan.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#101010"],[53,"#181817"],[66,"#262625"],
        [91,"#363635"],[145,"#52524f"],[238,"#999993"],[255,"#999993"]]
fg = "#999993"
top = "#999993"
accent_fg = "#101010"
view = "#101010"
[dark.fam]
blue = ["#15539e","#7c7c99"]
red = ["#cc0000","#8c4665"]
orange = ["#f57900","#7c7c9a"]
green = ["#4e9a06","#287373"]
[dark.exact]
"#26ab62" = "#287373"
"#26a269" = "#287373"      # GTK4 stock success green
"#3584e4" = "#7c7c99"
"#eeeeec" = "#999993"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#101010"],[34.67,"#101010"],[55.33,"#181817"],[66.33,"#262625"],
        [86.67,"#363635"],[156,"#72726e"],[179,"#72726e"],[250,"#999993"],
        [255,"#999993"]]
fg = "#999993"
top = "#999993"
accent_fg = "#101010"
view = "#101010"
[shell.dark.fam]
blue = ["#3584e4","#7c7c99"]
red = ["#c01c28","#8c4665"]
orange = ["#ff7800","#84617f"]
green = ["#26a269","#287373"]
[shell.dark.exact]
"#cd9309" = "#7c7c9a"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#72726e"      # web-login title, dim text
"#54545a" = "#262625"      # notification/message card: surface
"#45454a" = "#1f1f1e"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#8c4665"
fg = "#101010"
[accents.dark.green]
color = "#287373"
fg = "#101010"
[accents.dark.yellow]
color = "#7c7c99"
fg = "#101010"
[accents.dark.blue]
color = "#395573"
fg = "#101010"
[accents.dark.magenta]
color = "#5e468c"
fg = "#101010"
[accents.dark.cyan]
color = "#31658c"
fg = "#101010"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#101010"
bg = "#181817"
surface = "#262625"
surface_high = "#363635"
popover = "#363635"
fg = "#999993"
red = "#8c4665"
green = "#287373"
yellow = "#7c7c9a"
accent = "#7c7c99"
