# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #31363b 5.5% towards fg
# derived: dark.surface derived: #31363b 16.0% towards fg
# derived: dark.surface_high derived: #31363b 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #31363b -> #313643 (the text colour varies per accent: the default needs its own token)
title = "Maia"
gtk_name = "Maia"
shell_name = "Maia-Shell"
credit = "Maia (colours of the Ptyxis built-in 'Maia'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Maia.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#31363b"],[53,"#393e43"],[66,"#474d51"],
        [91,"#585d62"],[145,"#747a7e"],[238,"#bdc3c7"],[255,"#bdc3c7"]]
fg = "#bdc3c7"
top = "#bdc3c7"
accent_fg = "#313643"
view = "#31363b"
[dark.fam]
blue = ["#15539e","#00cccc"]
red = ["#cc0000","#ba2922"]
orange = ["#f57900","#4c4f4d"]
green = ["#4e9a06","#7e807e"]
[dark.exact]
"#26ab62" = "#7e807e"
"#26a269" = "#7e807e"      # GTK4 stock success green
"#3584e4" = "#00cccc"
"#eeeeec" = "#bdc3c7"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#31363b"],[34.67,"#31363b"],[55.33,"#393e43"],[66.33,"#474d51"],
        [86.67,"#585d62"],[156,"#959b9f"],[179,"#959b9f"],[250,"#bdc3c7"],
        [255,"#bdc3c7"]]
fg = "#bdc3c7"
top = "#bdc3c7"
accent_fg = "#313643"
view = "#31363b"
[shell.dark.fam]
blue = ["#3584e4","#00cccc"]
red = ["#c01c28","#ba2922"]
orange = ["#ff7800","#833c38"]
green = ["#26a269","#7e807e"]
[shell.dark.exact]
"#cd9309" = "#4c4f4d"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#959b9f"      # web-login title, dim text
"#54545a" = "#474d51"      # notification/message card: surface
"#45454a" = "#40464a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ba2922"
fg = "#bdc3c7"
[accents.dark.green]
color = "#7e807e"
fg = "#313643"
[accents.dark.yellow]
color = "#4c4f4d"
fg = "#bdc3c7"
[accents.dark.blue]
color = "#16a085"
fg = "#313643"
[accents.dark.magenta]
color = "#43746a"
fg = "#bdc3c7"
[accents.dark.cyan]
color = "#00cccc"
fg = "#313643"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#31363b"
bg = "#393e43"
surface = "#474d51"
surface_high = "#585d62"
popover = "#585d62"
fg = "#bdc3c7"
red = "#ba2922"
green = "#7e807e"
yellow = "#4c4f4d"
accent = "#00cccc"
