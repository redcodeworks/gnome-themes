# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Cobalt Neon'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Cobalt%20Neon.yml.
title = "Cobalt Neon"
gtk_name = "Cobalt-Neon"
shell_name = "Cobalt-Neon-Shell"
credit = "Cobalt Neon (colours of the Ptyxis built-in 'Cobalt Neon'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Cobalt%20Neon.yml)"
ptyxis = "Cobalt Neon"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Cobalt Neon' (bulk-built by tools/bulk-scheme.py)."
default_accent = "yellow"

[dark]
bg_deep = "#142838"
fg = "#8ff586"
selection = "#2d5148"   # DERIVED
red = "#ff2320"
orange = "#f4853e"   # DERIVED
yellow = "#e9e75c"
green = "#3ba5ff"
cyan = "#8ff586"
blue = "#8ff586"
magenta = "#781aa0"
purple = "#781aa0"   # = magenta
# palette Color8 (bright black) = #fff688: a candidate for `comment`
[dark.ansi]
red = "#ff2320"
green = "#3ba5ff"
yellow = "#e9e75c"
blue = "#8ff586"
magenta = "#781aa0"
cyan = "#8ff586"
[dark.terminal]
source = "Cobalt Neon"   # Ptyxis built-in id
black = "#142631"   # Ptyxis Color0
white = "#ba46b2"   # Ptyxis Color7
bright_black = "#fff688"   # Ptyxis Color8
bright_red = "#d4312e"   # Ptyxis Color9
bright_green = "#8ff586"   # Ptyxis Color10
bright_yellow = "#e9f06d"   # Ptyxis Color11
bright_blue = "#3c7dd2"   # Ptyxis Color12
bright_magenta = "#8230a7"   # Ptyxis Color13
bright_cyan = "#6cbc67"   # Ptyxis Color14
bright_white = "#8ff586"   # Ptyxis Color15
