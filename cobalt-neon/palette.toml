title = "Cobalt Neon"
gtk_name = "Cobalt-Neon"
shell_name = "Cobalt-Neon-Shell"
credit = "Cobalt Neon (colours of the Ptyxis built-in 'Cobalt Neon'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Cobalt%20Neon.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#142838"],[53,"#1b333c"],[66,"#284944"],
        [91,"#36614e"],[145,"#4f8a5d"],[238,"#8ff586"],[255,"#8ff586"]]
fg = "#8ff586"
top = "#8ff586"
accent_fg = "#142840"
view = "#142838"
[dark.fam]
blue = ["#15539e","#e9e75c"]
red = ["#cc0000","#ff2320"]
orange = ["#f57900","#e9e75d"]
green = ["#4e9a06","#3ba5ff"]
[dark.exact]
"#26ab62" = "#3ba5ff"
"#26a269" = "#3ba5ff"      # GTK4 stock success green
"#3584e4" = "#e9e75c"
"#eeeeec" = "#8ff586"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#142838"],[34.67,"#142838"],[55.33,"#1b333c"],[66.33,"#284944"],
        [86.67,"#36614e"],[156,"#6cbb70"],[179,"#6cbb70"],[250,"#8ff586"],
        [255,"#8ff586"]]
fg = "#8ff586"
top = "#8ff586"
accent_fg = "#142840"
view = "#142838"
[shell.dark.fam]
blue = ["#3584e4","#e9e75c"]
red = ["#c01c28","#ff2320"]
orange = ["#ff7800","#f4853e"]
green = ["#26a269","#3ba5ff"]
[shell.dark.exact]
"#cd9309" = "#e9e75d"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#6cbb70"      # web-login title, dim text
"#54545a" = "#284944"      # notification/message card: surface
"#45454a" = "#223e40"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
