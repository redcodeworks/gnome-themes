# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #222222 5.5% towards fg
# derived: dark.surface derived: #222222 16.0% towards fg
# derived: dark.surface_high derived: #222222 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #fec255 (it equals the default accent; keeps accent tokens unique)
title = "Spacegray Eighties"
gtk_name = "Spacegray-Eighties"
shell_name = "Spacegray-Eighties-Shell"
credit = "Spacegray Eighties (colours of the Ptyxis built-in 'Spacegray Eighties'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Spacegray%20Eighties.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#222222"],[53,"#2b2a2a"],[66,"#3b3a38"],
        [91,"#4d4d49"],[145,"#6d6b65"],[238,"#bdbaae"],[255,"#bdbaae"]]
fg = "#bdbaae"
top = "#bdbaae"
accent_fg = "#222222"
view = "#222222"
[dark.fam]
blue = ["#15539e","#fec254"]
red = ["#cc0000","#ec5f67"]
orange = ["#f57900","#fec255"]
green = ["#4e9a06","#81a764"]
[dark.exact]
"#26ab62" = "#81a764"
"#26a269" = "#81a764"      # GTK4 stock success green
"#3584e4" = "#fec254"
"#eeeeec" = "#bdbaae"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#222222"],[34.67,"#222222"],[55.33,"#2b2a2a"],[66.33,"#3b3a38"],
        [86.67,"#4d4d49"],[156,"#918f86"],[179,"#918f86"],[250,"#bdbaae"],
        [255,"#bdbaae"]]
fg = "#bdbaae"
top = "#bdbaae"
accent_fg = "#222222"
view = "#222222"
[shell.dark.fam]
blue = ["#3584e4","#fec254"]
red = ["#c01c28","#ec5f67"]
orange = ["#ff7800","#f5905e"]
green = ["#26a269","#81a764"]
[shell.dark.exact]
"#cd9309" = "#fec255"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#918f86"      # web-login title, dim text
"#54545a" = "#3b3a38"      # notification/message card: surface
"#45454a" = "#333231"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ec5f67"
fg = "#222222"
[accents.dark.green]
color = "#81a764"
fg = "#222222"
[accents.dark.yellow]
color = "#fec254"
fg = "#222222"
[accents.dark.blue]
color = "#5486c0"
fg = "#222222"
[accents.dark.magenta]
color = "#bf83c1"
fg = "#222222"
[accents.dark.cyan]
color = "#57c2c1"
fg = "#222222"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#222222"
bg = "#2b2a2a"
surface = "#3b3a38"
surface_high = "#4d4d49"
popover = "#4d4d49"
fg = "#bdbaae"
red = "#ec5f67"
green = "#81a764"
yellow = "#fec255"
accent = "#fec254"
accent_fg = "#222222"
warning_fg = "#222222"
secondary_sidebar = "#2b2a2a"
