# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #222222 5.5% towards fg
# derived: dark.surface derived: #222222 16.0% towards fg
# derived: dark.surface_high derived: #222222 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
title = "Spacegray Eighties Dull"
gtk_name = "Spacegray-Eighties-Dull"
shell_name = "Spacegray-Eighties-Dull-Shell"
credit = "Spacegray Eighties Dull (colours of the Ptyxis built-in 'Spacegray Eighties Dull'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Spacegray%20Eighties%20Dull.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#222222"],[53,"#2b2b2a"],[66,"#3d3c3b"],
        [91,"#51504d"],[145,"#72716c"],[238,"#c9c6bc"],[255,"#c9c6bc"]]
fg = "#c9c6bc"
top = "#c9c6bc"
accent_fg = "#222222"
view = "#222222"
[dark.fam]
blue = ["#15539e","#80cdcb"]
red = ["#cc0000","#b24a56"]
orange = ["#f57900","#c6735a"]
green = ["#4e9a06","#92b477"]
[dark.exact]
"#26ab62" = "#92b477"
"#26a269" = "#92b477"      # GTK4 stock success green
"#3584e4" = "#80cdcb"
"#eeeeec" = "#c9c6bc"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#222222"],[34.67,"#222222"],[55.33,"#2b2b2a"],[66.33,"#3d3c3b"],
        [86.67,"#51504d"],[156,"#9a9890"],[179,"#9a9890"],[250,"#c9c6bc"],
        [255,"#c9c6bc"]]
fg = "#c9c6bc"
top = "#c9c6bc"
accent_fg = "#222222"
view = "#222222"
[shell.dark.fam]
blue = ["#3584e4","#80cdcb"]
red = ["#c01c28","#b24a56"]
orange = ["#ff7800","#bc5e58"]
green = ["#26a269","#92b477"]
[shell.dark.exact]
"#cd9309" = "#c6735a"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9a9890"      # web-login title, dim text
"#54545a" = "#3d3c3b"      # notification/message card: surface
"#45454a" = "#343432"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#b24a56"
fg = "#222222"
[accents.dark.green]
color = "#92b477"
fg = "#222222"
[accents.dark.yellow]
color = "#c6735a"
fg = "#222222"
[accents.dark.blue]
color = "#7c8fa5"
fg = "#222222"
[accents.dark.magenta]
color = "#a5789e"
fg = "#222222"
[accents.dark.cyan]
color = "#80cdcb"
fg = "#222222"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#222222"
bg = "#2b2b2a"
surface = "#3d3c3b"
surface_high = "#51504d"
popover = "#51504d"
fg = "#c9c6bc"
red = "#b24a56"
green = "#92b477"
yellow = "#c6735a"
