# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #424043 5.5% towards fg
# derived: dark.surface derived: #424043 16.0% towards fg
# derived: dark.surface_high derived: #424043 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #424043 -> #42404b (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #fce950 (it equals the default accent; keeps accent tokens unique)
title = "Wzoreck"
gtk_name = "Wzoreck"
shell_name = "Wzoreck-Shell"
credit = "Wzoreck (colours of the Ptyxis built-in 'Wzoreck'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Wzoreck.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#424043"],[53,"#4c4a4d"],[66,"#605e60"],
        [91,"#767576"],[145,"#9b9a9b"],[238,"#fcfcfa"],[255,"#fcfcfa"]]
fg = "#fcfcfa"
top = "#fcfcfa"
accent_fg = "#42404b"
view = "#424043"
[dark.fam]
blue = ["#15539e","#fce94f"]
red = ["#cc0000","#fc6386"]
orange = ["#f57900","#fce950"]
green = ["#4e9a06","#424043"]
[dark.exact]
"#26ab62" = "#424043"
"#26a269" = "#424043"      # GTK4 stock success green
"#3584e4" = "#fce94f"
"#eeeeec" = "#fcfcfa"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#424043"],[34.67,"#424043"],[55.33,"#4c4a4d"],[66.33,"#605e60"],
        [86.67,"#767576"],[156,"#c7c7c6"],[179,"#c7c7c6"],[250,"#fcfcfa"],
        [255,"#fcfcfa"]]
fg = "#fcfcfa"
top = "#fcfcfa"
accent_fg = "#42404b"
view = "#424043"
[shell.dark.fam]
blue = ["#3584e4","#fce94f"]
red = ["#c01c28","#fc6386"]
orange = ["#ff7800","#fca66a"]
green = ["#26a269","#424043"]
[shell.dark.exact]
"#cd9309" = "#fce950"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c7c7c6"      # web-login title, dim text
"#54545a" = "#605e60"      # notification/message card: surface
"#45454a" = "#565456"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#fc6386"
fg = "#42404b"
[accents.dark.green]
color = "#424043"
fg = "#fcfcfa"
[accents.dark.yellow]
color = "#fce94f"
fg = "#42404b"
[accents.dark.blue]
color = "#fb976b"
fg = "#42404b"
[accents.dark.magenta]
color = "#75507b"
fg = "#fcfcfa"
[accents.dark.cyan]
color = "#34e2e2"
fg = "#42404b"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#424043"
bg = "#4c4a4d"
surface = "#605e60"
surface_high = "#767576"
popover = "#767576"
fg = "#fcfcfa"
red = "#fc6386"
green = "#424043"
yellow = "#fce950"
accent = "#fce94f"
