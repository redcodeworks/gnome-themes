# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #2f1e2e 5.5% towards fg
# derived: dark.surface derived: #2f1e2e 16.0% towards fg
# derived: dark.surface_high derived: #2f1e2e 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #fec419 (it equals the default accent; keeps accent tokens unique)
title = "Paraiso Dark"
gtk_name = "Paraiso-Dark"
shell_name = "Paraiso-Dark-Shell"
credit = "Paraiso Dark (colours of the Ptyxis built-in 'Paraiso Dark'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Paraiso%20Dark.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#2f1e2e"],[53,"#352534"],[66,"#42323f"],
        [91,"#4f424d"],[145,"#665b62"],[238,"#a39e9b"],[255,"#a39e9b"]]
fg = "#a39e9b"
top = "#a39e9b"
accent_fg = "#2f1e2e"
view = "#2f1e2e"
[dark.fam]
blue = ["#15539e","#fec418"]
red = ["#cc0000","#ef6155"]
orange = ["#f57900","#fec419"]
green = ["#4e9a06","#48b685"]
[dark.exact]
"#26ab62" = "#48b685"
"#26a269" = "#48b685"      # GTK4 stock success green
"#3584e4" = "#fec418"
"#eeeeec" = "#a39e9b"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2f1e2e"],[34.67,"#2f1e2e"],[55.33,"#352534"],[66.33,"#42323f"],
        [86.67,"#4f424d"],[156,"#827a7c"],[179,"#827a7c"],[250,"#a39e9b"],
        [255,"#a39e9b"]]
fg = "#a39e9b"
top = "#a39e9b"
accent_fg = "#2f1e2e"
view = "#2f1e2e"
[shell.dark.fam]
blue = ["#3584e4","#fec418"]
red = ["#c01c28","#ef6155"]
orange = ["#ff7800","#f69236"]
green = ["#26a269","#48b685"]
[shell.dark.exact]
"#cd9309" = "#fec419"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#827a7c"      # web-login title, dim text
"#54545a" = "#42323f"      # notification/message card: surface
"#45454a" = "#3c2c3a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ef6155"
fg = "#2f1e2e"
[accents.dark.green]
color = "#48b685"
fg = "#2f1e2e"
[accents.dark.yellow]
color = "#fec418"
fg = "#2f1e2e"
[accents.dark.blue]
color = "#06b6ef"
fg = "#2f1e2e"
[accents.dark.magenta]
color = "#815ba4"
fg = "#2f1e2e"
[accents.dark.cyan]
color = "#5bc4bf"
fg = "#2f1e2e"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#2f1e2e"
bg = "#352534"
surface = "#42323f"
surface_high = "#4f424d"
popover = "#4f424d"
fg = "#a39e9b"
red = "#ef6155"
green = "#48b685"
yellow = "#fec419"
