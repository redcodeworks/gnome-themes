title = "Catppuccin Macchiato"
gtk_name = "Catppuccin-Macchiato"
shell_name = "Catppuccin-Macchiato-Shell"
credit = "Catppuccin Macchiato (colours of the Ptyxis built-in 'Catppuccin Macchiato'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Catppuccin%20Macchiato.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#24273a"],[53,"#2d3044"],[66,"#3f4358"],
        [91,"#52576e"],[145,"#747994"],[238,"#cad3f5"],[255,"#cad3f5"]]
fg = "#cad3f5"
top = "#cad3f5"
accent_fg = "#24273a"
view = "#24273a"
[dark.fam]
blue = ["#15539e","#eed49f"]
red = ["#cc0000","#ed8796"]
orange = ["#f57900","#eed4a0"]
green = ["#4e9a06","#a6da95"]
[dark.exact]
"#26ab62" = "#a6da95"
"#26a269" = "#a6da95"      # GTK4 stock success green
"#3584e4" = "#eed49f"
"#eeeeec" = "#cad3f5"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#24273a"],[34.67,"#24273a"],[55.33,"#2d3044"],[66.33,"#3f4358"],
        [86.67,"#52576e"],[156,"#9ba2c0"],[179,"#9ba2c0"],[250,"#cad3f5"],
        [255,"#cad3f5"]]
fg = "#cad3f5"
top = "#cad3f5"
accent_fg = "#24273a"
view = "#24273a"
[shell.dark.fam]
blue = ["#3584e4","#eed49f"]
red = ["#c01c28","#ed8796"]
orange = ["#ff7800","#eeae9a"]
green = ["#26a269","#a6da95"]
[shell.dark.exact]
"#cd9309" = "#eed4a0"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9ba2c0"      # web-login title, dim text
"#54545a" = "#3f4358"      # notification/message card: surface
"#45454a" = "#363a4e"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
