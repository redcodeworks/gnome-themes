# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Catppuccin Macchiato'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Catppuccin%20Macchiato.yml.
title = "Catppuccin Macchiato"
gtk_name = "Catppuccin-Macchiato"
shell_name = "Catppuccin-Macchiato-Shell"
credit = "Catppuccin Macchiato (colours of the Ptyxis built-in 'Catppuccin Macchiato'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Catppuccin%20Macchiato.yml)"
ptyxis = "Catppuccin Macchiato"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Catppuccin Macchiato' (bulk-built by tools/bulk-scheme.py)."
default_accent = "yellow"

[dark]
bg_deep = "#24273a"
fg = "#cad3f5"
selection = "#45495f"   # DERIVED
red = "#ed8796"
orange = "#eeae9a"   # DERIVED
yellow = "#eed49f"
green = "#a6da95"
cyan = "#8bd5ca"
blue = "#8aadf4"
magenta = "#f5bde6"
purple = "#f5bde6"   # = magenta
# palette Color8 (bright black) = #5b6078: a candidate for `comment`
[dark.ansi]
red = "#ed8796"
green = "#a6da95"
yellow = "#eed49f"
blue = "#8aadf4"
magenta = "#f5bde6"
cyan = "#8bd5ca"
[dark.terminal]
source = "Catppuccin Macchiato"   # Ptyxis built-in id
black = "#494d64"   # Ptyxis Color0
white = "#b8c0e0"   # Ptyxis Color7
bright_black = "#5b6078"   # Ptyxis Color8
bright_white = "#a5adcb"   # Ptyxis Color15
