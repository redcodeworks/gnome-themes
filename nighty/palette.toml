# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #2f2f2f 5.5% towards fg
# derived: dark.surface derived: #2f2f2f 16.0% towards fg
# derived: dark.surface_high derived: #2f2f2f 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #2f2f2f -> #2f2f37 (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #808021 (it equals the default accent; keeps accent tokens unique)
title = "Nighty"
gtk_name = "Nighty"
shell_name = "Nighty-Shell"
credit = "Nighty (colours of the Ptyxis built-in 'Nighty'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Nighty.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#2f2f2f"],[53,"#393939"],[66,"#4b4b4b"],
        [91,"#606060"],[145,"#848484"],[238,"#dfdfdf"],[255,"#dfdfdf"]]
fg = "#dfdfdf"
top = "#dfdfdf"
accent_fg = "#2f2f37"
view = "#2f2f2f"
[dark.fam]
blue = ["#15539e","#808020"]
red = ["#cc0000","#9b3e46"]
orange = ["#f57900","#808021"]
green = ["#4e9a06","#095b32"]
[dark.exact]
"#26ab62" = "#095b32"
"#26a269" = "#095b32"      # GTK4 stock success green
"#3584e4" = "#808020"
"#eeeeec" = "#dfdfdf"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2f2f2f"],[34.67,"#2f2f2f"],[55.33,"#393939"],[66.33,"#4b4b4b"],
        [86.67,"#606060"],[156,"#adadad"],[179,"#adadad"],[250,"#dfdfdf"],
        [255,"#dfdfdf"]]
fg = "#dfdfdf"
top = "#dfdfdf"
accent_fg = "#2f2f37"
view = "#2f2f2f"
[shell.dark.fam]
blue = ["#3584e4","#808020"]
red = ["#c01c28","#9b3e46"]
orange = ["#ff7800","#8e5f33"]
green = ["#26a269","#095b32"]
[shell.dark.exact]
"#cd9309" = "#808021"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#adadad"      # web-login title, dim text
"#54545a" = "#4b4b4b"      # notification/message card: surface
"#45454a" = "#424242"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#9b3e46"
fg = "#dfdfdf"
[accents.dark.green]
color = "#095b32"
fg = "#dfdfdf"
[accents.dark.yellow]
color = "#808020"
fg = "#2f2f37"
[accents.dark.blue]
color = "#1d3e6f"
fg = "#dfdfdf"
[accents.dark.magenta]
color = "#823065"
fg = "#dfdfdf"
[accents.dark.cyan]
color = "#3a7458"
fg = "#dfdfdf"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#2f2f2f"
bg = "#393939"
surface = "#4b4b4b"
surface_high = "#606060"
popover = "#606060"
fg = "#dfdfdf"
red = "#9b3e46"
green = "#095b32"
yellow = "#808021"
accent = "#808020"
accent_fg = "#2f2f37"
warning_fg = "#2f2f2f"
secondary_sidebar = "#393939"
