# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #222125 5.5% towards fg
# derived: dark.surface derived: #222125 16.0% towards fg
# derived: dark.surface_high derived: #222125 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.green nudged to #31ac62 (it equals the default accent; keeps accent tokens unique)
title = "Ollie"
gtk_name = "Ollie"
shell_name = "Ollie-Shell"
credit = "Ollie (colours of the Ptyxis built-in 'Ollie'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Ollie.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#222125"],[53,"#28272d"],[66,"#33323b"],
        [91,"#3f3f4b"],[145,"#545567"],[238,"#8a8dae"],[255,"#8a8dae"]]
fg = "#8a8dae"
top = "#8a8dae"
accent_fg = "#222125"
view = "#222125"
[dark.fam]
blue = ["#15539e","#31ac61"]
red = ["#cc0000","#ac2e31"]
orange = ["#f57900","#ac4300"]
green = ["#4e9a06","#31ac62"]
[dark.exact]
"#26ab62" = "#31ac62"
"#26a269" = "#31ac62"      # GTK4 stock success green
"#3584e4" = "#31ac61"
"#eeeeec" = "#8a8dae"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#222125"],[34.67,"#222125"],[55.33,"#28272d"],[66.33,"#33323b"],
        [86.67,"#3f3f4b"],[156,"#6d6e87"],[179,"#6d6e87"],[250,"#8a8dae"],
        [255,"#8a8dae"]]
fg = "#8a8dae"
top = "#8a8dae"
accent_fg = "#222125"
view = "#222125"
[shell.dark.fam]
blue = ["#3584e4","#31ac61"]
red = ["#c01c28","#ac2e31"]
orange = ["#ff7800","#ac3818"]
green = ["#26a269","#31ac62"]
[shell.dark.exact]
"#cd9309" = "#ac4300"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#6d6e87"      # web-login title, dim text
"#54545a" = "#33323b"      # notification/message card: surface
"#45454a" = "#2e2c34"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ac2e31"
fg = "#222125"
[accents.dark.green]
color = "#31ac61"
fg = "#222125"
[accents.dark.yellow]
color = "#ac4300"
fg = "#222125"
[accents.dark.blue]
color = "#2d57ac"
fg = "#222125"
[accents.dark.magenta]
color = "#b08528"
fg = "#222125"
[accents.dark.cyan]
color = "#1fa6ac"
fg = "#222125"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#222125"
bg = "#28272d"
surface = "#33323b"
surface_high = "#3f3f4b"
popover = "#3f3f4b"
fg = "#8a8dae"
red = "#ac2e31"
green = "#31ac62"
yellow = "#ac4300"
accent = "#31ac61"
