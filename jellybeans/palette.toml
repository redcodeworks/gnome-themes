# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #121212 5.5% towards fg
# derived: dark.surface derived: #121212 16.0% towards fg
# derived: dark.surface_high derived: #121212 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
title = "Jellybeans"
gtk_name = "Jellybeans"
shell_name = "Jellybeans-Shell"
credit = "Jellybeans (colours of the Ptyxis built-in 'Jellybeans'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Jellybeans.yml)"
default_accent = "magenta"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#121212"],[53,"#1d1d1d"],[66,"#333333"],
        [91,"#4b4b4b"],[145,"#747474"],[238,"#dedede"],[255,"#dedede"]]
fg = "#dedede"
top = "#dedede"
accent_fg = "#121212"
view = "#121212"
[dark.fam]
blue = ["#15539e","#e1c0fa"]
red = ["#cc0000","#e27373"]
orange = ["#f57900","#ffba7b"]
green = ["#4e9a06","#94b979"]
[dark.exact]
"#26ab62" = "#94b979"
"#26a269" = "#94b979"      # GTK4 stock success green
"#3584e4" = "#e1c0fa"
"#eeeeec" = "#dedede"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#121212"],[34.67,"#121212"],[55.33,"#1d1d1d"],[66.33,"#333333"],
        [86.67,"#4b4b4b"],[156,"#a4a4a4"],[179,"#a4a4a4"],[250,"#dedede"],
        [255,"#dedede"]]
fg = "#dedede"
top = "#dedede"
accent_fg = "#121212"
view = "#121212"
[shell.dark.fam]
blue = ["#3584e4","#e1c0fa"]
red = ["#c01c28","#e27373"]
orange = ["#ff7800","#f09677"]
green = ["#26a269","#94b979"]
[shell.dark.exact]
"#cd9309" = "#ffba7b"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a4a4a4"      # web-login title, dim text
"#54545a" = "#333333"      # notification/message card: surface
"#45454a" = "#282828"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#e27373"
fg = "#121212"
[accents.dark.green]
color = "#94b979"
fg = "#121212"
[accents.dark.yellow]
color = "#ffba7b"
fg = "#121212"
[accents.dark.blue]
color = "#97bedc"
fg = "#121212"
[accents.dark.magenta]
color = "#e1c0fa"
fg = "#121212"
[accents.dark.cyan]
color = "#00988e"
fg = "#121212"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#121212"
bg = "#1d1d1d"
surface = "#333333"
surface_high = "#4b4b4b"
popover = "#4b4b4b"
fg = "#dedede"
red = "#e27373"
green = "#94b979"
yellow = "#ffba7b"
accent = "#e1c0fa"
