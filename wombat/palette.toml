# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #171717 5.5% towards fg
# derived: dark.surface derived: #171717 16.0% towards fg
# derived: dark.surface_high derived: #171717 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
title = "Wombat"
gtk_name = "Wombat"
shell_name = "Wombat-Shell"
credit = "Wombat (colours of the Ptyxis built-in 'Wombat'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Wombat.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#171717"],[53,"#222221"],[66,"#373634"],
        [91,"#4f4e4b"],[145,"#77756f"],[238,"#dedacf"],[255,"#dedacf"]]
fg = "#dedacf"
top = "#dedacf"
accent_fg = "#171717"
view = "#171717"
[dark.fam]
blue = ["#15539e","#82fff7"]
red = ["#cc0000","#ff615a"]
orange = ["#f57900","#ebd99c"]
green = ["#4e9a06","#b1e969"]
[dark.exact]
"#26ab62" = "#b1e969"
"#26a269" = "#b1e969"      # GTK4 stock success green
"#3584e4" = "#82fff7"
"#eeeeec" = "#dedacf"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#171717"],[34.67,"#171717"],[55.33,"#222221"],[66.33,"#373634"],
        [86.67,"#4f4e4b"],[156,"#a6a39b"],[179,"#a6a39b"],[250,"#dedacf"],
        [255,"#dedacf"]]
fg = "#dedacf"
top = "#dedacf"
accent_fg = "#171717"
view = "#171717"
[shell.dark.fam]
blue = ["#3584e4","#82fff7"]
red = ["#c01c28","#ff615a"]
orange = ["#ff7800","#f59d7b"]
green = ["#26a269","#b1e969"]
[shell.dark.exact]
"#cd9309" = "#ebd99c"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a6a39b"      # web-login title, dim text
"#54545a" = "#373634"      # notification/message card: surface
"#45454a" = "#2c2c2a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff615a"
fg = "#171717"
[accents.dark.green]
color = "#b1e969"
fg = "#171717"
[accents.dark.yellow]
color = "#ebd99c"
fg = "#171717"
[accents.dark.blue]
color = "#5da9f6"
fg = "#171717"
[accents.dark.magenta]
color = "#e86aff"
fg = "#171717"
[accents.dark.cyan]
color = "#82fff7"
fg = "#171717"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#171717"
bg = "#222221"
surface = "#373634"
surface_high = "#4f4e4b"
popover = "#4f4e4b"
fg = "#dedacf"
red = "#ff615a"
green = "#b1e969"
yellow = "#ebd99c"
accent = "#82fff7"
accent_fg = "#171717"
warning_fg = "#171717"
secondary_sidebar = "#222221"
