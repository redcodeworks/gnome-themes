# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #0e1019 5.5% towards fg
# derived: dark.surface derived: #0e1019 16.0% towards fg
# derived: dark.surface_high derived: #0e1019 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #0e1019 -> #0e1021 (the text colour varies per accent: the default needs its own token)
# derived: dark.green nudged to #8ce10c (it equals the default accent; keeps accent tokens unique)
title = "Argonaut"
gtk_name = "Argonaut"
shell_name = "Argonaut-Shell"
credit = "Argonaut (colours of the Ptyxis built-in 'Argonaut'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Argonaut.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#0e1019"],[53,"#1b1d25"],[66,"#35353c"],
        [91,"#515256"],[145,"#828082"],[238,"#fffaf4"],[255,"#fffaf4"]]
fg = "#fffaf4"
top = "#fffaf4"
accent_fg = "#0e1021"
view = "#0e1019"
[dark.fam]
blue = ["#15539e","#8ce10b"]
red = ["#cc0000","#ff000f"]
orange = ["#f57900","#ffb900"]
green = ["#4e9a06","#8ce10c"]
[dark.exact]
"#26ab62" = "#8ce10c"
"#26a269" = "#8ce10c"      # GTK4 stock success green
"#3584e4" = "#8ce10b"
"#eeeeec" = "#fffaf4"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#0e1019"],[34.67,"#0e1019"],[55.33,"#1b1d25"],[66.33,"#35353c"],
        [86.67,"#515256"],[156,"#bbb8b6"],[179,"#bbb8b6"],[250,"#fffaf4"],
        [255,"#fffaf4"]]
fg = "#fffaf4"
top = "#fffaf4"
accent_fg = "#0e1021"
view = "#0e1019"
[shell.dark.fam]
blue = ["#3584e4","#8ce10b"]
red = ["#c01c28","#ff000f"]
orange = ["#ff7800","#ff5c08"]
green = ["#26a269","#8ce10c"]
[shell.dark.exact]
"#cd9309" = "#ffb900"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#bbb8b6"      # web-login title, dim text
"#54545a" = "#35353c"      # notification/message card: surface
"#45454a" = "#282930"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff000f"
fg = "#0e1021"
[accents.dark.green]
color = "#8ce10b"
fg = "#0e1021"
[accents.dark.yellow]
color = "#ffb900"
fg = "#0e1021"
[accents.dark.blue]
color = "#008df8"
fg = "#0e1021"
[accents.dark.magenta]
color = "#6d43a6"
fg = "#fffaf4"
[accents.dark.cyan]
color = "#00d8eb"
fg = "#0e1021"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#0e1019"
bg = "#1b1d25"
surface = "#35353c"
surface_high = "#515256"
popover = "#515256"
fg = "#fffaf4"
red = "#ff000f"
green = "#8ce10c"
yellow = "#ffb900"
accent = "#8ce10b"
accent_fg = "#0e1021"
warning_fg = "#0e1019"
secondary_sidebar = "#1b1d25"
