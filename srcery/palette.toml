[dark.exact]
"#26ab62" = "#519f50"
"#26a269" = "#519f50"      # GTK4 stock success green
"#3584e4" = "#fbb829"
"#eeeeec" = "#fce8c3"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
