title = "Srcery"
gtk_name = "Srcery"
shell_name = "Srcery-Shell"
credit = "Srcery (colours of the Ptyxis built-in 'Srcery'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Srcery.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
