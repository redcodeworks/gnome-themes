        [86.67,"#5b5449"],[156,"#bcae93"],[179,"#bcae93"],[250,"#fce8c3"],
        [255,"#fce8c3"]]
fg = "#fce8c3"
top = "#fce8c3"
accent_fg = "#1c1b19"
view = "#1c1b19"
[shell.dark.fam]
blue = ["#3584e4","#fbb829"]
red = ["#c01c28","#ef2f27"]
orange = ["#ff7800","#f57428"]
green = ["#26a269","#519f50"]
[shell.dark.exact]
"#cd9309" = "#fbb82a"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#bcae93"      # web-login title, dim text
"#54545a" = "#403c34"      # notification/message card: surface
"#45454a" = "#34312b"      # message card stacked behind the front one: bg and surface mixed 50 %

