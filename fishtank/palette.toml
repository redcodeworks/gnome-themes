# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #232537 5.5% towards fg
# derived: dark.surface derived: #232537 16.0% towards fg
# derived: dark.surface_high derived: #232537 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #232537 -> #23253f (the text colour varies per accent: the default needs its own token)
# derived: dark.green nudged to #acf158 (it equals the default accent; keeps accent tokens unique)
title = "Fishtank"
gtk_name = "Fishtank"
shell_name = "Fishtank-Shell"
credit = "Fishtank (colours of the Ptyxis built-in 'Fishtank'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Fishtank.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#232537"],[53,"#2e3042"],[66,"#434557"],
        [91,"#5b5e6f"],[145,"#848697"],[238,"#ecf0fe"],[255,"#ecf0fe"]]
fg = "#ecf0fe"
top = "#ecf0fe"
accent_fg = "#23253f"
view = "#232537"
[dark.fam]
blue = ["#15539e","#acf157"]
red = ["#cc0000","#c6004a"]
orange = ["#f57900","#fecd5e"]
green = ["#4e9a06","#acf158"]
[dark.exact]
"#26ab62" = "#acf158"
"#26a269" = "#acf158"      # GTK4 stock success green
"#3584e4" = "#acf157"
"#eeeeec" = "#ecf0fe"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#232537"],[34.67,"#232537"],[55.33,"#2e3042"],[66.33,"#434557"],
        [86.67,"#5b5e6f"],[156,"#b3b6c6"],[179,"#b3b6c6"],[250,"#ecf0fe"],
        [255,"#ecf0fe"]]
fg = "#ecf0fe"
top = "#ecf0fe"
accent_fg = "#23253f"
view = "#232537"
[shell.dark.fam]
blue = ["#3584e4","#acf157"]
red = ["#c01c28","#c6004a"]
orange = ["#ff7800","#e26654"]
green = ["#26a269","#acf158"]
[shell.dark.exact]
"#cd9309" = "#fecd5e"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b3b6c6"      # web-login title, dim text
"#54545a" = "#434557"      # notification/message card: surface
"#45454a" = "#383a4c"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#c6004a"
fg = "#ecf0fe"
[accents.dark.green]
color = "#acf157"
fg = "#23253f"
[accents.dark.yellow]
color = "#fecd5e"
fg = "#23253f"
[accents.dark.blue]
color = "#525fb8"
fg = "#ecf0fe"
[accents.dark.magenta]
color = "#986f82"
fg = "#23253f"
[accents.dark.cyan]
color = "#968763"
fg = "#23253f"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#232537"
bg = "#2e3042"
surface = "#434557"
surface_high = "#5b5e6f"
popover = "#5b5e6f"
fg = "#ecf0fe"
red = "#c6004a"
green = "#acf158"
yellow = "#fecd5e"
accent = "#acf157"
