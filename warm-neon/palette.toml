fg = "#afdab6"
[accents.dark.magenta]
color = "#f920fb"
fg = "#404048"
[accents.dark.cyan]
color = "#2abbd4"
fg = "#404048"

# roles for tools/libadwaita-gen.py
[roles.dark]
