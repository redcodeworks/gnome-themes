# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #404040 5.5% towards fg
# derived: dark.surface derived: #404040 16.0% towards fg
# derived: dark.surface_high derived: #404040 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #404040 -> #404048 (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #dae146 (it equals the default accent; keeps accent tokens unique)
title = "Warm Neon"
gtk_name = "Warm-Neon"
shell_name = "Warm-Neon-Shell"
credit = "Warm Neon (colours of the Ptyxis built-in 'Warm Neon'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Warm%20Neon.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#404040"],[53,"#464846"],[66,"#525953"],
        [91,"#5f6b61"],[145,"#758a78"],[238,"#afdab6"],[255,"#afdab6"]]
fg = "#afdab6"
top = "#afdab6"
accent_fg = "#404048"
view = "#404040"
[dark.fam]
blue = ["#15539e","#dae145"]
red = ["#cc0000","#e24346"]
orange = ["#f57900","#dae146"]
green = ["#4e9a06","#39b13a"]
[dark.exact]
"#26ab62" = "#39b13a"
"#26a269" = "#39b13a"      # GTK4 stock success green
"#3584e4" = "#dae145"
"#eeeeec" = "#afdab6"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#404040"],[34.67,"#404040"],[55.33,"#464846"],[66.33,"#525953"],
        [86.67,"#5f6b61"],[156,"#90ae94"],[179,"#90ae94"],[250,"#afdab6"],
        [255,"#afdab6"]]
fg = "#afdab6"
top = "#afdab6"
accent_fg = "#404048"
view = "#404040"
[shell.dark.fam]
blue = ["#3584e4","#dae145"]
red = ["#c01c28","#e24346"]
orange = ["#ff7800","#de9246"]
green = ["#26a269","#39b13a"]
[shell.dark.exact]
"#cd9309" = "#dae146"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#90ae94"      # web-login title, dim text
"#54545a" = "#525953"      # notification/message card: surface
"#45454a" = "#4c504c"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#e24346"
fg = "#404048"
[accents.dark.green]
color = "#39b13a"
fg = "#404048"
[accents.dark.yellow]
