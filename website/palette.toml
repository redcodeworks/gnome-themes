# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #132f35 5.5% towards fg
# derived: dark.surface derived: #132f35 16.0% towards fg
# derived: dark.surface_high derived: #132f35 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.green nudged to #bcca16 (it equals the default accent; keeps accent tokens unique)
title = "Website"
gtk_name = "Website"
shell_name = "Website-Shell"
credit = "Website (colours of the Ptyxis built-in 'Website'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Website.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#132f35"],[53,"#1d373a"],[66,"#314544"],
        [91,"#48554e"],[145,"#6e7161"],[238,"#d1b890"],[255,"#d1b890"]]
fg = "#d1b890"
top = "#d1b890"
accent_fg = "#132f35"
view = "#132f35"
[dark.fam]
blue = ["#15539e","#bcca15"]
red = ["#cc0000","#da4949"]
orange = ["#f57900","#ffb02e"]
green = ["#4e9a06","#bcca16"]
[dark.exact]
"#26ab62" = "#bcca16"
"#26a269" = "#bcca16"      # GTK4 stock success green
"#3584e4" = "#bcca15"
"#eeeeec" = "#d1b890"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#132f35"],[34.67,"#132f35"],[55.33,"#1d373a"],[66.33,"#314544"],
        [86.67,"#48554e"],[156,"#9b9176"],[179,"#9b9176"],[250,"#d1b890"],
        [255,"#d1b890"]]
fg = "#d1b890"
top = "#d1b890"
accent_fg = "#132f35"
view = "#132f35"
[shell.dark.fam]
blue = ["#3584e4","#bcca15"]
red = ["#c01c28","#da4949"]
orange = ["#ff7800","#ec7c3c"]
green = ["#26a269","#bcca16"]
[shell.dark.exact]
"#cd9309" = "#ffb02e"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9b9176"      # web-login title, dim text
"#54545a" = "#314544"      # notification/message card: surface
"#45454a" = "#273e3f"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#da4949"
fg = "#132f35"
[accents.dark.green]
