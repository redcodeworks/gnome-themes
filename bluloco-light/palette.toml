title = "Bluloco Light"
gtk_name = "Bluloco-Light"
shell_name = "Bluloco-Light-Shell"
credit = "Bluloco Light (colours of the Ptyxis built-in 'Bluloco Light'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Bluloco%20Light.yml)"
default_accent = "cyan"
dark_only = false
light_only = true

[light]
ramp = [[0,"#383a42"],[46,"#383a42"],[145,"#9fa0a4"],[224,"#e8e8e9"],
        [237,"#edeeee"],[246,"#f3f3f4"],[255,"#f9f9f9"]]
fg = "#383a42"
top = "#f9f9f9"
accent_fg = "#f9f9f9"
view = "#f9f9f9"
[light.fam]
blue = ["#3584e4","#27618d"]
red = ["#cc0000","#d52753"]
orange = ["#f57900","#df631c"]
green = ["#4e9a06","#23974a"]
[light.exact]
"#33d17a" = "#23974a"
"#2ec27e" = "#23974a"      # GTK4 stock success green (light)
"#2e3436" = "#383a42"
"#f6f5f4" = "#f3f3f4"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#383a42"],[46,"#383a42"],[145,"#9fa0a4"],[224,"#e8e8e9"],
        [237,"#edeeee"],[250,"#f9f9f9"],[255,"#f9f9f9"]]
fg = "#383a42"
top = "#f9f9f9"
accent_fg = "#f9f9f9"
view = "#f9f9f9"
[shell.light.fam]
blue = ["#3584e4","#27618d"]
red = ["#c01c28","#d52753"]
orange = ["#e66100","#da4538"]
green = ["#26a269","#23974a"]
[shell.light.exact]
"#e5a50a" = "#df631c"      # warning yellow
"#a5a5b7" = "#9fa0a4"

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.light.red]
color = "#d52753"
fg = "#f9f9f9"
[accents.light.green]
color = "#23974a"
