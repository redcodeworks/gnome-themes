# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #2c2e34 5.5% towards fg
# derived: dark.surface derived: #2c2e34 16.0% towards fg
# derived: dark.surface_high derived: #2c2e34 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #e7c665 (it equals the default accent; keeps accent tokens unique)
title = "Sonokai"
gtk_name = "Sonokai"
shell_name = "Sonokai-Shell"
credit = "Sonokai (colours of the Ptyxis built-in 'Sonokai'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Sonokai.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#2c2e34"],[53,"#36383e"],[66,"#494b50"],
        [91,"#5f6065"],[145,"#838488"],[238,"#e2e2e3"],[255,"#e2e2e3"]]
fg = "#e2e2e3"
top = "#e2e2e3"
accent_fg = "#2c2e34"
view = "#2c2e34"
[dark.fam]
blue = ["#15539e","#e7c664"]
red = ["#cc0000","#fc5d7c"]
orange = ["#f57900","#e7c665"]
green = ["#4e9a06","#9ed072"]
[dark.exact]
"#26ab62" = "#9ed072"
"#26a269" = "#9ed072"      # GTK4 stock success green
"#3584e4" = "#e7c664"
"#eeeeec" = "#e2e2e3"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2c2e34"],[34.67,"#2c2e34"],[55.33,"#36383e"],[66.33,"#494b50"],
        [86.67,"#5f6065"],[156,"#aeafb2"],[179,"#aeafb2"],[250,"#e2e2e3"],
        [255,"#e2e2e3"]]
fg = "#e2e2e3"
top = "#e2e2e3"
accent_fg = "#2c2e34"
view = "#2c2e34"
[shell.dark.fam]
blue = ["#3584e4","#e7c664"]
red = ["#c01c28","#fc5d7c"]
orange = ["#ff7800","#f29270"]
green = ["#26a269","#9ed072"]
[shell.dark.exact]
"#cd9309" = "#e7c665"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#aeafb2"      # web-login title, dim text
"#54545a" = "#494b50"      # notification/message card: surface
"#45454a" = "#404247"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#fc5d7c"
fg = "#2c2e34"
[accents.dark.green]
color = "#9ed072"
fg = "#2c2e34"
[accents.dark.yellow]
color = "#e7c664"
fg = "#2c2e34"
[accents.dark.blue]
color = "#f39660"
fg = "#2c2e34"
[accents.dark.magenta]
color = "#b39df3"
fg = "#2c2e34"
[accents.dark.cyan]
color = "#76cce0"
fg = "#2c2e34"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#2c2e34"
bg = "#36383e"
surface = "#494b50"
surface_high = "#5f6065"
