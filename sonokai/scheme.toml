# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Sonokai'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Sonokai.yml.
title = "Sonokai"
gtk_name = "Sonokai"
shell_name = "Sonokai-Shell"
credit = "Sonokai (colours of the Ptyxis built-in 'Sonokai'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Sonokai.yml)"
ptyxis = "Sonokai"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Sonokai' (bulk-built by tools/bulk-scheme.py)."
default_accent = "yellow"

[dark]
bg_deep = "#2c2e34"
fg = "#e2e2e3"
selection = "#505257"   # DERIVED
red = "#fc5d7c"
orange = "#f29270"   # DERIVED
yellow = "#e7c664"
green = "#9ed072"
cyan = "#76cce0"
blue = "#f39660"
magenta = "#b39df3"
purple = "#b39df3"   # = magenta
# palette Color8 (bright black) = #7f8490: a candidate for `comment`
[dark.ansi]
red = "#fc5d7c"
green = "#9ed072"
yellow = "#e7c664"
blue = "#f39660"
magenta = "#b39df3"
cyan = "#76cce0"
[dark.terminal]
source = "Sonokai"   # Ptyxis built-in id
black = "#2c2e34"   # Ptyxis Color0
bright_black = "#7f8490"   # Ptyxis Color8
