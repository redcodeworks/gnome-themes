# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #0a1e24 5.5% towards fg
# derived: dark.surface derived: #0a1e24 16.0% towards fg
# derived: dark.surface_high derived: #0a1e24 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #0a1e24 -> #0a1e2c (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #e3cd7c (it equals the default accent; keeps accent tokens unique)
title = "Spacedust"
gtk_name = "Spacedust"
shell_name = "Spacedust-Shell"
credit = "Spacedust (colours of the Ptyxis built-in 'Spacedust'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Spacedust.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#0a1e24"],[53,"#162a2d"],[66,"#2e403d"],
        [91,"#495950"],[145,"#768370"],[238,"#ecf0c1"],[255,"#ecf0c1"]]
fg = "#ecf0c1"
top = "#ecf0c1"
accent_fg = "#0a1e2c"
view = "#0a1e24"
[dark.fam]
blue = ["#15539e","#e3cd7b"]
red = ["#cc0000","#e35b00"]
orange = ["#f57900","#e3cd7c"]
green = ["#4e9a06","#5cab96"]
[dark.exact]
"#26ab62" = "#5cab96"
"#26a269" = "#5cab96"      # GTK4 stock success green
"#3584e4" = "#e3cd7b"
"#eeeeec" = "#ecf0c1"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#0a1e24"],[34.67,"#0a1e24"],[55.33,"#162a2d"],[66.33,"#2e403d"],
        [86.67,"#495950"],[156,"#acb595"],[179,"#acb595"],[250,"#ecf0c1"],
        [255,"#ecf0c1"]]
fg = "#ecf0c1"
top = "#ecf0c1"
accent_fg = "#0a1e2c"
view = "#0a1e24"
[shell.dark.fam]
blue = ["#3584e4","#e3cd7b"]
red = ["#c01c28","#e35b00"]
orange = ["#ff7800","#e3943e"]
green = ["#26a269","#5cab96"]
[shell.dark.exact]
"#cd9309" = "#e3cd7c"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#acb595"      # web-login title, dim text
"#54545a" = "#2e403d"      # notification/message card: surface
"#45454a" = "#223535"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#e35b00"
fg = "#0a1e2c"
[accents.dark.green]
color = "#5cab96"
fg = "#0a1e2c"
[accents.dark.yellow]
color = "#e3cd7b"
fg = "#0a1e2c"
[accents.dark.blue]
color = "#0f548b"
fg = "#ecf0c1"
[accents.dark.magenta]
color = "#e35b00"
fg = "#0a1e2c"
[accents.dark.cyan]
color = "#06afc7"
fg = "#0a1e2c"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#0a1e24"
bg = "#162a2d"
surface = "#2e403d"
surface_high = "#495950"
popover = "#495950"
fg = "#ecf0c1"
