# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
title = "Nordic"
gtk_name = "Nordic-Nord"
shell_name = "Nordic-Nord-Shell"
credit = "Nord by Sven Greb (MIT)"
default_accent = "cyan"
dark_only = true

[dark]
ramp = [[0,"#000000"],[45,"#2e3440"],[53,"#3b4252"],[66,"#434c5e"],
        [91,"#4c566a"],[145,"#828896"],[238,"#d8dee9"],[255,"#d8dee9"]]
fg = "#d8dee9"
top = "#d8dee9"
accent_fg = "#2e3440"
view = "#2e3440"
[dark.fam]
blue = ["#15539e","#88c0d0"]
red = ["#cc0000","#bf616a"]
orange = ["#f57900","#ebcb8b"]
green = ["#4e9a06","#a3be8c"]
[dark.exact]
"#26ab62" = "#a3be8c"
"#26a269" = "#a3be8c"      # GTK4 stock success green
"#3584e4" = "#88c0d0"
"#eeeeec" = "#d8dee9"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2e3440"],[34.67,"#2e3440"],[55.33,"#3b4252"],[66.33,"#434c5e"],
        [86.67,"#4c566a"],[156,"#a9afbc"],[179,"#a9afbc"],[250,"#d8dee9"],
        [255,"#d8dee9"]]
fg = "#d8dee9"
top = "#d8dee9"
accent_fg = "#2e3440"
view = "#2e3440"
[shell.dark.fam]
blue = ["#3584e4","#88c0d0"]
red = ["#c01c28","#bf616a"]
orange = ["#ff7800","#d08770"]
green = ["#26a269","#a3be8c"]
[shell.dark.exact]
"#cd9309" = "#ebcb8b"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a9afbc"      # web-login title, dim text
"#54545a" = "#434c5e"      # notification/message card: surface
"#45454a" = "#3f4758"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#bf616a"
fg = "#2e3440"
[accents.dark.green]
color = "#a3be8c"
