# SPDX-License-Identifier: MIT
# Nord palette (arcticicestudio/nord, MIT, Copyright (c) 2016-present Sven Greb), dark only. "Nordic" is the
# GTK theme (EliverLara/Nordic) that popularised Nord for GTK; only the Nord palette values are used here.
# Ladder as in the brief: view nord0, window nord1, headers nord2, popovers nord3. fg_dim and comment are derived
# by the fixed mixing rules (Nord has no dim-text step). ANSI six = Ptyxis "Nord" [Dark] Color1-6 (identical to
# the Nord spec's typical terminal table); default accent cyan = nord8, Nord's primary UI colour.
title = "Nordic"
gtk_name = "Nordic-Nord"
shell_name = "Nordic-Nord-Shell"
credit = "Nord by Sven Greb (MIT)"
ptyxis = "nord"
ptyxis_reason = "the built-in (id lower case, Name Nord) has [Light] and [Dark] sections; under a light system colour scheme Ptyxis shows its [Light] section while the rest of Nordic stays dark (ptyxis_light_section_accepted)."
ptyxis_light_section_accepted = true
default_accent = "cyan"

[dark]
bg_deep = "#2e3440"
bg = "#3b4252"
surface = "#434c5e"
surface_high = "#4c566a"
fg = "#d8dee9"
selection = "#4c566a"
red = "#bf616a"
orange = "#d08770"
yellow = "#ebcb8b"
green = "#a3be8c"
cyan = "#88c0d0"
blue = "#81a1c1"
magenta = "#b48ead"
purple = "#b48ead"
[dark.ansi]
orange = "#d08770"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#81a1c1"
magenta = "#b48ead"
cyan = "#88c0d0"


# TERMINAL (2026-11-07, Kevin's decision): Nordic uses the Ptyxis built-in "Nord" (source of truth; official Nord terminal colours). Nord has [Light] and [Dark] sections and
# Nordic is dark only, so under a LIGHT system colour scheme Ptyxis shows Nord's [Light] section while the rest of Nordic (GTK, Shell) stays dark; this was accepted on purpose
# (`ptyxis_light_section_accepted` below). The dark values here are Nord's [Dark] section as it is.

[dark.terminal]
source = "nord"   # Ptyxis built-in, its [Dark] section, checked 2026-11-07 with tools/ptyxis-palette.sh
black = "#3b4252"   # Color0
white = "#e5e9f0"   # Color7
bright_black = "#4c566a"   # Color8
bright_red = "#bf616a"   # Color9
bright_green = "#a3be8c"   # Color10
bright_yellow = "#ebcb8b"   # Color11
bright_blue = "#81a1c1"   # Color12
bright_magenta = "#b48ead"   # Color13
bright_cyan = "#8fbcbb"   # Color14
bright_white = "#eceff4"   # Color15
