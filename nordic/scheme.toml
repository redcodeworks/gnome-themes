# SPDX-License-Identifier: MIT
# Nord palette (arcticicestudio/nord, MIT, Copyright (c) 2016-present Sven Greb), dark only. "Nordic" is the
# GTK theme (EliverLara/Nordic) that popularised Nord for GTK; only the Nord palette values are used here.
# Ladder as in the brief: view nord0, window nord1, headers nord2, popovers nord3. fg_dim and comment are derived
# by the fixed mixing rules (Nord has no dim-text step). ANSI six = Ptyxis "Nord" [Dark] Color1-6 (identical to
# the Nord spec's typical terminal table); default accent cyan = nord8, Nord's primary UI colour.
title = "Nordic"
gtk_name = "Nordic-Nord"
shell_name = "Nordic-Nord-Shell"
credit = "Nord by Sven Greb (MIT)"
ptyxis = "generated"
ptyxis_reason = "the Nord built-in matches the dark roles exactly but has a [Light] section: under a light system setting Ptyxis would switch to a light terminal while this dark-only scheme (GTK light slot = dark values) stays dark; the generated palette keeps both slots dark"
default_accent = "cyan"

[dark]
bg_deep = "#2e3440"
bg = "#3b4252"
surface = "#434c5e"
surface_high = "#4c566a"
fg = "#d8dee9"
selection = "#4c566a"
red = "#bf616a"
orange = "#d08770"
yellow = "#ebcb8b"
green = "#a3be8c"
cyan = "#88c0d0"
blue = "#81a1c1"
magenta = "#b48ead"
purple = "#b48ead"
[dark.ansi]
orange = "#d08770"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#bf616a"
green = "#a3be8c"
yellow = "#ebcb8b"
blue = "#81a1c1"
magenta = "#b48ead"
cyan = "#88c0d0"

# Terminal palette overrides (tools/ptyxis-gen.py). Source (checked 2026-11-07 with tools/ptyxis-palette.sh): the Ptyxis built-in palette(s) named below,
# whose six ANSI colours equal this scheme's; their black and REAL brights are taken wherever they differ from the generator defaults
# (a bright black equal to the background is skipped: it would be invisible; the default `comment` stays). Each key notes the Color it is.
# dark variant <- Ptyxis "Nord [Dark]"
[dark.terminal]
black = "#3b4252"   # Color0
bright_black = "#4c566a"   # Color8
bright_cyan = "#8fbcbb"   # Color14
bright_white = "#eceff4"   # Color15
