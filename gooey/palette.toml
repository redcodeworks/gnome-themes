# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #0d101b 5.5% towards fg
# derived: dark.surface derived: #0d101b 16.0% towards fg
# derived: dark.surface_high derived: #0d101b 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.green nudged to #72ccaf (it equals the default accent; keeps accent tokens unique)
title = "Gooey"
gtk_name = "Gooey"
shell_name = "Gooey-Shell"
credit = "Gooey (colours of the Ptyxis built-in 'Gooey'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Gooey.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#0d101b"],[53,"#191c27"],[66,"#31343f"],
        [91,"#4b4e59"],[145,"#777a86"],[238,"#ebeef9"],[255,"#ebeef9"]]
fg = "#ebeef9"
top = "#ebeef9"
accent_fg = "#0d101b"
view = "#0d101b"
[dark.fam]
blue = ["#15539e","#72ccae"]
red = ["#cc0000","#bb4f6c"]
orange = ["#f57900","#c65e3d"]
green = ["#4e9a06","#72ccaf"]
[dark.exact]
"#26ab62" = "#72ccaf"
"#26a269" = "#72ccaf"      # GTK4 stock success green
"#3584e4" = "#72ccae"
"#eeeeec" = "#ebeef9"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#0d101b"],[34.67,"#0d101b"],[55.33,"#191c27"],[66.33,"#31343f"],
        [86.67,"#4b4e59"],[156,"#acafba"],[179,"#acafba"],[250,"#ebeef9"],
        [255,"#ebeef9"]]
fg = "#ebeef9"
top = "#ebeef9"
accent_fg = "#0d101b"
view = "#0d101b"
[shell.dark.fam]
blue = ["#3584e4","#72ccae"]
red = ["#c01c28","#bb4f6c"]
orange = ["#ff7800","#c05654"]
green = ["#26a269","#72ccaf"]
[shell.dark.exact]
"#cd9309" = "#c65e3d"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#acafba"      # web-login title, dim text
"#54545a" = "#31343f"      # notification/message card: surface
"#45454a" = "#252833"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#bb4f6c"
fg = "#0d101b"
[accents.dark.green]
color = "#72ccae"
fg = "#0d101b"
[accents.dark.yellow]
color = "#c65e3d"
fg = "#0d101b"
[accents.dark.blue]
color = "#58b6ca"
fg = "#0d101b"
[accents.dark.magenta]
color = "#6488c4"
fg = "#0d101b"
[accents.dark.cyan]
color = "#8d84c6"
fg = "#0d101b"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#0d101b"
bg = "#191c27"
surface = "#31343f"
surface_high = "#4b4e59"
popover = "#4b4e59"
fg = "#ebeef9"
red = "#bb4f6c"
green = "#72ccaf"
yellow = "#c65e3d"
accent = "#72ccae"
accent_fg = "#0d101b"
warning_fg = "#0d101b"
secondary_sidebar = "#191c27"
