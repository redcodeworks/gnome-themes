# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #211f46 5.5% towards fg
# derived: dark.surface derived: #211f46 16.0% towards fg
# derived: dark.surface_high derived: #211f46 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #211f46 -> #211f4e (the text colour varies per accent: the default needs its own token)
title = "Morada"
gtk_name = "Morada"
shell_name = "Morada-Shell"
credit = "Morada (colours of the Ptyxis built-in 'Morada'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Morada.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#211f46"],[53,"#2d2b50"],[66,"#454364"],
        [91,"#5f5e7a"],[145,"#8c8a9f"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#211f4e"
view = "#211f46"
[dark.fam]
blue = ["#15539e","#70a699"]
red = ["#cc0000","#0f49c4"]
orange = ["#f57900","#e87324"]
green = ["#4e9a06","#48b117"]
[dark.exact]
"#26ab62" = "#48b117"
"#26a269" = "#48b117"      # GTK4 stock success green
"#3584e4" = "#70a699"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#211f46"],[34.67,"#211f46"],[55.33,"#2d2b50"],[66.33,"#454364"],
        [86.67,"#5f5e7a"],[156,"#c0bfca"],[179,"#c0bfca"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#211f4e"
view = "#211f46"
[shell.dark.fam]
blue = ["#3584e4","#70a699"]
red = ["#c01c28","#0f49c4"]
orange = ["#ff7800","#7c5e74"]
green = ["#26a269","#48b117"]
[shell.dark.exact]
"#cd9309" = "#e87324"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c0bfca"      # web-login title, dim text
"#54545a" = "#454364"      # notification/message card: surface
"#45454a" = "#39375a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#0f49c4"
fg = "#ffffff"
[accents.dark.green]
color = "#48b117"
fg = "#211f4e"
[accents.dark.yellow]
color = "#e87324"
fg = "#211f4e"
[accents.dark.blue]
color = "#bc0116"
fg = "#ffffff"
[accents.dark.magenta]
color = "#665b93"
fg = "#ffffff"
[accents.dark.cyan]
color = "#70a699"
fg = "#211f4e"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#211f46"
bg = "#2d2b50"
surface = "#454364"
surface_high = "#5f5e7a"
popover = "#5f5e7a"
fg = "#ffffff"
red = "#0f49c4"
green = "#48b117"
yellow = "#e87324"
accent = "#70a699"
accent_fg = "#211f4e"
warning_fg = "#211f46"
secondary_sidebar = "#2d2b50"
