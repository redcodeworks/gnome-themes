title = "Pnevma"
gtk_name = "Pnevma"
shell_name = "Pnevma-Shell"
credit = "Pnevma (colours of the Ptyxis built-in 'Pnevma'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Pnevma.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1c1c1c"],[53,"#262626"],[66,"#393939"],
        [91,"#4e4e4e"],[145,"#727272"],[238,"#d0d0d0"],[255,"#d0d0d0"]]
fg = "#d0d0d0"
top = "#d0d0d0"
accent_fg = "#1c1c1c"
view = "#1c1c1c"
[dark.fam]
blue = ["#15539e","#8adbb4"]
red = ["#cc0000","#a36666"]
orange = ["#f57900","#d7af87"]
green = ["#4e9a06","#90a57d"]
[dark.exact]
"#26ab62" = "#90a57d"
"#26a269" = "#90a57d"      # GTK4 stock success green
"#3584e4" = "#8adbb4"
"#eeeeec" = "#d0d0d0"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1c1c1c"],[34.67,"#1c1c1c"],[55.33,"#262626"],[66.33,"#393939"],
        [86.67,"#4e4e4e"],[156,"#9d9d9d"],[179,"#9d9d9d"],[250,"#d0d0d0"],
        [255,"#d0d0d0"]]
fg = "#d0d0d0"
top = "#d0d0d0"
accent_fg = "#1c1c1c"
view = "#1c1c1c"
[shell.dark.fam]
blue = ["#3584e4","#8adbb4"]
red = ["#c01c28","#a36666"]
orange = ["#ff7800","#bd8a76"]
green = ["#26a269","#90a57d"]
[shell.dark.exact]
"#cd9309" = "#d7af87"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9d9d9d"      # web-login title, dim text
"#54545a" = "#393939"      # notification/message card: surface
"#45454a" = "#303030"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
