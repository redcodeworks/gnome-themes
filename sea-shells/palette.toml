fg = "#deb88d"
[accents.dark.magenta]
color = "#68d4f1"
fg = "#091423"
[accents.dark.cyan]
color = "#50a3b5"
fg = "#091423"

# roles for tools/libadwaita-gen.py
[roles.dark]
