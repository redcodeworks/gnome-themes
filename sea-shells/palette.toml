title = "Sea Shells"
gtk_name = "Sea-Shells"
shell_name = "Sea-Shells-Shell"
credit = "Sea Shells (colours of the Ptyxis built-in 'Sea Shells'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Sea%20Shells.yml)"
default_accent = "magenta"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#09141b"],[53,"#151d21"],[66,"#2b2e2d"],
        [91,"#45423b"],[145,"#6f6352"],[238,"#deb88d"],[255,"#deb88d"]]
fg = "#deb88d"
top = "#deb88d"
accent_fg = "#091423"
view = "#09141b"
[dark.fam]
blue = ["#15539e","#68d4f1"]
red = ["#cc0000","#d15123"]
orange = ["#f57900","#fca02f"]
green = ["#4e9a06","#027c9b"]
[dark.exact]
"#26ab62" = "#027c9b"
"#26a269" = "#027c9b"      # GTK4 stock success green
"#3584e4" = "#68d4f1"
"#eeeeec" = "#deb88d"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#09141b"],[34.67,"#09141b"],[55.33,"#151d21"],[66.33,"#2b2e2d"],
        [86.67,"#45423b"],[156,"#a28a6d"],[179,"#a28a6d"],[250,"#deb88d"],
        [255,"#deb88d"]]
fg = "#deb88d"
top = "#deb88d"
accent_fg = "#091423"
view = "#09141b"
[shell.dark.fam]
blue = ["#3584e4","#68d4f1"]
red = ["#c01c28","#d15123"]
orange = ["#ff7800","#e67829"]
green = ["#26a269","#027c9b"]
[shell.dark.exact]
"#cd9309" = "#fca02f"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a28a6d"      # web-login title, dim text
"#54545a" = "#2b2e2d"      # notification/message card: surface
"#45454a" = "#202627"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
