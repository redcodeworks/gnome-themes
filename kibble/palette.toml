title = "Kibble"
gtk_name = "Kibble"
shell_name = "Kibble-Shell"
credit = "Kibble (colours of the Ptyxis built-in 'Kibble'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Kibble.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#0e100a"],[53,"#1b1d17"],[66,"#333530"],
        [91,"#4f514c"],[145,"#7e7f7c"],[238,"#f7f7f7"],[255,"#f7f7f7"]]
fg = "#f7f7f7"
top = "#f7f7f7"
accent_fg = "#0e1012"
view = "#0e100a"
[dark.fam]
blue = ["#15539e","#d8e30e"]
red = ["#cc0000","#c70031"]
orange = ["#f57900","#d8e30f"]
green = ["#4e9a06","#29cf13"]
[dark.exact]
"#26ab62" = "#29cf13"
"#26a269" = "#29cf13"      # GTK4 stock success green
"#3584e4" = "#d8e30e"
"#eeeeec" = "#f7f7f7"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#0e100a"],[34.67,"#0e100a"],[55.33,"#1b1d17"],[66.33,"#333530"],
        [86.67,"#4f514c"],[156,"#b5b6b4"],[179,"#b5b6b4"],[250,"#f7f7f7"],
        [255,"#f7f7f7"]]
fg = "#f7f7f7"
top = "#f7f7f7"
accent_fg = "#0e1012"
view = "#0e100a"
[shell.dark.fam]
blue = ["#3584e4","#d8e30e"]
red = ["#c01c28","#c70031"]
orange = ["#ff7800","#d07220"]
green = ["#26a269","#29cf13"]
[shell.dark.exact]
"#cd9309" = "#d8e30f"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b5b6b4"      # web-login title, dim text
"#54545a" = "#333530"      # notification/message card: surface
"#45454a" = "#272924"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
