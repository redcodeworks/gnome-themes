# derived: dark.bg derived: #0e100a 5.5% towards fg
# derived: dark.surface derived: #0e100a 16.0% towards fg
# derived: dark.surface_high derived: #0e100a 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
