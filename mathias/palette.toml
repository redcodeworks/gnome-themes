# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #000000 5.5% towards fg
# derived: dark.surface derived: #000000 16.0% towards fg
# derived: dark.surface_high derived: #000000 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.green nudged to #a6e32e (it equals the default accent; keeps accent tokens unique)
title = "Mathias"
gtk_name = "Mathias"
shell_name = "Mathias-Shell"
credit = "Mathias (colours of the Ptyxis built-in 'Mathias'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Mathias.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#000000"],[53,"#0a0a0a"],[66,"#1e1e1e"],
        [91,"#343434"],[145,"#5a5a5a"],[238,"#bbbbbb"],[255,"#bbbbbb"]]
fg = "#bbbbbb"
top = "#bbbbbb"
accent_fg = "#000000"
view = "#000000"
[dark.fam]
blue = ["#15539e","#a6e32d"]
red = ["#cc0000","#e52222"]
orange = ["#f57900","#fc951e"]
green = ["#4e9a06","#a6e32e"]
[dark.exact]
"#26ab62" = "#a6e32e"
"#26a269" = "#a6e32e"      # GTK4 stock success green
"#3584e4" = "#a6e32d"
"#eeeeec" = "#bbbbbb"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#000000"],[34.67,"#000000"],[55.33,"#0a0a0a"],[66.33,"#1e1e1e"],
        [86.67,"#343434"],[156,"#868686"],[179,"#868686"],[250,"#bbbbbb"],
        [255,"#bbbbbb"]]
fg = "#bbbbbb"
top = "#bbbbbb"
accent_fg = "#000000"
view = "#000000"
[shell.dark.fam]
blue = ["#3584e4","#a6e32d"]
red = ["#c01c28","#e52222"]
orange = ["#ff7800","#f05c20"]
green = ["#26a269","#a6e32e"]
[shell.dark.exact]
"#cd9309" = "#fc951e"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#868686"      # web-login title, dim text
"#54545a" = "#1e1e1e"      # notification/message card: surface
"#45454a" = "#141414"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#e52222"
fg = "#000000"
[accents.dark.green]
color = "#a6e32d"
fg = "#000000"
[accents.dark.yellow]
color = "#fc951e"
fg = "#000000"
[accents.dark.blue]
color = "#c48dff"
fg = "#000000"
[accents.dark.magenta]
color = "#fa2573"
fg = "#000000"
[accents.dark.cyan]
color = "#67d9f0"
fg = "#000000"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#000000"
bg = "#0a0a0a"
surface = "#1e1e1e"
surface_high = "#343434"
popover = "#343434"
