credit = "Vag (colours of the Ptyxis built-in 'Vag'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Vag.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
