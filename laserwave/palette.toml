title = "Laserwave"
gtk_name = "Laserwave"
shell_name = "Laserwave-Shell"
credit = "Laserwave (colours of the Ptyxis built-in 'Laserwave'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Laserwave.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1f1926"],[53,"#2a2430"],[66,"#3e3944"],
        [91,"#55515a"],[145,"#7c797f"],[238,"#e0e0e0"],[255,"#e0e0e0"]]
fg = "#e0e0e0"
top = "#e0e0e0"
accent_fg = "#1f192e"
view = "#1f1926"
[dark.fam]
blue = ["#15539e","#afd686"]
red = ["#cc0000","#eb64b9"]
orange = ["#f57900","#feae87"]
green = ["#4e9a06","#afd687"]
[dark.exact]
"#26ab62" = "#afd687"
"#26a269" = "#afd687"      # GTK4 stock success green
"#3584e4" = "#afd686"
"#eeeeec" = "#e0e0e0"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1f1926"],[34.67,"#1f1926"],[55.33,"#2a2430"],[66.33,"#3e3944"],
        [86.67,"#55515a"],[156,"#a9a8ab"],[179,"#a9a8ab"],[250,"#e0e0e0"],
        [255,"#e0e0e0"]]
fg = "#e0e0e0"
top = "#e0e0e0"
accent_fg = "#1f192e"
view = "#1f1926"
[shell.dark.fam]
blue = ["#3584e4","#afd686"]
red = ["#c01c28","#eb64b9"]
orange = ["#ff7800","#f489a0"]
green = ["#26a269","#afd687"]
[shell.dark.exact]
"#cd9309" = "#feae87"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a9a8ab"      # web-login title, dim text
"#54545a" = "#3e3944"      # notification/message card: surface
"#45454a" = "#342e3a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
