# derived: dark.bg derived: #1f1926 5.5% towards fg
# derived: dark.surface derived: #1f1926 16.0% towards fg
# derived: dark.surface_high derived: #1f1926 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
