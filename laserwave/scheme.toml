# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Laserwave'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Laserwave.yml.
title = "Laserwave"
gtk_name = "Laserwave"
shell_name = "Laserwave-Shell"
credit = "Laserwave (colours of the Ptyxis built-in 'Laserwave'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Laserwave.yml)"
ptyxis = "Laserwave"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Laserwave' (bulk-built by tools/bulk-scheme.py)."
default_accent = "green"

[dark]
bg_deep = "#1f1926"
fg = "#e0e0e0"
selection = "#46414b"   # DERIVED
red = "#eb64b9"
orange = "#f489a0"   # DERIVED
yellow = "#feae87"
green = "#afd686"
cyan = "#215969"
blue = "#40b4c4"
magenta = "#b381c5"
purple = "#b381c5"   # = magenta
# palette Color8 (bright black) = #716485: a candidate for `comment`
[dark.ansi]
red = "#eb64b9"
green = "#afd686"
yellow = "#feae87"
blue = "#40b4c4"
magenta = "#b381c5"
cyan = "#215969"
[dark.terminal]
source = "Laserwave"   # Ptyxis built-in id
cursor = "#c7c7c7"   # Ptyxis Cursor
black = "#39243a"   # Ptyxis Color0
white = "#91889b"   # Ptyxis Color7
bright_black = "#716485"   # Ptyxis Color8
bright_red = "#fc2377"   # Ptyxis Color9
bright_green = "#50fa7b"   # Ptyxis Color10
bright_yellow = "#ffe261"   # Ptyxis Color11
bright_blue = "#74dfc4"   # Ptyxis Color12
bright_magenta = "#6d75e0"   # Ptyxis Color13
bright_cyan = "#b4dce7"   # Ptyxis Color14
bright_white = "#ffffff"   # Ptyxis Color15
