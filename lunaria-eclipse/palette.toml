# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #323f46 5.5% towards fg
# derived: dark.surface derived: #323f46 16.0% towards fg
# derived: dark.surface_high derived: #323f46 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #323f46 -> #323f4e (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #a69876 (it equals the default accent; keeps accent tokens unique)
title = "Lunaria Eclipse"
gtk_name = "Lunaria-Eclipse"
shell_name = "Lunaria-Eclipse-Shell"
credit = "Lunaria Eclipse (colours of the Ptyxis built-in 'Lunaria Eclipse'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Lunaria%20Eclipse.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#323f46"],[53,"#3a474e"],[66,"#4a565d"],
        [91,"#5c676f"],[145,"#7a838c"],[238,"#c9cdd7"],[255,"#c9cdd7"]]
fg = "#c9cdd7"
top = "#c9cdd7"
accent_fg = "#323f4e"
view = "#323f46"
[dark.fam]
blue = ["#15539e","#a69875"]
red = ["#cc0000","#83615b"]
orange = ["#f57900","#a69876"]
green = ["#4e9a06","#7f9781"]
[dark.exact]
"#26ab62" = "#7f9781"
"#26a269" = "#7f9781"      # GTK4 stock success green
"#3584e4" = "#a69875"
"#eeeeec" = "#c9cdd7"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#323f46"],[34.67,"#323f46"],[55.33,"#3a474e"],[66.33,"#4a565d"],
        [86.67,"#5c676f"],[156,"#9ea5ae"],[179,"#9ea5ae"],[250,"#c9cdd7"],
        [255,"#c9cdd7"]]
fg = "#c9cdd7"
top = "#c9cdd7"
accent_fg = "#323f4e"
view = "#323f46"
[shell.dark.fam]
blue = ["#3584e4","#a69875"]
red = ["#c01c28","#83615b"]
orange = ["#ff7800","#947c68"]
green = ["#26a269","#7f9781"]
[shell.dark.exact]
"#cd9309" = "#a69876"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9ea5ae"      # web-login title, dim text
"#54545a" = "#4a565d"      # notification/message card: surface
"#45454a" = "#424e56"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#83615b"
fg = "#c9cdd7"
[accents.dark.green]
color = "#7f9781"
