[accents.dark.blue]
color = "#53516f"
fg = "#c9cdd7"
[accents.dark.magenta]
color = "#856880"
fg = "#c9cdd7"
[accents.dark.cyan]
color = "#7d96b2"
fg = "#323f4e"

# roles for tools/libadwaita-gen.py
[roles.dark]
