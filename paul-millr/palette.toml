# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #000000 5.5% towards fg
# derived: dark.surface derived: #000000 16.0% towards fg
# derived: dark.surface_high derived: #000000 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.green nudged to #79ff10 (it equals the default accent; keeps accent tokens unique)
title = "Paul Millr"
gtk_name = "Paul-Millr"
shell_name = "Paul-Millr-Shell"
credit = "Paul Millr (colours of the Ptyxis built-in 'Paul Millr'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Paul%20Millr.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#000000"],[53,"#0d0d0d"],[66,"#272727"],
        [91,"#444444"],[145,"#747474"],[238,"#f2f2f2"],[255,"#f2f2f2"]]
fg = "#f2f2f2"
top = "#f2f2f2"
accent_fg = "#000000"
view = "#000000"
[dark.fam]
blue = ["#15539e","#79ff0f"]
red = ["#cc0000","#ff0000"]
orange = ["#f57900","#d3bf00"]
green = ["#4e9a06","#79ff10"]
[dark.exact]
"#26ab62" = "#79ff10"
"#26a269" = "#79ff10"      # GTK4 stock success green
"#3584e4" = "#79ff0f"
"#eeeeec" = "#f2f2f2"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#000000"],[34.67,"#000000"],[55.33,"#0d0d0d"],[66.33,"#272727"],
        [86.67,"#444444"],[156,"#adadad"],[179,"#adadad"],[250,"#f2f2f2"],
        [255,"#f2f2f2"]]
fg = "#f2f2f2"
top = "#f2f2f2"
accent_fg = "#000000"
view = "#000000"
[shell.dark.fam]
blue = ["#3584e4","#79ff0f"]
red = ["#c01c28","#ff0000"]
orange = ["#ff7800","#e96000"]
green = ["#26a269","#79ff10"]
[shell.dark.exact]
"#cd9309" = "#d3bf00"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#adadad"      # web-login title, dim text
"#54545a" = "#272727"      # notification/message card: surface
"#45454a" = "#1a1a1a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff0000"
fg = "#000000"
[accents.dark.green]
color = "#79ff0f"
fg = "#000000"
[accents.dark.yellow]
color = "#d3bf00"
fg = "#000000"
[accents.dark.blue]
color = "#396bd7"
fg = "#000000"
[accents.dark.magenta]
color = "#b449be"
fg = "#000000"
[accents.dark.cyan]
color = "#66ccff"
fg = "#000000"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#000000"
bg = "#0d0d0d"
surface = "#272727"
surface_high = "#444444"
popover = "#444444"
fg = "#f2f2f2"
red = "#ff0000"
green = "#79ff10"
yellow = "#d3bf00"
accent = "#79ff0f"
accent_fg = "#000000"
warning_fg = "#000000"
secondary_sidebar = "#0d0d0d"
