view = "#0d1926"
[dark.fam]
blue = ["#15539e","#b8b87a"]
red = ["#cc0000","#b87a7a"]
orange = ["#f57900","#b8b87b"]
green = ["#4e9a06","#7ab87a"]
[dark.exact]
"#26ab62" = "#7ab87a"
"#26a269" = "#7ab87a"      # GTK4 stock success green
"#3584e4" = "#b8b87a"
"#eeeeec" = "#d9e6f2"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#0d1926"],[34.67,"#0d1926"],[55.33,"#182431"],[66.33,"#2e3a47"],
        [86.67,"#46525f"],[156,"#9facb8"],[179,"#9facb8"],[250,"#d9e6f2"],
        [255,"#d9e6f2"]]
fg = "#d9e6f2"
top = "#d9e6f2"
accent_fg = "#0d1926"
view = "#0d1926"
[shell.dark.fam]
blue = ["#3584e4","#b8b87a"]
red = ["#c01c28","#b87a7a"]
orange = ["#ff7800","#b8997a"]
green = ["#26a269","#7ab87a"]
[shell.dark.exact]
"#cd9309" = "#b8b87b"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9facb8"      # web-login title, dim text
"#54545a" = "#2e3a47"      # notification/message card: surface
"#45454a" = "#232f3c"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
