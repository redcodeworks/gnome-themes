# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #323232 5.5% towards fg
# derived: dark.surface derived: #323232 16.0% towards fg
# derived: dark.surface_high derived: #323232 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #323232 -> #32323a (the text colour varies per accent: the default needs its own token)
title = "Idle Toes"
gtk_name = "Idle-Toes"
shell_name = "Idle-Toes-Shell"
credit = "Idle Toes (colours of the Ptyxis built-in 'Idle Toes'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Idle%20Toes.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#323232"],[53,"#3d3d3d"],[66,"#535353"],
        [91,"#6b6b6b"],[145,"#949494"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#32323a"
view = "#323232"
[dark.fam]
blue = ["#15539e","#bed6ff"]
red = ["#cc0000","#d25252"]
orange = ["#f57900","#ffc66d"]
green = ["#4e9a06","#7fe173"]
[dark.exact]
"#26ab62" = "#7fe173"
"#26a269" = "#7fe173"      # GTK4 stock success green
"#3584e4" = "#bed6ff"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#323232"],[34.67,"#323232"],[55.33,"#3d3d3d"],[66.33,"#535353"],
        [86.67,"#6b6b6b"],[156,"#c5c5c5"],[179,"#c5c5c5"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#32323a"
view = "#323232"
[shell.dark.fam]
blue = ["#3584e4","#bed6ff"]
red = ["#c01c28","#d25252"]
orange = ["#ff7800","#e88c60"]
green = ["#26a269","#7fe173"]
[shell.dark.exact]
"#cd9309" = "#ffc66d"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c5c5c5"      # web-login title, dim text
"#54545a" = "#535353"      # notification/message card: surface
"#45454a" = "#484848"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#d25252"
fg = "#ffffff"
[accents.dark.green]
color = "#7fe173"
fg = "#32323a"
[accents.dark.yellow]
color = "#ffc66d"
fg = "#32323a"
[accents.dark.blue]
color = "#4099ff"
fg = "#32323a"
[accents.dark.magenta]
color = "#f680ff"
fg = "#32323a"
[accents.dark.cyan]
color = "#bed6ff"
fg = "#32323a"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#323232"
bg = "#3d3d3d"
surface = "#535353"
surface_high = "#6b6b6b"
popover = "#6b6b6b"
fg = "#ffffff"
red = "#d25252"
green = "#7fe173"
yellow = "#ffc66d"
accent = "#bed6ff"
accent_fg = "#32323a"
warning_fg = "#323232"
secondary_sidebar = "#3d3d3d"
