# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #1f2d3a 5.5% towards fg
# derived: dark.surface derived: #1f2d3a 16.0% towards fg
# derived: dark.surface_high derived: #1f2d3a 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #f39c13 (it equals the default accent; keeps accent tokens unique)
title = "Flat"
gtk_name = "Flat"
shell_name = "Flat-Shell"
credit = "Flat (colours of the Ptyxis built-in 'Flat'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Flat.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1f2d3a"],[53,"#1f353f"],[66,"#1e444a"],
        [91,"#1e5555"],[145,"#1d7269"],[238,"#1abc9c"],[255,"#1abc9c"]]
fg = "#1abc9c"
top = "#1abc9c"
accent_fg = "#1f2d3a"
view = "#1f2d3a"
[dark.fam]
blue = ["#15539e","#f39c12"]
red = ["#cc0000","#c0392b"]
orange = ["#f57900","#f39c13"]
green = ["#4e9a06","#27ae60"]
[dark.exact]
"#26ab62" = "#27ae60"
"#26a269" = "#27ae60"      # GTK4 stock success green
"#3584e4" = "#f39c12"
"#eeeeec" = "#1abc9c"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1f2d3a"],[34.67,"#1f2d3a"],[55.33,"#1f353f"],[66.33,"#1e444a"],
        [86.67,"#1e5555"],[156,"#1c9480"],[179,"#1c9480"],[250,"#1abc9c"],
        [255,"#1abc9c"]]
fg = "#1abc9c"
top = "#1abc9c"
accent_fg = "#1f2d3a"
view = "#1f2d3a"
[shell.dark.fam]
blue = ["#3584e4","#f39c12"]
red = ["#c01c28","#c0392b"]
orange = ["#ff7800","#da6a1e"]
green = ["#26a269","#27ae60"]
[shell.dark.exact]
"#cd9309" = "#f39c13"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#1c9480"      # web-login title, dim text
"#54545a" = "#1e444a"      # notification/message card: surface
"#45454a" = "#1e3c44"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#c0392b"
fg = "#1f2d3a"
[accents.dark.green]
color = "#27ae60"
fg = "#1f2d3a"
[accents.dark.yellow]
color = "#f39c12"
