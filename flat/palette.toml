[accents.dark.blue]
color = "#2980b9"
fg = "#1f2d3a"
[accents.dark.magenta]
color = "#8e44ad"
fg = "#1f2d3a"
[accents.dark.cyan]
color = "#16a085"
fg = "#1f2d3a"

# roles for tools/libadwaita-gen.py
[roles.dark]
