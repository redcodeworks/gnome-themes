# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #1c1f27 5.5% towards fg
# derived: dark.surface derived: #1c1f27 16.0% towards fg
# derived: dark.surface_high derived: #1c1f27 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.green nudged to #afd384 (it equals the default accent; keeps accent tokens unique)
title = "Ocean Dark"
gtk_name = "Ocean-Dark"
shell_name = "Ocean-Dark-Shell"
credit = "Ocean Dark (colours of the Ptyxis built-in 'Ocean Dark'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Ocean%20Dark.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1c1f27"],[53,"#23262e"],[66,"#30333c"],
        [91,"#3e424c"],[145,"#575b67"],[238,"#979cac"],[255,"#979cac"]]
fg = "#979cac"
top = "#979cac"
accent_fg = "#1c1f27"
view = "#1c1f27"
[dark.fam]
blue = ["#15539e","#afd383"]
red = ["#cc0000","#af4b57"]
orange = ["#f57900","#e5c079"]
green = ["#4e9a06","#afd384"]
[dark.exact]
"#26ab62" = "#afd384"
"#26a269" = "#afd384"      # GTK4 stock success green
"#3584e4" = "#afd383"
"#eeeeec" = "#979cac"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1c1f27"],[34.67,"#1c1f27"],[55.33,"#23262e"],[66.33,"#30333c"],
        [86.67,"#3e424c"],[156,"#747986"],[179,"#747986"],[250,"#979cac"],
        [255,"#979cac"]]
fg = "#979cac"
top = "#979cac"
accent_fg = "#1c1f27"
view = "#1c1f27"
[shell.dark.fam]
blue = ["#3584e4","#afd383"]
red = ["#c01c28","#af4b57"]
orange = ["#ff7800","#ca8668"]
green = ["#26a269","#afd384"]
[shell.dark.exact]
"#cd9309" = "#e5c079"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#747986"      # web-login title, dim text
"#54545a" = "#30333c"      # notification/message card: surface
"#45454a" = "#2a2c35"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#af4b57"
fg = "#1c1f27"
[accents.dark.green]
color = "#afd383"
fg = "#1c1f27"
[accents.dark.yellow]
color = "#e5c079"
fg = "#1c1f27"
[accents.dark.blue]
color = "#7d90a4"
fg = "#1c1f27"
[accents.dark.magenta]
color = "#a4799d"
fg = "#1c1f27"
[accents.dark.cyan]
color = "#85a6a5"
fg = "#1c1f27"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#1c1f27"
bg = "#23262e"
surface = "#30333c"
surface_high = "#3e424c"
popover = "#3e424c"
fg = "#979cac"
red = "#af4b57"
green = "#afd384"
yellow = "#e5c079"
accent = "#afd383"
accent_fg = "#1c1f27"
warning_fg = "#1c1f27"
secondary_sidebar = "#23262e"
