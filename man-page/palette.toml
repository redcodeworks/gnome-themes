title = "Man Page"
gtk_name = "Man-Page"
shell_name = "Man-Page-Shell"
credit = "Man Page (colours of the Ptyxis built-in 'Man Page'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Man%20Page.yml)"
default_accent = "blue"
dark_only = false
light_only = true

[light]
ramp = [[0,"#000000"],[46,"#000000"],[145,"#878253"],[224,"#e7de8e"],
        [237,"#efe593"],[246,"#f6ed97"],[255,"#fef49c"]]
fg = "#000000"
top = "#fef49c"
accent_fg = "#fef4a4"
view = "#fef49c"
[light.fam]
blue = ["#3584e4","#0000b2"]
red = ["#cc0000","#cc0000"]
orange = ["#f57900","#999900"]
green = ["#4e9a06","#00a600"]
[light.exact]
"#33d17a" = "#00a600"
"#2ec27e" = "#00a600"      # GTK4 stock success green (light)
"#2e3436" = "#000000"
"#f6f5f4" = "#f6ed97"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#000000"],[46,"#000000"],[145,"#878253"],[224,"#e7de8e"],
        [237,"#efe593"],[250,"#fef49c"],[255,"#fef49c"]]
fg = "#000000"
top = "#fef49c"
accent_fg = "#fef4a4"
view = "#fef49c"
[shell.light.fam]
blue = ["#3584e4","#0000b2"]
red = ["#c01c28","#cc0000"]
orange = ["#e66100","#b24c00"]
green = ["#26a269","#00a600"]
[shell.light.exact]
"#e5a50a" = "#999900"      # warning yellow
"#a5a5b7" = "#878253"

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.light.red]
color = "#cc0000"
fg = "#fef4a4"
[accents.light.green]
color = "#00a600"
fg = "#000000"
[accents.light.yellow]
color = "#999900"
fg = "#000000"
[accents.light.blue]
color = "#0000b2"
fg = "#fef4a4"
[accents.light.magenta]
color = "#b200b2"
fg = "#fef4a4"
[accents.light.cyan]
color = "#00a6b2"
fg = "#000000"

# roles for tools/libadwaita-gen.py
[roles.light]
