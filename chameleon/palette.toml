# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #2c2c2c 5.5% towards fg
# derived: dark.surface derived: #2c2c2c 16.0% towards fg
# derived: dark.surface_high derived: #2c2c2c 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #2c2c2c -> #2c2c34 (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #d79923 (it equals the default accent; keeps accent tokens unique)
title = "Chameleon"
gtk_name = "Chameleon"
shell_name = "Chameleon-Shell"
credit = "Chameleon (colours of the Ptyxis built-in 'Chameleon'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Chameleon.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#2c2c2c"],[53,"#363636"],[66,"#484848"],
        [91,"#5e5e5e"],[145,"#828282"],[238,"#dedede"],[255,"#dedede"]]
fg = "#dedede"
top = "#dedede"
accent_fg = "#2c2c34"
view = "#2c2c2c"
[dark.fam]
blue = ["#15539e","#d79922"]
red = ["#cc0000","#cc231c"]
orange = ["#f57900","#d79923"]
green = ["#4e9a06","#689d69"]
[dark.exact]
"#26ab62" = "#689d69"
"#26a269" = "#689d69"      # GTK4 stock success green
"#3584e4" = "#d79922"
"#eeeeec" = "#dedede"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2c2c2c"],[34.67,"#2c2c2c"],[55.33,"#363636"],[66.33,"#484848"],
        [86.67,"#5e5e5e"],[156,"#acacac"],[179,"#acacac"],[250,"#dedede"],
        [255,"#dedede"]]
fg = "#dedede"
top = "#dedede"
accent_fg = "#2c2c34"
view = "#2c2c2c"
[shell.dark.fam]
blue = ["#3584e4","#d79922"]
red = ["#c01c28","#cc231c"]
orange = ["#ff7800","#d25e1f"]
green = ["#26a269","#689d69"]
[shell.dark.exact]
"#cd9309" = "#d79923"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#acacac"      # web-login title, dim text
"#54545a" = "#484848"      # notification/message card: surface
"#45454a" = "#3f3f3f"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#cc231c"
fg = "#dedede"
[accents.dark.green]
color = "#689d69"
fg = "#2c2c34"
[accents.dark.yellow]
color = "#d79922"
fg = "#2c2c34"
[accents.dark.blue]
color = "#366b71"
fg = "#dedede"
[accents.dark.magenta]
color = "#4e5165"
fg = "#dedede"
[accents.dark.cyan]
color = "#458587"
fg = "#2c2c34"

# roles for tools/libadwaita-gen.py
[roles.dark]
