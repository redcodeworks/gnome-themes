ramp = [[0,"#24364b"],[34.67,"#24364b"],[55.33,"#253e4e"],[66.33,"#264f53"],
        [86.67,"#286158"],[156,"#2da46e"],[179,"#2da46e"],[250,"#31d07b"],
        [255,"#31d07b"]]
fg = "#31d07b"
top = "#31d07b"
accent_fg = "#243653"
view = "#24364b"
[shell.dark.fam]
blue = ["#3584e4","#db8e27"]
red = ["#c01c28","#be2d26"]
orange = ["#ff7800","#cc5e26"]
green = ["#26a269","#1a9172"]
[shell.dark.exact]
"#cd9309" = "#db8e28"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#2da46e"      # web-login title, dim text
"#54545a" = "#264f53"      # notification/message card: surface
"#45454a" = "#264650"      # message card stacked behind the front one: bg and surface mixed 50 %

