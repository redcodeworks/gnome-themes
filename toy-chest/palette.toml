red = ["#cc0000","#be2d26"]
orange = ["#f57900","#db8e28"]
green = ["#4e9a06","#1a9172"]
[dark.exact]
"#26ab62" = "#1a9172"
"#26a269" = "#1a9172"      # GTK4 stock success green
"#3584e4" = "#db8e27"
"#eeeeec" = "#31d07b"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
