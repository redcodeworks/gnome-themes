title = "Toy Chest"
gtk_name = "Toy-Chest"
shell_name = "Toy-Chest-Shell"
credit = "Toy Chest (colours of the Ptyxis built-in 'Toy Chest'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Toy%20Chest.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#24364b"],[53,"#253e4e"],[66,"#264f53"],
        [91,"#286158"],[145,"#2a8062"],[238,"#31d07b"],[255,"#31d07b"]]
fg = "#31d07b"
top = "#31d07b"
