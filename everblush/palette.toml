# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #141b1e 5.5% towards fg
# derived: dark.surface derived: #141b1e 16.0% towards fg
# derived: dark.surface_high derived: #141b1e 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #e5c76c (it equals the default accent; keeps accent tokens unique)
title = "Everblush"
gtk_name = "Everblush"
shell_name = "Everblush-Shell"
credit = "Everblush (colours of the Ptyxis built-in 'Everblush'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Everblush.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#141b1e"],[53,"#1f2628"],[66,"#343a3c"],
        [91,"#4b5053"],[145,"#737778"],[238,"#dadada"],[255,"#dadada"]]
fg = "#dadada"
top = "#dadada"
accent_fg = "#141b1e"
view = "#141b1e"
[dark.fam]
blue = ["#15539e","#e5c76b"]
red = ["#cc0000","#e57474"]
orange = ["#f57900","#e5c76c"]
green = ["#4e9a06","#8ccf7e"]
[dark.exact]
"#26ab62" = "#8ccf7e"
"#26a269" = "#8ccf7e"      # GTK4 stock success green
"#3584e4" = "#e5c76b"
"#eeeeec" = "#dadada"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#141b1e"],[34.67,"#141b1e"],[55.33,"#1f2628"],[66.33,"#343a3c"],
        [86.67,"#4b5053"],[156,"#a2a4a5"],[179,"#a2a4a5"],[250,"#dadada"],
        [255,"#dadada"]]
fg = "#dadada"
top = "#dadada"
accent_fg = "#141b1e"
view = "#141b1e"
[shell.dark.fam]
blue = ["#3584e4","#e5c76b"]
red = ["#c01c28","#e57474"]
orange = ["#ff7800","#e59e70"]
green = ["#26a269","#8ccf7e"]
[shell.dark.exact]
"#cd9309" = "#e5c76c"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a2a4a5"      # web-login title, dim text
"#54545a" = "#343a3c"      # notification/message card: surface
"#45454a" = "#2a3032"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#e57474"
fg = "#141b1e"
[accents.dark.green]
color = "#8ccf7e"
fg = "#141b1e"
[accents.dark.yellow]
color = "#e5c76b"
fg = "#141b1e"
[accents.dark.blue]
color = "#67b0e8"
fg = "#141b1e"
[accents.dark.magenta]
color = "#c47fd5"
fg = "#141b1e"
[accents.dark.cyan]
color = "#6cbfbf"
fg = "#141b1e"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#141b1e"
bg = "#1f2628"
surface = "#343a3c"
surface_high = "#4b5053"
popover = "#4b5053"
fg = "#dadada"
red = "#e57474"
green = "#8ccf7e"
yellow = "#e5c76c"
accent = "#e5c76b"
accent_fg = "#141b1e"
warning_fg = "#141b1e"
secondary_sidebar = "#1f2628"
