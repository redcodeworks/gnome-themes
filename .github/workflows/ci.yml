# SPDX-License-Identifier: MIT
# Branching: main is protected. Push to `testing`; this workflow runs there ONCE per push (no pull_request trigger: the required checks
# `test` and `secrets` are matched by name on the PR head commit, which is the pushed commit, so the push run satisfies them).
# A pull request can only be merged into main when both jobs below pass.
name: ci

on:
  push:
    branches: [testing]
  workflow_dispatch:
    inputs:
      full:
        description: 'Full suite: regeneration, selftest and the install/switch/update/remove loop for every scheme (a dispatched run is full by default)'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # The required check "test": lint, hygiene, regeneration, per-scheme selftest, recipe behaviour (tools/test.sh).
  # Runs in Fedora because the generators read the stock GTK 3, GTK 4 and GNOME Shell stylesheets from the installed
  # libraries: the committed files were generated on Fedora 45, so a Fedora 45 container reproduces them. If a stock
  # stylesheet changes upstream, the regeneration check fails: run `just generate <scheme>` and commit the result.
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    container: fedora:45
    steps:
      - name: Install git (needed by checkout)
        run: dnf -y install git
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Install the test dependencies (the same list the local test container uses)
        run: dnf -y install $(cat tools/test-packages.txt)
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run the test suite
        # Cheap checks run for every scheme; the install/switch/update/remove loop runs for the featured schemes, the schemes changed
        # against origin/main (capped at 15) and a rotating slice (the list is printed at the top of the log). Manual dispatch: every scheme.
        env:
          TEST_ALL: ${{ (github.event_name == 'workflow_dispatch' && inputs.full) && '1' || '' }}
        run: tools/test.sh

  # The required check "secrets": no credentials in the history.
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL --retry 5 --retry-delay 5 --retry-all-errors https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact -v
