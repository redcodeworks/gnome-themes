# SPDX-License-Identifier: MIT
# Branching: main is protected. Push to `testing`; this workflow runs there and on pull requests into main.
# A pull request can only be merged into main when both jobs below pass.
name: ci

on:
  push:
    branches: [testing]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The required check "test": lint, hygiene, regeneration, per-scheme selftest, recipe behaviour (tools/test.sh).
  # Runs in Fedora because the generators read the stock GTK 3, GTK 4 and GNOME Shell stylesheets from the installed
  # libraries: the committed files were generated on Fedora 45, so a Fedora 45 container reproduces them. If a stock
  # stylesheet changes upstream, the regeneration check fails: run `just generate <scheme>` and commit the result.
  test:
    runs-on: ubuntu-latest
    container: fedora:45
    steps:
      - name: Install git (needed by checkout)
        run: dnf -y install git
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install the test dependencies (the same list the local test container uses)
        run: dnf -y install $(cat tools/test-packages.txt)
      - name: Trust the workspace for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Run the test suite
        run: tools/test.sh

  # The required check "secrets": no credentials in the history.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/gitleaks_8.24.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks detect --no-banner --redact -v
