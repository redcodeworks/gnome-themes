name: require-testing-branch

# Changes move one way: feature branch -> testing -> main. A pull request into main
# must come from testing. Make this check required on main.
on:
  pull_request:
    branches: [main]

permissions: {}

jobs:
  require-testing-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Head branch must be testing
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REF" != "testing" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::Pull requests into main must come from testing in this repository (got '$HEAD_REF' from '$HEAD_REPO'). Open the pull request into testing instead."
            exit 1
          fi
          echo "head is testing"
