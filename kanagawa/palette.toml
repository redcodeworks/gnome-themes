title = "Kanagawa"
gtk_name = "Kanagawa"
shell_name = "Kanagawa-Shell"
credit = "Kanagawa (colours of the Ptyxis built-in 'Kanagawa'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Kanagawa.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1f1f28"],[53,"#292930"],[66,"#3d3c3f"],
        [91,"#545351"],[145,"#7a776e"],[238,"#dcd7ba"],[255,"#dcd7ba"]]
fg = "#dcd7ba"
top = "#dcd7ba"
accent_fg = "#1f1f28"
view = "#1f1f28"
[dark.fam]
blue = ["#15539e","#c0a36e"]
red = ["#cc0000","#c34043"]
orange = ["#f57900","#c0a36f"]
green = ["#4e9a06","#76946a"]
[dark.exact]
"#26ab62" = "#76946a"
"#26a269" = "#76946a"      # GTK4 stock success green
"#3584e4" = "#c0a36e"
"#eeeeec" = "#dcd7ba"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1f1f28"],[34.67,"#1f1f28"],[55.33,"#292930"],[66.33,"#3d3c3f"],
        [86.67,"#545351"],[156,"#a6a391"],[179,"#a6a391"],[250,"#dcd7ba"],
        [255,"#dcd7ba"]]
fg = "#dcd7ba"
top = "#dcd7ba"
accent_fg = "#1f1f28"
view = "#1f1f28"
[shell.dark.fam]
blue = ["#3584e4","#c0a36e"]
red = ["#c01c28","#c34043"]
orange = ["#ff7800","#c27258"]
green = ["#26a269","#76946a"]
[shell.dark.exact]
"#cd9309" = "#c0a36f"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a6a391"      # web-login title, dim text
"#54545a" = "#3d3c3f"      # notification/message card: surface
"#45454a" = "#333238"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
