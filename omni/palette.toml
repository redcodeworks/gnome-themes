[dark.exact]
"#26ab62" = "#67e481"
"#26a269" = "#67e481"      # GTK4 stock success green
"#3584e4" = "#67e480"
"#eeeeec" = "#abb2bf"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
