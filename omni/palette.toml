        [86.67,"#42424e"],[156,"#828693"],[179,"#828693"],[250,"#abb2bf"],
        [255,"#abb2bf"]]
fg = "#abb2bf"
top = "#abb2bf"
accent_fg = "#191622"
view = "#191622"
[shell.dark.fam]
blue = ["#3584e4","#67e480"]
red = ["#c01c28","#e96379"]
orange = ["#ff7800","#e8806e"]
green = ["#26a269","#67e481"]
[shell.dark.exact]
"#cd9309" = "#e89e64"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#828693"      # web-login title, dim text
"#54545a" = "#302f3b"      # notification/message card: surface
"#45454a" = "#282733"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
