# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Seafoam Pastel'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Seafoam%20Pastel.yml.
title = "Seafoam Pastel"
gtk_name = "Seafoam-Pastel"
shell_name = "Seafoam-Pastel-Shell"
credit = "Seafoam Pastel (colours of the Ptyxis built-in 'Seafoam Pastel'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Seafoam%20Pastel.yml)"
ptyxis = "Seafoam Pastel"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Seafoam Pastel' (bulk-built by tools/bulk-scheme.py)."
default_accent = "yellow"

[dark]
bg_deep = "#243435"
fg = "#d4e7d4"
selection = "#475855"   # DERIVED
red = "#825d4d"
orange = "#987f5d"   # DERIVED
yellow = "#ada16d"
green = "#728c62"
cyan = "#729494"
blue = "#4d7b82"
magenta = "#8a7267"
purple = "#8a7267"   # = magenta
# palette Color8 (bright black) = #8a8a8a: a candidate for `comment`
[dark.ansi]
red = "#825d4d"
green = "#728c62"
yellow = "#ada16d"
blue = "#4d7b82"
magenta = "#8a7267"
cyan = "#729494"
[dark.terminal]
source = "Seafoam Pastel"   # Ptyxis built-in id
black = "#757575"   # Ptyxis Color0
white = "#e0e0e0"   # Ptyxis Color7
bright_black = "#8a8a8a"   # Ptyxis Color8
bright_red = "#cf937a"   # Ptyxis Color9
bright_green = "#98d9aa"   # Ptyxis Color10
bright_yellow = "#fae79d"   # Ptyxis Color11
bright_blue = "#7ac3cf"   # Ptyxis Color12
bright_magenta = "#d6b2a1"   # Ptyxis Color13
bright_cyan = "#ade0e0"   # Ptyxis Color14
bright_white = "#e0e0e0"   # Ptyxis Color15
