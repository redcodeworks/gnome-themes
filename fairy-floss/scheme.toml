# SPDX-License-Identifier: MIT
# Fairy Floss (sailorhg/fairyfloss, fairyfloss.tmTheme), dark only. NO UPSTREAM LICENCE (all rights reserved by default;
# raw LICENSE returns 404): only a handful of hex values are taken as facts, nothing else from the repo.
# VERIFIED against the raw tmTheme (2026-11-07): background #5A5475, foreground #F8F8F2, pink #FFB8D1, lavender #C5A3FF,
# mint #C2FFDF, coral #FF857F, comment yellow #E6C000, yellow #FFEA00. The tmTheme is a thin syntax theme: there is no
# red/orange/green/blue/cyan set, no surface layers and no ANSI table (its #F92672/#AE81FF/#F8F8F0/#49483E are Monokai leftovers).
# Therefore, and by Kevin's decision (2026-11-07) to build it anyway:
#  - NOT from the tmTheme (INVENTED or DERIVED here): bg_deep #42395d (the background of Ptyxis' "Fairy Floss Dark", a
#    Gogh variant, not the tmTheme), surface and surface_high (bg mixed 8 % / 16 % towards fg), fg_dim and comment (derived
#    by the fixed rules), orange (coral mixed 35 % towards yellow), selection (= surface_high). The invented blue #aac3f8 and cyan #8fe3f0
#    were dropped on 2026-11-07, see TERMINAL FIRST below.
#  - FROM the tmTheme: purple = lavender, comment yellow #e6c000 (the ANSI yellow); the ANSI six are now Ptyxis' (see below).
# No seventh "orange" accent: the upstream tmTheme has no orange (the orange role is invented here), so only the six terminal accents exist.
# Default accent magenta = pink #FFB8D1, the theme's signature colour (Kevin's brief).
# TERMINAL FIRST (2026-11-07): the Ptyxis built-in named in [<variant>.terminal] `source` is the starting point and the source of truth. bg_deep and fg are its
# Background and Foreground, the six accents its Color1-6, the real black, white and brights are in the terminal table. Where an older note above gives other
# values, THIS block and the values below supersede it. A colour that still differs from its source is a listed nudge ([<variant>.nudge], with its reason).
# Source: Fairy Floss Dark (it has this scheme's background #42395d; the plain "Fairy Floss" built-in has #5A5475). That changes the accents to Ptyxis' own:
# red #a8757b (dull), green #ff857f (really coral), yellow #e6c000, blue #ae81ff, magenta #716799 (a dull violet; 1.3:1 against the background as a text colour),
# cyan #c2ffdf (mint); fg #c2ffdf (was #f8f8f2). The names follow the Ptyxis slots, not the colours' hues. The role colours red, green, yellow, cyan, blue,
# magenta, pink follow the ANSI six, so the UI's success colour is coral here. If these look wrong, the built-in is what to fix upstream (or leave the scheme).
title = "Fairy Floss"
gtk_name = "Fairy-Floss"
shell_name = "Fairy-Floss-Shell"
credit = "Fairy Floss by sailorhg (hex values only, no upstream licence; accents partly invented)"
ptyxis = "Fairy Floss Dark"
ptyxis_reason = "Fairy Floss Dark is the source (it has this scheme's background #42395D; the plain Fairy Floss built-in has #5A5475) and equals the scheme in every role (0.00 dE, no nudges); flat and dark only, like the scheme"
default_accent = "magenta"

[dark]
bg_deep = "#42395d"
bg = "#5a5475"
surface = "#67617f"
surface_high = "#736e89"
fg = "#c2ffdf"
selection = "#736e89"
red = "#a8757b"
orange = "#f69a53"
yellow = "#e6c000"
green = "#ff857f"
cyan = "#c2ffdf"
blue = "#ae81ff"
magenta = "#716799"
purple = "#c5a3ff"
pink = "#716799"
[dark.ansi]
red = "#a8757b"
green = "#ff857f"
yellow = "#e6c000"
blue = "#ae81ff"
magenta = "#716799"
cyan = "#c2ffdf"

# Terminal palette: the Ptyxis built-in named in `source` is the starting point and the source of truth for the variant (the terminal comes first,
# the toolkit themes follow). Background and Foreground are bg_deep and fg above, the six accents are [<variant>.ansi]; the real black, white and brights
# are below. A colour that differs from its source is listed in [<variant>.nudge] with the reason (tools/ptyxis-compare.py --check enforces this).

[dark.terminal]
source = "Fairy Floss Dark"   # Ptyxis built-in, checked 2026-11-07 with tools/ptyxis-palette.sh
black = "#42395d"   # Color0
white = "#f8f8f2"   # Color7
bright_black = "#75507b"   # Color8
bright_red = "#ffb8d1"   # Color9
bright_green = "#f1568e"   # Color10
bright_yellow = "#d5a425"   # Color11
bright_blue = "#c5a3ff"   # Color12
bright_magenta = "#8077a8"   # Color13
bright_cyan = "#c2ffff"   # Color14
bright_white = "#f8f8f0"   # Color15
