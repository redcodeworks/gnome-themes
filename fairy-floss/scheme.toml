# SPDX-License-Identifier: MIT
# Fairy Floss (sailorhg/fairyfloss, fairyfloss.tmTheme), dark only. NO UPSTREAM LICENCE (all rights reserved by default;
# raw LICENSE returns 404): only a handful of hex values are taken as facts, nothing else from the repo.
# VERIFIED against the raw tmTheme (2026-11-07): background #5A5475, foreground #F8F8F2, pink #FFB8D1, lavender #C5A3FF,
# mint #C2FFDF, coral #FF857F, comment yellow #E6C000, yellow #FFEA00. The tmTheme is a thin syntax theme: there is no
# red/orange/green/blue/cyan set, no surface layers and no ANSI table (its #F92672/#AE81FF/#F8F8F0/#49483E are Monokai leftovers).
# Therefore, and by Kevin's decision (2026-11-07) to build it anyway:
#  - NOT from the tmTheme (INVENTED or DERIVED here): bg_deep #42395d (the background of Ptyxis' "Fairy Floss Dark", a
#    Gogh variant, not the tmTheme), surface and surface_high (bg mixed 8 % / 16 % towards fg), fg_dim and comment (derived
#    by the fixed rules), orange (coral mixed 35 % towards yellow), selection (= surface_high). The invented blue #aac3f8 and cyan #8fe3f0
#    were dropped on 2026-11-07, see TERMINAL FIRST below.
#  - FROM the tmTheme: purple = lavender, comment yellow #e6c000 (the ANSI yellow); the ANSI six are now Ptyxis' (see below).
# No seventh "orange" accent: the upstream tmTheme has no orange (the orange role is invented here), so only the six terminal accents exist.
# Default accent magenta = pink #FFB8D1, the theme's signature colour (Kevin's brief).
# SOURCE ORDER (2026-11-07): official source first, the Ptyxis built-in of the same name second, invented last. Each variant's [<variant>.terminal] says which
# it uses: `source = "official: <repo/url, date verified>"` (with `builtin_differs` where the official palette differs from the built-in: name, max delta E, why
# official wins) or `source = "<built-in name>"` (bg_deep, fg, the six accents and the real black, white and brights ARE the built-in's) or `no_builtin`. A
# colour that still differs from its source is a listed nudge ([<variant>.nudge], with the reason). Where an older note above gives other values, THIS block wins.
# Source dark: official (tmTheme): fg #f8f8f2, red = coral #ff857f, green = mint #c2ffdf, yellow #e6c000, magenta = pink #ffb8d1, window #5a5475. NOT official and kept as before:
# bg_deep #42395d (the view; Ptyxis' Fairy Floss Dark background), blue #aac3f8 and cyan #8fe3f0 (invented), orange and the surface steps. The built-ins Fairy Floss / Fairy Floss
# Dark map the slots differently (green = coral, magenta a dull violet #716799), which is why this scheme generates its palette; their black, white and bright black/white are taken.
title = "Fairy Floss"
gtk_name = "Fairy-Floss"
shell_name = "Fairy-Floss-Shell"
credit = "Fairy Floss by sailorhg (hex values only, no upstream licence; accents partly invented)"
ptyxis = "Fairy Floss Dark"
ptyxis_reason = "dark only. Fairy Floss and Fairy Floss Dark differ only in Background (#5a5475 vs #42395d); Fairy Floss Dark matches the scheme background exactly."
default_accent = "magenta"

[dark]
bg_deep = "#42395d"
bg = "#5a5475"
surface = "#67617f"
surface_high = "#736e89"
fg = "#f8f8f2"
selection = "#736e89"
red = "#ff857f"
orange = "#f69a53"
yellow = "#e6c000"
green = "#c2ffdf"
cyan = "#8fe3f0"
blue = "#aac3f8"
magenta = "#ffb8d1"
purple = "#c5a3ff"
pink = "#ffb8d1"

[dark.ansi]
red = "#ff857f"
green = "#c2ffdf"
yellow = "#e6c000"
blue = "#aac3f8"
magenta = "#ffb8d1"
cyan = "#8fe3f0"

[dark.terminal]
source = "official: sailorhg/fairyfloss fairyfloss.tmTheme, raw file, verified 2026-11-07"
builtin_differs = { name = "Fairy Floss Dark", de = 96.4, note = "the tmTheme's coral, mint, yellow, pink and foreground are official; the built-in Fairy Floss Dark is a Gogh port with a different mapping (its green is coral, magenta a dull violet); blue, cyan and the view colour stay this scheme's own (invented, as before)" }
white = "#f8f8f2"   # Color7 (the built-in's)
bright_black = "#75507b"   # Color8 (the built-in's)
bright_white = "#f8f8f0"   # Color15 (the built-in's)
