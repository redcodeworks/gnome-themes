# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #001e27 5.5% towards fg
# derived: dark.surface derived: #001e27 16.0% towards fg
# derived: dark.surface_high derived: #001e27 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.green nudged to #6cbe6d (it equals the default accent; keeps accent tokens unique)
title = "Solarized Dark Higher Contrast"
gtk_name = "Solarized-Dark-Higher-Contrast"
shell_name = "Solarized-Dark-Higher-Contrast-Shell"
credit = "Solarized Dark Higher Contrast (colours of the Ptyxis built-in 'Solarized Dark Higher Contrast'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Solarized%20Dark%20Higher%20Contrast.yml)"
default_accent = "green"
dark_only = true

[dark]
ramp = [[0,"#000000"],[45,"#001e27"],[53,"#092730"],[66,"#193840"],
        [91,"#2c4c53"],[145,"#4b6d72"],[238,"#9cc2c3"],[255,"#9cc2c3"]]
fg = "#9cc2c3"
top = "#9cc2c3"
accent_fg = "#001e27"
view = "#001e27"
[dark.fam]
blue = ["#15539e","#6cbe6c"]
red = ["#cc0000","#d11c24"]
orange = ["#f57900","#a57706"]
green = ["#4e9a06","#6cbe6d"]
[dark.exact]
"#26ab62" = "#6cbe6d"
"#26a269" = "#6cbe6d"      # GTK4 stock success green
"#3584e4" = "#6cbe6c"
"#eeeeec" = "#9cc2c3"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#001e27"],[34.67,"#001e27"],[55.33,"#092730"],[66.33,"#193840"],
        [86.67,"#2c4c53"],[156,"#709497"],[179,"#709497"],[250,"#9cc2c3"],
        [255,"#9cc2c3"]]
fg = "#9cc2c3"
top = "#9cc2c3"
accent_fg = "#001e27"
view = "#001e27"
[shell.dark.fam]
blue = ["#3584e4","#6cbe6c"]
red = ["#c01c28","#d11c24"]
orange = ["#ff7800","#bb4a15"]
green = ["#26a269","#6cbe6d"]
[shell.dark.exact]
"#cd9309" = "#a57706"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#709497"      # web-login title, dim text
"#54545a" = "#193840"      # notification/message card: surface
"#45454a" = "#113038"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#d11c24"
fg = "#001e27"
[accents.dark.green]
color = "#6cbe6c"
fg = "#001e27"
[accents.dark.yellow]
color = "#a57706"
fg = "#001e27"
[accents.dark.blue]
color = "#2176c7"
fg = "#001e27"
[accents.dark.magenta]
color = "#c61c6f"
fg = "#001e27"
[accents.dark.cyan]
color = "#259286"
fg = "#001e27"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#001e27"
bg = "#092730"
surface = "#193840"
surface_high = "#2c4c53"
popover = "#2c4c53"
fg = "#9cc2c3"
