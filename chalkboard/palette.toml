title = "Chalkboard"
gtk_name = "Chalkboard"
shell_name = "Chalkboard-Shell"
credit = "Chalkboard (colours of the Ptyxis built-in 'Chalkboard'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Chalkboard.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#29262f"],[53,"#33313a"],[66,"#45454e"],
        [91,"#5a5c66"],[145,"#7e828d"],[238,"#d9e6f2"],[255,"#d9e6f2"]]
fg = "#d9e6f2"
top = "#d9e6f2"
accent_fg = "#29262f"
view = "#29262f"
[dark.fam]
blue = ["#15539e","#c2c372"]
red = ["#cc0000","#c37372"]
orange = ["#f57900","#c2c373"]
green = ["#4e9a06","#72c373"]
[dark.exact]
"#26ab62" = "#72c373"
"#26a269" = "#72c373"      # GTK4 stock success green
"#3584e4" = "#c2c372"
"#eeeeec" = "#d9e6f2"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#29262f"],[34.67,"#29262f"],[55.33,"#33313a"],[66.33,"#45454e"],
        [86.67,"#5a5c66"],[156,"#a7b0bb"],[179,"#a7b0bb"],[250,"#d9e6f2"],
        [255,"#d9e6f2"]]
fg = "#d9e6f2"
top = "#d9e6f2"
accent_fg = "#29262f"
view = "#29262f"
[shell.dark.fam]
blue = ["#3584e4","#c2c372"]
red = ["#c01c28","#c37372"]
orange = ["#ff7800","#c29b72"]
green = ["#26a269","#72c373"]
[shell.dark.exact]
"#cd9309" = "#c2c373"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a7b0bb"      # web-login title, dim text
"#54545a" = "#45454e"      # notification/message card: surface
"#45454a" = "#3c3b44"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
