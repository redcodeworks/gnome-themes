# SPDX-License-Identifier: MIT
# Rose Pine (rose-pine/rose-pine-palette, MIT, Copyright (c) mvllow and contributors): Main dark + Dawn light.
# VERIFIED 2026-11-07 against the raw files: rose-pine/alacritty dist/rose-pine.toml and rose-pine-dawn.toml (the official terminal
# mapping: foreground, background, surface #1f1d2e (overlay #f2e9e1 on Dawn), selection #403d52/#dfdad9, the eight ANSI colours) and palette.json
# (base, surface, overlay, muted, subtle, text, love, gold, rose, pine, foam, iris of main and dawn). highlight-med comes from the
# alacritty selection colour (palette.json has no highlight roles).
# DAWN TEXT: palette.json says #464261, the alacritty port (and the Rose Pine site/CSS) say #575279. #575279 is used: two official
# sources against one, and #575279 is the long-standing documented value (palette.json looks like a drift). Contrast on #faf4ed is
# 6.9:1 against 9.3:1 for #464261, both pass; change fg below to #464261 if palette.json is the one that matters to you.
# Ladder dark: view base #191724, window surface #1f1d2e, headers overlay #26233a, popovers highlight-med #403d52.
# Ladder light (view lightest): view surface #fffaf3, window base #faf4ed, headers overlay #f2e9e1, popovers highlight-med #dfdad9.
# fg_dim = subtle, comment = muted. ANSI six = Ptyxis' mapping (2026-11-07): love red, FOAM green, gold yellow, PINE blue, iris magenta,
# rose cyan (the alacritty port has pine green and foam blue). Rose Pine has no orange: orange is DERIVED (gold mixed 35 % towards love).
# No seventh "orange" accent: upstream Rose Pine has no orange (the orange role above is a derived mix), so only the six terminal accents exist.
# Default accent magenta = iris: Rose Pine's own UI accent in most ports; iris and rose are not ANSI blue, and iris is the
# one with the best contrast of the six on the dark window (8.4:1 on base; pine, now the blue, is only 3.2:1, 3.6:1 on Dawn view for iris).
# accent_fg (dark): text on an accent is the window colour #1f1d2e, not bg_deep. Reason (generator limit, not taste): the dark and
# light variants would otherwise share ONE nudged ink token (#19172c) that maps to different inks per accent in the two variants,
# and the single libadwaita file (both variants, one sed pass) cannot tell them apart (accent-maps-gen verification fails).
# SOURCE ORDER (2026-11-07): official source first, the Ptyxis built-in of the same name second, invented last. Each variant's [<variant>.terminal] says which
# it uses: `source = "official: <repo/url, date verified>"` (with `builtin_differs` where the official palette differs from the built-in: name, max delta E, why
# official wins) or `source = "<built-in name>"` (bg_deep, fg, the six accents and the real black, white and brights ARE the built-in's) or `no_builtin`. A
# colour that still differs from its source is a listed nudge ([<variant>.nudge], with the reason). Where an older note above gives other values, THIS block wins.
# Sources: official (alacritty rose-pine and rose-pine-dawn terminal files, palette.json): the mapping love red, PINE green, gold yellow, FOAM blue, iris magenta, rose cyan. The built-ins Rosé Pine
# and Rosé Pine Dawn swap pine and foam. Dawn: the view stays the palette's surface #fffaf3, the TERMINAL background is base #faf4ed (terminal.background). Black, white, bright black
# and bright white are the built-ins'; the bright colours follow the accents (the alacritty files repeat the normal ones). Moon is not used.
title = "Rose Pine"
gtk_name = "Rose-Pine"
shell_name = "Rose-Pine-Shell"
credit = "Rose Pine (MIT), Main and Dawn"
ptyxis = "generated"
ptyxis_reason = "the official alacritty mapping has pine as green and foam as blue; the Rosé Pine and Rosé Pine Dawn built-ins swap them (36 dE dark, 19 dE Dawn); they are also two flat built-ins, so a generated pair palette carries the official colours"
default_accent = "magenta"

[dark]
bg_deep = "#191724"
bg = "#1f1d2e"
surface = "#26233a"
surface_high = "#403d52"
fg = "#e0def4"
accent_fg = "#1f1d2e"
fg_dim = "#908caa"
comment = "#6e6a86"
selection = "#403d52"
red = "#eb6f92"
orange = "#f2a480"
yellow = "#f6c177"
green = "#31748f"
cyan = "#ebbcba"
blue = "#9ccfd8"
magenta = "#c4a7e7"
purple = "#c4a7e7"
pink = "#ebbcba"

[dark.ansi]
red = "#eb6f92"
green = "#31748f"
yellow = "#f6c177"
blue = "#9ccfd8"
magenta = "#c4a7e7"
cyan = "#ebbcba"

[light]
bg_deep = "#fffaf3"
bg = "#faf4ed"
surface = "#f2e9e1"
surface_high = "#dfdad9"
fg = "#575279"
fg_dim = "#797593"
comment = "#9893a5"
selection = "#dfdad9"
red = "#b4637a"
orange = "#d7894c"
yellow = "#ea9d34"
green = "#286983"
cyan = "#d7827e"
blue = "#56949f"
magenta = "#907aa9"
purple = "#907aa9"
pink = "#d7827e"

[light.ansi]
red = "#b4637a"
green = "#286983"
yellow = "#ea9d34"
blue = "#56949f"
magenta = "#907aa9"
cyan = "#d7827e"

[dark.terminal]
source = "official: rose-pine/alacritty dist/rose-pine.toml + rose-pine-dawn.toml and rose-pine/rose-pine-palette palette.json, raw files, verified 2026-11-07"
builtin_differs = { name = "Rosé Pine", de = 36.0, note = "the official alacritty mapping is love, pine green, gold, foam blue, iris, rose; the built-in swaps pine and foam (green and blue)" }
black = "#26233a"   # Color0 (the built-in's)
white = "#e0def4"   # Color7 (the built-in's)
bright_black = "#6e6a86"   # Color8 (the built-in's)
bright_white = "#e0def4"   # Color15 (the built-in's)

[light.terminal]
source = "official: rose-pine/alacritty dist/rose-pine.toml + rose-pine-dawn.toml and rose-pine/rose-pine-palette palette.json, raw files, verified 2026-11-07"
builtin_differs = { name = "Rosé Pine Dawn", de = 19.0, note = "the official alacritty mapping is love, pine green, gold, foam blue, iris, rose; the built-in swaps pine and foam (green and blue)" }
background = "#faf4ed"   # official terminal background (alacritty rose-pine-dawn: base); the view stays #fffaf3
black = "#f2e9e1"   # Color0 (the built-in's)
white = "#575279"   # Color7 (the built-in's)
bright_black = "#9893a5"   # Color8 (the built-in's)
bright_white = "#575279"   # Color15 (the built-in's)
