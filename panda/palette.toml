# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #1d1e20 5.5% towards fg
# derived: dark.surface derived: #1d1e20 16.0% towards fg
# derived: dark.surface_high derived: #1d1e20 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.green nudged to #26ffd5 (it equals the default accent; keeps accent tokens unique)
title = "Panda"
gtk_name = "Panda"
shell_name = "Panda-Shell"
credit = "Panda (colours of the Ptyxis built-in 'Panda'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Panda.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1d1e20"],[53,"#292a2b"],[66,"#3f4041"],
        [91,"#58595a"],[145,"#838384"],[238,"#f0f0f0"],[255,"#f0f0f0"]]
fg = "#f0f0f0"
top = "#f0f0f0"
accent_fg = "#1d1e20"
view = "#1d1e20"
[dark.fam]
blue = ["#15539e","#26ffd4"]
red = ["#cc0000","#fb055a"]
orange = ["#f57900","#fdaa5a"]
green = ["#4e9a06","#26ffd5"]
[dark.exact]
"#26ab62" = "#26ffd5"
"#26a269" = "#26ffd5"      # GTK4 stock success green
"#3584e4" = "#26ffd4"
"#eeeeec" = "#f0f0f0"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1d1e20"],[34.67,"#1d1e20"],[55.33,"#292a2b"],[66.33,"#3f4041"],
        [86.67,"#58595a"],[156,"#b4b5b5"],[179,"#b4b5b5"],[250,"#f0f0f0"],
        [255,"#f0f0f0"]]
fg = "#f0f0f0"
top = "#f0f0f0"
accent_fg = "#1d1e20"
view = "#1d1e20"
[shell.dark.fam]
blue = ["#3584e4","#26ffd4"]
red = ["#c01c28","#fb055a"]
orange = ["#ff7800","#fc585a"]
green = ["#26a269","#26ffd5"]
[shell.dark.exact]
"#cd9309" = "#fdaa5a"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b4b5b5"      # web-login title, dim text
"#54545a" = "#3f4041"      # notification/message card: surface
"#45454a" = "#343536"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#fb055a"
fg = "#1d1e20"
[accents.dark.green]
color = "#26ffd4"
fg = "#1d1e20"
[accents.dark.yellow]
color = "#fdaa5a"
fg = "#1d1e20"
[accents.dark.blue]
color = "#5c9fff"
fg = "#1d1e20"
[accents.dark.magenta]
color = "#fc59a6"
fg = "#1d1e20"
[accents.dark.cyan]
color = "#26ffd4"
fg = "#1d1e20"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#1d1e20"
bg = "#292a2b"
surface = "#3f4041"
surface_high = "#58595a"
popover = "#58595a"
fg = "#f0f0f0"
red = "#fb055a"
green = "#26ffd5"
yellow = "#fdaa5a"
accent = "#26ffd4"
