# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #09111a 5.5% towards fg
# derived: dark.surface derived: #09111a 16.0% towards fg
# derived: dark.surface_high derived: #09111a 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #aca46e (it equals the default accent; keeps accent tokens unique)
title = "Azu"
gtk_name = "Azu"
shell_name = "Azu-Shell"
credit = "Azu (colours of the Ptyxis built-in 'Azu'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Azu.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#09111a"],[53,"#141d26"],[66,"#2a333d"],
        [91,"#434d56"],[145,"#6d7782"],[238,"#d9e6f2"],[255,"#d9e6f2"]]
fg = "#d9e6f2"
top = "#d9e6f2"
accent_fg = "#09111a"
view = "#09111a"
[dark.fam]
blue = ["#15539e","#aca46d"]
red = ["#cc0000","#ac6d74"]
orange = ["#f57900","#aca46e"]
green = ["#4e9a06","#74ac6d"]
[dark.exact]
"#26ab62" = "#74ac6d"
"#26a269" = "#74ac6d"      # GTK4 stock success green
"#3584e4" = "#aca46d"
"#eeeeec" = "#d9e6f2"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#09111a"],[34.67,"#09111a"],[55.33,"#141d26"],[66.33,"#2a333d"],
        [86.67,"#434d56"],[156,"#9eaab5"],[179,"#9eaab5"],[250,"#d9e6f2"],
        [255,"#d9e6f2"]]
fg = "#d9e6f2"
top = "#d9e6f2"
accent_fg = "#09111a"
view = "#09111a"
[shell.dark.fam]
blue = ["#3584e4","#aca46d"]
red = ["#c01c28","#ac6d74"]
orange = ["#ff7800","#ac8870"]
green = ["#26a269","#74ac6d"]
[shell.dark.exact]
"#cd9309" = "#aca46e"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9eaab5"      # web-login title, dim text
"#54545a" = "#2a333d"      # notification/message card: surface
"#45454a" = "#1f2832"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ac6d74"
fg = "#09111a"
[accents.dark.green]
color = "#74ac6d"
fg = "#09111a"
[accents.dark.yellow]
color = "#aca46d"
fg = "#09111a"
[accents.dark.blue]
color = "#6d74ac"
fg = "#09111a"
[accents.dark.magenta]
color = "#a46dac"
fg = "#09111a"
[accents.dark.cyan]
color = "#6daca4"
fg = "#09111a"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#09111a"
bg = "#141d26"
surface = "#2a333d"
surface_high = "#434d56"
popover = "#434d56"
fg = "#d9e6f2"
red = "#ac6d74"
green = "#74ac6d"
yellow = "#aca46e"
accent = "#aca46d"
accent_fg = "#09111a"
warning_fg = "#09111a"
secondary_sidebar = "#141d26"
