green = "#01a252"
cyan = "#b5e4f4"
blue = "#01a0e4"
magenta = "#a16a94"
purple = "#a16a94"   # = magenta
# palette Color8 (bright black) = #5c5855: a candidate for `comment`
[light.ansi]
red = "#db2d20"
green = "#01a252"
yellow = "#fded02"
blue = "#01a0e4"
magenta = "#a16a94"
cyan = "#b5e4f4"
