red = ["#c01c28","#db2d20"]
orange = ["#e66100","#ec8d11"]
green = ["#26a269","#01a252"]
[shell.light.exact]
"#e5a50a" = "#fded03"      # warning yellow
"#a5a5b7" = "#a6a4a3"

