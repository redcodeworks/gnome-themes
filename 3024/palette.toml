red = ["#cc0000","#db2d20"]
orange = ["#f57900","#fded03"]
green = ["#4e9a06","#01a252"]
[light.exact]
"#33d17a" = "#01a252"
"#2ec27e" = "#01a252"      # GTK4 stock success green (light)
"#2e3436" = "#4a4543"
"#f6f5f4" = "#f2f2f2"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#090300"],[34.67,"#090300"],[55.33,"#120c09"],[66.33,"#221c1a"],
        [86.67,"#35302d"],[156,"#797574"],[179,"#797574"],[250,"#a5a2a2"],
        [255,"#a5a2a2"]]
fg = "#a5a2a2"
top = "#a5a2a2"
accent_fg = "#090300"
view = "#090300"
[shell.dark.fam]
blue = ["#3584e4","#fded02"]
red = ["#c01c28","#db2d20"]
orange = ["#ff7800","#ec8d11"]
green = ["#26a269","#01a252"]
[shell.dark.exact]
"#cd9309" = "#fded03"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#797574"      # web-login title, dim text
"#54545a" = "#221c1a"      # notification/message card: surface
"#45454a" = "#1a1412"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#4a4543"],[46,"#4a4543"],[145,"#a6a4a3"],[224,"#e7e7e7"],
        [237,"#edecec"],[250,"#f7f7f7"],[255,"#f7f7f7"]]
