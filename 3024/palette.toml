title = "3024"
gtk_name = "3024"
shell_name = "3024-Shell"
credit = "3024 (colours of the Ptyxis built-in '3024'; the built-in's header names no origin)"
default_accent = "yellow"
dark_only = false
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#090300"],[53,"#120c09"],[66,"#221c1a"],
        [91,"#35302d"],[145,"#54504e"],[238,"#a5a2a2"],[255,"#a5a2a2"]]
fg = "#a5a2a2"
top = "#a5a2a2"
