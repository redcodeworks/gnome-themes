view = "#090300"
[dark.fam]
blue = ["#15539e","#fded02"]
red = ["#cc0000","#db2d20"]
orange = ["#f57900","#fded03"]
green = ["#4e9a06","#01a252"]
[dark.exact]
"#26ab62" = "#01a252"
"#26a269" = "#01a252"      # GTK4 stock success green
"#3584e4" = "#fded02"
"#eeeeec" = "#a5a2a2"

[light]
ramp = [[0,"#4a4543"],[46,"#4a4543"],[145,"#a6a4a3"],[224,"#e7e7e7"],
        [237,"#edecec"],[246,"#f2f2f2"],[255,"#f7f7f7"]]
fg = "#4a4543"
top = "#f7f7f7"
accent_fg = "#090308"
