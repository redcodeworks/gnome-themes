# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #002451 5.5% towards fg
# derived: dark.surface derived: #002451 16.0% towards fg
# derived: dark.surface_high derived: #002451 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
title = "Tomorrow Night Blue"
gtk_name = "Tomorrow-Night-Blue"
shell_name = "Tomorrow-Night-Blue-Shell"
credit = "Tomorrow Night Blue (colours of the Ptyxis built-in 'Tomorrow Night Blue'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Tomorrow%20Night%20Blue.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#002451"],[53,"#0e305b"],[66,"#29476d"],
        [91,"#476181"],[145,"#7a8da4"],[238,"#fffefe"],[255,"#fffefe"]]
fg = "#fffefe"
top = "#fffefe"
accent_fg = "#002451"
view = "#002451"
[dark.fam]
blue = ["#15539e","#99ffff"]
red = ["#cc0000","#ff9da3"]
orange = ["#f57900","#ffeead"]
green = ["#4e9a06","#d1f1a9"]
[dark.exact]
"#26ab62" = "#d1f1a9"
"#26a269" = "#d1f1a9"      # GTK4 stock success green
"#3584e4" = "#99ffff"
"#eeeeec" = "#fffefe"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#002451"],[34.67,"#002451"],[55.33,"#0e305b"],[66.33,"#29476d"],
        [86.67,"#476181"],[156,"#b7c0cd"],[179,"#b7c0cd"],[250,"#fffefe"],
        [255,"#fffefe"]]
fg = "#fffefe"
top = "#fffefe"
accent_fg = "#002451"
view = "#002451"
[shell.dark.fam]
blue = ["#3584e4","#99ffff"]
red = ["#c01c28","#ff9da3"]
orange = ["#ff7800","#ffc6a8"]
green = ["#26a269","#d1f1a9"]
[shell.dark.exact]
"#cd9309" = "#ffeead"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b7c0cd"      # web-login title, dim text
"#54545a" = "#29476d"      # notification/message card: surface
"#45454a" = "#1c3c64"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff9da3"
fg = "#002451"
[accents.dark.green]
color = "#d1f1a9"
fg = "#002451"
[accents.dark.yellow]
color = "#ffeead"
fg = "#002451"
[accents.dark.blue]
color = "#bbdaff"
fg = "#002451"
[accents.dark.magenta]
color = "#ebbbff"
fg = "#002451"
[accents.dark.cyan]
color = "#99ffff"
fg = "#002451"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#002451"
bg = "#0e305b"
surface = "#29476d"
surface_high = "#476181"
popover = "#476181"
fg = "#fffefe"
red = "#ff9da3"
green = "#d1f1a9"
yellow = "#ffeead"
accent = "#99ffff"
accent_fg = "#002451"
warning_fg = "#002451"
secondary_sidebar = "#0e305b"
