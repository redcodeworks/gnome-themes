# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #3f3f3f 5.5% towards fg
# derived: dark.surface derived: #3f3f3f 16.0% towards fg
# derived: dark.surface_high derived: #3f3f3f 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #3f3f3f -> #3f3f47 (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #f0dfb0 (it equals the default accent; keeps accent tokens unique)
title = "Zenburn"
gtk_name = "Zenburn"
shell_name = "Zenburn-Shell"
credit = "Zenburn (colours of the Ptyxis built-in 'Zenburn'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Zenburn.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#3f3f3f"],[53,"#484847"],[66,"#585856"],
        [91,"#6b6b66"],[145,"#8b8b83"],[238,"#dcdccc"],[255,"#dcdccc"]]
fg = "#dcdccc"
top = "#dcdccc"
accent_fg = "#3f3f47"
view = "#3f3f3f"
[dark.fam]
blue = ["#15539e","#f0dfaf"]
red = ["#cc0000","#705050"]
orange = ["#f57900","#f0dfb0"]
green = ["#4e9a06","#60b48a"]
[dark.exact]
"#26ab62" = "#60b48a"
"#26a269" = "#60b48a"      # GTK4 stock success green
"#3584e4" = "#f0dfaf"
"#eeeeec" = "#dcdccc"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#3f3f3f"],[34.67,"#3f3f3f"],[55.33,"#484847"],[66.33,"#585856"],
        [86.67,"#6b6b66"],[156,"#b0b0a4"],[179,"#b0b0a4"],[250,"#dcdccc"],
        [255,"#dcdccc"]]
fg = "#dcdccc"
top = "#dcdccc"
accent_fg = "#3f3f47"
view = "#3f3f3f"
[shell.dark.fam]
blue = ["#3584e4","#f0dfaf"]
red = ["#c01c28","#705050"]
orange = ["#ff7800","#b09880"]
green = ["#26a269","#60b48a"]
[shell.dark.exact]
"#cd9309" = "#f0dfb0"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b0b0a4"      # web-login title, dim text
"#54545a" = "#585856"      # notification/message card: surface
"#45454a" = "#50504e"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#705050"
fg = "#dcdccc"
[accents.dark.green]
color = "#60b48a"
fg = "#3f3f47"
[accents.dark.yellow]
color = "#f0dfaf"
fg = "#3f3f47"
[accents.dark.blue]
color = "#506070"
fg = "#dcdccc"
[accents.dark.magenta]
color = "#dc8cc3"
fg = "#3f3f47"
[accents.dark.cyan]
color = "#8cd0d3"
fg = "#3f3f47"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#3f3f3f"
bg = "#484847"
surface = "#585856"
surface_high = "#6b6b66"
popover = "#6b6b66"
fg = "#dcdccc"
red = "#705050"
green = "#60b48a"
