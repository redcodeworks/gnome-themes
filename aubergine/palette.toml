# SPDX-License-Identifier: MIT
# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #300a24 5.5% towards fg
# derived: dark.surface_high derived: #300a24 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #300a24 -> #300a2c (the text colour varies per accent: the default needs its own token)
# derived: dark.orange nudged to #e95428 (it equals the default accent; keeps accent tokens unique)
title = "Aubergine"
gtk_name = "Aubergine"
shell_name = "Aubergine-Shell"
credit = "Aubergine: Ubuntu terminal palette (hex values only; Tango ANSI, licence unverified)"
default_accent = "orange"
dark_only = true

[dark]
ramp = [[0,"#000000"],[45,"#300a24"],[53,"#3b1730"],[66,"#5e2750"],
        [91,"#6a4f61"],[145,"#937f8d"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#300a2c"
view = "#300a24"
[dark.fam]
blue = ["#15539e","#e95420"]
red = ["#cc0000","#cc0000"]
orange = ["#f57900","#c4a000"]
green = ["#4e9a06","#4e9a06"]
[dark.exact]
"#26ab62" = "#4e9a06"
"#26a269" = "#4e9a06"      # GTK4 stock success green
"#3584e4" = "#e95420"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#300a24"],[34.67,"#300a24"],[55.33,"#3b1730"],[66.33,"#5e2750"],
        [86.67,"#6a4f61"],[156,"#c4b9c1"],[179,"#c4b9c1"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#300a2c"
view = "#300a24"
[shell.dark.fam]
blue = ["#3584e4","#e95420"]
red = ["#c01c28","#cc0000"]
orange = ["#ff7800","#e95428"]
green = ["#26a269","#4e9a06"]
[shell.dark.exact]
"#cd9309" = "#c4a000"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c4b9c1"      # web-login title, dim text
"#54545a" = "#5e2750"      # notification/message card: surface
"#45454a" = "#4c1f40"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#cc0000"
fg = "#ffffff"
[accents.dark.green]
color = "#4e9a06"
fg = "#300a2c"
[accents.dark.yellow]
color = "#c4a000"
fg = "#300a2c"
[accents.dark.blue]
color = "#3465a4"
fg = "#ffffff"
[accents.dark.magenta]
color = "#75507b"
fg = "#ffffff"
[accents.dark.cyan]
color = "#06989a"
fg = "#300a2c"
[accents.dark.orange]
color = "#e95420"
fg = "#300a2c"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#300a24"
bg = "#3b1730"
surface = "#5e2750"
surface_high = "#6a4f61"
popover = "#6a4f61"
fg = "#ffffff"
red = "#cc0000"
green = "#4e9a06"
yellow = "#c4a000"
accent = "#e95420"
accent_fg = "#300a2c"
warning_fg = "#300a24"
secondary_sidebar = "#3b1730"
