# SPDX-License-Identifier: MIT
# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.surface_high derived: #2c001e 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #2c001e -> #2c0026 (the text colour varies per accent: the default needs its own token)
# derived: dark.orange nudged to #e95428 (it equals the default accent; keeps accent tokens unique)
title = "Aubergine"
gtk_name = "Aubergine"
shell_name = "Aubergine-Shell"
credit = "Aubergine: Ubuntu terminal palette (hex values only; Tango ANSI, licence unverified)"
default_accent = "orange"
dark_only = true

[dark]
ramp = [[0,"#000000"],[45,"#2c001e"],[53,"#300a24"],[66,"#5e2750"],
        [91,"#67475d"],[145,"#8d7887"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#2c0026"
view = "#2c001e"
[dark.fam]
blue = ["#15539e","#e95420"]
red = ["#cc0000","#cc0000"]
orange = ["#f57900","#c4a000"]
green = ["#4e9a06","#4e9a06"]
[dark.exact]
"#26ab62" = "#4e9a06"
"#26a269" = "#4e9a06"      # GTK4 stock success green
"#3584e4" = "#e95420"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2c001e"],[34.67,"#2c001e"],[55.33,"#300a24"],[66.33,"#5e2750"],
        [86.67,"#67475d"],[156,"#c1b6bd"],[179,"#c1b6bd"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#2c0026"
view = "#2c001e"
[shell.dark.fam]
blue = ["#3584e4","#e95420"]
red = ["#c01c28","#cc0000"]
orange = ["#ff7800","#e95428"]
green = ["#26a269","#4e9a06"]
[shell.dark.exact]
"#cd9309" = "#c4a000"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c1b6bd"      # web-login title, dim text
"#54545a" = "#5e2750"      # notification/message card: surface
"#45454a" = "#47183a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#cc0000"
fg = "#ffffff"
[accents.dark.green]
color = "#4e9a06"
fg = "#2c0026"
[accents.dark.yellow]
color = "#c4a000"
fg = "#2c0026"
[accents.dark.blue]
color = "#3465a4"
fg = "#ffffff"
[accents.dark.magenta]
color = "#75507b"
fg = "#ffffff"
[accents.dark.cyan]
color = "#06989a"
fg = "#2c0026"
[accents.dark.orange]
color = "#e95420"
fg = "#2c0026"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#2c001e"
bg = "#300a24"
surface = "#5e2750"
surface_high = "#67475d"
popover = "#67475d"
fg = "#ffffff"
red = "#cc0000"
green = "#4e9a06"
yellow = "#c4a000"
accent = "#e95420"
accent_fg = "#2c0026"
warning_fg = "#2c001e"
secondary_sidebar = "#300a24"
