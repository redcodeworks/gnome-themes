# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #2b2b2b 5.5% towards fg
# derived: dark.surface derived: #2b2b2b 16.0% towards fg
# derived: dark.surface_high derived: #2b2b2b 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #2b2b2b -> #2b2b33 (the text colour varies per accent: the default needs its own token)
# derived: dark.green nudged to #a8ff61 (it equals the default accent; keeps accent tokens unique)
title = "Rippedcasts"
gtk_name = "Rippedcasts"
shell_name = "Rippedcasts-Shell"
credit = "Rippedcasts (colours of the Ptyxis built-in 'Rippedcasts'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Rippedcasts.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#2b2b2b"],[53,"#373737"],[66,"#4d4d4d"],
        [91,"#666666"],[145,"#919191"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#2b2b33"
view = "#2b2b2b"
[dark.fam]
blue = ["#15539e","#a8ff60"]
red = ["#cc0000","#cdaf95"]
orange = ["#f57900","#bfbb1f"]
green = ["#4e9a06","#a8ff61"]
[dark.exact]
"#26ab62" = "#a8ff61"
"#26a269" = "#a8ff61"      # GTK4 stock success green
"#3584e4" = "#a8ff60"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2b2b2b"],[34.67,"#2b2b2b"],[55.33,"#373737"],[66.33,"#4d4d4d"],
        [86.67,"#666666"],[156,"#c3c3c3"],[179,"#c3c3c3"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#2b2b33"
view = "#2b2b2b"
[shell.dark.fam]
blue = ["#3584e4","#a8ff60"]
red = ["#c01c28","#cdaf95"]
orange = ["#ff7800","#c6b55a"]
green = ["#26a269","#a8ff61"]
[shell.dark.exact]
"#cd9309" = "#bfbb1f"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c3c3c3"      # web-login title, dim text
"#54545a" = "#4d4d4d"      # notification/message card: surface
"#45454a" = "#424242"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#cdaf95"
fg = "#2b2b33"
[accents.dark.green]
color = "#a8ff60"
fg = "#2b2b33"
[accents.dark.yellow]
color = "#bfbb1f"
fg = "#2b2b33"
[accents.dark.blue]
color = "#75a5b0"
fg = "#2b2b33"
[accents.dark.magenta]
color = "#ff73fd"
fg = "#2b2b33"
[accents.dark.cyan]
color = "#5a647e"
fg = "#ffffff"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#2b2b2b"
bg = "#373737"
surface = "#4d4d4d"
surface_high = "#666666"
popover = "#666666"
fg = "#ffffff"
red = "#cdaf95"
green = "#a8ff61"
yellow = "#bfbb1f"
