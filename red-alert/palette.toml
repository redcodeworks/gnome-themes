# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #762423 5.5% towards fg
# derived: dark.surface derived: #762423 16.0% towards fg
# derived: dark.surface_high derived: #762423 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #762423 -> #76242b (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #beb86c (it equals the default accent; keeps accent tokens unique)
title = "Red Alert"
gtk_name = "Red-Alert"
shell_name = "Red-Alert-Shell"
credit = "Red Alert (colours of the Ptyxis built-in 'Red Alert'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Red%20Alert.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#762423"],[53,"#7e302f"],[66,"#8c4746"],
        [91,"#9c6161"],[145,"#b88d8d"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#76242b"
view = "#762423"
[dark.fam]
blue = ["#15539e","#beb86b"]
red = ["#cc0000","#d62e4e"]
orange = ["#f57900","#beb86c"]
green = ["#4e9a06","#71be6b"]
[dark.exact]
"#26ab62" = "#71be6b"
"#26a269" = "#71be6b"      # GTK4 stock success green
"#3584e4" = "#beb86b"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#762423"],[34.67,"#762423"],[55.33,"#7e302f"],[66.33,"#8c4746"],
        [86.67,"#9c6161"],[156,"#d8c1c1"],[179,"#d8c1c1"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#76242b"
view = "#762423"
[shell.dark.fam]
blue = ["#3584e4","#beb86b"]
red = ["#c01c28","#d62e4e"]
orange = ["#ff7800","#ca735c"]
green = ["#26a269","#71be6b"]
[shell.dark.exact]
"#cd9309" = "#beb86c"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#d8c1c1"      # web-login title, dim text
"#54545a" = "#8c4746"      # notification/message card: surface
"#45454a" = "#853c3a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#d62e4e"
fg = "#ffffff"
[accents.dark.green]
color = "#71be6b"
fg = "#76242b"
[accents.dark.yellow]
color = "#beb86b"
fg = "#76242b"
[accents.dark.blue]
color = "#489bee"
fg = "#76242b"
[accents.dark.magenta]
color = "#e979d7"
fg = "#76242b"
[accents.dark.cyan]
color = "#6bbeb8"
fg = "#76242b"

# roles for tools/libadwaita-gen.py
[roles.dark]
