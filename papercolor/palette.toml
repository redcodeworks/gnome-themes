view = "#1c1c1c"
[dark.fam]
blue = ["#15539e","#d7af5f"]
red = ["#cc0000","#af005f"]
orange = ["#f57900","#d7af60"]
green = ["#4e9a06","#5faf00"]
[dark.exact]
"#26ab62" = "#5faf00"
"#26a269" = "#5faf00"      # GTK4 stock success green
"#3584e4" = "#d7af5f"
"#eeeeec" = "#d0d0d0"

[light]
ramp = [[0,"#444444"],[46,"#444444"],[145,"#9f9f9f"],[224,"#dfdfdf"],
        [237,"#e4e4e4"],[246,"#e9e9e9"],[255,"#eeeeee"]]
fg = "#444444"
top = "#eeeeee"
accent_fg = "#1c1c24"
