[light.fam]
blue = ["#3584e4","#5f8700"]
red = ["#cc0000","#af0000"]
orange = ["#f57900","#5f8701"]
green = ["#4e9a06","#008700"]
[light.exact]
"#33d17a" = "#008700"
"#2ec27e" = "#008700"      # GTK4 stock success green (light)
"#2e3436" = "#444444"
"#f6f5f4" = "#e9e9e9"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1c1c1c"],[34.67,"#1c1c1c"],[55.33,"#262626"],[66.33,"#393939"],
        [86.67,"#4e4e4e"],[156,"#9d9d9d"],[179,"#9d9d9d"],[250,"#d0d0d0"],
        [255,"#d0d0d0"]]
fg = "#d0d0d0"
top = "#d0d0d0"
accent_fg = "#1c1c24"
view = "#1c1c1c"
[shell.dark.fam]
blue = ["#3584e4","#d7af5f"]
red = ["#c01c28","#af005f"]
orange = ["#ff7800","#c3585f"]
green = ["#26a269","#5faf00"]
[shell.dark.exact]
"#cd9309" = "#d7af60"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9d9d9d"      # web-login title, dim text
"#54545a" = "#393939"      # notification/message card: surface
"#45454a" = "#303030"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#444444"],[46,"#444444"],[145,"#9f9f9f"],[224,"#dfdfdf"],
        [237,"#e4e4e4"],[250,"#eeeeee"],[255,"#eeeeee"]]
