title = "Papercolor"
gtk_name = "Papercolor"
shell_name = "Papercolor-Shell"
credit = "Papercolor (colours of the Ptyxis built-in 'Papercolor'; the built-in's header names no origin)"
default_accent = "yellow"
dark_only = false
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1c1c1c"],[53,"#262626"],[66,"#393939"],
        [91,"#4e4e4e"],[145,"#727272"],[238,"#d0d0d0"],[255,"#d0d0d0"]]
fg = "#d0d0d0"
top = "#d0d0d0"
