title = "Medallion"
gtk_name = "Medallion"
shell_name = "Medallion-Shell"
credit = "Medallion (colours of the Ptyxis built-in 'Medallion'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Medallion.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1d1908"],[53,"#272210"],[66,"#39341f"],
        [91,"#4d4830"],[145,"#706a4c"],[238,"#cac296"],[255,"#cac296"]]
fg = "#cac296"
top = "#cac296"
accent_fg = "#1d1908"
view = "#1d1908"
[dark.fam]
blue = ["#15539e","#d3bd26"]
red = ["#cc0000","#b64c00"]
orange = ["#f57900","#d3bd27"]
green = ["#4e9a06","#7c8b16"]
[dark.exact]
"#26ab62" = "#7c8b16"
"#26a269" = "#7c8b16"      # GTK4 stock success green
"#3584e4" = "#d3bd26"
"#eeeeec" = "#cac296"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1d1908"],[34.67,"#1d1908"],[55.33,"#272210"],[66.33,"#39341f"],
        [86.67,"#4d4830"],[156,"#99926e"],[179,"#99926e"],[250,"#cac296"],
        [255,"#cac296"]]
fg = "#cac296"
top = "#cac296"
accent_fg = "#1d1908"
view = "#1d1908"
[shell.dark.fam]
blue = ["#3584e4","#d3bd26"]
red = ["#c01c28","#b64c00"]
orange = ["#ff7800","#c48413"]
green = ["#26a269","#7c8b16"]
[shell.dark.exact]
"#cd9309" = "#d3bd27"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#99926e"      # web-login title, dim text
"#54545a" = "#39341f"      # notification/message card: surface
"#45454a" = "#302b18"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
