# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #132738 5.5% towards fg
# derived: dark.surface derived: #132738 16.0% towards fg
# derived: dark.surface_high derived: #132738 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #132738 -> #132740 (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #ffe50b (it equals the default accent; keeps accent tokens unique)
title = "Cobalt 2"
gtk_name = "Cobalt-2"
shell_name = "Cobalt-2-Shell"
credit = "Cobalt 2 (colours of the Ptyxis built-in 'Cobalt 2'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Cobalt%202.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#132738"],[53,"#203343"],[66,"#394a58"],
        [91,"#556370"],[145,"#848f98"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#132740"
view = "#132738"
[dark.fam]
blue = ["#15539e","#ffe50a"]
red = ["#cc0000","#ff0000"]
orange = ["#f57900","#ffe50b"]
green = ["#4e9a06","#38de21"]
[dark.exact]
"#26ab62" = "#38de21"
"#26a269" = "#38de21"      # GTK4 stock success green
"#3584e4" = "#ffe50a"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#132738"],[34.67,"#132738"],[55.33,"#203343"],[66.33,"#394a58"],
        [86.67,"#556370"],[156,"#bcc2c7"],[179,"#bcc2c7"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#132740"
view = "#132738"
[shell.dark.fam]
blue = ["#3584e4","#ffe50a"]
red = ["#c01c28","#ff0000"]
orange = ["#ff7800","#ff7205"]
green = ["#26a269","#38de21"]
[shell.dark.exact]
"#cd9309" = "#ffe50b"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#bcc2c7"      # web-login title, dim text
"#54545a" = "#394a58"      # notification/message card: surface
"#45454a" = "#2c3e4e"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff0000"
fg = "#132740"
[accents.dark.green]
color = "#38de21"
fg = "#132740"
[accents.dark.yellow]
color = "#ffe50a"
fg = "#132740"
[accents.dark.blue]
color = "#1460d2"
fg = "#ffffff"
[accents.dark.magenta]
color = "#ff005d"
fg = "#132740"
[accents.dark.cyan]
color = "#00bbbb"
fg = "#132740"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#132738"
bg = "#203343"
surface = "#394a58"
surface_high = "#556370"
popover = "#556370"
fg = "#ffffff"
red = "#ff0000"
