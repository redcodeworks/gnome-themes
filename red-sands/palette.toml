# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #7a251e 5.5% towards fg
# derived: dark.surface derived: #7a251e 16.0% towards fg
# derived: dark.surface_high derived: #7a251e 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #7a251e -> #7a2526 (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #e7b001 (it equals the default accent; keeps accent tokens unique)
title = "Red Sands"
gtk_name = "Red-Sands"
shell_name = "Red-Sands-Shell"
credit = "Red Sands (colours of the Ptyxis built-in 'Red Sands'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Red%20Sands.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#7a251e"],[53,"#7f2e26"],[66,"#893f34"],
        [91,"#945344"],[145,"#a77460"],[238,"#d7c9a7"],[255,"#d7c9a7"]]
fg = "#d7c9a7"
top = "#d7c9a7"
accent_fg = "#7a2526"
view = "#7a251e"
[dark.fam]
blue = ["#15539e","#e7b000"]
red = ["#cc0000","#ff3f00"]
orange = ["#f57900","#e7b001"]
green = ["#4e9a06","#00bb00"]
[dark.exact]
"#26ab62" = "#00bb00"
"#26a269" = "#00bb00"      # GTK4 stock success green
"#3584e4" = "#e7b000"
"#eeeeec" = "#d7c9a7"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#7a251e"],[34.67,"#7a251e"],[55.33,"#7f2e26"],[66.33,"#893f34"],
        [86.67,"#945344"],[156,"#bd9a80"],[179,"#bd9a80"],[250,"#d7c9a7"],
        [255,"#d7c9a7"]]
fg = "#d7c9a7"
top = "#d7c9a7"
accent_fg = "#7a2526"
view = "#7a251e"
[shell.dark.fam]
blue = ["#3584e4","#e7b000"]
red = ["#c01c28","#ff3f00"]
orange = ["#ff7800","#f37800"]
green = ["#26a269","#00bb00"]
[shell.dark.exact]
"#cd9309" = "#e7b001"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#bd9a80"      # web-login title, dim text
"#54545a" = "#893f34"      # notification/message card: surface
"#45454a" = "#84362d"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff3f00"
fg = "#7a2526"
[accents.dark.green]
color = "#00bb00"
fg = "#7a2526"
[accents.dark.yellow]
color = "#e7b000"
fg = "#7a2526"
[accents.dark.blue]
color = "#0072ff"
fg = "#d7c9a7"
[accents.dark.magenta]
color = "#bb00bb"
fg = "#d7c9a7"
[accents.dark.cyan]
color = "#00bbbb"
fg = "#7a2526"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#7a251e"
bg = "#7f2e26"
surface = "#893f34"
surface_high = "#945344"
popover = "#945344"
fg = "#d7c9a7"
