# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #101010 5.5% towards fg
# derived: dark.surface derived: #101010 16.0% towards fg
# derived: dark.surface_high derived: #101010 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #101010 -> #101018 (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #ffc006 (it equals the default accent; keeps accent tokens unique)
title = "Elementary"
gtk_name = "Elementary"
shell_name = "Elementary-Shell"
credit = "Elementary (colours of the Ptyxis built-in 'Elementary'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Elementary.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#101010"],[53,"#1c1c1c"],[66,"#343434"],
        [91,"#4f4f4f"],[145,"#7c7c7c"],[238,"#f2f2f2"],[255,"#f2f2f2"]]
fg = "#f2f2f2"
top = "#f2f2f2"
accent_fg = "#101018"
view = "#101010"
[dark.fam]
blue = ["#15539e","#ffc005"]
red = ["#cc0000","#e1321a"]
orange = ["#f57900","#ffc006"]
green = ["#4e9a06","#6ab017"]
[dark.exact]
"#26ab62" = "#6ab017"
"#26a269" = "#6ab017"      # GTK4 stock success green
"#3584e4" = "#ffc005"
"#eeeeec" = "#f2f2f2"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#101010"],[34.67,"#101010"],[55.33,"#1c1c1c"],[66.33,"#343434"],
        [86.67,"#4f4f4f"],[156,"#b2b2b2"],[179,"#b2b2b2"],[250,"#f2f2f2"],
        [255,"#f2f2f2"]]
fg = "#f2f2f2"
top = "#f2f2f2"
accent_fg = "#101018"
view = "#101010"
[shell.dark.fam]
blue = ["#3584e4","#ffc005"]
red = ["#c01c28","#e1321a"]
orange = ["#ff7800","#f07910"]
green = ["#26a269","#6ab017"]
[shell.dark.exact]
"#cd9309" = "#ffc006"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b2b2b2"      # web-login title, dim text
"#54545a" = "#343434"      # notification/message card: surface
"#45454a" = "#282828"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#e1321a"
fg = "#101018"
[accents.dark.green]
color = "#6ab017"
fg = "#101018"
[accents.dark.yellow]
color = "#ffc005"
fg = "#101018"
[accents.dark.blue]
color = "#004f9e"
fg = "#f2f2f2"
[accents.dark.magenta]
color = "#ec0048"
fg = "#101018"
[accents.dark.cyan]
color = "#2aa7e7"
fg = "#101018"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#101010"
bg = "#1c1c1c"
surface = "#343434"
surface_high = "#4f4f4f"
popover = "#4f4f4f"
fg = "#f2f2f2"
red = "#e1321a"
green = "#6ab017"
yellow = "#ffc006"
