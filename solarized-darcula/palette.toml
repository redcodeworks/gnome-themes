title = "Solarized Darcula"
gtk_name = "Solarized-Darcula"
shell_name = "Solarized-Darcula-Shell"
credit = "Solarized Darcula (colours of the Ptyxis built-in 'Solarized Darcula'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Solarized%20Darcula.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#3d3f41"],[53,"#454749"],[66,"#555759"],
        [91,"#676a6c"],[145,"#84888a"],[238,"#d2d8d9"],[255,"#d2d8d9"]]
fg = "#d2d8d9"
top = "#d2d8d9"
accent_fg = "#3d3f49"
view = "#3d3f41"
[dark.fam]
blue = ["#15539e","#b68800"]
red = ["#cc0000","#f24840"]
orange = ["#f57900","#b68801"]
green = ["#4e9a06","#629655"]
[dark.exact]
"#26ab62" = "#629655"
"#26a269" = "#629655"      # GTK4 stock success green
"#3584e4" = "#b68800"
"#eeeeec" = "#d2d8d9"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#3d3f41"],[34.67,"#3d3f41"],[55.33,"#454749"],[66.33,"#555759"],
        [86.67,"#676a6c"],[156,"#a8acae"],[179,"#a8acae"],[250,"#d2d8d9"],
        [255,"#d2d8d9"]]
fg = "#d2d8d9"
top = "#d2d8d9"
accent_fg = "#3d3f49"
view = "#3d3f41"
[shell.dark.fam]
blue = ["#3584e4","#b68800"]
red = ["#c01c28","#f24840"]
orange = ["#ff7800","#d46820"]
green = ["#26a269","#629655"]
[shell.dark.exact]
"#cd9309" = "#b68801"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a8acae"      # web-login title, dim text
"#54545a" = "#555759"      # notification/message card: surface
"#45454a" = "#4d4f51"      # message card stacked behind the front one: bg and surface mixed 50 %

