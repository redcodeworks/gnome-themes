# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #283033 5.5% towards fg
# derived: dark.surface derived: #283033 16.0% towards fg
# derived: dark.surface_high derived: #283033 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #283033 -> #28303b (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #fecd23 (it equals the default accent; keeps accent tokens unique)
title = "Obsidian"
gtk_name = "Obsidian"
shell_name = "Obsidian-Shell"
credit = "Obsidian (colours of the Ptyxis built-in 'Obsidian'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Obsidian.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#283033"],[53,"#31393b"],[66,"#42494c"],
        [91,"#565c5e"],[145,"#777c7d"],[238,"#cdcdcd"],[255,"#cdcdcd"]]
fg = "#cdcdcd"
top = "#cdcdcd"
accent_fg = "#28303b"
view = "#283033"
[dark.fam]
blue = ["#15539e","#fecd22"]
red = ["#cc0000","#a60001"]
orange = ["#f57900","#fecd23"]
green = ["#4e9a06","#00bb00"]
[dark.exact]
"#26ab62" = "#00bb00"
"#26a269" = "#00bb00"      # GTK4 stock success green
"#3584e4" = "#fecd22"
"#eeeeec" = "#cdcdcd"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#283033"],[34.67,"#283033"],[55.33,"#31393b"],[66.33,"#42494c"],
        [86.67,"#565c5e"],[156,"#9ea1a1"],[179,"#9ea1a1"],[250,"#cdcdcd"],
        [255,"#cdcdcd"]]
fg = "#cdcdcd"
top = "#cdcdcd"
accent_fg = "#28303b"
view = "#283033"
[shell.dark.fam]
blue = ["#3584e4","#fecd22"]
red = ["#c01c28","#a60001"]
orange = ["#ff7800","#d26612"]
green = ["#26a269","#00bb00"]
[shell.dark.exact]
"#cd9309" = "#fecd23"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9ea1a1"      # web-login title, dim text
"#54545a" = "#42494c"      # notification/message card: surface
"#45454a" = "#3a4144"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#a60001"
fg = "#cdcdcd"
[accents.dark.green]
color = "#00bb00"
fg = "#28303b"
[accents.dark.yellow]
color = "#fecd22"
fg = "#28303b"
[accents.dark.blue]
color = "#3a9bdb"
fg = "#28303b"
[accents.dark.magenta]
color = "#bb00bb"
fg = "#cdcdcd"
[accents.dark.cyan]
color = "#00bbbb"
fg = "#28303b"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#283033"
bg = "#31393b"
surface = "#42494c"
surface_high = "#565c5e"
popover = "#565c5e"
fg = "#cdcdcd"
red = "#a60001"
green = "#00bb00"
yellow = "#fecd23"
accent = "#fecd22"
accent_fg = "#28303b"
warning_fg = "#283033"
secondary_sidebar = "#31393b"
