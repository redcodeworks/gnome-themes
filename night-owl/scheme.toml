# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Night Owl'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Night%20Owl.yml.
title = "Night Owl"
gtk_name = "Night-Owl"
shell_name = "Night-Owl-Shell"
credit = "Night Owl (colours of the Ptyxis built-in 'Night Owl'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Night%20Owl.yml)"
ptyxis = "Night Owl"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Night Owl' (bulk-built by tools/bulk-scheme.py)."
default_accent = "yellow"

[dark]
bg_deep = "#011627"
fg = "#d6deeb"
selection = "#2c3e4e"   # DERIVED
red = "#ef5350"
orange = "#ce975c"   # DERIVED
yellow = "#addb67"
green = "#22da6e"
cyan = "#21c7a8"
blue = "#82aaff"
magenta = "#c792ea"
purple = "#c792ea"   # = magenta
# palette Color8 (bright black) = #575656: a candidate for `comment`
[dark.ansi]
red = "#ef5350"
green = "#22da6e"
yellow = "#addb67"
blue = "#82aaff"
magenta = "#c792ea"
cyan = "#21c7a8"
[dark.terminal]
source = "Night Owl"   # Ptyxis built-in id
black = "#011627"   # Ptyxis Color0
white = "#ffffff"   # Ptyxis Color7
bright_black = "#575656"   # Ptyxis Color8
bright_yellow = "#ffeb95"   # Ptyxis Color11
bright_cyan = "#7fdbca"   # Ptyxis Color14
bright_white = "#ffffff"   # Ptyxis Color15
