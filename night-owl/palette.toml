# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #011627 5.5% towards fg
# derived: dark.surface derived: #011627 16.0% towards fg
# derived: dark.surface_high derived: #011627 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #addb68 (it equals the default accent; keeps accent tokens unique)
title = "Night Owl"
gtk_name = "Night-Owl"
shell_name = "Night-Owl-Shell"
credit = "Night Owl (colours of the Ptyxis built-in 'Night Owl'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Night%20Owl.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#011627"],[53,"#0d2132"],[66,"#233646"],
        [91,"#3d4e5e"],[145,"#677685"],[238,"#d6deeb"],[255,"#d6deeb"]]
fg = "#d6deeb"
top = "#d6deeb"
accent_fg = "#011627"
view = "#011627"
[dark.fam]
blue = ["#15539e","#addb67"]
red = ["#cc0000","#ef5350"]
orange = ["#f57900","#addb68"]
green = ["#4e9a06","#22da6e"]
[dark.exact]
"#26ab62" = "#22da6e"
"#26a269" = "#22da6e"      # GTK4 stock success green
"#3584e4" = "#addb67"
"#eeeeec" = "#d6deeb"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#011627"],[34.67,"#011627"],[55.33,"#0d2132"],[66.33,"#233646"],
        [86.67,"#3d4e5e"],[156,"#9aa5b4"],[179,"#9aa5b4"],[250,"#d6deeb"],
        [255,"#d6deeb"]]
fg = "#d6deeb"
top = "#d6deeb"
accent_fg = "#011627"
view = "#011627"
[shell.dark.fam]
blue = ["#3584e4","#addb67"]
red = ["#c01c28","#ef5350"]
orange = ["#ff7800","#ce975c"]
green = ["#26a269","#22da6e"]
[shell.dark.exact]
"#cd9309" = "#addb68"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9aa5b4"      # web-login title, dim text
"#54545a" = "#233646"      # notification/message card: surface
"#45454a" = "#182c3c"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ef5350"
fg = "#011627"
[accents.dark.green]
color = "#22da6e"
fg = "#011627"
[accents.dark.yellow]
color = "#addb67"
fg = "#011627"
[accents.dark.blue]
color = "#82aaff"
fg = "#011627"
[accents.dark.magenta]
color = "#c792ea"
fg = "#011627"
[accents.dark.cyan]
color = "#21c7a8"
fg = "#011627"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#011627"
bg = "#0d2132"
surface = "#233646"
surface_high = "#3d4e5e"
popover = "#3d4e5e"
fg = "#d6deeb"
red = "#ef5350"
green = "#22da6e"
