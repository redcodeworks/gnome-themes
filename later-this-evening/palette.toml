# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #222222 5.5% towards fg
# derived: dark.surface derived: #222222 16.0% towards fg
# derived: dark.surface_high derived: #222222 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #e5d28a (it equals the default accent; keeps accent tokens unique)
title = "Later This Evening"
gtk_name = "Later-This-Evening"
shell_name = "Later-This-Evening-Shell"
credit = "Later This Evening (colours of the Ptyxis built-in 'Later This Evening'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Later%20This%20Evening.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#222222"],[53,"#282828"],[66,"#343434"],
        [91,"#424242"],[145,"#595959"],[238,"#959595"],[255,"#959595"]]
fg = "#959595"
top = "#959595"
accent_fg = "#222222"
view = "#222222"
[dark.fam]
blue = ["#15539e","#e5d289"]
red = ["#cc0000","#d45a60"]
orange = ["#f57900","#e5d28a"]
green = ["#4e9a06","#afba67"]
[dark.exact]
"#26ab62" = "#afba67"
"#26a269" = "#afba67"      # GTK4 stock success green
"#3584e4" = "#e5d289"
"#eeeeec" = "#959595"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#222222"],[34.67,"#222222"],[55.33,"#282828"],[66.33,"#343434"],
        [86.67,"#424242"],[156,"#747474"],[179,"#747474"],[250,"#959595"],
        [255,"#959595"]]
fg = "#959595"
top = "#959595"
accent_fg = "#222222"
view = "#222222"
[shell.dark.fam]
blue = ["#3584e4","#e5d289"]
red = ["#c01c28","#d45a60"]
orange = ["#ff7800","#dc9674"]
green = ["#26a269","#afba67"]
[shell.dark.exact]
"#cd9309" = "#e5d28a"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#747474"      # web-login title, dim text
"#54545a" = "#343434"      # notification/message card: surface
"#45454a" = "#2e2e2e"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#d45a60"
fg = "#222222"
[accents.dark.green]
color = "#afba67"
fg = "#222222"
[accents.dark.yellow]
color = "#e5d289"
fg = "#222222"
[accents.dark.blue]
