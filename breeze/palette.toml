# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #232627 5.5% towards fg
# derived: dark.surface derived: #232627 16.0% towards fg
# derived: dark.surface_high derived: #232627 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #232627 -> #23262f (the text colour varies per accent: the default needs its own token)
# derived: dark.green nudged to #11d117 (it equals the default accent; keeps accent tokens unique)
title = "Breeze"
gtk_name = "Breeze"
shell_name = "Breeze-Shell"
credit = "Breeze (colours of the Ptyxis built-in 'Breeze'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Breeze.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#232627"],[53,"#2f3233"],[66,"#464849"],
        [91,"#606263"],[145,"#8b8d8d"],[238,"#fcfcfc"],[255,"#fcfcfc"]]
fg = "#fcfcfc"
top = "#fcfcfc"
accent_fg = "#23262f"
view = "#232627"
[dark.fam]
blue = ["#15539e","#11d116"]
red = ["#cc0000","#ed1515"]
orange = ["#f57900","#f67400"]
green = ["#4e9a06","#11d117"]
[dark.exact]
"#26ab62" = "#11d117"
"#26a269" = "#11d117"      # GTK4 stock success green
"#3584e4" = "#11d116"
"#eeeeec" = "#fcfcfc"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#232627"],[34.67,"#232627"],[55.33,"#2f3233"],[66.33,"#464849"],
        [86.67,"#606263"],[156,"#bebfc0"],[179,"#bebfc0"],[250,"#fcfcfc"],
        [255,"#fcfcfc"]]
fg = "#fcfcfc"
top = "#fcfcfc"
accent_fg = "#23262f"
view = "#232627"
[shell.dark.fam]
blue = ["#3584e4","#11d116"]
red = ["#c01c28","#ed1515"]
orange = ["#ff7800","#f2440a"]
green = ["#26a269","#11d117"]
[shell.dark.exact]
"#cd9309" = "#f67400"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#bebfc0"      # web-login title, dim text
"#54545a" = "#464849"      # notification/message card: surface
"#45454a" = "#3a3d3e"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ed1515"
fg = "#fcfcfc"
[accents.dark.green]
color = "#11d116"
fg = "#23262f"
[accents.dark.yellow]
color = "#f67400"
fg = "#23262f"
[accents.dark.blue]
color = "#1d99f3"
fg = "#23262f"
[accents.dark.magenta]
color = "#9b59b6"
fg = "#fcfcfc"
[accents.dark.cyan]
color = "#1abc9c"
fg = "#23262f"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#232627"
bg = "#2f3233"
surface = "#464849"
surface_high = "#606263"
popover = "#606263"
fg = "#fcfcfc"
red = "#ed1515"
green = "#11d117"
yellow = "#f67400"
accent = "#11d116"
accent_fg = "#23262f"
warning_fg = "#232627"
secondary_sidebar = "#2f3233"
