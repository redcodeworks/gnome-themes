ramp = [[0,"#000000"],[34.67,"#000000"],[55.33,"#0e0e0e"],[66.33,"#292929"],
        [86.67,"#474747"],[156,"#b7b7b7"],[179,"#b7b7b7"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
