view = "#000000"
[shell.dark.fam]
blue = ["#3584e4","#b1d630"]
red = ["#c01c28","#ff0054"]
orange = ["#ff7800","#ce4459"]
green = ["#26a269","#b1d631"]
[shell.dark.exact]
"#cd9309" = "#9d895e"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b7b7b7"      # web-login title, dim text
"#54545a" = "#292929"      # notification/message card: surface
"#45454a" = "#1c1c1c"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
