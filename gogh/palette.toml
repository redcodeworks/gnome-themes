# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #292d3e 5.5% towards fg
# derived: dark.surface derived: #292d3e 16.0% towards fg
# derived: dark.surface_high derived: #292d3e 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #ffcb6c (it equals the default accent; keeps accent tokens unique)
title = "Gogh"
gtk_name = "Gogh"
shell_name = "Gogh-Shell"
credit = "Gogh (colours of the Ptyxis built-in 'Gogh'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Gogh.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#292d3e"],[53,"#313546"],[66,"#414656"],
        [91,"#535868"],[145,"#717786"],[238,"#bfc7d5"],[255,"#bfc7d5"]]
fg = "#bfc7d5"
top = "#bfc7d5"
accent_fg = "#292d3e"
view = "#292d3e"
[dark.fam]
blue = ["#15539e","#ffcb6b"]
red = ["#cc0000","#f07178"]
orange = ["#f57900","#ffcb6c"]
green = ["#4e9a06","#62de84"]
[dark.exact]
"#26ab62" = "#62de84"
"#26a269" = "#62de84"      # GTK4 stock success green
"#3584e4" = "#ffcb6b"
"#eeeeec" = "#bfc7d5"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#292d3e"],[34.67,"#292d3e"],[55.33,"#313546"],[66.33,"#414656"],
        [86.67,"#535868"],[156,"#949baa"],[179,"#949baa"],[250,"#bfc7d5"],
        [255,"#bfc7d5"]]
fg = "#bfc7d5"
top = "#bfc7d5"
accent_fg = "#292d3e"
view = "#292d3e"
[shell.dark.fam]
blue = ["#3584e4","#ffcb6b"]
red = ["#c01c28","#f07178"]
orange = ["#ff7800","#f89e72"]
green = ["#26a269","#62de84"]
[shell.dark.exact]
"#cd9309" = "#ffcb6c"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#949baa"      # web-login title, dim text
"#54545a" = "#414656"      # notification/message card: surface
"#45454a" = "#393e4e"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#f07178"
fg = "#292d3e"
[accents.dark.green]
color = "#62de84"
fg = "#292d3e"
[accents.dark.yellow]
color = "#ffcb6b"
fg = "#292d3e"
[accents.dark.blue]
color = "#75a1ff"
fg = "#292d3e"
[accents.dark.magenta]
color = "#f580ff"
fg = "#292d3e"
[accents.dark.cyan]
color = "#60baec"
fg = "#292d3e"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#292d3e"
bg = "#313546"
surface = "#414656"
surface_high = "#535868"
popover = "#535868"
fg = "#bfc7d5"
red = "#f07178"
green = "#62de84"
yellow = "#ffcb6c"
accent = "#ffcb6b"
accent_fg = "#292d3e"
warning_fg = "#292d3e"
secondary_sidebar = "#313546"
