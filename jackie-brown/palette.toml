# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #2c1d16 5.5% towards fg
# derived: dark.surface derived: #2c1d16 16.0% towards fg
# derived: dark.surface_high derived: #2c1d16 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #2c1d16 -> #2c1d1e (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #bebf01 (it equals the default accent; keeps accent tokens unique)
title = "Jackie Brown"
gtk_name = "Jackie-Brown"
shell_name = "Jackie-Brown-Shell"
credit = "Jackie Brown (colours of the Ptyxis built-in 'Jackie Brown'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Jackie%20Brown.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#2c1d16"],[53,"#382717"],[66,"#4e391a"],
        [91,"#674e1d"],[145,"#927122"],[238,"#ffcc2f"],[255,"#ffcc2f"]]
fg = "#ffcc2f"
top = "#ffcc2f"
accent_fg = "#2c1d1e"
view = "#2c1d16"
[dark.fam]
blue = ["#15539e","#bebf00"]
red = ["#cc0000","#ef5734"]
orange = ["#f57900","#bebf01"]
green = ["#4e9a06","#2baf2b"]
[dark.exact]
"#26ab62" = "#2baf2b"
"#26a269" = "#2baf2b"      # GTK4 stock success green
"#3584e4" = "#bebf00"
"#eeeeec" = "#ffcc2f"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2c1d16"],[34.67,"#2c1d16"],[55.33,"#382717"],[66.33,"#4e391a"],
        [86.67,"#674e1d"],[156,"#c39a28"],[179,"#c39a28"],[250,"#ffcc2f"],
        [255,"#ffcc2f"]]
fg = "#ffcc2f"
top = "#ffcc2f"
accent_fg = "#2c1d1e"
view = "#2c1d16"
[shell.dark.fam]
blue = ["#3584e4","#bebf00"]
red = ["#c01c28","#ef5734"]
orange = ["#ff7800","#d68b1a"]
green = ["#26a269","#2baf2b"]
[shell.dark.exact]
"#cd9309" = "#bebf01"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c39a28"      # web-login title, dim text
"#54545a" = "#4e391a"      # notification/message card: surface
"#45454a" = "#433018"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ef5734"
fg = "#2c1d1e"
[accents.dark.green]
color = "#2baf2b"
fg = "#2c1d1e"
[accents.dark.yellow]
color = "#bebf00"
fg = "#2c1d1e"
[accents.dark.blue]
color = "#246eb2"
fg = "#ffcc2f"
[accents.dark.magenta]
color = "#d05ec1"
fg = "#2c1d1e"
[accents.dark.cyan]
color = "#00acee"
fg = "#2c1d1e"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#2c1d16"
bg = "#382717"
surface = "#4e391a"
surface_high = "#674e1d"
popover = "#674e1d"
fg = "#ffcc2f"
red = "#ef5734"
green = "#2baf2b"
