# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #091116 5.5% towards fg
# derived: dark.surface derived: #091116 16.0% towards fg
# derived: dark.surface_high derived: #091116 28.0% towards fg
