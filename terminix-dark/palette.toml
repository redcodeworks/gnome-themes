title = "Terminix Dark"
gtk_name = "Terminix-Dark"
shell_name = "Terminix-Dark-Shell"
credit = "Terminix Dark (colours of the Ptyxis built-in 'Terminix Dark'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Terminix%20Dark.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#091116"],[53,"#10181c"],[66,"#1d2429"],
        [91,"#2c3337"],[145,"#454b4e"],[238,"#868a8c"],[255,"#868a8c"]]
fg = "#868a8c"
top = "#868a8c"
accent_fg = "#091116"
view = "#091116"
[dark.fam]
blue = ["#15539e","#a1b56c"]
red = ["#cc0000","#a54242"]
orange = ["#f57900","#de935f"]
green = ["#4e9a06","#a1b56d"]
[dark.exact]
"#26ab62" = "#a1b56d"
"#26a269" = "#a1b56d"      # GTK4 stock success green
"#3584e4" = "#a1b56c"
"#eeeeec" = "#868a8c"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#091116"],[34.67,"#091116"],[55.33,"#10181c"],[66.33,"#1d2429"],
        [86.67,"#2c3337"],[156,"#63686a"],[179,"#63686a"],[250,"#868a8c"],
        [255,"#868a8c"]]
fg = "#868a8c"
top = "#868a8c"
accent_fg = "#091116"
view = "#091116"
[shell.dark.fam]
blue = ["#3584e4","#a1b56c"]
red = ["#c01c28","#a54242"]
orange = ["#ff7800","#c26a50"]
green = ["#26a269","#a1b56d"]
[shell.dark.exact]
"#cd9309" = "#de935f"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#63686a"      # web-login title, dim text
"#54545a" = "#1d2429"      # notification/message card: surface
"#45454a" = "#161e22"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
