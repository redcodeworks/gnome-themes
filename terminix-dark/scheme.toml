# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Terminix Dark'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Terminix%20Dark.yml.
title = "Terminix Dark"
gtk_name = "Terminix-Dark"
shell_name = "Terminix-Dark-Shell"
credit = "Terminix Dark (colours of the Ptyxis built-in 'Terminix Dark'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Terminix%20Dark.yml)"
ptyxis = "Terminix Dark"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Terminix Dark' (bulk-built by tools/bulk-scheme.py)."
default_accent = "green"

[dark]
bg_deep = "#091116"
fg = "#868a8c"
selection = "#22292e"   # DERIVED
red = "#a54242"
orange = "#c26a50"   # DERIVED
yellow = "#de935f"
green = "#a1b56c"
cyan = "#5e8d87"
blue = "#225555"
magenta = "#85678f"
purple = "#85678f"   # = magenta
# palette Color8 (bright black) = #373b41: a candidate for `comment`
[dark.ansi]
red = "#a54242"
green = "#a1b56c"
yellow = "#de935f"
blue = "#225555"
magenta = "#85678f"
cyan = "#5e8d87"
[dark.terminal]
source = "Terminix Dark"   # Ptyxis built-in id
black = "#282a2e"   # Ptyxis Color0
white = "#777777"   # Ptyxis Color7
bright_black = "#373b41"   # Ptyxis Color8
bright_red = "#c63535"   # Ptyxis Color9
bright_green = "#608360"   # Ptyxis Color10
bright_yellow = "#fa805a"   # Ptyxis Color11
bright_blue = "#449da1"   # Ptyxis Color12
bright_magenta = "#ba8baf"   # Ptyxis Color13
bright_cyan = "#86c1b9"   # Ptyxis Color14
bright_white = "#c5c8c6"   # Ptyxis Color15
