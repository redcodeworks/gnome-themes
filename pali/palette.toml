# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #232e37 5.5% towards fg
# derived: dark.surface derived: #232e37 16.0% towards fg
# derived: dark.surface_high derived: #232e37 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #8fab75 (it equals the default accent; keeps accent tokens unique)
title = "Pali"
gtk_name = "Pali"
shell_name = "Pali-Shell"
credit = "Pali (colours of the Ptyxis built-in 'Pali'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Pali.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#232e37"],[53,"#2d3841"],[66,"#404b55"],
        [91,"#56626b"],[145,"#7a8691"],[238,"#d9e6f2"],[255,"#d9e6f2"]]
fg = "#d9e6f2"
top = "#d9e6f2"
accent_fg = "#232e37"
view = "#232e37"
[dark.fam]
blue = ["#15539e","#8fab74"]
red = ["#cc0000","#ab8f74"]
orange = ["#f57900","#8fab75"]
green = ["#4e9a06","#74ab8f"]
[dark.exact]
"#26ab62" = "#74ab8f"
"#26a269" = "#74ab8f"      # GTK4 stock success green
"#3584e4" = "#8fab74"
"#eeeeec" = "#d9e6f2"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#232e37"],[34.67,"#232e37"],[55.33,"#2d3841"],[66.33,"#404b55"],
        [86.67,"#56626b"],[156,"#a5b2bd"],[179,"#a5b2bd"],[250,"#d9e6f2"],
        [255,"#d9e6f2"]]
fg = "#d9e6f2"
top = "#d9e6f2"
accent_fg = "#232e37"
view = "#232e37"
[shell.dark.fam]
blue = ["#3584e4","#8fab74"]
red = ["#c01c28","#ab8f74"]
orange = ["#ff7800","#9d9d74"]
green = ["#26a269","#74ab8f"]
[shell.dark.exact]
"#cd9309" = "#8fab75"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a5b2bd"      # web-login title, dim text
"#54545a" = "#404b55"      # notification/message card: surface
"#45454a" = "#36424b"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ab8f74"
fg = "#232e37"
[accents.dark.green]
color = "#74ab8f"
fg = "#232e37"
[accents.dark.yellow]
color = "#8fab74"
fg = "#232e37"
[accents.dark.blue]
color = "#8f74ab"
fg = "#232e37"
[accents.dark.magenta]
color = "#ab748f"
fg = "#232e37"
[accents.dark.cyan]
color = "#748fab"
fg = "#232e37"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#232e37"
bg = "#2d3841"
surface = "#404b55"
surface_high = "#56626b"
popover = "#56626b"
fg = "#d9e6f2"
red = "#ab8f74"
green = "#74ab8f"
yellow = "#8fab75"
accent = "#8fab74"
accent_fg = "#232e37"
warning_fg = "#232e37"
secondary_sidebar = "#2d3841"
