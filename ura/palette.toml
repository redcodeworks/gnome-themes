# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: light.bg derived: #feffee 3.0% towards fg
# derived: light.surface derived: #feffee 6.0% towards fg
# derived: light.surface_high derived: #feffee 9.0% towards fg
# derived: light.fg_dim derived: fg 30% towards bg
# derived: light.comment derived: fg 55% towards bg
# derived: light.accent_fg #feffee -> #fefff6 (the text colour varies per accent: the default needs its own token)
title = "Ura"
gtk_name = "Ura"
shell_name = "Ura-Shell"
credit = "Ura (colours of the Ptyxis built-in 'Ura'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Ura.yml)"
default_accent = "magenta"
dark_only = false
light_only = true

[light]
ramp = [[0,"#23476a"],[46,"#23476a"],[145,"#98a9b0"],[224,"#eaeee2"],
        [237,"#f1f4e6"],[246,"#f7f9ea"],[255,"#feffee"]]
fg = "#23476a"
top = "#feffee"
accent_fg = "#fefff6"
view = "#feffee"
[light.fam]
blue = ["#3584e4","#6f1bc2"]
red = ["#cc0000","#c21b6f"]
orange = ["#f57900","#c26f1b"]
green = ["#4e9a06","#6fc21b"]
[light.exact]
"#33d17a" = "#6fc21b"
"#2ec27e" = "#6fc21b"      # GTK4 stock success green (light)
"#2e3436" = "#23476a"
"#f6f5f4" = "#f7f9ea"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#23476a"],[46,"#23476a"],[145,"#98a9b0"],[224,"#eaeee2"],
        [237,"#f1f4e6"],[250,"#feffee"],[255,"#feffee"]]
fg = "#23476a"
top = "#feffee"
accent_fg = "#fefff6"
view = "#feffee"
[shell.light.fam]
blue = ["#3584e4","#6f1bc2"]
red = ["#c01c28","#c21b6f"]
orange = ["#e66100","#c24545"]
green = ["#26a269","#6fc21b"]
[shell.light.exact]
"#e5a50a" = "#c26f1b"      # warning yellow
"#a5a5b7" = "#98a9b0"

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.light.red]
color = "#c21b6f"
fg = "#fefff6"
[accents.light.green]
color = "#6fc21b"
fg = "#23476a"
[accents.light.yellow]
color = "#c26f1b"
fg = "#fefff6"
[accents.light.blue]
color = "#1b6fc2"
fg = "#fefff6"
[accents.light.magenta]
color = "#6f1bc2"
fg = "#fefff6"
[accents.light.cyan]
color = "#1bc26f"
fg = "#23476a"

# roles for tools/libadwaita-gen.py
[roles.light]
bg_deep = "#feffee"
bg = "#f7f9ea"
surface = "#f1f4e6"
surface_high = "#eaeee2"
popover = "#feffee"
fg = "#23476a"
red = "#c21b6f"
green = "#6fc21b"
yellow = "#c26f1b"
accent = "#6f1bc2"
