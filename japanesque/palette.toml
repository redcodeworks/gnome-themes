# derived: dark.bg derived: #1e1e1e 5.5% towards fg
# derived: dark.surface derived: #1e1e1e 16.0% towards fg
# derived: dark.surface_high derived: #1e1e1e 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
