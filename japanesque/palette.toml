red = ["#cc0000","#cf3f61"]
orange = ["#f57900","#e9b32b"]
green = ["#4e9a06","#7bb75b"]
[dark.exact]
"#26ab62" = "#7bb75b"
"#26a269" = "#7bb75b"      # GTK4 stock success green
"#3584e4" = "#e9b32a"
"#eeeeec" = "#f7f6ec"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
