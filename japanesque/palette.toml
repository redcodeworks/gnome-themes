title = "Japanesque"
gtk_name = "Japanesque"
shell_name = "Japanesque-Shell"
credit = "Japanesque (colours of the Ptyxis built-in 'Japanesque'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Japanesque.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
