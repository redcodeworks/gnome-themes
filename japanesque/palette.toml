ramp = [[0,"#1e1e1e"],[34.67,"#1e1e1e"],[55.33,"#2a2a29"],[66.33,"#41413f"],
        [86.67,"#5b5a58"],[156,"#bab9b2"],[179,"#bab9b2"],[250,"#f7f6ec"],
        [255,"#f7f6ec"]]
fg = "#f7f6ec"
top = "#f7f6ec"
accent_fg = "#1e1e26"
view = "#1e1e1e"
[shell.dark.fam]
blue = ["#3584e4","#e9b32a"]
red = ["#c01c28","#cf3f61"]
orange = ["#ff7800","#dc7946"]
green = ["#26a269","#7bb75b"]
[shell.dark.exact]
"#cd9309" = "#e9b32b"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#bab9b2"      # web-login title, dim text
"#54545a" = "#41413f"      # notification/message card: surface
"#45454a" = "#363634"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
