title = "Vs Code"
gtk_name = "Vs-Code"
shell_name = "Vs-Code-Shell"
credit = "Vs Code (colours of the Ptyxis built-in 'Vs Code'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Vs%20Code%20Light+.yml)"
default_accent = "green"
dark_only = false
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1e1e1e"],[53,"#282828"],[66,"#3a3a3a"],
        [91,"#4f4f4f"],[145,"#727272"],[238,"#cccccc"],[255,"#cccccc"]]
fg = "#cccccc"
top = "#cccccc"
accent_fg = "#1e1e1e"
view = "#1e1e1e"
[dark.fam]
blue = ["#15539e","#39e9a8"]
red = ["#cc0000","#e9653b"]
orange = ["#f57900","#e5b684"]
green = ["#4e9a06","#39e9a9"]
[dark.exact]
"#26ab62" = "#39e9a9"
"#26a269" = "#39e9a9"      # GTK4 stock success green
"#3584e4" = "#39e9a8"
"#eeeeec" = "#cccccc"

[light]
ramp = [[0,"#020202"],[46,"#020202"],[145,"#868686"],[224,"#e3e3e3"],
        [237,"#eaeaea"],[246,"#f2f2f2"],[255,"#f9f9f9"]]
fg = "#020202"
top = "#f9f9f9"
accent_fg = "#02020a"
view = "#f9f9f9"
[light.fam]
blue = ["#3584e4","#00bc00"]
red = ["#cc0000","#cd3232"]
orange = ["#f57900","#a5a900"]
green = ["#4e9a06","#00bc01"]
[light.exact]
"#33d17a" = "#00bc01"
"#2ec27e" = "#00bc01"      # GTK4 stock success green (light)
"#2e3436" = "#020202"
"#f6f5f4" = "#f2f2f2"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1e1e1e"],[34.67,"#1e1e1e"],[55.33,"#282828"],[66.33,"#3a3a3a"],
        [86.67,"#4f4f4f"],[156,"#9b9b9b"],[179,"#9b9b9b"],[250,"#cccccc"],
        [255,"#cccccc"]]
fg = "#cccccc"
top = "#cccccc"
accent_fg = "#1e1e1e"
view = "#1e1e1e"
[shell.dark.fam]
blue = ["#3584e4","#39e9a8"]
red = ["#c01c28","#e9653b"]
orange = ["#ff7800","#e78e60"]
green = ["#26a269","#39e9a9"]
[shell.dark.exact]
"#cd9309" = "#e5b684"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9b9b9b"      # web-login title, dim text
"#54545a" = "#3a3a3a"      # notification/message card: surface
"#45454a" = "#313131"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#020202"],[46,"#020202"],[145,"#868686"],[224,"#e3e3e3"],
        [237,"#eaeaea"],[250,"#f9f9f9"],[255,"#f9f9f9"]]
fg = "#020202"
top = "#f9f9f9"
accent_fg = "#02020a"
view = "#f9f9f9"
[shell.light.fam]
blue = ["#3584e4","#00bc00"]
red = ["#c01c28","#cd3232"]
orange = ["#e66100","#b96e19"]
green = ["#26a269","#00bc01"]
[shell.light.exact]
"#e5a50a" = "#a5a900"      # warning yellow
"#a5a5b7" = "#868686"

