# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #000000 5.5% towards fg
# derived: dark.surface derived: #000000 16.0% towards fg
# derived: dark.surface_high derived: #000000 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #000000 -> #000008 (the text colour varies per accent: the default needs its own token)
# derived: dark.green nudged to #ccff05 (it equals the default accent; keeps accent tokens unique)
title = "Vibrant Ink"
gtk_name = "Vibrant-Ink"
shell_name = "Vibrant-Ink-Shell"
credit = "Vibrant Ink (colours of the Ptyxis built-in 'Vibrant Ink'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Vibrant%20Ink.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#000000"],[53,"#0e0e0e"],[66,"#292929"],
        [91,"#474747"],[145,"#7a7a7a"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#000008"
view = "#000000"
[dark.fam]
blue = ["#15539e","#ccff04"]
red = ["#cc0000","#ff6600"]
orange = ["#f57900","#ffcc00"]
green = ["#4e9a06","#ccff05"]
[dark.exact]
"#26ab62" = "#ccff05"
"#26a269" = "#ccff05"      # GTK4 stock success green
"#3584e4" = "#ccff04"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#000000"],[34.67,"#000000"],[55.33,"#0e0e0e"],[66.33,"#292929"],
        [86.67,"#474747"],[156,"#b7b7b7"],[179,"#b7b7b7"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#000008"
view = "#000000"
[shell.dark.fam]
blue = ["#3584e4","#ccff04"]
red = ["#c01c28","#ff6600"]
orange = ["#ff7800","#ff9900"]
green = ["#26a269","#ccff05"]
[shell.dark.exact]
"#cd9309" = "#ffcc00"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b7b7b7"      # web-login title, dim text
"#54545a" = "#292929"      # notification/message card: surface
"#45454a" = "#1c1c1c"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff6600"
fg = "#000008"
[accents.dark.green]
color = "#ccff04"
fg = "#000008"
[accents.dark.yellow]
color = "#ffcc00"
fg = "#000008"
[accents.dark.blue]
color = "#44b4cc"
fg = "#000008"
[accents.dark.magenta]
color = "#9933cc"
fg = "#ffffff"
[accents.dark.cyan]
color = "#44b4cc"
fg = "#000008"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#000000"
bg = "#0e0e0e"
surface = "#292929"
surface_high = "#474747"
popover = "#474747"
fg = "#ffffff"
red = "#ff6600"
green = "#ccff05"
yellow = "#ffcc00"
accent = "#ccff04"
accent_fg = "#000008"
warning_fg = "#000000"
secondary_sidebar = "#0e0e0e"
