# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #1f1726 5.5% towards fg
# derived: dark.surface derived: #1f1726 16.0% towards fg
# derived: dark.surface_high derived: #1f1726 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #1f1726 -> #1f172e (the text colour varies per accent: the default needs its own token)
title = "Wild Cherry"
gtk_name = "Wild-Cherry"
shell_name = "Wild-Cherry-Shell"
credit = "Wild Cherry (colours of the Ptyxis built-in 'Wild Cherry'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Wild%20Cherry.yml)"
default_accent = "magenta"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1f1726"],[53,"#292332"],[66,"#3d3b49"],
        [91,"#535763"],[145,"#79848e"],[238,"#dafaff"],[255,"#dafaff"]]
fg = "#dafaff"
top = "#dafaff"
accent_fg = "#1f172e"
view = "#1f1726"
[dark.fam]
blue = ["#15539e","#ececec"]
red = ["#cc0000","#d94085"]
orange = ["#f57900","#ffd16f"]
green = ["#4e9a06","#2ab250"]
[dark.exact]
"#26ab62" = "#2ab250"
"#26a269" = "#2ab250"      # GTK4 stock success green
"#3584e4" = "#ececec"
"#eeeeec" = "#dafaff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1f1726"],[34.67,"#1f1726"],[55.33,"#292332"],[66.33,"#3d3b49"],
        [86.67,"#535763"],[156,"#a5bac2"],[179,"#a5bac2"],[250,"#dafaff"],
        [255,"#dafaff"]]
fg = "#dafaff"
top = "#dafaff"
accent_fg = "#1f172e"
view = "#1f1726"
[shell.dark.fam]
blue = ["#3584e4","#ececec"]
red = ["#c01c28","#d94085"]
orange = ["#ff7800","#ec887a"]
green = ["#26a269","#2ab250"]
[shell.dark.exact]
"#cd9309" = "#ffd16f"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a5bac2"      # web-login title, dim text
"#54545a" = "#3d3b49"      # notification/message card: surface
"#45454a" = "#332f3e"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#d94085"
fg = "#1f172e"
[accents.dark.green]
color = "#2ab250"
fg = "#1f172e"
[accents.dark.yellow]
color = "#ffd16f"
fg = "#1f172e"
[accents.dark.blue]
color = "#883cdc"
fg = "#dafaff"
[accents.dark.magenta]
color = "#ececec"
fg = "#1f172e"
[accents.dark.cyan]
color = "#c1b8b7"
fg = "#1f172e"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#1f1726"
bg = "#292332"
surface = "#3d3b49"
surface_high = "#535763"
popover = "#535763"
fg = "#dafaff"
red = "#d94085"
green = "#2ab250"
yellow = "#ffd16f"
accent = "#ececec"
accent_fg = "#1f172e"
warning_fg = "#1f1726"
secondary_sidebar = "#292332"
