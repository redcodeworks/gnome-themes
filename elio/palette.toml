# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #041a3b 5.5% towards fg
# derived: dark.surface derived: #041a3b 16.0% towards fg
# derived: dark.surface_high derived: #041a3b 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #ffc006 (it equals the default accent; keeps accent tokens unique)
title = "Elio"
gtk_name = "Elio"
shell_name = "Elio-Shell"
credit = "Elio (colours of the Ptyxis built-in 'Elio'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Elio.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#041a3b"],[53,"#112645"],[66,"#2a3d58"],
        [91,"#47566e"],[145,"#768293"],[238,"#f2f2f2"],[255,"#f2f2f2"]]
fg = "#f2f2f2"
top = "#f2f2f2"
accent_fg = "#041a3b"
view = "#041a3b"
[dark.fam]
blue = ["#15539e","#ffc005"]
red = ["#cc0000","#e1321a"]
orange = ["#f57900","#ffc006"]
green = ["#4e9a06","#6ab017"]
[dark.exact]
"#26ab62" = "#6ab017"
"#26a269" = "#6ab017"      # GTK4 stock success green
"#3584e4" = "#ffc005"
"#eeeeec" = "#f2f2f2"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#041a3b"],[34.67,"#041a3b"],[55.33,"#112645"],[66.33,"#2a3d58"],
        [86.67,"#47566e"],[156,"#aeb5be"],[179,"#aeb5be"],[250,"#f2f2f2"],
        [255,"#f2f2f2"]]
fg = "#f2f2f2"
top = "#f2f2f2"
accent_fg = "#041a3b"
view = "#041a3b"
[shell.dark.fam]
blue = ["#3584e4","#ffc005"]
red = ["#c01c28","#e1321a"]
orange = ["#ff7800","#f07910"]
green = ["#26a269","#6ab017"]
[shell.dark.exact]
"#cd9309" = "#ffc006"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#aeb5be"      # web-login title, dim text
"#54545a" = "#2a3d58"      # notification/message card: surface
"#45454a" = "#1e324e"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#e1321a"
fg = "#041a3b"
[accents.dark.green]
color = "#6ab017"
fg = "#041a3b"
[accents.dark.yellow]
color = "#ffc005"
fg = "#041a3b"
[accents.dark.blue]
color = "#729fcf"
fg = "#041a3b"
[accents.dark.magenta]
color = "#ec0048"
fg = "#041a3b"
[accents.dark.cyan]
color = "#2aa7e7"
fg = "#041a3b"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#041a3b"
bg = "#112645"
surface = "#2a3d58"
surface_high = "#47566e"
popover = "#47566e"
fg = "#f2f2f2"
red = "#e1321a"
green = "#6ab017"
yellow = "#ffc006"
accent = "#ffc005"
accent_fg = "#041a3b"
warning_fg = "#041a3b"
secondary_sidebar = "#112645"
