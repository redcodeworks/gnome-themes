# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: light.bg derived: #ffffff 3.0% towards fg
# derived: light.surface derived: #ffffff 6.0% towards fg
# derived: light.surface_high derived: #ffffff 9.0% towards fg
# derived: light.fg_dim derived: fg 30% towards bg
# derived: light.comment derived: fg 55% towards bg
# derived: light.accent_fg #ffffff -> #fffff7 (the text colour varies per accent: the default needs its own token)
title = "Clrs"
gtk_name = "Clrs"
shell_name = "Clrs-Shell"
credit = "Clrs (colours of the Ptyxis built-in 'Clrs'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Clrs.yml)"
default_accent = "magenta"
dark_only = false
light_only = true

[light]
ramp = [[0,"#262626"],[46,"#262626"],[145,"#9a9a9a"],[224,"#ebebeb"],
        [237,"#f2f2f2"],[246,"#f8f8f8"],[255,"#ffffff"]]
fg = "#262626"
top = "#ffffff"
accent_fg = "#fffff7"
view = "#ffffff"
[light.fam]
blue = ["#3584e4","#9f00bd"]
red = ["#cc0000","#f8282a"]
orange = ["#f57900","#fa701d"]
green = ["#4e9a06","#328a5d"]
[light.exact]
"#33d17a" = "#328a5d"
"#2ec27e" = "#328a5d"      # GTK4 stock success green (light)
"#2e3436" = "#262626"
"#f6f5f4" = "#f8f8f8"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#262626"],[46,"#262626"],[145,"#9a9a9a"],[224,"#ebebeb"],
        [237,"#f2f2f2"],[250,"#ffffff"],[255,"#ffffff"]]
fg = "#262626"
top = "#ffffff"
accent_fg = "#fffff7"
view = "#ffffff"
[shell.light.fam]
blue = ["#3584e4","#9f00bd"]
red = ["#c01c28","#f8282a"]
orange = ["#e66100","#f94c24"]
green = ["#26a269","#328a5d"]
[shell.light.exact]
"#e5a50a" = "#fa701d"      # warning yellow
"#a5a5b7" = "#9a9a9a"

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.light.red]
color = "#f8282a"
fg = "#fffff7"
[accents.light.green]
color = "#328a5d"
fg = "#fffff7"
[accents.light.yellow]
color = "#fa701d"
fg = "#262626"
[accents.light.blue]
color = "#135cd0"
fg = "#fffff7"
[accents.light.magenta]
color = "#9f00bd"
fg = "#fffff7"
[accents.light.cyan]
color = "#33c3c1"
fg = "#262626"

# roles for tools/libadwaita-gen.py
[roles.light]
bg_deep = "#ffffff"
bg = "#f8f8f8"
surface = "#f2f2f2"
surface_high = "#ebebeb"
popover = "#ffffff"
fg = "#262626"
red = "#f8282a"
green = "#328a5d"
yellow = "#fa701d"
accent = "#9f00bd"
accent_fg = "#fffff7"
warning_fg = "#262626"
secondary_sidebar = "#f5f5f5"
