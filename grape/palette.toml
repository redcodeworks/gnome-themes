title = "Grape"
gtk_name = "Grape"
shell_name = "Grape-Shell"
credit = "Grape (colours of the Ptyxis built-in 'Grape'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Grape.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#171423"],[53,"#1e1c2a"],[66,"#2d2a37"],
        [91,"#3d3b46"],[145,"#585760"],[238,"#9f9fa1"],[255,"#9f9fa1"]]
