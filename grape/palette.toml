top = "#9f9fa1"
accent_fg = "#171423"
view = "#171423"
[dark.fam]
blue = ["#15539e","#3bdeed"]
red = ["#cc0000","#ed2261"]
orange = ["#f57900","#8ddc20"]
green = ["#4e9a06","#1fa91b"]
[dark.exact]
"#26ab62" = "#1fa91b"
"#26a269" = "#1fa91b"      # GTK4 stock success green
"#3584e4" = "#3bdeed"
"#eeeeec" = "#9f9fa1"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#171423"],[34.67,"#171423"],[55.33,"#1e1c2a"],[66.33,"#2d2a37"],
        [86.67,"#3d3b46"],[156,"#78787d"],[179,"#78787d"],[250,"#9f9fa1"],
        [255,"#9f9fa1"]]
fg = "#9f9fa1"
top = "#9f9fa1"
accent_fg = "#171423"
view = "#171423"
[shell.dark.fam]
blue = ["#3584e4","#3bdeed"]
red = ["#c01c28","#ed2261"]
orange = ["#ff7800","#bd7f40"]
green = ["#26a269","#1fa91b"]
[shell.dark.exact]
"#cd9309" = "#8ddc20"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#78787d"      # web-login title, dim text
"#54545a" = "#2d2a37"      # notification/message card: surface
"#45454a" = "#262330"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
