# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #012849 5.5% towards fg
# derived: dark.surface derived: #012849 16.0% towards fg
# derived: dark.surface_high derived: #012849 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.green nudged to #a9ee56 (it equals the default accent; keeps accent tokens unique)
title = "Bim"
gtk_name = "Bim"
shell_name = "Bim-Shell"
credit = "Bim (colours of the Ptyxis built-in 'Bim'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Bim.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#012849"],[53,"#0a3051"],[66,"#1c4060"],
        [91,"#305271"],[145,"#52708e"],[238,"#a9bed8"],[255,"#a9bed8"]]
fg = "#a9bed8"
top = "#a9bed8"
accent_fg = "#012849"
view = "#012849"
[dark.fam]
blue = ["#15539e","#a9ee55"]
red = ["#cc0000","#f557a0"]
orange = ["#f57900","#f5a255"]
green = ["#4e9a06","#a9ee56"]
[dark.exact]
"#26ab62" = "#a9ee56"
"#26a269" = "#a9ee56"      # GTK4 stock success green
"#3584e4" = "#a9ee55"
"#eeeeec" = "#a9bed8"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#012849"],[34.67,"#012849"],[55.33,"#0a3051"],[66.33,"#1c4060"],
        [86.67,"#305271"],[156,"#7993b0"],[179,"#7993b0"],[250,"#a9bed8"],
        [255,"#a9bed8"]]
fg = "#a9bed8"
top = "#a9bed8"
accent_fg = "#012849"
view = "#012849"
[shell.dark.fam]
blue = ["#3584e4","#a9ee55"]
red = ["#c01c28","#f557a0"]
orange = ["#ff7800","#f57c7a"]
green = ["#26a269","#a9ee56"]
[shell.dark.exact]
"#cd9309" = "#f5a255"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#7993b0"      # web-login title, dim text
"#54545a" = "#1c4060"      # notification/message card: surface
"#45454a" = "#133858"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#f557a0"
fg = "#012849"
[accents.dark.green]
