# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #222235 5.5% towards fg
# derived: dark.surface derived: #222235 16.0% towards fg
# derived: dark.surface_high derived: #222235 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #222235 -> #22223d (the text colour varies per accent: the default needs its own token)
# derived: dark.green nudged to #06c994 (it equals the default accent; keeps accent tokens unique)
title = "Sweet Terminal"
gtk_name = "Sweet-Terminal"
shell_name = "Sweet-Terminal-Shell"
credit = "Sweet Terminal (colours of the Ptyxis built-in 'Sweet Terminal'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Sweet%20Terminal.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#222235"],[53,"#2e2e40"],[66,"#454555"],
        [91,"#60606e"],[145,"#8c8c96"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#22223d"
view = "#222235"
[dark.fam]
blue = ["#15539e","#06c993"]
red = ["#cc0000","#f60055"]
orange = ["#f57900","#9700be"]
green = ["#4e9a06","#06c994"]
[dark.exact]
"#26ab62" = "#06c994"
"#26a269" = "#06c994"      # GTK4 stock success green
"#3584e4" = "#06c993"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#222235"],[34.67,"#222235"],[55.33,"#2e2e40"],[66.33,"#454555"],
        [86.67,"#60606e"],[156,"#c0c0c6"],[179,"#c0c0c6"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#22223d"
view = "#222235"
[shell.dark.fam]
blue = ["#3584e4","#06c993"]
red = ["#c01c28","#f60055"]
orange = ["#ff7800","#c6008a"]
green = ["#26a269","#06c994"]
[shell.dark.exact]
"#cd9309" = "#9700be"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c0c0c6"      # web-login title, dim text
"#54545a" = "#454555"      # notification/message card: surface
"#45454a" = "#3a3a4a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#f60055"
fg = "#ffffff"
[accents.dark.green]
color = "#06c993"
fg = "#22223d"
[accents.dark.yellow]
color = "#9700be"
fg = "#ffffff"
[accents.dark.blue]
color = "#f69154"
fg = "#22223d"
[accents.dark.magenta]
color = "#ec89cb"
fg = "#22223d"
[accents.dark.cyan]
color = "#60adec"
fg = "#22223d"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#222235"
bg = "#2e2e40"
surface = "#454555"
surface_high = "#60606e"
popover = "#60606e"
fg = "#ffffff"
red = "#f60055"
green = "#06c994"
yellow = "#9700be"
accent = "#06c993"
accent_fg = "#22223d"
warning_fg = "#ffffff"
secondary_sidebar = "#2e2e40"
