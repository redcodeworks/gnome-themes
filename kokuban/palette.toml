title = "Kokuban"
gtk_name = "Kokuban"
shell_name = "Kokuban-Shell"
credit = "Kokuban (colours of the Ptyxis built-in 'Kokuban'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Kokuban.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#0d4a08"],[53,"#185213"],[66,"#2d6229"],
        [91,"#467542"],[145,"#6e936b"],[238,"#d8e2d7"],[255,"#d8e2d7"]]
fg = "#d8e2d7"
top = "#d8e2d7"
accent_fg = "#0d4a10"
view = "#0d4a08"
[dark.fam]
blue = ["#15539e","#d6e264"]
red = ["#cc0000","#d84e4c"]
orange = ["#f57900","#d6e265"]
green = ["#4e9a06","#95da5a"]
[dark.exact]
"#26ab62" = "#95da5a"
"#26a269" = "#95da5a"      # GTK4 stock success green
"#3584e4" = "#d6e264"
"#eeeeec" = "#d8e2d7"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#0d4a08"],[34.67,"#0d4a08"],[55.33,"#185213"],[66.33,"#2d6229"],
        [86.67,"#467542"],[156,"#9eb79c"],[179,"#9eb79c"],[250,"#d8e2d7"],
        [255,"#d8e2d7"]]
fg = "#d8e2d7"
top = "#d8e2d7"
accent_fg = "#0d4a10"
view = "#0d4a08"
[shell.dark.fam]
blue = ["#3584e4","#d6e264"]
red = ["#c01c28","#d84e4c"]
orange = ["#ff7800","#d79858"]
green = ["#26a269","#95da5a"]
[shell.dark.exact]
"#cd9309" = "#d6e265"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9eb79c"      # web-login title, dim text
"#54545a" = "#2d6229"      # notification/message card: surface
"#45454a" = "#225a1e"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
