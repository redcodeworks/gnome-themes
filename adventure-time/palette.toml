title = "Adventure Time"
gtk_name = "Adventure-Time"
shell_name = "Adventure-Time-Shell"
credit = "Adventure Time (colours of the Ptyxis built-in 'Adventure Time'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Adventure%20Time.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1f1d45"],[53,"#2b284c"],[66,"#423c59"],
        [91,"#5c5267"],[145,"#877980"],[238,"#f8dcc0"],[255,"#f8dcc0"]]
fg = "#f8dcc0"
top = "#f8dcc0"
accent_fg = "#1f1d4d"
view = "#1f1d45"
[dark.fam]
blue = ["#15539e","#4ab118"]
red = ["#cc0000","#bd0013"]
orange = ["#f57900","#e7741e"]
green = ["#4e9a06","#4ab119"]
[dark.exact]
"#26ab62" = "#4ab119"
"#26a269" = "#4ab119"      # GTK4 stock success green
"#3584e4" = "#4ab118"
"#eeeeec" = "#f8dcc0"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1f1d45"],[34.67,"#1f1d45"],[55.33,"#2b284c"],[66.33,"#423c59"],
        [86.67,"#5c5267"],[156,"#baa69d"],[179,"#baa69d"],[250,"#f8dcc0"],
        [255,"#f8dcc0"]]
fg = "#f8dcc0"
top = "#f8dcc0"
accent_fg = "#1f1d4d"
view = "#1f1d45"
[shell.dark.fam]
blue = ["#3584e4","#4ab118"]
red = ["#c01c28","#bd0013"]
orange = ["#ff7800","#d23a18"]
green = ["#26a269","#4ab119"]
[shell.dark.exact]
"#cd9309" = "#e7741e"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#baa69d"      # web-login title, dim text
"#54545a" = "#423c59"      # notification/message card: surface
"#45454a" = "#363252"      # message card stacked behind the front one: bg and surface mixed 50 %

