# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: light.bg derived: #d5d6db 3.0% towards fg
# derived: light.surface derived: #d5d6db 6.0% towards fg
# derived: light.surface_high derived: #d5d6db 9.0% towards fg
# derived: light.fg_dim derived: fg 30% towards bg
# derived: light.comment derived: fg 55% towards bg
title = "Tokyo Night Light"
gtk_name = "Tokyo-Night-Light"
shell_name = "Tokyo-Night-Light-Shell"
credit = "Tokyo Night Light (colours of the Ptyxis built-in 'Tokyo Night Light'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Tokyo%20Night%20Light.yml)"
default_accent = "cyan"
dark_only = false
light_only = true

[light]
ramp = [[0,"#565a6e"],[46,"#565a6e"],[145,"#9a9ca8"],[224,"#cacbd1"],
        [237,"#cdcfd4"],[246,"#d1d2d8"],[255,"#d5d6db"]]
fg = "#565a6e"
top = "#d5d6db"
accent_fg = "#d5d6db"
view = "#d5d6db"
[light.fam]
blue = ["#3584e4","#0f4b6e"]
red = ["#cc0000","#8c4351"]
orange = ["#f57900","#8f5e15"]
green = ["#4e9a06","#485e30"]
[light.exact]
"#33d17a" = "#485e30"
"#2ec27e" = "#485e30"      # GTK4 stock success green (light)
"#2e3436" = "#565a6e"
"#f6f5f4" = "#d1d2d8"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#565a6e"],[46,"#565a6e"],[145,"#9a9ca8"],[224,"#cacbd1"],
        [237,"#cdcfd4"],[250,"#d5d6db"],[255,"#d5d6db"]]
fg = "#565a6e"
top = "#d5d6db"
accent_fg = "#d5d6db"
view = "#d5d6db"
[shell.light.fam]
blue = ["#3584e4","#0f4b6e"]
red = ["#c01c28","#8c4351"]
orange = ["#e66100","#8e5033"]
green = ["#26a269","#485e30"]
[shell.light.exact]
"#e5a50a" = "#8f5e15"      # warning yellow
"#a5a5b7" = "#9a9ca8"

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.light.red]
color = "#8c4351"
fg = "#d5d6db"
[accents.light.green]
color = "#485e30"
fg = "#d5d6db"
[accents.light.yellow]
color = "#8f5e15"
fg = "#d5d6db"
[accents.light.blue]
color = "#34548a"
fg = "#d5d6db"
[accents.light.magenta]
color = "#5a4a78"
fg = "#d5d6db"
[accents.light.cyan]
color = "#0f4b6e"
fg = "#d5d6db"

# roles for tools/libadwaita-gen.py
[roles.light]
bg_deep = "#d5d6db"
bg = "#d1d2d8"
surface = "#cdcfd4"
surface_high = "#cacbd1"
popover = "#d5d6db"
fg = "#565a6e"
red = "#8c4351"
green = "#485e30"
yellow = "#8f5e15"
accent = "#0f4b6e"
accent_fg = "#d5d6db"
warning_fg = "#d5d6db"
secondary_sidebar = "#cfd0d6"
