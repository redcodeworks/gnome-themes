# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #20242d 5.5% towards fg
# derived: dark.surface derived: #20242d 16.0% towards fg
# derived: dark.surface_high derived: #20242d 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.green nudged to #7efdd1 (it equals the default accent; keeps accent tokens unique)
title = "Neon Night"
gtk_name = "Neon-Night"
shell_name = "Neon-Night-Shell"
credit = "Neon Night (colours of the Ptyxis built-in 'Neon Night'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Neon%20Night.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#20242d"],[53,"#292d39"],[66,"#3b3e4f"],
        [91,"#4f5268"],[145,"#707392"],[238,"#c7c8ff"],[255,"#c7c8ff"]]
fg = "#c7c8ff"
top = "#c7c8ff"
accent_fg = "#20242d"
view = "#20242d"
[dark.fam]
blue = ["#15539e","#7efdd0"]
red = ["#cc0000","#ff8e8e"]
orange = ["#f57900","#fcad3f"]
green = ["#4e9a06","#7efdd1"]
[dark.exact]
"#26ab62" = "#7efdd1"
"#26a269" = "#7efdd1"      # GTK4 stock success green
"#3584e4" = "#7efdd0"
"#eeeeec" = "#c7c8ff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#20242d"],[34.67,"#20242d"],[55.33,"#292d39"],[66.33,"#3b3e4f"],
        [86.67,"#4f5268"],[156,"#989ac4"],[179,"#989ac4"],[250,"#c7c8ff"],
        [255,"#c7c8ff"]]
fg = "#c7c8ff"
top = "#c7c8ff"
accent_fg = "#20242d"
view = "#20242d"
[shell.dark.fam]
blue = ["#3584e4","#7efdd0"]
red = ["#c01c28","#ff8e8e"]
orange = ["#ff7800","#fe9e66"]
green = ["#26a269","#7efdd1"]
[shell.dark.exact]
"#cd9309" = "#fcad3f"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#989ac4"      # web-login title, dim text
"#54545a" = "#3b3e4f"      # notification/message card: surface
"#45454a" = "#323644"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff8e8e"
fg = "#20242d"
[accents.dark.green]
color = "#7efdd0"
fg = "#20242d"
[accents.dark.yellow]
color = "#fcad3f"
fg = "#20242d"
[accents.dark.blue]
color = "#69b4f9"
fg = "#20242d"
[accents.dark.magenta]
color = "#dd92f6"
fg = "#20242d"
[accents.dark.cyan]
color = "#8ce8ff"
fg = "#20242d"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#20242d"
bg = "#292d39"
surface = "#3b3e4f"
surface_high = "#4f5268"
popover = "#4f5268"
fg = "#c7c8ff"
red = "#ff8e8e"
green = "#7efdd1"
yellow = "#fcad3f"
accent = "#7efdd0"
accent_fg = "#20242d"
warning_fg = "#20242d"
secondary_sidebar = "#292d39"
