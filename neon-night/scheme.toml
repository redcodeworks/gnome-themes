# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Neon Night'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Neon%20Night.yml.
title = "Neon Night"
gtk_name = "Neon-Night"
shell_name = "Neon-Night-Shell"
credit = "Neon Night (colours of the Ptyxis built-in 'Neon Night'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Neon%20Night.yml)"
ptyxis = "Neon Night"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Neon Night' (bulk-built by tools/bulk-scheme.py)."
default_accent = "green"

[dark]
bg_deep = "#20242d"
fg = "#c7c8ff"
selection = "#414557"   # DERIVED
red = "#ff8e8e"
orange = "#fe9e66"   # DERIVED
yellow = "#fcad3f"
green = "#7efdd0"
cyan = "#8ce8ff"
blue = "#69b4f9"
magenta = "#dd92f6"
purple = "#dd92f6"   # = magenta
# palette Color8 (bright black) = #20242d: a candidate for `comment`
[dark.ansi]
red = "#ff8e8e"
green = "#7efdd0"
yellow = "#fcad3f"
blue = "#69b4f9"
magenta = "#dd92f6"
cyan = "#8ce8ff"
[dark.terminal]
source = "Neon Night"   # Ptyxis built-in id
black = "#20242d"   # Ptyxis Color0
white = "#c9cccd"   # Ptyxis Color7
bright_black = "#20242d"   # Ptyxis Color8
bright_white = "#c9cccd"   # Ptyxis Color15
