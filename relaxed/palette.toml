# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #353a44 5.5% towards fg
# derived: dark.surface derived: #353a44 16.0% towards fg
# derived: dark.surface_high derived: #353a44 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #353a44 -> #353a4c (the text colour varies per accent: the default needs its own token)
title = "Relaxed"
gtk_name = "Relaxed"
shell_name = "Relaxed-Shell"
credit = "Relaxed (colours of the Ptyxis built-in 'Relaxed'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Relaxed.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#353a44"],[53,"#3e434c"],[66,"#4f535c"],
        [91,"#63676e"],[145,"#84868b"],[238,"#d9d9d9"],[255,"#d9d9d9"]]
fg = "#d9d9d9"
top = "#d9d9d9"
accent_fg = "#353a4c"
view = "#353a44"
[dark.fam]
blue = ["#15539e","#c9dfff"]
red = ["#cc0000","#bc5653"]
orange = ["#f57900","#ebc17a"]
green = ["#4e9a06","#909d63"]
[dark.exact]
"#26ab62" = "#909d63"
"#26a269" = "#909d63"      # GTK4 stock success green
"#3584e4" = "#c9dfff"
"#eeeeec" = "#d9d9d9"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#353a44"],[34.67,"#353a44"],[55.33,"#3e434c"],[66.33,"#4f535c"],
        [86.67,"#63676e"],[156,"#aaacaf"],[179,"#aaacaf"],[250,"#d9d9d9"],
        [255,"#d9d9d9"]]
fg = "#d9d9d9"
top = "#d9d9d9"
accent_fg = "#353a4c"
view = "#353a44"
[shell.dark.fam]
blue = ["#3584e4","#c9dfff"]
red = ["#c01c28","#bc5653"]
orange = ["#ff7800","#d48c66"]
green = ["#26a269","#909d63"]
[shell.dark.exact]
"#cd9309" = "#ebc17a"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#aaacaf"      # web-login title, dim text
"#54545a" = "#4f535c"      # notification/message card: surface
"#45454a" = "#464b54"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#bc5653"
fg = "#d9d9d9"
[accents.dark.green]
color = "#909d63"
fg = "#353a4c"
[accents.dark.yellow]
color = "#ebc17a"
fg = "#353a4c"
[accents.dark.blue]
color = "#6a8799"
fg = "#353a4c"
[accents.dark.magenta]
color = "#b06698"
fg = "#353a4c"
[accents.dark.cyan]
color = "#c9dfff"
fg = "#353a4c"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#353a44"
bg = "#3e434c"
surface = "#4f535c"
surface_high = "#63676e"
popover = "#63676e"
fg = "#d9d9d9"
red = "#bc5653"
green = "#909d63"
yellow = "#ebc17a"
