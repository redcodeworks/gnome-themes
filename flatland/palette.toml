# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #1d1f21 5.5% towards fg
# derived: dark.surface derived: #1d1f21 16.0% towards fg
# derived: dark.surface_high derived: #1d1f21 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #1d1f21 -> #1d1f29 (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #f4ef6e (it equals the default accent; keeps accent tokens unique)
title = "Flatland"
gtk_name = "Flatland"
shell_name = "Flatland-Shell"
credit = "Flatland (colours of the Ptyxis built-in 'Flatland'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Flatland.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1d1f21"],[53,"#26292c"],[66,"#363d42"],
        [91,"#48545b"],[145,"#687984"],[238,"#b8dbef"],[255,"#b8dbef"]]
fg = "#b8dbef"
top = "#b8dbef"
accent_fg = "#1d1f29"
view = "#1d1f21"
[dark.fam]
blue = ["#15539e","#f4ef6d"]
red = ["#cc0000","#f18339"]
orange = ["#f57900","#f4ef6e"]
green = ["#4e9a06","#9fd364"]
[dark.exact]
"#26ab62" = "#9fd364"
"#26a269" = "#9fd364"      # GTK4 stock success green
"#3584e4" = "#f4ef6d"
"#eeeeec" = "#b8dbef"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1d1f21"],[34.67,"#1d1f21"],[55.33,"#26292c"],[66.33,"#363d42"],
        [86.67,"#48545b"],[156,"#8ca6b4"],[179,"#8ca6b4"],[250,"#b8dbef"],
        [255,"#b8dbef"]]
fg = "#b8dbef"
top = "#b8dbef"
accent_fg = "#1d1f29"
view = "#1d1f21"
[shell.dark.fam]
blue = ["#3584e4","#f4ef6d"]
red = ["#c01c28","#f18339"]
orange = ["#ff7800","#f2b953"]
green = ["#26a269","#9fd364"]
[shell.dark.exact]
"#cd9309" = "#f4ef6e"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#8ca6b4"      # web-login title, dim text
"#54545a" = "#363d42"      # notification/message card: surface
"#45454a" = "#2e3337"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#f18339"
fg = "#1d1f29"
[accents.dark.green]
color = "#9fd364"
fg = "#1d1f29"
[accents.dark.yellow]
color = "#f4ef6d"
fg = "#1d1f29"
[accents.dark.blue]
color = "#5096be"
fg = "#1d1f29"
[accents.dark.magenta]
color = "#695abc"
fg = "#b8dbef"
[accents.dark.cyan]
color = "#d63865"
fg = "#1d1f29"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#1d1f21"
bg = "#26292c"
surface = "#363d42"
surface_high = "#48545b"
popover = "#48545b"
fg = "#b8dbef"
red = "#f18339"
green = "#9fd364"
yellow = "#f4ef6e"
accent = "#f4ef6d"
