red = ["#cc0000","#e34c26"]
orange = ["#f57900","#ed9a51"]
green = ["#4e9a06","#238636"]
[dark.exact]
"#26ab62" = "#238636"
"#26a269" = "#238636"      # GTK4 stock success green
"#3584e4" = "#a5d6ff"
"#eeeeec" = "#c9d1d9"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#161b22"],[34.67,"#161b22"],[55.33,"#20252c"],[66.33,"#33383f"],
        [86.67,"#484e55"],[156,"#969da5"],[179,"#969da5"],[250,"#c9d1d9"],
        [255,"#c9d1d9"]]
fg = "#c9d1d9"
top = "#c9d1d9"
accent_fg = "#161b22"
view = "#161b22"
[shell.dark.fam]
blue = ["#3584e4","#a5d6ff"]
red = ["#c01c28","#e34c26"]
orange = ["#ff7800","#e8733c"]
green = ["#26a269","#238636"]
[shell.dark.exact]
"#cd9309" = "#ed9a51"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#969da5"      # web-login title, dim text
"#54545a" = "#33383f"      # notification/message card: surface
"#45454a" = "#2a2e36"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
