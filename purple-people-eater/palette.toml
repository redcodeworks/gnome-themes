title = "Purple People Eater"
gtk_name = "Purple-People-Eater"
shell_name = "Purple-People-Eater-Shell"
credit = "Purple People Eater (colours of the Ptyxis built-in 'Purple People Eater'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Purple%20People%20Eater.yml)"
default_accent = "blue"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#161b22"],[53,"#20252c"],[66,"#33383f"],
        [91,"#484e55"],[145,"#6c727a"],[238,"#c9d1d9"],[255,"#c9d1d9"]]
fg = "#c9d1d9"
top = "#c9d1d9"
accent_fg = "#161b22"
view = "#161b22"
[dark.fam]
