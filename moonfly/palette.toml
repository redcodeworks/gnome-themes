# SPDX-License-Identifier: MIT
# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #080808 5.5% towards fg
# derived: dark.surface derived: #080808 16.0% towards fg
# derived: dark.surface_high derived: #080808 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #e3c78b (it equals the default accent; keeps accent tokens unique)
title = "Moonfly"
gtk_name = "Moonfly"
shell_name = "Moonfly-Shell"
credit = "Moonfly (colours of the Ptyxis built-in 'Moonfly'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Moonfly.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#080808"],[53,"#121212"],[66,"#252525"],
        [91,"#3b3b3b"],[145,"#5f5f5f"],[238,"#bdbdbd"],[255,"#bdbdbd"]]
fg = "#bdbdbd"
top = "#bdbdbd"
accent_fg = "#080808"
view = "#080808"
[dark.fam]
blue = ["#15539e","#e3c78a"]
red = ["#cc0000","#ff5454"]
orange = ["#f57900","#e3c78b"]
green = ["#4e9a06","#8cc85f"]
[dark.exact]
"#26ab62" = "#8cc85f"
"#26a269" = "#8cc85f"      # GTK4 stock success green
"#3584e4" = "#e3c78a"
"#eeeeec" = "#bdbdbd"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#080808"],[34.67,"#080808"],[55.33,"#121212"],[66.33,"#252525"],
        [86.67,"#3b3b3b"],[156,"#8a8a8a"],[179,"#8a8a8a"],[250,"#bdbdbd"],
        [255,"#bdbdbd"]]
fg = "#bdbdbd"
top = "#bdbdbd"
accent_fg = "#080808"
view = "#080808"
[shell.dark.fam]
blue = ["#3584e4","#e3c78a"]
red = ["#c01c28","#ff5454"]
orange = ["#ff7800","#f18e6f"]
green = ["#26a269","#8cc85f"]
[shell.dark.exact]
"#cd9309" = "#e3c78b"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#8a8a8a"      # web-login title, dim text
"#54545a" = "#252525"      # notification/message card: surface
"#45454a" = "#1c1c1c"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff5454"
fg = "#080808"
[accents.dark.green]
color = "#8cc85f"
fg = "#080808"
[accents.dark.yellow]
color = "#e3c78a"
fg = "#080808"
[accents.dark.blue]
color = "#80a0ff"
fg = "#080808"
[accents.dark.magenta]
color = "#cf87e8"
fg = "#080808"
[accents.dark.cyan]
color = "#79dac8"
fg = "#080808"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#080808"
bg = "#121212"
surface = "#252525"
surface_high = "#3b3b3b"
popover = "#3b3b3b"
fg = "#bdbdbd"
red = "#ff5454"
green = "#8cc85f"
yellow = "#e3c78b"
accent = "#e3c78a"
accent_fg = "#080808"
warning_fg = "#080808"
secondary_sidebar = "#121212"
