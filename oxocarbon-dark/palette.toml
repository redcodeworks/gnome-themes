# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #161616 5.5% towards fg
# derived: dark.surface derived: #161616 16.0% towards fg
# derived: dark.surface_high derived: #161616 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #ffe97c (it equals the default accent; keeps accent tokens unique)
title = "Oxocarbon Dark"
gtk_name = "Oxocarbon-Dark"
shell_name = "Oxocarbon-Dark-Shell"
credit = "Oxocarbon Dark (colours of the Ptyxis built-in 'Oxocarbon Dark'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Oxocarbon%20Dark.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#161616"],[53,"#232323"],[66,"#3b3b3b"],
        [91,"#575757"],[145,"#868686"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#161616"
view = "#161616"
[dark.fam]
blue = ["#15539e","#ffe97b"]
red = ["#cc0000","#ee5396"]
orange = ["#f57900","#ffe97c"]
green = ["#4e9a06","#42be65"]
[dark.exact]
"#26ab62" = "#42be65"
"#26a269" = "#42be65"      # GTK4 stock success green
"#3584e4" = "#ffe97b"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#161616"],[34.67,"#161616"],[55.33,"#232323"],[66.33,"#3b3b3b"],
        [86.67,"#575757"],[156,"#bdbdbd"],[179,"#bdbdbd"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#161616"
view = "#161616"
[shell.dark.fam]
blue = ["#3584e4","#ffe97b"]
red = ["#c01c28","#ee5396"]
orange = ["#ff7800","#f69e88"]
green = ["#26a269","#42be65"]
[shell.dark.exact]
"#cd9309" = "#ffe97c"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#bdbdbd"      # web-login title, dim text
"#54545a" = "#3b3b3b"      # notification/message card: surface
"#45454a" = "#2f2f2f"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ee5396"
fg = "#161616"
[accents.dark.green]
color = "#42be65"
fg = "#161616"
[accents.dark.yellow]
color = "#ffe97b"
fg = "#161616"
[accents.dark.blue]
color = "#33b1ff"
fg = "#161616"
[accents.dark.magenta]
color = "#ff7eb6"
fg = "#161616"
[accents.dark.cyan]
color = "#3ddbd9"
fg = "#161616"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#161616"
bg = "#232323"
surface = "#3b3b3b"
surface_high = "#575757"
popover = "#575757"
fg = "#ffffff"
red = "#ee5396"
green = "#42be65"
yellow = "#ffe97c"
accent = "#ffe97b"
accent_fg = "#161616"
warning_fg = "#161616"
secondary_sidebar = "#232323"
