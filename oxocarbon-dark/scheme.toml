# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Oxocarbon Dark'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Oxocarbon%20Dark.yml.
title = "Oxocarbon Dark"
gtk_name = "Oxocarbon-Dark"
shell_name = "Oxocarbon-Dark-Shell"
credit = "Oxocarbon Dark (colours of the Ptyxis built-in 'Oxocarbon Dark'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Oxocarbon%20Dark.yml)"
ptyxis = "Oxocarbon Dark"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Oxocarbon Dark' (bulk-built by tools/bulk-scheme.py)."
default_accent = "yellow"

[dark]
bg_deep = "#161616"
fg = "#ffffff"
selection = "#454545"   # DERIVED
red = "#ee5396"
orange = "#f69e88"   # DERIVED
yellow = "#ffe97b"
green = "#42be65"
cyan = "#3ddbd9"
blue = "#33b1ff"
magenta = "#ff7eb6"
purple = "#ff7eb6"   # = magenta
# palette Color8 (bright black) = #393939: a candidate for `comment`
[dark.ansi]
red = "#ee5396"
green = "#42be65"
yellow = "#ffe97b"
blue = "#33b1ff"
magenta = "#ff7eb6"
cyan = "#3ddbd9"
[dark.terminal]
source = "Oxocarbon Dark"   # Ptyxis built-in id
cursor = "#6f6f6f"   # Ptyxis Cursor
black = "#262626"   # Ptyxis Color0
white = "#dde1e6"   # Ptyxis Color7
bright_black = "#393939"   # Ptyxis Color8
bright_white = "#ffffff"   # Ptyxis Color15
