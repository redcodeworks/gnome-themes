# SPDX-License-Identifier: MIT
# Monokai (classic, by Wimer Hazenberg, monokai.nl), dark only. The canonical copy used is Base16 Monokai in
# tinted-theming/schemes (MIT, https://github.com/tinted-theming/schemes), VERIFIED against the raw base16/monokai.yaml (2026-11-07).
# Monokai PRO (monokai.pro) is proprietary and is deliberately NOT used.
# Roles: view base00 #272822, window base01 #383830, headers base02 #49483e, popovers DERIVED (fixed rule, 28 % towards fg),
# comment base03 #75715e, fg_dim base04 #a59f85, fg base05 #f8f8f2, selection base02.
# ANSI six = Ptyxis "Monokai Dark" Color1-6 (it matches the classic palette; "Monokai Soda" is a different one: #1A1A1A, red #F4005F),
# including cyan #2aa198 (a Solarized teal; Base16 Monokai's base0C #a1efe4 was used before 2026-11-07).
# Ptyxis' yellow #F4BF75 = base0A (the original string yellow #E6DB74 is not used).
# Default accent green #A6E22E (Monokai's signature colour, base0B), one of the six.
# TERMINAL FIRST (2026-11-07): the Ptyxis built-in named in [<variant>.terminal] `source` is the starting point and the source of truth. bg_deep and fg are its
# Background and Foreground, the six accents its Color1-6, the real black, white and brights are in the terminal table. Where an older note above gives other
# values, THIS block and the values below supersede it. A colour that still differs from its source is a listed nudge ([<variant>.nudge], with its reason).
# Source: Monokai Dark (flat, dark only; classic Monokai: same background, foreground and five of the six accents). Changes: cyan #2aa198, plus its black #75715e,
# white #f9f8f5, brights (its bright black equals the background #272822, so it is invisible as text; kept, it is the built-in's).
title = "Monokai"
gtk_name = "Monokai"
shell_name = "Monokai-Shell"
credit = "Monokai by Wimer Hazenberg (palette values via Base16, tinted-theming/schemes, MIT); not Monokai Pro"
ptyxis = "Monokai Dark"
ptyxis_reason = "Monokai Dark is the source (classic Monokai: background #272822, same ANSI colours; the Monokai Pro built-ins are a different palette) and equals the scheme in every role (0.00 dE, no nudges); flat and dark only, like the scheme"
default_accent = "green"

[dark]
bg_deep = "#272822"
bg = "#383830"
surface = "#49483e"
fg = "#f8f8f2"
fg_dim = "#a59f85"
comment = "#75715e"
selection = "#49483e"
red = "#f92672"
orange = "#fd971f"
yellow = "#f4bf75"
green = "#a6e22e"
cyan = "#2aa198"
blue = "#66d9ef"
magenta = "#ae81ff"
purple = "#ae81ff"
pink = "#f92672"
[dark.ansi]
orange = "#fd971f"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#f92672"
green = "#a6e22e"
yellow = "#f4bf75"
blue = "#66d9ef"
magenta = "#ae81ff"
cyan = "#2aa198"

# Terminal palette: the Ptyxis built-in named in `source` is the starting point and the source of truth for the variant (the terminal comes first,
# the toolkit themes follow). Background and Foreground are bg_deep and fg above, the six accents are [<variant>.ansi]; the real black, white and brights
# are below. A colour that differs from its source is listed in [<variant>.nudge] with the reason (tools/ptyxis-compare.py --check enforces this).

[dark.terminal]
source = "Monokai Dark"   # Ptyxis built-in, checked 2026-11-07 with tools/ptyxis-palette.sh
black = "#75715e"   # Color0
white = "#f9f8f5"   # Color7
bright_black = "#272822"   # Color8
bright_red = "#f92672"   # Color9
bright_green = "#a6e22e"   # Color10
bright_yellow = "#f4bf75"   # Color11
bright_blue = "#66d9ef"   # Color12
bright_magenta = "#ae81ff"   # Color13
bright_cyan = "#2aa198"   # Color14
bright_white = "#f8f8f2"   # Color15
