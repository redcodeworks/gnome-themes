# SPDX-License-Identifier: MIT
# Monokai (classic, by Wimer Hazenberg, monokai.nl), dark only. The canonical copy used is Base16 Monokai in
# tinted-theming/schemes (MIT, https://github.com/tinted-theming/schemes), VERIFIED against the raw base16/monokai.yaml (2026-11-07).
# Monokai PRO (monokai.pro) is proprietary and is deliberately NOT used.
# Roles: view base00 #272822, window base01 #383830, headers base02 #49483e, popovers DERIVED (fixed rule, 28 % towards fg),
# comment base03 #75715e, fg_dim base04 #a59f85, fg base05 #f8f8f2, selection base02.
# ANSI six = Ptyxis "Monokai Dark" Color1-6 (it matches the classic palette; "Monokai Soda" is a different one: #1A1A1A, red #F4005F),
# including cyan #2aa198 (a Solarized teal; Base16 Monokai's base0C #a1efe4 was used before 2026-11-07).
# Ptyxis' yellow #F4BF75 = base0A (the original string yellow #E6DB74 is not used).
# Default accent green #A6E22E (Monokai's signature colour, base0B), one of the six.
# SOURCE ORDER (2026-11-07): official source first, the Ptyxis built-in of the same name second, invented last. Each variant's [<variant>.terminal] says which
# it uses: `source = "official: <repo/url, date verified>"` (with `builtin_differs` where the official palette differs from the built-in: name, max delta E, why
# official wins) or `source = "<built-in name>"` (bg_deep, fg, the six accents and the real black, white and brights ARE the built-in's) or `no_builtin`. A
# colour that still differs from its source is a listed nudge ([<variant>.nudge], with the reason). Where an older note above gives other values, THIS block wins.
# Source: official (Base16 Monokai, raw file): cyan is base0C #a1efe4; the built-in Monokai Dark has #2aa198 there and is otherwise the same, so only cyan differs. The built-in's black #75715e and
# white are used; its bright black equals the background and is skipped.
title = "Monokai"
gtk_name = "Monokai"
shell_name = "Monokai-Shell"
credit = "Monokai by Wimer Hazenberg (palette values via Base16, tinted-theming/schemes, MIT); not Monokai Pro"
ptyxis = "generated"
ptyxis_reason = "the official Base16 Monokai cyan #a1efe4 differs from the Monokai Dark built-in's #2aa198 (30 dE); everything else equals it, but a built-in cannot carry the official cyan, so the palette is generated"
default_accent = "green"

[dark]
bg_deep = "#272822"
bg = "#383830"
surface = "#49483e"
fg = "#f8f8f2"
fg_dim = "#a59f85"
comment = "#75715e"
selection = "#49483e"
red = "#f92672"
orange = "#fd971f"
yellow = "#f4bf75"
green = "#a6e22e"
cyan = "#a1efe4"
blue = "#66d9ef"
magenta = "#ae81ff"
purple = "#ae81ff"
pink = "#f92672"

[dark.ansi]
orange = "#fd971f"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#f92672"
green = "#a6e22e"
yellow = "#f4bf75"
blue = "#66d9ef"
magenta = "#ae81ff"
cyan = "#a1efe4"

# Terminal palette overrides (tools/ptyxis-gen.py). Source: the Ptyxis built-in "Monokai Dark" (five of the six ANSI colours equal ours):
# Color0 = its black. It has no real brights, so the defaults stay.

[dark.terminal]
source = "official: tinted-theming/schemes base16/monokai.yaml, raw file, verified 2026-11-07"
builtin_differs = { name = "Monokai Dark", de = 32.5, note = "Base16 Monokai base0C cyan #a1efe4 is official; the built-in Monokai Dark has a Solarized teal #2aa198 there" }
black = "#75715e"   # Color0 (the built-in's)
white = "#f9f8f5"   # Color7 (the built-in's)
bright_white = "#f8f8f2"   # Color15 (the built-in's)
