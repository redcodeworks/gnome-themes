# SPDX-License-Identifier: MIT
# Monokai (classic, by Wimer Hazenberg, monokai.nl), dark only. Monokai PRO (monokai.pro) is proprietary and is deliberately NOT used.
# The colours are the Ptyxis built-in "Monokai Dark" (a Gogh port, https://github.com/Gogh-Co/Gogh, per its header): background #272822, foreground #f8f8f2,
# accents #f92672 #a6e22e #f4bf75 #66d9ef #ae81ff #2aa198 (cyan is a Solarized teal; Base16 Monokai's #a1efe4 is no longer used). "Monokai Pro", "Pro Ristretto" and
# "Soda" are other palettes (71-97 dE away) and not used.
# DERIVED or kept from the classic palette: window base01 #383830, headers base02 #49483e, comment base03 #75715e, fg_dim base04 #a59f85, selection base02;
# popovers DERIVED (fixed rule). Default accent green #A6E22E (Monokai's signature colour), one of the six.
title = "Monokai"
gtk_name = "Monokai"
shell_name = "Monokai-Shell"
credit = "Monokai by Wimer Hazenberg (palette values via Base16, tinted-theming/schemes, MIT); not Monokai Pro"
ptyxis = "Monokai Dark"
ptyxis_reason = "dark only; Monokai Dark is the closest of the Monokai built-ins (the Pro, Ristretto and Soda ones are 71-97 dE away)."
default_accent = "green"

[dark]
bg_deep = "#272822"
bg = "#383830"
surface = "#49483e"
fg = "#f8f8f2"
fg_dim = "#a59f85"
comment = "#75715e"
selection = "#49483e"
red = "#f92672"
orange = "#fd971f"
yellow = "#f4bf75"
green = "#a6e22e"
cyan = "#2aa198"
blue = "#66d9ef"
magenta = "#ae81ff"
purple = "#ae81ff"
pink = "#f92672"

[dark.ansi]
orange = "#fd971f"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#f92672"
green = "#a6e22e"
yellow = "#f4bf75"
blue = "#66d9ef"
magenta = "#ae81ff"
cyan = "#2aa198"

[dark.terminal]
source = "Monokai Dark"   # Ptyxis built-in id
black = "#75715e"   # Color0
white = "#f9f8f5"   # Color7
bright_black = "#272822"   # Color8
bright_white = "#f8f8f2"   # Color15
