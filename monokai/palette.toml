ramp = [[0,"#272822"],[34.67,"#272822"],[55.33,"#383830"],[66.33,"#49483e"],
        [86.67,"#62625c"],[156,"#a59f85"],[179,"#a59f85"],[250,"#f8f8f2"],
        [255,"#f8f8f2"]]
fg = "#f8f8f2"
top = "#f8f8f2"
accent_fg = "#272822"
view = "#272822"
[shell.dark.fam]
blue = ["#3584e4","#a6e22e"]
red = ["#c01c28","#f92672"]
orange = ["#ff7800","#fd971f"]
green = ["#26a269","#a6e22f"]
[shell.dark.exact]
"#cd9309" = "#f4bf75"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a59f85"      # web-login title, dim text
"#54545a" = "#49483e"      # notification/message card: surface
"#45454a" = "#404037"      # message card stacked behind the front one: bg and surface mixed 50 %

