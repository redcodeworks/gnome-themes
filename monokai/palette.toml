green = ["#4e9a06","#a6e22f"]
[dark.exact]
"#26ab62" = "#a6e22f"
"#26a269" = "#a6e22f"      # GTK4 stock success green
"#3584e4" = "#a6e22e"
"#eeeeec" = "#f8f8f2"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
