# derived: dark.bg derived: #2a1f1d 5.5% towards fg
# derived: dark.surface derived: #2a1f1d 16.0% towards fg
# derived: dark.surface_high derived: #2a1f1d 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #2a1f1d -> #2a1f25 (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #e99d2b (it equals the default accent; keeps accent tokens unique)
title = "Birds Of Paradise"
gtk_name = "Birds-Of-Paradise"
shell_name = "Birds-Of-Paradise-Shell"
credit = "Birds Of Paradise (colours of the Ptyxis built-in 'Birds Of Paradise'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Birds%20Of%20Paradise.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#2a1f1d"],[53,"#342925"],[66,"#473d36"],
        [91,"#5d5448"],[145,"#817967"],[238,"#e0dbb7"],[255,"#e0dbb7"]]
fg = "#e0dbb7"
top = "#e0dbb7"
accent_fg = "#2a1f25"
view = "#2a1f1d"
[dark.fam]
blue = ["#15539e","#e99d2a"]
red = ["#cc0000","#be2d26"]
orange = ["#f57900","#e99d2b"]
green = ["#4e9a06","#6ba18a"]
[dark.exact]
"#26ab62" = "#6ba18a"
"#26a269" = "#6ba18a"      # GTK4 stock success green
"#3584e4" = "#e99d2a"
"#eeeeec" = "#e0dbb7"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2a1f1d"],[34.67,"#2a1f1d"],[55.33,"#342925"],[66.33,"#473d36"],
        [86.67,"#5d5448"],[156,"#aca68b"],[179,"#aca68b"],[250,"#e0dbb7"],
        [255,"#e0dbb7"]]
fg = "#e0dbb7"
top = "#e0dbb7"
accent_fg = "#2a1f25"
view = "#2a1f1d"
[shell.dark.fam]
blue = ["#3584e4","#e99d2a"]
red = ["#c01c28","#be2d26"]
orange = ["#ff7800","#d46528"]
green = ["#26a269","#6ba18a"]
[shell.dark.exact]
"#cd9309" = "#e99d2b"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#aca68b"      # web-login title, dim text
"#54545a" = "#473d36"      # notification/message card: surface
"#45454a" = "#3e332e"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
