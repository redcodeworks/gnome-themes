# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #222222 5.5% towards fg
# derived: dark.surface derived: #222222 16.0% towards fg
# derived: dark.surface_high derived: #222222 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #222222 -> #22222a (the text colour varies per accent: the default needs its own token)
title = "Afterglow"
gtk_name = "Afterglow"
shell_name = "Afterglow-Shell"
credit = "Afterglow (colours of the Ptyxis built-in 'Afterglow'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Afterglow.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#222222"],[53,"#2c2c2c"],[66,"#3e3e3e"],
        [91,"#535353"],[145,"#767676"],[238,"#d0d0d0"],[255,"#d0d0d0"]]
fg = "#d0d0d0"
top = "#d0d0d0"
accent_fg = "#22222a"
view = "#222222"
[dark.fam]
blue = ["#15539e","#7dd6cf"]
red = ["#cc0000","#a53c23"]
orange = ["#f57900","#d3a04d"]
green = ["#4e9a06","#7b9246"]
[dark.exact]
"#26ab62" = "#7b9246"
"#26a269" = "#7b9246"      # GTK4 stock success green
"#3584e4" = "#7dd6cf"
"#eeeeec" = "#d0d0d0"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#222222"],[34.67,"#222222"],[55.33,"#2c2c2c"],[66.33,"#3e3e3e"],
        [86.67,"#535353"],[156,"#9f9f9f"],[179,"#9f9f9f"],[250,"#d0d0d0"],
        [255,"#d0d0d0"]]
fg = "#d0d0d0"
top = "#d0d0d0"
accent_fg = "#22222a"
view = "#222222"
[shell.dark.fam]
blue = ["#3584e4","#7dd6cf"]
red = ["#c01c28","#a53c23"]
orange = ["#ff7800","#bc6e38"]
green = ["#26a269","#7b9246"]
[shell.dark.exact]
"#cd9309" = "#d3a04d"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9f9f9f"      # web-login title, dim text
"#54545a" = "#3e3e3e"      # notification/message card: surface
"#45454a" = "#353535"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#a53c23"
fg = "#d0d0d0"
[accents.dark.green]
color = "#7b9246"
fg = "#22222a"
[accents.dark.yellow]
color = "#d3a04d"
fg = "#22222a"
[accents.dark.blue]
color = "#6c99bb"
fg = "#22222a"
[accents.dark.magenta]
color = "#9f4e85"
fg = "#d0d0d0"
[accents.dark.cyan]
color = "#7dd6cf"
fg = "#22222a"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#222222"
bg = "#2c2c2c"
surface = "#3e3e3e"
surface_high = "#535353"
popover = "#535353"
fg = "#d0d0d0"
red = "#a53c23"
green = "#7b9246"
yellow = "#d3a04d"
accent = "#7dd6cf"
