title = "Thayer Bright"
gtk_name = "Thayer-Bright"
shell_name = "Thayer-Bright-Shell"
credit = "Thayer Bright (colours of the Ptyxis built-in 'Thayer Bright'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Thayer%20Bright.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1b1d1e"],[53,"#27292a"],[66,"#3e4041"],
        [91,"#595a5b"],[145,"#858687"],[238,"#f8f8f8"],[255,"#f8f8f8"]]
fg = "#f8f8f8"
top = "#f8f8f8"
accent_fg = "#1b1d26"
view = "#1b1d1e"
[dark.fam]
blue = ["#15539e","#f4fd22"]
red = ["#cc0000","#f92672"]
orange = ["#f57900","#f4fd23"]
green = ["#4e9a06","#4df840"]
[dark.exact]
"#26ab62" = "#4df840"
"#26a269" = "#4df840"      # GTK4 stock success green
"#3584e4" = "#f4fd22"
"#eeeeec" = "#f8f8f8"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1b1d1e"],[34.67,"#1b1d1e"],[55.33,"#27292a"],[66.33,"#3e4041"],
        [86.67,"#595a5b"],[156,"#b9baba"],[179,"#b9baba"],[250,"#f8f8f8"],
        [255,"#f8f8f8"]]
fg = "#f8f8f8"
top = "#f8f8f8"
accent_fg = "#1b1d26"
view = "#1b1d1e"
[shell.dark.fam]
blue = ["#3584e4","#f4fd22"]
red = ["#c01c28","#f92672"]
orange = ["#ff7800","#f6924a"]
green = ["#26a269","#4df840"]
[shell.dark.exact]
"#cd9309" = "#f4fd23"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b9baba"      # web-login title, dim text
"#54545a" = "#3e4041"      # notification/message card: surface
"#45454a" = "#323436"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
