fg = "#1b1d26"
[accents.dark.green]
color = "#4df840"
fg = "#1b1d26"
[accents.dark.yellow]
color = "#f4fd22"
fg = "#1b1d26"
[accents.dark.blue]
color = "#2757d6"
fg = "#f8f8f8"
[accents.dark.magenta]
color = "#8c54fe"
fg = "#1b1d26"
[accents.dark.cyan]
color = "#38c8b5"
fg = "#1b1d26"

# roles for tools/libadwaita-gen.py
[roles.dark]
