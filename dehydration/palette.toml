# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #333333 5.5% towards fg
# derived: dark.surface derived: #333333 16.0% towards fg
# derived: dark.surface_high derived: #333333 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #333333 -> #33333b (the text colour varies per accent: the default needs its own token)
title = "Dehydration"
gtk_name = "Dehydration"
shell_name = "Dehydration-Shell"
credit = "Dehydration (colours of the Ptyxis built-in 'Dehydration'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Dehydration.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#333333"],[53,"#3b3b3b"],[66,"#4b4b4b"],
        [91,"#5e5e5e"],[145,"#7c7c7c"],[238,"#cccccc"],[255,"#cccccc"]]
fg = "#cccccc"
top = "#cccccc"
accent_fg = "#33333b"
view = "#333333"
[dark.fam]
blue = ["#15539e","#5fd3bc"]
red = ["#cc0000","#ff5555"]
orange = ["#f57900","#ff9955"]
green = ["#4e9a06","#5fd38d"]
[dark.exact]
"#26ab62" = "#5fd38d"
"#26a269" = "#5fd38d"      # GTK4 stock success green
"#3584e4" = "#5fd3bc"
"#eeeeec" = "#cccccc"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#333333"],[34.67,"#333333"],[55.33,"#3b3b3b"],[66.33,"#4b4b4b"],
        [86.67,"#5e5e5e"],[156,"#a0a0a0"],[179,"#a0a0a0"],[250,"#cccccc"],
        [255,"#cccccc"]]
fg = "#cccccc"
top = "#cccccc"
accent_fg = "#33333b"
view = "#333333"
[shell.dark.fam]
blue = ["#3584e4","#5fd3bc"]
red = ["#c01c28","#ff5555"]
orange = ["#ff7800","#ff7755"]
green = ["#26a269","#5fd38d"]
[shell.dark.exact]
"#cd9309" = "#ff9955"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a0a0a0"      # web-login title, dim text
"#54545a" = "#4b4b4b"      # notification/message card: surface
"#45454a" = "#434343"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff5555"
fg = "#33333b"
[accents.dark.green]
color = "#5fd38d"
fg = "#33333b"
[accents.dark.yellow]
color = "#ff9955"
fg = "#33333b"
[accents.dark.blue]
color = "#3771c8"
fg = "#cccccc"
[accents.dark.magenta]
color = "#bc5fd3"
fg = "#33333b"
[accents.dark.cyan]
color = "#5fd3bc"
fg = "#33333b"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#333333"
bg = "#3b3b3b"
surface = "#4b4b4b"
surface_high = "#5e5e5e"
popover = "#5e5e5e"
fg = "#cccccc"
red = "#ff5555"
green = "#5fd38d"
yellow = "#ff9955"
