# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #2c2c2c 5.5% towards fg
# derived: dark.surface derived: #2c2c2c 16.0% towards fg
# derived: dark.surface_high derived: #2c2c2c 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #ffcc67 (it equals the default accent; keeps accent tokens unique)
title = "Tomorrow Night Eighties"
gtk_name = "Tomorrow-Night-Eighties"
shell_name = "Tomorrow-Night-Eighties-Shell"
credit = "Tomorrow Night Eighties (colours of the Ptyxis built-in 'Tomorrow Night Eighties'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Tomorrow%20Night%20Eighties.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#2c2c2c"],[53,"#353535"],[66,"#464646"],
        [91,"#595959"],[145,"#797979"],[238,"#cccccc"],[255,"#cccccc"]]
fg = "#cccccc"
top = "#cccccc"
accent_fg = "#2c2c2c"
view = "#2c2c2c"
[dark.fam]
blue = ["#15539e","#ffcc66"]
red = ["#cc0000","#f27779"]
orange = ["#f57900","#ffcc67"]
green = ["#4e9a06","#99cc99"]
[dark.exact]
"#26ab62" = "#99cc99"
"#26a269" = "#99cc99"      # GTK4 stock success green
"#3584e4" = "#ffcc66"
"#eeeeec" = "#cccccc"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2c2c2c"],[34.67,"#2c2c2c"],[55.33,"#353535"],[66.33,"#464646"],
        [86.67,"#595959"],[156,"#9f9f9f"],[179,"#9f9f9f"],[250,"#cccccc"],
        [255,"#cccccc"]]
fg = "#cccccc"
top = "#cccccc"
accent_fg = "#2c2c2c"
view = "#2c2c2c"
[shell.dark.fam]
blue = ["#3584e4","#ffcc66"]
red = ["#c01c28","#f27779"]
orange = ["#ff7800","#f8a270"]
green = ["#26a269","#99cc99"]
[shell.dark.exact]
"#cd9309" = "#ffcc67"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9f9f9f"      # web-login title, dim text
"#54545a" = "#464646"      # notification/message card: surface
"#45454a" = "#3e3e3e"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#f27779"
fg = "#2c2c2c"
[accents.dark.green]
color = "#99cc99"
fg = "#2c2c2c"
[accents.dark.yellow]
color = "#ffcc66"
fg = "#2c2c2c"
[accents.dark.blue]
color = "#6699cc"
fg = "#2c2c2c"
[accents.dark.magenta]
color = "#cc99cc"
fg = "#2c2c2c"
[accents.dark.cyan]
color = "#66cccc"
fg = "#2c2c2c"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#2c2c2c"
bg = "#353535"
surface = "#464646"
surface_high = "#595959"
popover = "#595959"
fg = "#cccccc"
red = "#f27779"
green = "#99cc99"
yellow = "#ffcc67"
accent = "#ffcc66"
accent_fg = "#2c2c2c"
warning_fg = "#2c2c2c"
secondary_sidebar = "#353535"
