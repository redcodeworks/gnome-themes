# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #222225 5.5% towards fg
# derived: dark.surface derived: #222225 16.0% towards fg
# derived: dark.surface_high derived: #222225 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #222225 -> #22222d (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #ffcb3f (it equals the default accent; keeps accent tokens unique)
title = "Highway"
gtk_name = "Highway"
shell_name = "Highway-Shell"
credit = "Highway (colours of the Ptyxis built-in 'Highway'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Highway.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#222225"],[53,"#2d2d30"],[66,"#424245"],
        [91,"#5b5b5d"],[145,"#838385"],[238,"#ededed"],[255,"#ededed"]]
fg = "#ededed"
top = "#ededed"
accent_fg = "#22222d"
view = "#222225"
[dark.fam]
blue = ["#15539e","#ffcb3e"]
red = ["#cc0000","#d00e18"]
orange = ["#f57900","#ffcb3f"]
green = ["#4e9a06","#138034"]
[dark.exact]
"#26ab62" = "#138034"
"#26a269" = "#138034"      # GTK4 stock success green
"#3584e4" = "#ffcb3e"
"#eeeeec" = "#ededed"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#222225"],[34.67,"#222225"],[55.33,"#2d2d30"],[66.33,"#424245"],
        [86.67,"#5b5b5d"],[156,"#b3b3b4"],[179,"#b3b3b4"],[250,"#ededed"],
        [255,"#ededed"]]
fg = "#ededed"
top = "#ededed"
accent_fg = "#22222d"
view = "#222225"
[shell.dark.fam]
blue = ["#3584e4","#ffcb3e"]
red = ["#c01c28","#d00e18"]
orange = ["#ff7800","#e86c2b"]
green = ["#26a269","#138034"]
[shell.dark.exact]
"#cd9309" = "#ffcb3f"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b3b3b4"      # web-login title, dim text
"#54545a" = "#424245"      # notification/message card: surface
"#45454a" = "#38383a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#d00e18"
fg = "#ededed"
[accents.dark.green]
color = "#138034"
fg = "#ededed"
[accents.dark.yellow]
color = "#ffcb3e"
fg = "#22222d"
[accents.dark.blue]
color = "#006bb3"
fg = "#ededed"
[accents.dark.magenta]
color = "#6b2775"
fg = "#ededed"
[accents.dark.cyan]
color = "#384564"
fg = "#ededed"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#222225"
bg = "#2d2d30"
surface = "#424245"
surface_high = "#5b5b5d"
popover = "#5b5b5d"
fg = "#ededed"
red = "#d00e18"
green = "#138034"
yellow = "#ffcb3f"
accent = "#ffcb3e"
accent_fg = "#22222d"
warning_fg = "#222225"
secondary_sidebar = "#2d2d30"
