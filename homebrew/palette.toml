# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #000000 5.5% towards fg
# derived: dark.surface derived: #000000 16.0% towards fg
# derived: dark.surface_high derived: #000000 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: light.bg derived: #ffffff 3.0% towards fg
# derived: light.surface derived: #ffffff 6.0% towards fg
# derived: light.surface_high derived: #ffffff 9.0% towards fg
# derived: light.fg_dim derived: fg 30% towards bg
# derived: light.comment derived: fg 55% towards bg
# derived: dark.accent_fg #000000 -> #000008 (the text colour varies per accent: the default needs its own token)
# derived: light.accent_fg #000000 -> #000008 (the text colour varies per accent: the default needs its own token)
title = "Homebrew"
gtk_name = "Homebrew"
shell_name = "Homebrew-Shell"
credit = "Homebrew (colours of the Ptyxis built-in 'Homebrew' and 'Homebrew Light'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Homebrew.yml)"
default_accent = "cyan"
dark_only = false
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#000000"],[53,"#000e00"],[66,"#002900"],
        [91,"#004700"],[145,"#007a00"],[238,"#00ff00"],[255,"#00ff00"]]
fg = "#00ff00"
top = "#00ff00"
accent_fg = "#000008"
view = "#000000"
[dark.fam]
blue = ["#15539e","#00a6b2"]
red = ["#cc0000","#990000"]
orange = ["#f57900","#999900"]
green = ["#4e9a06","#00a600"]
[dark.exact]
"#26ab62" = "#00a600"
"#26a269" = "#00a600"      # GTK4 stock success green
"#3584e4" = "#00a6b2"
"#eeeeec" = "#00ff00"

[light]
ramp = [[0,"#000000"],[46,"#000000"],[145,"#888888"],[224,"#e8e8e8"],
        [237,"#f0f0f0"],[246,"#f7f7f7"],[255,"#ffffff"]]
fg = "#000000"
top = "#ffffff"
accent_fg = "#000008"
view = "#ffffff"
[light.fam]
blue = ["#3584e4","#00a6b2"]
red = ["#cc0000","#990000"]
orange = ["#f57900","#999900"]
green = ["#4e9a06","#00a600"]
[light.exact]
"#33d17a" = "#00a600"
"#2ec27e" = "#00a600"      # GTK4 stock success green (light)
"#2e3436" = "#000000"
"#f6f5f4" = "#f7f7f7"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#000000"],[34.67,"#000000"],[55.33,"#000e00"],[66.33,"#002900"],
        [86.67,"#004700"],[156,"#00b700"],[179,"#00b700"],[250,"#00ff00"],
        [255,"#00ff00"]]
fg = "#00ff00"
top = "#00ff00"
accent_fg = "#000008"
view = "#000000"
[shell.dark.fam]
blue = ["#3584e4","#00a6b2"]
red = ["#c01c28","#990000"]
orange = ["#ff7800","#994c00"]
green = ["#26a269","#00a600"]
[shell.dark.exact]
"#cd9309" = "#999900"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#00b700"      # web-login title, dim text
"#54545a" = "#002900"      # notification/message card: surface
"#45454a" = "#001c00"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#000000"],[46,"#000000"],[145,"#888888"],[224,"#e8e8e8"],
        [237,"#f0f0f0"],[250,"#ffffff"],[255,"#ffffff"]]
fg = "#000000"
top = "#ffffff"
accent_fg = "#000008"
view = "#ffffff"
[shell.light.fam]
blue = ["#3584e4","#00a6b2"]
red = ["#c01c28","#990000"]
orange = ["#e66100","#994c00"]
green = ["#26a269","#00a600"]
[shell.light.exact]
"#e5a50a" = "#999900"      # warning yellow
"#a5a5b7" = "#888888"

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
