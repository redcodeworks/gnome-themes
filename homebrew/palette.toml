[accents.light.red]
color = "#990000"
fg = "#ffffff"
[accents.light.green]
color = "#00a600"
fg = "#000008"
[accents.light.yellow]
color = "#999900"
fg = "#000008"
[accents.light.blue]
color = "#0000b2"
fg = "#ffffff"
[accents.light.magenta]
color = "#b200b2"
fg = "#ffffff"
[accents.light.cyan]
color = "#00a6b2"
