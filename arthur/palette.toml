# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #1c1c1c 5.5% towards fg
# derived: dark.surface derived: #1c1c1c 16.0% towards fg
# derived: dark.surface_high derived: #1c1c1c 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
title = "Arthur"
gtk_name = "Arthur"
shell_name = "Arthur-Shell"
credit = "Arthur (colours of the Ptyxis built-in 'Arthur'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Arthur.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1c1c1c"],[53,"#272827"],[66,"#3b3e3b"],
        [91,"#525752"],[145,"#798179"],[238,"#ddeedd"],[255,"#ddeedd"]]
fg = "#ddeedd"
top = "#ddeedd"
accent_fg = "#1c1c1c"
view = "#1c1c1c"
[dark.fam]
blue = ["#15539e","#b0c4de"]
red = ["#cc0000","#cd5c5c"]
orange = ["#f57900","#e8ae5b"]
green = ["#4e9a06","#86af80"]
[dark.exact]
"#26ab62" = "#86af80"
"#26a269" = "#86af80"      # GTK4 stock success green
"#3584e4" = "#b0c4de"
"#eeeeec" = "#ddeedd"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1c1c1c"],[34.67,"#1c1c1c"],[55.33,"#272827"],[66.33,"#3b3e3b"],
        [86.67,"#525752"],[156,"#a6b3a6"],[179,"#a6b3a6"],[250,"#ddeedd"],
        [255,"#ddeedd"]]
fg = "#ddeedd"
top = "#ddeedd"
accent_fg = "#1c1c1c"
view = "#1c1c1c"
[shell.dark.fam]
blue = ["#3584e4","#b0c4de"]
red = ["#c01c28","#cd5c5c"]
orange = ["#ff7800","#da855c"]
green = ["#26a269","#86af80"]
[shell.dark.exact]
"#cd9309" = "#e8ae5b"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a6b3a6"      # web-login title, dim text
"#54545a" = "#3b3e3b"      # notification/message card: surface
"#45454a" = "#313331"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#cd5c5c"
fg = "#1c1c1c"
[accents.dark.green]
color = "#86af80"
fg = "#1c1c1c"
[accents.dark.yellow]
color = "#e8ae5b"
fg = "#1c1c1c"
[accents.dark.blue]
color = "#6495ed"
fg = "#1c1c1c"
[accents.dark.magenta]
color = "#deb887"
fg = "#1c1c1c"
[accents.dark.cyan]
color = "#b0c4de"
fg = "#1c1c1c"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#1c1c1c"
bg = "#272827"
surface = "#3b3e3b"
surface_high = "#525752"
popover = "#525752"
fg = "#ddeedd"
red = "#cd5c5c"
green = "#86af80"
yellow = "#e8ae5b"
accent = "#b0c4de"
accent_fg = "#1c1c1c"
warning_fg = "#1c1c1c"
secondary_sidebar = "#272827"
