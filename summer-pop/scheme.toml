# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Summer Pop'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Summer%20Pop.yml.
title = "Summer Pop"
gtk_name = "Summer-Pop"
shell_name = "Summer-Pop-Shell"
credit = "Summer Pop (colours of the Ptyxis built-in 'Summer Pop'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Summer%20Pop.yml)"
ptyxis = "Summer Pop"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Summer Pop' (bulk-built by tools/bulk-scheme.py)."
default_accent = "yellow"

[dark]
bg_deep = "#272822"
fg = "#ffffff"
selection = "#52534e"   # DERIVED
red = "#ff1e8e"
orange = "#ff8c47"   # DERIVED
yellow = "#fffb00"
green = "#8eff1e"
cyan = "#00e5e5"
blue = "#1e8eff"
magenta = "#e500e5"
purple = "#e500e5"   # = magenta
# palette Color8 (bright black) = #666666: a candidate for `comment`
[dark.ansi]
red = "#ff1e8e"
green = "#8eff1e"
yellow = "#fffb00"
blue = "#1e8eff"
magenta = "#e500e5"
cyan = "#00e5e5"
[dark.terminal]
source = "Summer Pop"   # Ptyxis built-in id
black = "#666666"   # Ptyxis Color0
white = "#e5e5e5"   # Ptyxis Color7
bright_black = "#666666"   # Ptyxis Color8
bright_white = "#e5e5e5"   # Ptyxis Color15
