# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #272822 5.5% towards fg
# derived: dark.surface derived: #272822 16.0% towards fg
# derived: dark.surface_high derived: #272822 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #fffb01 (it equals the default accent; keeps accent tokens unique)
title = "Summer Pop"
gtk_name = "Summer-Pop"
shell_name = "Summer-Pop-Shell"
credit = "Summer Pop (colours of the Ptyxis built-in 'Summer Pop'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Summer%20Pop.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#272822"],[53,"#33342e"],[66,"#4a4a45"],
        [91,"#636460"],[145,"#8f8f8c"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#272822"
view = "#272822"
[dark.fam]
blue = ["#15539e","#fffb00"]
red = ["#cc0000","#ff1e8e"]
orange = ["#f57900","#fffb01"]
green = ["#4e9a06","#8eff1e"]
[dark.exact]
"#26ab62" = "#8eff1e"
"#26a269" = "#8eff1e"      # GTK4 stock success green
"#3584e4" = "#fffb00"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#272822"],[34.67,"#272822"],[55.33,"#33342e"],[66.33,"#4a4a45"],
        [86.67,"#636460"],[156,"#c2c2c0"],[179,"#c2c2c0"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#272822"
view = "#272822"
[shell.dark.fam]
blue = ["#3584e4","#fffb00"]
red = ["#c01c28","#ff1e8e"]
orange = ["#ff7800","#ff8c47"]
green = ["#26a269","#8eff1e"]
[shell.dark.exact]
"#cd9309" = "#fffb01"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c2c2c0"      # web-login title, dim text
"#54545a" = "#4a4a45"      # notification/message card: surface
"#45454a" = "#3e3f3a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff1e8e"
fg = "#272822"
[accents.dark.green]
color = "#8eff1e"
