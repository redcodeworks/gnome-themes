[accents.dark.yellow]
color = "#fffb00"
fg = "#272822"
[accents.dark.blue]
color = "#1e8eff"
fg = "#272822"
[accents.dark.magenta]
color = "#e500e5"
fg = "#272822"
[accents.dark.cyan]
color = "#00e5e5"
fg = "#272822"

# roles for tools/libadwaita-gen.py
[roles.dark]
