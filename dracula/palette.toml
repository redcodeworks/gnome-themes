red = ["#c01c28","#cb3a2a"]
orange = ["#e66100","#a34d14"]
green = ["#26a269","#14710a"]
[shell.light.exact]
"#e5a50a" = "#846e15"      # warning yellow
"#a5a5b7" = "#9b9ca1"

