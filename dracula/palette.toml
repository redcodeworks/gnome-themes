red = ["#cc0000","#cb3a2a"]
orange = ["#f57900","#846e15"]
green = ["#4e9a06","#14710a"]
[light.exact]
"#33d17a" = "#14710a"
"#2ec27e" = "#14710a"      # GTK4 stock success green (light)
"#2e3436" = "#282a36"
"#f6f5f4" = "#f9f9f9"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#282a36"],[34.67,"#282a36"],[55.33,"#333540"],[66.33,"#44475a"],
        [86.67,"#62646b"],[156,"#bdbebd"],[179,"#bdbebd"],[250,"#f8f8f2"],
        [255,"#f8f8f2"]]
fg = "#f8f8f2"
top = "#f8f8f2"
accent_fg = "#282a36"
view = "#282a36"
[shell.dark.fam]
blue = ["#3584e4","#bd93f9"]
red = ["#c01c28","#ff5555"]
orange = ["#ff7800","#ffb86c"]
green = ["#26a269","#50fa7b"]
[shell.dark.exact]
"#cd9309" = "#f1fa8c"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#bdbebd"      # web-login title, dim text
"#54545a" = "#44475a"      # notification/message card: surface
"#45454a" = "#3c3e4d"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#282a36"],[46,"#282a36"],[145,"#9b9ca1"],[224,"#ececed"],
        [237,"#f2f2f3"],[250,"#ffffff"],[255,"#ffffff"]]
