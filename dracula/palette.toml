view = "#282a36"
[dark.fam]
blue = ["#15539e","#bd93f9"]
red = ["#cc0000","#ff5555"]
orange = ["#f57900","#f1fa8c"]
green = ["#4e9a06","#50fa7b"]
[dark.exact]
"#26ab62" = "#50fa7b"
"#26a269" = "#50fa7b"      # GTK4 stock success green
"#3584e4" = "#bd93f9"
"#eeeeec" = "#f8f8f2"

[light]
ramp = [[0,"#282a36"],[46,"#282a36"],[145,"#9b9ca1"],[224,"#ececed"],
        [237,"#f2f2f3"],[246,"#f9f9f9"],[255,"#ffffff"]]
fg = "#282a36"
top = "#ffffff"
accent_fg = "#ffffff"
