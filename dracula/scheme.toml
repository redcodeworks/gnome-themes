# SPDX-License-Identifier: MIT
# Dracula (dracula/dracula-theme, MIT, Copyright (c) 2023 Dracula Theme) dark + Alucard light.
# The spec has only bg #282a36 and selection #44475a: bg_deep = bg, surface = selection, bg and surface_high are
# DERIVED by mixing towards fg (dark ladder rule), fg_dim and comment likewise. Alucard (light) lists only bg #fffbeb
# and fg #1f1f1f as surfaces: its ladder is derived (light rule).
# ANSI six: dark = Ptyxis "Dracula" [Dark] Color1-6, which settles the values the research file had marked unverified
# (they match: blue #bd93f9 = Dracula purple). Light = Ptyxis "Dracula" [Light] Color1-6 (a Ptyxis-made light palette,
# NOT Alucard's own colours, because the accents follow the terminal definition); the light role colours below are Alucard's.
title = "Dracula"
gtk_name = "Dracula"
shell_name = "Dracula-Shell"
credit = "Dracula Theme (MIT), light variant Alucard"
ptyxis = "generated"
ptyxis_reason = "the Dracula built-in's [Dark] equals ours (0.00 dE) but its [Light] differs (Foreground 10 dE, Color7 86 dE) from this scheme's Alucard light variant; one palette name per profile, so the pair cannot be mixed"
default_accent = "blue"

[dark]
bg_deep = "#282a36"
surface = "#44475a"
fg = "#f8f8f2"
selection = "#44475a"
red = "#ff5555"
orange = "#ffb86c"
yellow = "#f1fa8c"
green = "#50fa7b"
cyan = "#8be9fd"
blue = "#bd93f9"
magenta = "#ff79c6"
purple = "#bd93f9"
pink = "#ff79c6"
[dark.ansi]
orange = "#ffb86c"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#ff5555"
green = "#50fa7b"
yellow = "#f1fa8c"
blue = "#bd93f9"
magenta = "#ff79c6"
cyan = "#8be9fd"

[light]
bg_deep = "#fffbeb"
fg = "#1f1f1f"
selection = "#cfcfde"
comment = "#6c664b"
red = "#cb3a2a"
orange = "#a34d14"
yellow = "#846e15"
green = "#14710a"
cyan = "#036a96"
blue = "#644ac9"
magenta = "#a3144d"
purple = "#644ac9"
pink = "#a3144d"
[light.ansi]
orange = "#a34d14"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#b60021"
green = "#006800"
yellow = "#515f00"
blue = "#6946a3"
magenta = "#a41d74"
cyan = "#006274"

# Terminal palette overrides (tools/ptyxis-gen.py). Source (checked 2026-11-07 with tools/ptyxis-palette.sh): the Ptyxis built-in palette(s) named below,
# whose six ANSI colours equal this scheme's; their black and REAL brights are taken wherever they differ from the generator defaults
# (a bright black equal to the background is skipped: it would be invisible; the default `comment` stays). Each key notes the Color it is.
# dark variant <- Ptyxis "Dracula [Dark]"
[dark.terminal]
black = "#21222c"   # Color0
bright_black = "#6272a4"   # Color8
bright_red = "#ff6e6e"   # Color9
bright_green = "#69ff94"   # Color10
bright_yellow = "#ffffa5"   # Color11
bright_blue = "#d6acff"   # Color12
bright_magenta = "#ff92df"   # Color13
bright_cyan = "#a4ffff"   # Color14
bright_white = "#ffffff"   # Color15
# light variant <- Ptyxis "Dracula [Light]"
[light.terminal]
black = "#f1f2ff"   # Color0
bright_black = "#8393c7"   # Color8
bright_red = "#ac202f"   # Color9
bright_green = "#006803"   # Color10
bright_yellow = "#585e06"   # Color11
bright_blue = "#6c4993"   # Color12
bright_magenta = "#962f7c"   # Color13
bright_cyan = "#006465"   # Color14
bright_white = "#595959"   # Color15
