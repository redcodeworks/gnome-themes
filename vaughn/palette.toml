# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #25234f 5.5% towards fg
# derived: dark.surface derived: #25234f 16.0% towards fg
# derived: dark.surface_high derived: #25234f 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #25234f -> #252357 (the text colour varies per accent: the default needs its own token)
title = "Vaughn"
gtk_name = "Vaughn"
shell_name = "Vaughn-Shell"
credit = "Vaughn (colours of the Ptyxis built-in 'Vaughn'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Vaughn.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#25234f"],[53,"#2f2d56"],[66,"#424163"],
        [91,"#585772"],[145,"#7d7c8b"],[238,"#dcdccc"],[255,"#dcdccc"]]
fg = "#dcdccc"
top = "#dcdccc"
accent_fg = "#252357"
view = "#25234f"
[dark.fam]
blue = ["#15539e","#8cd0d3"]
red = ["#cc0000","#705050"]
orange = ["#f57900","#dfaf8f"]
green = ["#4e9a06","#60b48a"]
[dark.exact]
"#26ab62" = "#60b48a"
"#26a269" = "#60b48a"      # GTK4 stock success green
"#3584e4" = "#8cd0d3"
"#eeeeec" = "#dcdccc"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#25234f"],[34.67,"#25234f"],[55.33,"#2f2d56"],[66.33,"#424163"],
        [86.67,"#585772"],[156,"#a8a8a9"],[179,"#a8a8a9"],[250,"#dcdccc"],
        [255,"#dcdccc"]]
fg = "#dcdccc"
top = "#dcdccc"
accent_fg = "#252357"
view = "#25234f"
[shell.dark.fam]
blue = ["#3584e4","#8cd0d3"]
red = ["#c01c28","#705050"]
orange = ["#ff7800","#a88070"]
green = ["#26a269","#60b48a"]
[shell.dark.exact]
"#cd9309" = "#dfaf8f"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a8a8a9"      # web-login title, dim text
"#54545a" = "#424163"      # notification/message card: surface
"#45454a" = "#38375c"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#705050"
fg = "#dcdccc"
[accents.dark.green]
color = "#60b48a"
fg = "#252357"
[accents.dark.yellow]
color = "#dfaf8f"
fg = "#252357"
[accents.dark.blue]
color = "#5555ff"
fg = "#dcdccc"
[accents.dark.magenta]
color = "#f08cc3"
fg = "#252357"
[accents.dark.cyan]
color = "#8cd0d3"
fg = "#252357"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#25234f"
bg = "#2f2d56"
surface = "#424163"
surface_high = "#585772"
popover = "#585772"
fg = "#dcdccc"
red = "#705050"
green = "#60b48a"
yellow = "#dfaf8f"
accent = "#8cd0d3"
accent_fg = "#252357"
warning_fg = "#25234f"
secondary_sidebar = "#2f2d56"
