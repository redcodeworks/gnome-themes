# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #120b0d 5.5% towards fg
# derived: dark.surface derived: #120b0d 16.0% towards fg
# derived: dark.surface_high derived: #120b0d 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #120b0d -> #120b15 (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #c36e29 (it equals the default accent; keeps accent tokens unique)
title = "Mona Lisa"
gtk_name = "Mona-Lisa"
shell_name = "Mona-Lisa-Shell"
credit = "Mona Lisa (colours of the Ptyxis built-in 'Mona Lisa'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Mona%20Lisa.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#120b0d"],[53,"#1f1612"],[66,"#372b1c"],
        [91,"#524427"],[145,"#806c3a"],[238,"#f7d66a"],[255,"#f7d66a"]]
fg = "#f7d66a"
top = "#f7d66a"
accent_fg = "#120b15"
view = "#120b0d"
[dark.fam]
blue = ["#15539e","#c36e28"]
red = ["#cc0000","#9b291c"]
orange = ["#f57900","#c36e29"]
green = ["#4e9a06","#636232"]
[dark.exact]
"#26ab62" = "#636232"
"#26a269" = "#636232"      # GTK4 stock success green
"#3584e4" = "#c36e28"
"#eeeeec" = "#f7d66a"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#120b0d"],[34.67,"#120b0d"],[55.33,"#1f1612"],[66.33,"#372b1c"],
        [86.67,"#524427"],[156,"#b69c50"],[179,"#b69c50"],[250,"#f7d66a"],
        [255,"#f7d66a"]]
fg = "#f7d66a"
top = "#f7d66a"
accent_fg = "#120b15"
view = "#120b0d"
[shell.dark.fam]
blue = ["#3584e4","#c36e28"]
red = ["#c01c28","#9b291c"]
orange = ["#ff7800","#af4c22"]
green = ["#26a269","#636232"]
[shell.dark.exact]
"#cd9309" = "#c36e29"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b69c50"      # web-login title, dim text
"#54545a" = "#372b1c"      # notification/message card: surface
"#45454a" = "#2b2017"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#9b291c"
fg = "#f7d66a"
[accents.dark.green]
color = "#636232"
fg = "#f7d66a"
[accents.dark.yellow]
color = "#c36e28"
fg = "#120b15"
[accents.dark.blue]
color = "#515c5d"
fg = "#f7d66a"
[accents.dark.magenta]
color = "#9b1d29"
fg = "#f7d66a"
[accents.dark.cyan]
color = "#588056"
fg = "#120b15"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#120b0d"
bg = "#1f1612"
surface = "#372b1c"
surface_high = "#524427"
popover = "#524427"
fg = "#f7d66a"
red = "#9b291c"
green = "#636232"
yellow = "#c36e29"
accent = "#c36e28"
