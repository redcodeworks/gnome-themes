title = "Tomorrow"
gtk_name = "Tomorrow"
shell_name = "Tomorrow-Shell"
credit = "Tomorrow (colours of the Ptyxis built-in 'Tomorrow Night' and 'Tomorrow'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Tomorrow%20Night.yml)"
default_accent = "yellow"
dark_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1d1f21"],[53,"#26282a"],[66,"#383a3b"],
        [91,"#4c4e4f"],[145,"#6e7070"],[238,"#c5c8c6"],[255,"#c5c8c6"]]
fg = "#c5c8c6"
top = "#c5c8c6"
accent_fg = "#1d1f21"
view = "#1d1f21"
[dark.fam]
blue = ["#15539e","#f0c674"]
red = ["#cc0000","#cc6666"]
orange = ["#f57900","#f0c675"]
green = ["#4e9a06","#b5bd68"]
[dark.exact]
"#26ab62" = "#b5bd68"
"#26a269" = "#b5bd68"      # GTK4 stock success green
"#3584e4" = "#f0c674"
"#eeeeec" = "#c5c8c6"

[light]
ramp = [[0,"#4d4d4c"],[46,"#4d4d4c"],[145,"#acacac"],[224,"#efefef"],
        [237,"#f4f4f4"],[246,"#fafafa"],[255,"#ffffff"]]
fg = "#4d4d4c"
top = "#ffffff"
accent_fg = "#1d1f29"
view = "#ffffff"
[light.fam]
blue = ["#3584e4","#eab700"]
red = ["#cc0000","#c82828"]
orange = ["#f57900","#eab701"]
green = ["#4e9a06","#718c00"]
[light.exact]
"#33d17a" = "#718c00"
"#2ec27e" = "#718c00"      # GTK4 stock success green (light)
"#2e3436" = "#4d4d4c"
"#f6f5f4" = "#fafafa"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1d1f21"],[34.67,"#1d1f21"],[55.33,"#26282a"],[66.33,"#383a3b"],
        [86.67,"#4c4e4f"],[156,"#959897"],[179,"#959897"],[250,"#c5c8c6"],
        [255,"#c5c8c6"]]
fg = "#c5c8c6"
top = "#c5c8c6"
accent_fg = "#1d1f21"
view = "#1d1f21"
[shell.dark.fam]
blue = ["#3584e4","#f0c674"]
red = ["#c01c28","#cc6666"]
orange = ["#ff7800","#de966d"]
green = ["#26a269","#b5bd68"]
[shell.dark.exact]
"#cd9309" = "#f0c675"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#959897"      # web-login title, dim text
"#54545a" = "#383a3b"      # notification/message card: surface
"#45454a" = "#2f3132"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#4d4d4c"],[46,"#4d4d4c"],[145,"#acacac"],[224,"#efefef"],
        [237,"#f4f4f4"],[250,"#ffffff"],[255,"#ffffff"]]
fg = "#4d4d4c"
top = "#ffffff"
accent_fg = "#1d1f29"
view = "#ffffff"
[shell.light.fam]
blue = ["#3584e4","#eab700"]
red = ["#c01c28","#c82828"]
orange = ["#e66100","#d97014"]
green = ["#26a269","#718c00"]
[shell.light.exact]
"#e5a50a" = "#eab701"      # warning yellow
"#a5a5b7" = "#acacac"

