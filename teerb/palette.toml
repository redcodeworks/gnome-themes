title = "Teerb"
gtk_name = "Teerb"
shell_name = "Teerb-Shell"
credit = "Teerb (colours of the Ptyxis built-in 'Teerb'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Teerb.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#262626"],[53,"#2f2f2f"],[66,"#414141"],
        [91,"#565656"],[145,"#777777"],[238,"#d0d0d0"],[255,"#d0d0d0"]]
fg = "#d0d0d0"
top = "#d0d0d0"
accent_fg = "#262626"
view = "#262626"
[dark.fam]
blue = ["#15539e","#8adbb4"]
red = ["#cc0000","#d68686"]
orange = ["#f57900","#d7af87"]
green = ["#4e9a06","#aed686"]
[dark.exact]
"#26ab62" = "#aed686"
"#26a269" = "#aed686"      # GTK4 stock success green
"#3584e4" = "#8adbb4"
"#eeeeec" = "#d0d0d0"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#262626"],[34.67,"#262626"],[55.33,"#2f2f2f"],[66.33,"#414141"],
        [86.67,"#565656"],[156,"#a0a0a0"],[179,"#a0a0a0"],[250,"#d0d0d0"],
        [255,"#d0d0d0"]]
fg = "#d0d0d0"
top = "#d0d0d0"
accent_fg = "#262626"
view = "#262626"
[shell.dark.fam]
blue = ["#3584e4","#8adbb4"]
red = ["#c01c28","#d68686"]
orange = ["#ff7800","#d69a86"]
green = ["#26a269","#aed686"]
[shell.dark.exact]
"#cd9309" = "#d7af87"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a0a0a0"      # web-login title, dim text
"#54545a" = "#414141"      # notification/message card: surface
"#45454a" = "#383838"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#d68686"
fg = "#262626"
[accents.dark.green]
color = "#aed686"
fg = "#262626"
[accents.dark.yellow]
color = "#d7af87"
fg = "#262626"
[accents.dark.blue]
color = "#86aed6"
fg = "#262626"
[accents.dark.magenta]
color = "#d6aed6"
fg = "#262626"
[accents.dark.cyan]
color = "#8adbb4"
fg = "#262626"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#262626"
bg = "#2f2f2f"
surface = "#414141"
surface_high = "#565656"
popover = "#565656"
fg = "#d0d0d0"
red = "#d68686"
green = "#aed686"
yellow = "#d7af87"
