# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Teerb'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Teerb.yml.
title = "Teerb"
gtk_name = "Teerb"
shell_name = "Teerb-Shell"
credit = "Teerb (colours of the Ptyxis built-in 'Teerb'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Teerb.yml)"
ptyxis = "Teerb"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Teerb' (bulk-built by tools/bulk-scheme.py)."
default_accent = "cyan"

[dark]
bg_deep = "#262626"
fg = "#d0d0d0"
selection = "#484848"   # DERIVED
red = "#d68686"
orange = "#d69a86"   # DERIVED
yellow = "#d7af87"
green = "#aed686"
cyan = "#8adbb4"
blue = "#86aed6"
magenta = "#d6aed6"
purple = "#d6aed6"   # = magenta
# palette Color8 (bright black) = #1c1c1c: a candidate for `comment`
[dark.ansi]
red = "#d68686"
green = "#aed686"
yellow = "#d7af87"
blue = "#86aed6"
magenta = "#d6aed6"
cyan = "#8adbb4"
[dark.terminal]
source = "Teerb"   # Ptyxis built-in id
black = "#1c1c1c"   # Ptyxis Color0
bright_black = "#1c1c1c"   # Ptyxis Color8
bright_yellow = "#e4c9af"   # Ptyxis Color11
bright_cyan = "#b1e7dd"   # Ptyxis Color14
bright_white = "#efefef"   # Ptyxis Color15
