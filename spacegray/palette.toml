# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #20242d 5.5% towards fg
# derived: dark.surface derived: #20242d 16.0% towards fg
# derived: dark.surface_high derived: #20242d 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #e5c17a (it equals the default accent; keeps accent tokens unique)
title = "Spacegray"
gtk_name = "Spacegray"
shell_name = "Spacegray-Shell"
credit = "Spacegray (colours of the Ptyxis built-in 'Spacegray'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Spacegray.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#20242d"],[53,"#282c35"],[66,"#383c45"],
        [91,"#494d57"],[145,"#676b75"],[238,"#b3b8c3"],[255,"#b3b8c3"]]
fg = "#b3b8c3"
top = "#b3b8c3"
accent_fg = "#20242d"
view = "#20242d"
[dark.fam]
blue = ["#15539e","#e5c179"]
red = ["#cc0000","#b04b57"]
orange = ["#f57900","#e5c17a"]
green = ["#4e9a06","#87b379"]
[dark.exact]
"#26ab62" = "#87b379"
"#26a269" = "#87b379"      # GTK4 stock success green
"#3584e4" = "#e5c179"
"#eeeeec" = "#b3b8c3"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#20242d"],[34.67,"#20242d"],[55.33,"#282c35"],[66.33,"#383c45"],
        [86.67,"#494d57"],[156,"#898e98"],[179,"#898e98"],[250,"#b3b8c3"],
        [255,"#b3b8c3"]]
fg = "#b3b8c3"
top = "#b3b8c3"
accent_fg = "#20242d"
view = "#20242d"
[shell.dark.fam]
blue = ["#3584e4","#e5c179"]
red = ["#c01c28","#b04b57"]
orange = ["#ff7800","#ca8668"]
green = ["#26a269","#87b379"]
[shell.dark.exact]
"#cd9309" = "#e5c17a"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#898e98"      # web-login title, dim text
"#54545a" = "#383c45"      # notification/message card: surface
"#45454a" = "#30343d"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#b04b57"
fg = "#20242d"
[accents.dark.green]
color = "#87b379"
fg = "#20242d"
[accents.dark.yellow]
color = "#e5c179"
fg = "#20242d"
[accents.dark.blue]
color = "#7d8fa4"
fg = "#20242d"
[accents.dark.magenta]
color = "#a47996"
fg = "#20242d"
[accents.dark.cyan]
color = "#85a7a5"
fg = "#20242d"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#20242d"
bg = "#282c35"
surface = "#383c45"
surface_high = "#494d57"
popover = "#494d57"
fg = "#b3b8c3"
red = "#b04b57"
green = "#87b379"
yellow = "#e5c17a"
accent = "#e5c179"
accent_fg = "#20242d"
warning_fg = "#20242d"
secondary_sidebar = "#282c35"
