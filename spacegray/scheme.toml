# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Spacegray'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Spacegray.yml.
title = "Spacegray"
gtk_name = "Spacegray"
shell_name = "Spacegray-Shell"
credit = "Spacegray (colours of the Ptyxis built-in 'Spacegray'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Spacegray.yml)"
ptyxis = "Spacegray"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Spacegray' (bulk-built by tools/bulk-scheme.py)."
default_accent = "yellow"

[dark]
bg_deep = "#20242d"
fg = "#b3b8c3"
selection = "#3d424b"   # DERIVED
red = "#b04b57"
orange = "#ca8668"   # DERIVED
yellow = "#e5c179"
green = "#87b379"
cyan = "#85a7a5"
blue = "#7d8fa4"
magenta = "#a47996"
purple = "#a47996"   # = magenta
# palette Color8 (bright black) = #000000: a candidate for `comment`
[dark.ansi]
red = "#b04b57"
green = "#87b379"
yellow = "#e5c179"
blue = "#7d8fa4"
magenta = "#a47996"
cyan = "#85a7a5"
[dark.terminal]
source = "Spacegray"   # Ptyxis built-in id
black = "#000000"   # Ptyxis Color0
bright_black = "#000000"   # Ptyxis Color8
bright_white = "#ffffff"   # Ptyxis Color15
