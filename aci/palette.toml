# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #0d1926 5.5% towards fg
# derived: dark.surface derived: #0d1926 16.0% towards fg
# derived: dark.surface_high derived: #0d1926 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #0d1926 -> #0d192e (the text colour varies per accent: the default needs its own token)
# derived: dark.green nudged to #83ff09 (it equals the default accent; keeps accent tokens unique)
title = "Aci"
gtk_name = "Aci"
shell_name = "Aci-Shell"
credit = "Aci (colours of the Ptyxis built-in 'Aci'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Aci.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#0d1926"],[53,"#162432"],[66,"#283948"],
        [91,"#3c5162"],[145,"#5d798d"],[238,"#b4e1fd"],[255,"#b4e1fd"]]
fg = "#b4e1fd"
top = "#b4e1fd"
accent_fg = "#0d192e"
view = "#0d1926"
[dark.fam]
blue = ["#15539e","#83ff08"]
red = ["#cc0000","#ff0883"]
orange = ["#f57900","#ff8308"]
green = ["#4e9a06","#83ff09"]
[dark.exact]
"#26ab62" = "#83ff09"
"#26a269" = "#83ff09"      # GTK4 stock success green
"#3584e4" = "#83ff08"
"#eeeeec" = "#b4e1fd"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#0d1926"],[34.67,"#0d1926"],[55.33,"#162432"],[66.33,"#283948"],
        [86.67,"#3c5162"],[156,"#85a8c0"],[179,"#85a8c0"],[250,"#b4e1fd"],
        [255,"#b4e1fd"]]
fg = "#b4e1fd"
top = "#b4e1fd"
accent_fg = "#0d192e"
view = "#0d1926"
[shell.dark.fam]
blue = ["#3584e4","#83ff08"]
red = ["#c01c28","#ff0883"]
orange = ["#ff7800","#ff4646"]
green = ["#26a269","#83ff09"]
[shell.dark.exact]
"#cd9309" = "#ff8308"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#85a8c0"      # web-login title, dim text
"#54545a" = "#283948"      # notification/message card: surface
"#45454a" = "#1f2e3d"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff0883"
fg = "#0d192e"
[accents.dark.green]
