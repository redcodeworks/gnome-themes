fg = "#0d192e"
[accents.dark.blue]
color = "#0883ff"
fg = "#0d192e"
[accents.dark.magenta]
color = "#8308ff"
fg = "#b4e1fd"
[accents.dark.cyan]
color = "#08ff83"
fg = "#0d192e"

# roles for tools/libadwaita-gen.py
[roles.dark]
