# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #251200 -> #251208 (the text colour varies per accent: the default needs its own token)
title = "Frontend Fun Forrest"
gtk_name = "Frontend-Fun-Forrest"
shell_name = "Frontend-Fun-Forrest-Shell"
credit = "Frontend Fun Forrest (colours of the Ptyxis built-in 'Frontend Fun Forrest'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Frontend%20Fun%20Forrest.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#251200"],[53,"#2f1c06"],[66,"#432e10"],
        [91,"#59431c"],[145,"#7e6631"],[238,"#dec165"],[255,"#dec165"]]
fg = "#dec165"
top = "#dec165"
accent_fg = "#251208"
view = "#251200"
[dark.fam]
blue = ["#15539e","#da8213"]
red = ["#cc0000","#d6262b"]
orange = ["#f57900","#be8a13"]
green = ["#4e9a06","#919c00"]
[dark.exact]
"#26ab62" = "#919c00"
"#26a269" = "#919c00"      # GTK4 stock success green
"#3584e4" = "#da8213"
"#eeeeec" = "#dec165"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#251200"],[34.67,"#251200"],[55.33,"#2f1c06"],[66.33,"#432e10"],
        [86.67,"#59431c"],[156,"#aa9048"],[179,"#aa9048"],[250,"#dec165"],
        [255,"#dec165"]]
fg = "#dec165"
top = "#dec165"
accent_fg = "#251208"
view = "#251200"
[shell.dark.fam]
blue = ["#3584e4","#da8213"]
red = ["#c01c28","#d6262b"]
orange = ["#ff7800","#ca581f"]
green = ["#26a269","#919c00"]
[shell.dark.exact]
"#cd9309" = "#be8a13"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#aa9048"      # web-login title, dim text
"#54545a" = "#432e10"      # notification/message card: surface
"#45454a" = "#39250b"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
