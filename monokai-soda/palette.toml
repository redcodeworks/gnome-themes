title = "Monokai Soda"
gtk_name = "Monokai-Soda"
shell_name = "Monokai-Soda-Shell"
credit = "Monokai Soda (colours of the Ptyxis built-in 'Monokai Soda'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Monokai%20Soda.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1a1a1a"],[53,"#232323"],[66,"#353533"],
        [91,"#4a4a45"],[145,"#6b6c65"],[238,"#c4c5b5"],[255,"#c4c5b5"]]
fg = "#c4c5b5"
top = "#c4c5b5"
accent_fg = "#1a1a1a"
view = "#1a1a1a"
[dark.fam]
blue = ["#15539e","#98e024"]
red = ["#cc0000","#f4005f"]
orange = ["#f57900","#fa8419"]
green = ["#4e9a06","#98e025"]
[dark.exact]
"#26ab62" = "#98e025"
"#26a269" = "#98e025"      # GTK4 stock success green
"#3584e4" = "#98e024"
"#eeeeec" = "#c4c5b5"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1a1a1a"],[34.67,"#1a1a1a"],[55.33,"#232323"],[66.33,"#353533"],
        [86.67,"#4a4a45"],[156,"#949489"],[179,"#949489"],[250,"#c4c5b5"],
        [255,"#c4c5b5"]]
fg = "#c4c5b5"
top = "#c4c5b5"
accent_fg = "#1a1a1a"
view = "#1a1a1a"
[shell.dark.fam]
blue = ["#3584e4","#98e024"]
red = ["#c01c28","#f4005f"]
orange = ["#ff7800","#f7423c"]
green = ["#26a269","#98e025"]
[shell.dark.exact]
"#cd9309" = "#fa8419"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#949489"      # web-login title, dim text
"#54545a" = "#353533"      # notification/message card: surface
"#45454a" = "#2c2c2b"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
