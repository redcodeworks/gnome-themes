# SPDX-License-Identifier: MIT
# Everforest (sainnhe/everforest, MIT, Copyright (c) 2019 sainnhe), medium contrast, dark + light.
# Ladder by Gruvbox Material's mapping: view bg0, window bg1, headers bg3, popovers bg5 (light: bg0, bg1, bg3, bg4).
# ANSI six = Ptyxis "Everforest" Color1-6 ([Dark] and [Light]): red green yellow blue, purple as magenta, aqua as cyan.
# Default accent green (Everforest's primary). Light accent_fg is Everforest dark bg_dim #232a2e: the light accents are
# too bright for cream text (green #8da101 would give 2.7:1).
title = "Everforest"
gtk_name = "Everforest"
shell_name = "Everforest-Shell"
credit = "Everforest by sainnhe (MIT)"
default_accent = "green"

[dark]
bg_deep = "#2d353b"
bg = "#343f44"
surface = "#475258"
surface_high = "#56635f"
fg = "#d3c6aa"
fg_dim = "#9da9a0"
comment = "#859289"
selection = "#543a48"
red = "#e67e80"
orange = "#e69875"
yellow = "#dbbc7f"
green = "#a7c080"
cyan = "#83c092"
blue = "#7fbbb3"
magenta = "#d699b6"
purple = "#d699b6"
[dark.ansi]
