# SPDX-License-Identifier: MIT
# Everforest (sainnhe/everforest, MIT, Copyright (c) 2019 sainnhe), medium contrast, dark + light.
# Ladder by Gruvbox Material's mapping: view bg0, window bg1, headers bg3, popovers bg5 (light: bg0, bg1, bg3, bg4).
# ANSI six = Ptyxis "Everforest" Color1-6 ([Dark] and [Light]): red green yellow blue, purple as magenta, aqua as cyan.
# Default accent green (Everforest's primary). Light accent_fg is Everforest dark bg_dim #232a2e: the light accents are
# too bright for cream text (green #8da101 would give 2.7:1).
title = "Everforest"
gtk_name = "Everforest"
shell_name = "Everforest-Shell"
credit = "Everforest by sainnhe (MIT)"
default_accent = "green"

[dark]
bg_deep = "#2d353b"
bg = "#343f44"
surface = "#475258"
surface_high = "#56635f"
fg = "#d3c6aa"
fg_dim = "#9da9a0"
comment = "#859289"
selection = "#543a48"
red = "#e67e80"
orange = "#e69875"
yellow = "#dbbc7f"
green = "#a7c080"
cyan = "#83c092"
blue = "#7fbbb3"
magenta = "#d699b6"
purple = "#d699b6"
[dark.ansi]
orange = "#e69875"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#e67e80"
green = "#a7c080"
yellow = "#dbbc7f"
blue = "#7fbbb3"
magenta = "#d699b6"
cyan = "#83c092"

[light]
bg_deep = "#fdf6e3"
bg = "#f4f0d9"
surface = "#e6e2cc"
surface_high = "#e0dcc7"
fg = "#5c6a72"
fg_dim = "#829181"
comment = "#939f91"
selection = "#eaedc8"
accent_fg = "#232a2e"
red = "#f85552"
orange = "#f57d26"
yellow = "#dfa000"
green = "#8da101"
cyan = "#35a77c"
blue = "#3a94c5"
magenta = "#df69ba"
purple = "#df69ba"
[light.ansi]
orange = "#f57d26"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#f85552"
green = "#8da101"
yellow = "#dfa000"
blue = "#3a94c5"
magenta = "#df69ba"
cyan = "#35a77c"

# Terminal palette overrides (tools/ptyxis-gen.py). Source (checked 2026-11-07 with tools/ptyxis-palette.sh): the Ptyxis built-in palette(s) named below,
# whose six ANSI colours equal this scheme's; their black and REAL brights are taken wherever they differ from the generator defaults
# (a bright black equal to the background is skipped: it would be invisible; the default `comment` stays). Each key notes the Color it is.
# dark variant <- Ptyxis "Everforest [Dark]"
[dark.terminal]
black = "#4b565c"   # Color0
bright_black = "#5c6a72"   # Color8
bright_red = "#f85552"   # Color9
bright_green = "#8da101"   # Color10
bright_yellow = "#dfa000"   # Color11
bright_blue = "#3a94c5"   # Color12
bright_magenta = "#df69ba"   # Color13
bright_cyan = "#35a77c"   # Color14
bright_white = "#dfddc8"   # Color15
# light variant <- Ptyxis "Everforest [Light]"
[light.terminal]
black = "#5c6a72"   # Color0
bright_black = "#4b565c"   # Color8
bright_red = "#e67e80"   # Color9
bright_green = "#a7c080"   # Color10
bright_yellow = "#dbbc7f"   # Color11
bright_blue = "#7fbbb3"   # Color12
bright_magenta = "#d699b6"   # Color13
bright_cyan = "#83c092"   # Color14
bright_white = "#d3c6aa"   # Color15
