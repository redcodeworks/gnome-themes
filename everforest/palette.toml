# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.green nudged to #a7c081 (it equals the default accent; keeps accent tokens unique)
# derived: light.green nudged to #8da102 (it equals the default accent; keeps accent tokens unique)
title = "Everforest"
gtk_name = "Everforest"
shell_name = "Everforest-Shell"
credit = "Everforest by sainnhe (MIT)"
default_accent = "green"
dark_only = false

[dark]
ramp = [[0,"#000000"],[45,"#2d353b"],[53,"#343f44"],[66,"#475258"],
        [91,"#56635f"],[145,"#859289"],[238,"#d3c6aa"],[255,"#d3c6aa"]]
fg = "#d3c6aa"
top = "#d3c6aa"
accent_fg = "#2d353b"
view = "#2d353b"
[dark.fam]
blue = ["#15539e","#a7c080"]
red = ["#cc0000","#e67e80"]
orange = ["#f57900","#dbbc7f"]
green = ["#4e9a06","#a7c081"]
[dark.exact]
"#26ab62" = "#a7c081"
"#26a269" = "#a7c081"      # GTK4 stock success green
"#3584e4" = "#a7c080"
"#eeeeec" = "#d3c6aa"

[light]
ramp = [[0,"#5c6a72"],[46,"#5c6a72"],[145,"#939f91"],[224,"#e0dcc7"],
        [237,"#e6e2cc"],[246,"#f4f0d9"],[255,"#fdf6e3"]]
fg = "#5c6a72"
top = "#fdf6e3"
accent_fg = "#232a2e"
view = "#fdf6e3"
[light.fam]
blue = ["#3584e4","#8da101"]
red = ["#cc0000","#f85552"]
orange = ["#f57900","#dfa000"]
green = ["#4e9a06","#8da102"]
[light.exact]
"#33d17a" = "#8da102"
"#2ec27e" = "#8da102"      # GTK4 stock success green (light)
"#2e3436" = "#5c6a72"
"#f6f5f4" = "#f4f0d9"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2d353b"],[34.67,"#2d353b"],[55.33,"#343f44"],[66.33,"#475258"],
        [86.67,"#56635f"],[156,"#9da9a0"],[179,"#9da9a0"],[250,"#d3c6aa"],
        [255,"#d3c6aa"]]
fg = "#d3c6aa"
top = "#d3c6aa"
accent_fg = "#2d353b"
view = "#2d353b"
[shell.dark.fam]
blue = ["#3584e4","#a7c080"]
red = ["#c01c28","#e67e80"]
orange = ["#ff7800","#e69875"]
green = ["#26a269","#a7c081"]
[shell.dark.exact]
"#cd9309" = "#dbbc7f"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9da9a0"      # web-login title, dim text
"#54545a" = "#475258"      # notification/message card: surface
"#45454a" = "#3e484e"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#5c6a72"],[46,"#5c6a72"],[145,"#939f91"],[224,"#e0dcc7"],
        [237,"#e6e2cc"],[250,"#fdf6e3"],[255,"#fdf6e3"]]
fg = "#5c6a72"
top = "#fdf6e3"
accent_fg = "#232a2e"
view = "#fdf6e3"
[shell.light.fam]
blue = ["#3584e4","#8da101"]
red = ["#c01c28","#f85552"]
orange = ["#e66100","#f57d26"]
green = ["#26a269","#8da102"]
[shell.light.exact]
"#e5a50a" = "#dfa000"      # warning yellow
"#a5a5b7" = "#939f91"

