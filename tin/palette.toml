# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #2e2e35 5.5% towards fg
# derived: dark.surface derived: #2e2e35 16.0% towards fg
# derived: dark.surface_high derived: #2e2e35 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #2e2e35 -> #2e2e3d (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #888d4f (it equals the default accent; keeps accent tokens unique)
title = "Tin"
gtk_name = "Tin"
shell_name = "Tin-Shell"
credit = "Tin (colours of the Ptyxis built-in 'Tin'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Tin.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#2e2e35"],[53,"#393940"],[66,"#4f4f55"],
        [91,"#69696e"],[145,"#929296"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#2e2e3d"
view = "#2e2e35"
[dark.fam]
blue = ["#15539e","#888d4e"]
red = ["#cc0000","#8d534e"]
orange = ["#f57900","#888d4f"]
green = ["#4e9a06","#4e8d53"]
[dark.exact]
"#26ab62" = "#4e8d53"
"#26a269" = "#4e8d53"      # GTK4 stock success green
"#3584e4" = "#888d4e"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2e2e35"],[34.67,"#2e2e35"],[55.33,"#393940"],[66.33,"#4f4f55"],
        [86.67,"#69696e"],[156,"#c4c4c6"],[179,"#c4c4c6"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#2e2e3d"
view = "#2e2e35"
[shell.dark.fam]
blue = ["#3584e4","#888d4e"]
red = ["#c01c28","#8d534e"]
orange = ["#ff7800","#8a704e"]
green = ["#26a269","#4e8d53"]
[shell.dark.exact]
"#cd9309" = "#888d4f"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c4c4c6"      # web-login title, dim text
"#54545a" = "#4f4f55"      # notification/message card: surface
"#45454a" = "#44444a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#8d534e"
fg = "#ffffff"
[accents.dark.green]
color = "#4e8d53"
fg = "#ffffff"
[accents.dark.yellow]
color = "#888d4e"
fg = "#2e2e3d"
[accents.dark.blue]
color = "#534e8d"
fg = "#ffffff"
[accents.dark.magenta]
color = "#8d4e88"
fg = "#ffffff"
[accents.dark.cyan]
color = "#4e888d"
fg = "#ffffff"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#2e2e35"
bg = "#393940"
surface = "#4f4f55"
surface_high = "#69696e"
popover = "#69696e"
fg = "#ffffff"
red = "#8d534e"
green = "#4e8d53"
yellow = "#888d4f"
accent = "#888d4e"
accent_fg = "#2e2e3d"
warning_fg = "#2e2e35"
secondary_sidebar = "#393940"
