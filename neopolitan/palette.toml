# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #271f19 5.5% towards fg
# derived: dark.surface derived: #271f19 16.0% towards fg
# derived: dark.surface_high derived: #271f19 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #271f19 -> #271f21 (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #fbde2e (it equals the default accent; keeps accent tokens unique)
title = "Neopolitan"
gtk_name = "Neopolitan"
shell_name = "Neopolitan-Shell"
credit = "Neopolitan (colours of the Ptyxis built-in 'Neopolitan'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Neopolitan.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#271f19"],[53,"#332b26"],[66,"#4a433e"],
        [91,"#635e59"],[145,"#8f8a88"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#271f21"
view = "#271f19"
[dark.fam]
blue = ["#15539e","#fbde2d"]
red = ["#cc0000","#800000"]
orange = ["#f57900","#fbde2e"]
green = ["#4e9a06","#61ce3c"]
[dark.exact]
"#26ab62" = "#61ce3c"
"#26a269" = "#61ce3c"      # GTK4 stock success green
"#3584e4" = "#fbde2d"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#271f19"],[34.67,"#271f19"],[55.33,"#332b26"],[66.33,"#4a433e"],
        [86.67,"#635e59"],[156,"#c2bfbe"],[179,"#c2bfbe"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#271f21"
view = "#271f19"
[shell.dark.fam]
blue = ["#3584e4","#fbde2d"]
red = ["#c01c28","#800000"]
orange = ["#ff7800","#be6f16"]
green = ["#26a269","#61ce3c"]
[shell.dark.exact]
"#cd9309" = "#fbde2e"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c2bfbe"      # web-login title, dim text
"#54545a" = "#4a433e"      # notification/message card: surface
"#45454a" = "#3e3732"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#800000"
fg = "#ffffff"
[accents.dark.green]
color = "#61ce3c"
fg = "#271f21"
[accents.dark.yellow]
color = "#fbde2d"
fg = "#271f21"
[accents.dark.blue]
color = "#253b76"
fg = "#ffffff"
[accents.dark.magenta]
color = "#ff0080"
fg = "#271f21"
[accents.dark.cyan]
color = "#8da6ce"
fg = "#271f21"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#271f19"
bg = "#332b26"
surface = "#4a433e"
surface_high = "#635e59"
popover = "#635e59"
fg = "#ffffff"
red = "#800000"
green = "#61ce3c"
yellow = "#fbde2e"
accent = "#fbde2d"
accent_fg = "#271f21"
warning_fg = "#271f19"
secondary_sidebar = "#332b26"
