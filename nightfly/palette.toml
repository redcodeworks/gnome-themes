# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #011627 5.5% towards fg
# derived: dark.surface derived: #011627 16.0% towards fg
# derived: dark.surface_high derived: #011627 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #e3d18b (it equals the default accent; keeps accent tokens unique)
title = "Nightfly"
gtk_name = "Nightfly"
shell_name = "Nightfly-Shell"
credit = "Nightfly (colours of the Ptyxis built-in 'Nightfly'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Nightfly.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#011627"],[53,"#0b1f30"],[66,"#1f3140"],
        [91,"#364654"],[145,"#5b6874"],[238,"#bdc1c6"],[255,"#bdc1c6"]]
fg = "#bdc1c6"
top = "#bdc1c6"
accent_fg = "#011627"
view = "#011627"
[dark.fam]
blue = ["#15539e","#e3d18a"]
red = ["#cc0000","#fc514e"]
orange = ["#f57900","#e3d18b"]
green = ["#4e9a06","#a1cd5e"]
[dark.exact]
"#26ab62" = "#a1cd5e"
"#26a269" = "#a1cd5e"      # GTK4 stock success green
"#3584e4" = "#e3d18a"
"#eeeeec" = "#bdc1c6"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#011627"],[34.67,"#011627"],[55.33,"#0b1f30"],[66.33,"#1f3140"],
        [86.67,"#364654"],[156,"#889099"],[179,"#889099"],[250,"#bdc1c6"],
        [255,"#bdc1c6"]]
fg = "#bdc1c6"
top = "#bdc1c6"
accent_fg = "#011627"
view = "#011627"
[shell.dark.fam]
blue = ["#3584e4","#e3d18a"]
red = ["#c01c28","#fc514e"]
orange = ["#ff7800","#f0916c"]
green = ["#26a269","#a1cd5e"]
[shell.dark.exact]
"#cd9309" = "#e3d18b"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#889099"      # web-login title, dim text
"#54545a" = "#1f3140"      # notification/message card: surface
"#45454a" = "#152838"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#fc514e"
fg = "#011627"
[accents.dark.green]
color = "#a1cd5e"
fg = "#011627"
[accents.dark.yellow]
color = "#e3d18a"
fg = "#011627"
[accents.dark.blue]
color = "#82aaff"
fg = "#011627"
[accents.dark.magenta]
color = "#c792ea"
fg = "#011627"
[accents.dark.cyan]
color = "#7fdbca"
fg = "#011627"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#011627"
bg = "#0b1f30"
surface = "#1f3140"
surface_high = "#364654"
popover = "#364654"
fg = "#bdc1c6"
