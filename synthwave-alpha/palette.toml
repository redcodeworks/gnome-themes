# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #241b30 5.5% towards fg
# derived: dark.surface derived: #241b30 16.0% towards fg
# derived: dark.surface_high derived: #241b30 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #241b30 -> #241b38 (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #adad3f (it equals the default accent; keeps accent tokens unique)
title = "Synthwave Alpha"
gtk_name = "Synthwave-Alpha"
shell_name = "Synthwave-Alpha-Shell"
credit = "Synthwave Alpha (colours of the Ptyxis built-in 'Synthwave Alpha'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Synthwave%20Alpha.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#241b30"],[53,"#2f273a"],[66,"#453d4d"],
        [91,"#5e5762"],[145,"#878286"],[238,"#f2f2e3"],[255,"#f2f2e3"]]
fg = "#f2f2e3"
top = "#f2f2e3"
accent_fg = "#241b38"
view = "#241b30"
[dark.fam]
blue = ["#15539e","#adad3e"]
red = ["#cc0000","#9a0048"]
orange = ["#f57900","#adad3f"]
green = ["#4e9a06","#00986c"]
[dark.exact]
"#26ab62" = "#00986c"
"#26a269" = "#00986c"      # GTK4 stock success green
"#3584e4" = "#adad3e"
"#eeeeec" = "#f2f2e3"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#241b30"],[34.67,"#241b30"],[55.33,"#2f273a"],[66.33,"#453d4d"],
        [86.67,"#5e5762"],[156,"#b8b5b0"],[179,"#b8b5b0"],[250,"#f2f2e3"],
        [255,"#f2f2e3"]]
fg = "#f2f2e3"
top = "#f2f2e3"
accent_fg = "#241b38"
view = "#241b30"
[shell.dark.fam]
blue = ["#3584e4","#adad3e"]
red = ["#c01c28","#9a0048"]
orange = ["#ff7800","#a45643"]
green = ["#26a269","#00986c"]
[shell.dark.exact]
"#cd9309" = "#adad3f"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b8b5b0"      # web-login title, dim text
"#54545a" = "#453d4d"      # notification/message card: surface
"#45454a" = "#3a3244"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#9a0048"
fg = "#f2f2e3"
[accents.dark.green]
color = "#00986c"
fg = "#241b38"
[accents.dark.yellow]
color = "#adad3e"
fg = "#241b38"
[accents.dark.blue]
color = "#6e29ad"
fg = "#f2f2e3"
[accents.dark.magenta]
color = "#b300ad"
fg = "#f2f2e3"
[accents.dark.cyan]
color = "#00b0b1"
fg = "#241b38"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#241b30"
bg = "#2f273a"
surface = "#453d4d"
surface_high = "#5e5762"
popover = "#5e5762"
fg = "#f2f2e3"
red = "#9a0048"
green = "#00986c"
yellow = "#adad3f"
accent = "#adad3e"
