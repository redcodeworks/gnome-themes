# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #222324 5.5% towards fg
# derived: dark.surface derived: #222324 16.0% towards fg
# derived: dark.surface_high derived: #222324 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #f2d42d (it equals the default accent; keeps accent tokens unique)
title = "Darkside"
gtk_name = "Darkside"
shell_name = "Darkside-Shell"
credit = "Darkside (colours of the Ptyxis built-in 'Darkside'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Darkside.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#222324"],[53,"#2a2b2c"],[66,"#3a3b3c"],
        [91,"#4d4d4e"],[145,"#6b6b6c"],[238,"#bababa"],[255,"#bababa"]]
fg = "#bababa"
top = "#bababa"
accent_fg = "#222324"
view = "#222324"
[dark.fam]
blue = ["#15539e","#f2d42c"]
red = ["#cc0000","#e8341c"]
orange = ["#f57900","#f2d42d"]
green = ["#4e9a06","#68c256"]
[dark.exact]
"#26ab62" = "#68c256"
"#26a269" = "#68c256"      # GTK4 stock success green
"#3584e4" = "#f2d42c"
"#eeeeec" = "#bababa"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#222324"],[34.67,"#222324"],[55.33,"#2a2b2c"],[66.33,"#3a3b3c"],
        [86.67,"#4d4d4e"],[156,"#8f8f8f"],[179,"#8f8f8f"],[250,"#bababa"],
        [255,"#bababa"]]
fg = "#bababa"
top = "#bababa"
accent_fg = "#222324"
view = "#222324"
[shell.dark.fam]
blue = ["#3584e4","#f2d42c"]
red = ["#c01c28","#e8341c"]
orange = ["#ff7800","#ed8424"]
green = ["#26a269","#68c256"]
[shell.dark.exact]
"#cd9309" = "#f2d42d"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#8f8f8f"      # web-login title, dim text
"#54545a" = "#3a3b3c"      # notification/message card: surface
"#45454a" = "#323334"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#e8341c"
fg = "#222324"
[accents.dark.green]
color = "#68c256"
fg = "#222324"
[accents.dark.yellow]
color = "#f2d42c"
fg = "#222324"
[accents.dark.blue]
color = "#1c98e8"
fg = "#222324"
[accents.dark.magenta]
color = "#8e69c9"
fg = "#222324"
[accents.dark.cyan]
color = "#1c98e8"
fg = "#222324"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#222324"
bg = "#2a2b2c"
surface = "#3a3b3c"
surface_high = "#4d4d4e"
popover = "#4d4d4e"
fg = "#bababa"
red = "#e8341c"
green = "#68c256"
yellow = "#f2d42d"
accent = "#f2d42c"
accent_fg = "#222324"
warning_fg = "#222324"
secondary_sidebar = "#2a2b2c"
