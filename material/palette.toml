# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #212121 5.5% towards fg
# derived: dark.surface derived: #212121 16.0% towards fg
# derived: dark.surface_high derived: #212121 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: light.bg derived: #fafafa 3.0% towards fg
# derived: light.surface derived: #fafafa 6.0% towards fg
# derived: light.surface_high derived: #fafafa 9.0% towards fg
# derived: light.fg_dim derived: fg 30% towards bg
# derived: light.comment derived: fg 55% towards bg
# derived: dark.orange nudged to #f78c74 (it equals the default accent; keeps accent tokens unique)
# derived: light.accent_fg #212121 -> #212129 (the text colour varies per accent: the default needs its own token)
# derived: light.orange nudged to #f76d4f (it equals the default accent; keeps accent tokens unique)
title = "Material"
gtk_name = "Material"
shell_name = "Material-Shell"
credit = "Material Theme by Mattia Astorino (Sublime port, MIT), Darker and Lighter"
default_accent = "orange"
dark_only = false

[dark]
ramp = [[0,"#000000"],[45,"#212121"],[53,"#292a2a"],[66,"#383a3b"],
        [91,"#494d4f"],[145,"#666d70"],[238,"#b0bec5"],[255,"#b0bec5"]]
fg = "#b0bec5"
top = "#b0bec5"
accent_fg = "#212121"
view = "#212121"
[dark.fam]
blue = ["#15539e","#f78c6c"]
red = ["#cc0000","#f07178"]
orange = ["#f57900","#ffcb6b"]
green = ["#4e9a06","#c3e88d"]
[dark.exact]
"#26ab62" = "#c3e88d"
"#26a269" = "#c3e88d"      # GTK4 stock success green
"#3584e4" = "#f78c6c"
"#eeeeec" = "#b0bec5"

[light]
ramp = [[0,"#546e7a"],[46,"#546e7a"],[145,"#adb9be"],[224,"#ebedee"],
        [237,"#f0f2f2"],[246,"#f5f6f6"],[255,"#fafafa"]]
fg = "#546e7a"
top = "#fafafa"
accent_fg = "#212129"
view = "#fafafa"
[light.fam]
blue = ["#3584e4","#f76d47"]
red = ["#cc0000","#e53935"]
orange = ["#f57900","#ffb62c"]
green = ["#4e9a06","#91b859"]
[light.exact]
"#33d17a" = "#91b859"
"#2ec27e" = "#91b859"      # GTK4 stock success green (light)
"#2e3436" = "#546e7a"
"#f6f5f4" = "#f5f6f6"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#212121"],[34.67,"#212121"],[55.33,"#292a2a"],[66.33,"#383a3b"],
        [86.67,"#494d4f"],[156,"#889296"],[179,"#889296"],[250,"#b0bec5"],
        [255,"#b0bec5"]]
fg = "#b0bec5"
top = "#b0bec5"
accent_fg = "#212121"
view = "#212121"
[shell.dark.fam]
blue = ["#3584e4","#f78c6c"]
red = ["#c01c28","#f07178"]
orange = ["#ff7800","#f78c74"]
green = ["#26a269","#c3e88d"]
[shell.dark.exact]
"#cd9309" = "#ffcb6b"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#889296"      # web-login title, dim text
"#54545a" = "#383a3b"      # notification/message card: surface
"#45454a" = "#303232"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#546e7a"],[46,"#546e7a"],[145,"#adb9be"],[224,"#ebedee"],
        [237,"#f0f2f2"],[250,"#fafafa"],[255,"#fafafa"]]
fg = "#546e7a"
top = "#fafafa"
accent_fg = "#212129"
view = "#fafafa"
[shell.light.fam]
blue = ["#3584e4","#f76d47"]
red = ["#c01c28","#e53935"]
orange = ["#e66100","#f76d4f"]
green = ["#26a269","#91b859"]
[shell.light.exact]
"#e5a50a" = "#ffb62c"      # warning yellow
"#a5a5b7" = "#adb9be"

