# SPDX-License-Identifier: MIT
# Material Theme by Mattia Astorino, Sublime Text port (SublimeText/material-theme, MIT, Copyright (c) 2016 Mattia Astorino):
# Darker dark + Lighter light. The official VS Code "Material Theme" is a commercial product and was NOT used or consulted.
# VERIFIED against the raw schemes/Material-Theme-{Darker,Lighter}.tmTheme (2026-11-07): Darker background #212121, red #F07178,
# orange #F78C6C, yellow #FFCB6B, green #C3E88D, cyan #89DDFF, blue #82AAFF, purple #C792EA, selection/gutter #424242; Lighter
# background #FAFAFA, red #E53935, orange #F76D47, yellow #FFB62C, green #91B859, cyan #39ADB5, blue #6182B8, purple #7C4DFF,
# greys #E7EAEC and #CFD8DC. NOT verifiable from the raw files: the text colours fg #B0BEC5 (Darker) and #546E7A (Lighter) are the
# Material UI text colours from the project documentation (the Sublime tmTheme uses #EEFFFF and #80CBC4 as editor foregrounds,
# which are glaring or too faint for a desktop UI); Lighter's bg_deep is the tmTheme background, its window step is DERIVED.
# Ladder dark: Darker publishes none, so bg, surface and surface_high are DERIVED from #212121 towards fg by the fixed rules.
# Light: also DERIVED (light rule, 3/6/9 %): the tmTheme's greys #e7eaec/#cfd8dc were tried as surface/surface_high but give
# #546e7a text only 4.5:1 and 3.7:1 (selection #cfd8dc is kept). fg_dim and comment derived.
# ANSI six, light: the Material accents of the tmTheme above (magenta = purple); Ptyxis has no light Material, so these stay. Dark: see
# TERMINAL FIRST below (it used to follow the tmTheme as well).
# Default accent orange (the seventh accent, the scheme's own orange role colour): Darker's UI accent is orange #FF9800, and Darker's
# tmTheme orange is #F78C6C. The single default_accent serves both variants, so Lighter gets its orange #F76D47 too (Lighter's own
# UI accent is cyan #00BCD4; cyan stays selectable).
# TERMINAL FIRST (2026-11-07): the Ptyxis built-in named in [<variant>.terminal] `source` is the starting point and the source of truth. bg_deep and fg are its
# Background and Foreground, the six accents its Color1-6, the real black, white and brights are in the terminal table. Where an older note above gives other
# values, THIS block and the values below supersede it. A colour that still differs from its source is a listed nudge ([<variant>.nudge], with its reason).
# Source dark: Material (Gogh's terminal scheme: background #1e282c, fg #c3c7d1, red #eb606b, green #c3e88d, yellow #f7eb95, blue #80cbc3, magenta #ff2490, cyan #aeddff),
# which replaces the Darker tmTheme values above for the dark variant. Light: NO built-in (the built-in of that name is dark only), the Lighter values stay;
# the two variants now come from different lineages. The explicit-less ladder is derived from the new bg_deep.
title = "Material"
gtk_name = "Material"
shell_name = "Material-Shell"
credit = "Material Theme by Mattia Astorino (Sublime port, MIT), Darker and Lighter"
ptyxis = "generated"
ptyxis_reason = "the Material built-in is the dark source (no nudges) but it is flat and dark only and there is no light built-in, so a flat built-in would lose light/dark switching; the generated pair palette carries the built-in's dark colours and this scheme's own light ones"
default_accent = "orange"

[dark]
bg_deep = "#1e282c"
fg = "#c3c7d1"
selection = "#424242"
red = "#eb606b"
orange = "#f78c6c"
yellow = "#f7eb95"
green = "#c3e88d"
cyan = "#aeddff"
blue = "#80cbc3"
magenta = "#ff2490"
purple = "#ff2490"
pink = "#ff5370"
[dark.ansi]
orange = "#f78c6c"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#eb606b"
green = "#c3e88d"
yellow = "#f7eb95"
blue = "#80cbc3"
magenta = "#ff2490"
cyan = "#aeddff"

[light]
bg_deep = "#fafafa"
fg = "#546e7a"
selection = "#cfd8dc"
red = "#e53935"
orange = "#f76d47"
yellow = "#ffb62c"
green = "#91b859"
cyan = "#39adb5"
blue = "#6182b8"
magenta = "#7c4dff"
purple = "#7c4dff"
pink = "#ff5370"
[light.ansi]
orange = "#f76d47"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#e53935"
green = "#91b859"
yellow = "#ffb62c"
blue = "#6182b8"
magenta = "#7c4dff"
cyan = "#39adb5"

# Terminal palette: the Ptyxis built-in named in `source` is the starting point and the source of truth for the variant (the terminal comes first,
# the toolkit themes follow). Background and Foreground are bg_deep and fg above, the six accents are [<variant>.ansi]; the real black, white and brights
# are below. A colour that differs from its source is listed in [<variant>.nudge] with the reason (tools/ptyxis-compare.py --check enforces this).

[dark.terminal]
source = "Material"   # Ptyxis built-in, checked 2026-11-07 with tools/ptyxis-palette.sh
black = "#073641"   # Color0
white = "#ffffff"   # Color7
bright_black = "#002b36"   # Color8
bright_red = "#eb606b"   # Color9
bright_green = "#c3e88d"   # Color10
bright_yellow = "#f7eb95"   # Color11
bright_blue = "#7dc6bf"   # Color12
bright_magenta = "#6c71c3"   # Color13
bright_cyan = "#34434d"   # Color14
bright_white = "#ffffff"   # Color15

[light.terminal]
no_builtin = "no Ptyxis built-in has a light Material (the built-in of that name is dark only); the values stay as before"
