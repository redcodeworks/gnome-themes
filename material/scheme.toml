# Material Theme by Mattia Astorino, Sublime Text port (SublimeText/material-theme, MIT, Copyright (c) 2016 Mattia Astorino):
# Darker dark + Lighter light. The official VS Code "Material Theme" is a commercial product and was NOT used or consulted.
# VERIFIED against the raw schemes/Material-Theme-{Darker,Lighter}.tmTheme (2026-11-07): Darker background #212121, red #F07178,
# orange #F78C6C, yellow #FFCB6B, green #C3E88D, cyan #89DDFF, blue #82AAFF, purple #C792EA, selection/gutter #424242; Lighter
# background #FAFAFA, red #E53935, orange #F76D47, yellow #FFB62C, green #91B859, cyan #39ADB5, blue #6182B8, purple #7C4DFF,
# greys #E7EAEC and #CFD8DC. NOT verifiable from the raw files: the text colours fg #B0BEC5 (Darker) and #546E7A (Lighter) are the
# Material UI text colours from the project documentation (the Sublime tmTheme uses #EEFFFF and #80CBC4 as editor foregrounds,
# which are glaring or too faint for a desktop UI); Lighter's bg_deep is the tmTheme background, its window step is DERIVED.
# Ladder dark: Darker publishes none, so bg, surface and surface_high are DERIVED from #212121 towards fg by the fixed rules.
# Light: also DERIVED (light rule, 3/6/9 %): the tmTheme's greys #e7eaec/#cfd8dc were tried as surface/surface_high but give
# #546e7a text only 4.5:1 and 3.7:1 (selection #cfd8dc is kept). fg_dim and comment derived.
# ANSI six: the Material accents of the tmTheme above (magenta = purple). Ptyxis' "Material" palette was NOT used on purpose: it
# is Gogh's separate terminal scheme (background #1E282C, magenta #FF2490, yellow #F7EB95), not the Darker/Lighter themes, and it
# has no light counterpart, so one lineage was kept for both variants.
# Default accent yellow: Darker's UI accent is orange #FF9800, which is not a terminal colour; of the six, yellow (#FFCB6B,
# hue 40 against orange's 36) is nearest. Lighter's own UI accent is cyan #00BCD4; the single default_accent of a scheme serves both
# variants, so Lighter gets yellow (#FFB62C) too (weak as a ring on #FAFAFA: 1.7:1; cyan would be 2.6:1, also under 3:1).
title = "Material"
gtk_name = "Material"
shell_name = "Material-Shell"
credit = "Material Theme by Mattia Astorino (Sublime port, MIT), Darker and Lighter"
default_accent = "yellow"

[dark]
bg_deep = "#212121"
fg = "#b0bec5"
selection = "#424242"
red = "#f07178"
orange = "#f78c6c"
yellow = "#ffcb6b"
green = "#c3e88d"
cyan = "#89ddff"
blue = "#82aaff"
magenta = "#c792ea"
purple = "#c792ea"
pink = "#ff5370"
[dark.ansi]
red = "#f07178"
green = "#c3e88d"
yellow = "#ffcb6b"
blue = "#82aaff"
magenta = "#c792ea"
cyan = "#89ddff"

[light]
bg_deep = "#fafafa"
fg = "#546e7a"
selection = "#cfd8dc"
red = "#e53935"
orange = "#f76d47"
yellow = "#ffb62c"
green = "#91b859"
cyan = "#39adb5"
blue = "#6182b8"
magenta = "#7c4dff"
purple = "#7c4dff"
pink = "#ff5370"
[light.ansi]
red = "#e53935"
green = "#91b859"
yellow = "#ffb62c"
blue = "#6182b8"
magenta = "#7c4dff"
cyan = "#39adb5"
