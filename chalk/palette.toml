title = "Chalk"
gtk_name = "Chalk"
shell_name = "Chalk-Shell"
credit = "Chalk (colours of the Ptyxis built-in 'Chalk'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Chalk.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#2d2d2d"],[53,"#363636"],[66,"#484848"],
        [91,"#5c5c5c"],[145,"#7d7d7d"],[238,"#d4d4d4"],[255,"#d4d4d4"]]
fg = "#d4d4d4"
top = "#d4d4d4"
