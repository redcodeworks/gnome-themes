[dark.fam]
blue = ["#15539e","#fed37e"]
red = ["#cc0000","#f58e8e"]
orange = ["#f57900","#fed37f"]
green = ["#4e9a06","#a9d3ab"]
[dark.exact]
"#26ab62" = "#a9d3ab"
"#26a269" = "#a9d3ab"      # GTK4 stock success green
"#3584e4" = "#fed37e"
"#eeeeec" = "#d4d4d4"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2d2d2d"],[34.67,"#2d2d2d"],[55.33,"#363636"],[66.33,"#484848"],
        [86.67,"#5c5c5c"],[156,"#a5a5a5"],[179,"#a5a5a5"],[250,"#d4d4d4"],
        [255,"#d4d4d4"]]
fg = "#d4d4d4"
top = "#d4d4d4"
accent_fg = "#2d2d2d"
view = "#2d2d2d"
[shell.dark.fam]
blue = ["#3584e4","#fed37e"]
red = ["#c01c28","#f58e8e"]
orange = ["#ff7800","#fab086"]
green = ["#26a269","#a9d3ab"]
[shell.dark.exact]
"#cd9309" = "#fed37f"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a5a5a5"      # web-login title, dim text
"#54545a" = "#484848"      # notification/message card: surface
"#45454a" = "#3f3f3f"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
