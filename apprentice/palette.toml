# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #262626 5.5% towards fg
# derived: dark.surface derived: #262626 16.0% towards fg
# derived: dark.surface_high derived: #262626 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #262626 -> #26262e (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #878760 (it equals the default accent; keeps accent tokens unique)
title = "Apprentice"
gtk_name = "Apprentice"
shell_name = "Apprentice-Shell"
credit = "Apprentice (colours of the Ptyxis built-in 'Apprentice'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Apprentice.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#262626"],[53,"#2e2e2e"],[66,"#3e3e3e"],
        [91,"#505050"],[145,"#6e6e6e"],[238,"#bcbcbc"],[255,"#bcbcbc"]]
fg = "#bcbcbc"
top = "#bcbcbc"
accent_fg = "#26262e"
view = "#262626"
[dark.fam]
blue = ["#15539e","#87875f"]
red = ["#cc0000","#af5f5f"]
orange = ["#f57900","#878760"]
green = ["#4e9a06","#5f875f"]
[dark.exact]
"#26ab62" = "#5f875f"
"#26a269" = "#5f875f"      # GTK4 stock success green
"#3584e4" = "#87875f"
"#eeeeec" = "#bcbcbc"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#262626"],[34.67,"#262626"],[55.33,"#2e2e2e"],[66.33,"#3e3e3e"],
        [86.67,"#505050"],[156,"#919191"],[179,"#919191"],[250,"#bcbcbc"],
        [255,"#bcbcbc"]]
fg = "#bcbcbc"
top = "#bcbcbc"
accent_fg = "#26262e"
view = "#262626"
[shell.dark.fam]
blue = ["#3584e4","#87875f"]
red = ["#c01c28","#af5f5f"]
orange = ["#ff7800","#9b735f"]
green = ["#26a269","#5f875f"]
[shell.dark.exact]
"#cd9309" = "#878760"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#919191"      # web-login title, dim text
"#54545a" = "#3e3e3e"      # notification/message card: surface
"#45454a" = "#363636"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#af5f5f"
fg = "#26262e"
[accents.dark.green]
color = "#5f875f"
