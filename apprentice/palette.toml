[accents.dark.blue]
color = "#5f87af"
fg = "#26262e"
[accents.dark.magenta]
color = "#5f5f87"
fg = "#bcbcbc"
[accents.dark.cyan]
color = "#5f8787"
fg = "#26262e"

# roles for tools/libadwaita-gen.py
[roles.dark]
