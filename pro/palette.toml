# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #000000 5.5% towards fg
# derived: dark.surface derived: #000000 16.0% towards fg
# derived: dark.surface_high derived: #000000 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #000000 -> #000008 (the text colour varies per accent: the default needs its own token)
title = "Pro"
gtk_name = "Pro"
shell_name = "Pro-Shell"
credit = "Pro (colours of the Ptyxis built-in 'Pro'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Pro.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#000000"],[53,"#0d0d0d"],[66,"#272727"],
        [91,"#444444"],[145,"#747474"],[238,"#f2f2f2"],[255,"#f2f2f2"]]
fg = "#f2f2f2"
top = "#f2f2f2"
accent_fg = "#000008"
view = "#000000"
[dark.fam]
blue = ["#15539e","#00a6b2"]
red = ["#cc0000","#990000"]
orange = ["#f57900","#999900"]
green = ["#4e9a06","#00a600"]
[dark.exact]
"#26ab62" = "#00a600"
"#26a269" = "#00a600"      # GTK4 stock success green
"#3584e4" = "#00a6b2"
"#eeeeec" = "#f2f2f2"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#000000"],[34.67,"#000000"],[55.33,"#0d0d0d"],[66.33,"#272727"],
        [86.67,"#444444"],[156,"#adadad"],[179,"#adadad"],[250,"#f2f2f2"],
        [255,"#f2f2f2"]]
fg = "#f2f2f2"
top = "#f2f2f2"
accent_fg = "#000008"
view = "#000000"
[shell.dark.fam]
blue = ["#3584e4","#00a6b2"]
red = ["#c01c28","#990000"]
orange = ["#ff7800","#994c00"]
green = ["#26a269","#00a600"]
[shell.dark.exact]
"#cd9309" = "#999900"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#adadad"      # web-login title, dim text
"#54545a" = "#272727"      # notification/message card: surface
"#45454a" = "#1a1a1a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#990000"
fg = "#f2f2f2"
[accents.dark.green]
color = "#00a600"
fg = "#000008"
[accents.dark.yellow]
color = "#999900"
fg = "#000008"
[accents.dark.blue]
color = "#2009db"
fg = "#f2f2f2"
[accents.dark.magenta]
color = "#b200b2"
fg = "#f2f2f2"
[accents.dark.cyan]
color = "#00a6b2"
fg = "#000008"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#000000"
bg = "#0d0d0d"
surface = "#272727"
surface_high = "#444444"
popover = "#444444"
fg = "#f2f2f2"
red = "#990000"
green = "#00a600"
yellow = "#999900"
accent = "#00a6b2"
accent_fg = "#000008"
warning_fg = "#000000"
secondary_sidebar = "#0d0d0d"
