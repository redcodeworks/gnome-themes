red = ["#cc0000","#dc322f"]
orange = ["#f57900","#b58900"]
green = ["#4e9a06","#859900"]
[light.exact]
"#33d17a" = "#859900"
"#2ec27e" = "#859900"      # GTK4 stock success green (light)
"#2e3436" = "#5c7077"
"#f6f5f4" = "#f8f2e0"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#002b36"],[34.67,"#002b36"],[55.33,"#073642"],[66.33,"#163d46"],
        [86.67,"#274a53"],[156,"#637d82"],[179,"#637d82"],[250,"#8b9b9d"],
        [255,"#8b9b9d"]]
fg = "#8b9b9d"
top = "#8b9b9d"
accent_fg = "#002b3e"
view = "#002b36"
[shell.dark.fam]
blue = ["#3584e4","#268bd2"]
red = ["#c01c28","#dc322f"]
orange = ["#ff7800","#cb4b16"]
green = ["#26a269","#859900"]
[shell.dark.exact]
"#cd9309" = "#b58900"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#637d82"      # web-login title, dim text
"#54545a" = "#163d46"      # notification/message card: surface
"#45454a" = "#0e3a44"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#5c7077"],[46,"#5c7077"],[145,"#b2b8b1"],[224,"#eee8d5"],
        [237,"#f3eedd"],[250,"#fdf6e3"],[255,"#fdf6e3"]]
fg = "#5c7077"
top = "#fdf6e3"
accent_fg = "#002b3e"
view = "#fdf6e3"
