view = "#002b36"
[shell.dark.fam]
blue = ["#3584e4","#268bd2"]
red = ["#c01c28","#dc322f"]
orange = ["#ff7800","#cb4b16"]
green = ["#26a269","#859900"]
[shell.dark.exact]
"#cd9309" = "#b58900"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#839496"      # web-login title, dim text
"#54545a" = "#183e47"      # notification/message card: surface
"#45454a" = "#103a44"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
