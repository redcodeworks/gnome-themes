[dark.fam]
blue = ["#15539e","#268bd2"]
red = ["#cc0000","#dc322f"]
orange = ["#f57900","#b58900"]
green = ["#4e9a06","#859900"]
[dark.exact]
"#26ab62" = "#859900"
"#26a269" = "#859900"      # GTK4 stock success green
"#3584e4" = "#268bd2"
"#eeeeec" = "#8b9b9d"

[light]
ramp = [[0,"#5c7077"],[46,"#5c7077"],[145,"#b2b8b1"],[224,"#eee8d5"],
        [237,"#f3eedd"],[246,"#f8f2e0"],[255,"#fdf6e3"]]
fg = "#5c7077"
top = "#fdf6e3"
accent_fg = "#002b3e"
view = "#fdf6e3"
[light.fam]
