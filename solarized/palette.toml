ramp = [[0,"#002b36"],[34.67,"#002b36"],[55.33,"#073642"],[66.33,"#183e47"],
        [86.67,"#294c54"],[156,"#839496"],[179,"#839496"],[250,"#93a1a1"],
        [255,"#93a1a1"]]
fg = "#93a1a1"
top = "#93a1a1"
