red = ["#c01c28","#dc322f"]
orange = ["#e66100","#cb4b16"]
green = ["#26a269","#859900"]
[shell.light.exact]
"#e5a50a" = "#b58900"      # warning yellow
"#a5a5b7" = "#b2b8b1"

