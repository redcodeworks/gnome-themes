surface_high = "#eee8d5"
fg = "#586e75"
fg_dim = "#657b83"
comment = "#93a1a1"
selection = "#eee8d5"
red = "#dc322f"
orange = "#cb4b16"
yellow = "#b58900"
green = "#859900"
cyan = "#2aa198"
blue = "#268bd2"
magenta = "#d33682"
purple = "#6c71c4"
[light.ansi]
red = "#dc322f"
