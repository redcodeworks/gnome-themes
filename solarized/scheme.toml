# SPDX-License-Identifier: MIT
# Solarized (altercation/solarized, MIT, Copyright (c) 2011 Ethan Schoonover), dark (base03/base02) + light (base3/base2).
# Only two real background layers per variant: the missing ladder steps are DERIVED by mixing towards the foreground
# (dark: surface +16 %, surface_high +28 %; light: bg +3 %, surface +6 %; see tools/palette-from-scheme.py).
# fg is base1 (dark) / base01 (light), the "emphasised" tones, because the body tones base0/base00 are below 4.5:1 on
# the backgrounds (Solarized's documented low contrast); base0/base00 serve as fg_dim. ANSI six = Ptyxis "Solarized"
# Color1-6 (the 16 Solarized accents, same in both variants). Default accent blue.
title = "Solarized"
gtk_name = "Solarized"
shell_name = "Solarized-Shell"
credit = "Solarized by Ethan Schoonover (MIT)"
ptyxis = "generated"
ptyxis_reason = "the Solarized built-in has [Light] and [Dark] but its Foreground differs from ours in both (5.3 dE, above the threshold: ours is #93a1a1 / #586e75, the built-in #839496 / #657b83)"
default_accent = "blue"

[dark]
bg_deep = "#002b36"
bg = "#073642"
fg = "#93a1a1"
fg_dim = "#839496"
comment = "#586e75"
selection = "#073642"
red = "#dc322f"
orange = "#cb4b16"
yellow = "#b58900"
green = "#859900"
cyan = "#2aa198"
blue = "#268bd2"
magenta = "#d33682"
purple = "#6c71c4"
[dark.ansi]
orange = "#cb4b16"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#dc322f"
green = "#859900"
yellow = "#b58900"
blue = "#268bd2"
magenta = "#d33682"
cyan = "#2aa198"

[light]
bg_deep = "#fdf6e3"
surface_high = "#eee8d5"
fg = "#586e75"
fg_dim = "#657b83"
comment = "#93a1a1"
selection = "#eee8d5"
red = "#dc322f"
orange = "#cb4b16"
yellow = "#b58900"
green = "#859900"
cyan = "#2aa198"
blue = "#268bd2"
magenta = "#d33682"
purple = "#6c71c4"
[light.ansi]
orange = "#cb4b16"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#dc322f"
green = "#859900"
yellow = "#b58900"
blue = "#268bd2"
magenta = "#d33682"
cyan = "#2aa198"

# Terminal palette overrides (tools/ptyxis-gen.py). Source (checked 2026-11-07 with tools/ptyxis-palette.sh): the Ptyxis built-in palette(s) named below,
# whose six ANSI colours equal this scheme's; their black and REAL brights are taken wherever they differ from the generator defaults
# (a bright black equal to the background is skipped: it would be invisible; the default `comment` stays). Each key notes the Color it is.
# dark variant <- Ptyxis "Solarized [Dark]"
[dark.terminal]
black = "#073642"   # Color0
bright_red = "#cb4b16"   # Color9
bright_green = "#586e75"   # Color10
bright_yellow = "#657b83"   # Color11
bright_blue = "#839496"   # Color12
bright_magenta = "#6c71c4"   # Color13
bright_cyan = "#93a1a1"   # Color14
bright_white = "#fdf6e3"   # Color15
# light variant <- Ptyxis "Solarized [Light]"
[light.terminal]
black = "#073642"   # Color0
bright_black = "#002b36"   # Color8
bright_red = "#cb4b16"   # Color9
bright_green = "#586e75"   # Color10
bright_yellow = "#657b83"   # Color11
bright_blue = "#839496"   # Color12
bright_magenta = "#6c71c4"   # Color13
bright_cyan = "#93a1a1"   # Color14
bright_white = "#fdf6e3"   # Color15
