title = "Molokai"
gtk_name = "Molokai"
shell_name = "Molokai-Shell"
credit = "Molokai (colours of the Ptyxis built-in 'Molokai'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Molokai.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1b1d1e"],[53,"#242627"],[66,"#353637"],
        [91,"#48494a"],[145,"#68696a"],[238,"#bbbbbb"],[255,"#bbbbbb"]]
fg = "#bbbbbb"
top = "#bbbbbb"
accent_fg = "#1b1d26"
view = "#1b1d1e"
[dark.fam]
blue = ["#15539e","#23e298"]
red = ["#cc0000","#7325fa"]
orange = ["#f57900","#60d4df"]
green = ["#4e9a06","#23e299"]
[dark.exact]
"#26ab62" = "#23e299"
"#26a269" = "#23e299"      # GTK4 stock success green
"#3584e4" = "#23e298"
"#eeeeec" = "#bbbbbb"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1b1d1e"],[34.67,"#1b1d1e"],[55.33,"#242627"],[66.33,"#353637"],
        [86.67,"#48494a"],[156,"#8e8e8f"],[179,"#8e8e8f"],[250,"#bbbbbb"],
        [255,"#bbbbbb"]]
fg = "#bbbbbb"
top = "#bbbbbb"
accent_fg = "#1b1d26"
view = "#1b1d1e"
[shell.dark.fam]
blue = ["#3584e4","#23e298"]
red = ["#c01c28","#7325fa"]
orange = ["#ff7800","#6a7cec"]
green = ["#26a269","#23e299"]
[shell.dark.exact]
"#cd9309" = "#60d4df"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#8e8e8f"      # web-login title, dim text
"#54545a" = "#353637"      # notification/message card: surface
"#45454a" = "#2c2e2f"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
