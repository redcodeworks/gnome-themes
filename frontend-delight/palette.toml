# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #1b1c1d 5.5% towards fg
# derived: dark.surface derived: #1b1c1d 16.0% towards fg
# derived: dark.surface_high derived: #1b1c1d 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #1b1c1d -> #1b1c25 (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #fa771e (it equals the default accent; keeps accent tokens unique)
title = "Frontend Delight"
gtk_name = "Frontend-Delight"
shell_name = "Frontend-Delight-Shell"
credit = "Frontend Delight (colours of the Ptyxis built-in 'Frontend Delight'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Frontend%20Delight.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1b1c1d"],[53,"#232425"],[66,"#323334"],
        [91,"#444545"],[145,"#616262"],[238,"#adadad"],[255,"#adadad"]]
fg = "#adadad"
top = "#adadad"
accent_fg = "#1b1c25"
view = "#1b1c1d"
[dark.fam]
blue = ["#15539e","#fa771d"]
red = ["#cc0000","#f8511b"]
orange = ["#f57900","#fa771e"]
green = ["#4e9a06","#565747"]
[dark.exact]
"#26ab62" = "#565747"
"#26a269" = "#565747"      # GTK4 stock success green
"#3584e4" = "#fa771d"
"#eeeeec" = "#adadad"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1b1c1d"],[34.67,"#1b1c1d"],[55.33,"#232425"],[66.33,"#323334"],
        [86.67,"#444545"],[156,"#848484"],[179,"#848484"],[250,"#adadad"],
        [255,"#adadad"]]
fg = "#adadad"
top = "#adadad"
accent_fg = "#1b1c25"
view = "#1b1c1d"
[shell.dark.fam]
blue = ["#3584e4","#fa771d"]
red = ["#c01c28","#f8511b"]
orange = ["#ff7800","#f9641c"]
green = ["#26a269","#565747"]
[shell.dark.exact]
"#cd9309" = "#fa771e"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#848484"      # web-login title, dim text
"#54545a" = "#323334"      # notification/message card: surface
"#45454a" = "#2a2c2c"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#f8511b"
fg = "#1b1c25"
[accents.dark.green]
color = "#565747"
fg = "#adadad"
[accents.dark.yellow]
color = "#fa771d"
fg = "#1b1c25"
[accents.dark.blue]
color = "#2c70b7"
fg = "#1b1c25"
[accents.dark.magenta]
color = "#f02e4f"
fg = "#1b1c25"
[accents.dark.cyan]
color = "#3ca1a6"
fg = "#1b1c25"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#1b1c1d"
bg = "#232425"
surface = "#323334"
surface_high = "#444545"
popover = "#444545"
fg = "#adadad"
red = "#f8511b"
green = "#565747"
