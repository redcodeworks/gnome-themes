view = "#1c1e26"
[shell.dark.fam]
blue = ["#3584e4","#59e3e3"]
red = ["#c01c28","#e95678"]
orange = ["#ff7800","#f28686"]
green = ["#26a269","#29d398"]
[shell.dark.exact]
"#cd9309" = "#fab795"      # warning yellow (hue 43, would fall in the orange family)
