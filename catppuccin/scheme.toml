# SPDX-License-Identifier: MIT
# Catppuccin (catppuccin/catppuccin, MIT, Copyright (c) 2021 Catppuccin): Mocha dark + Latte light.
# Ladder dark: view Mantle, window Base, headers Surface0, popovers Surface1 (Crust unused). Light: view Base,
# window Mantle, headers Crust, popovers/dialogs Surface0. ANSI six = Ptyxis "Catppuccin Mocha"/"Catppuccin Latte"
# Color1-6 (identical to the Catppuccin terminal tables). Default accent blue (the brand accent mauve is not a terminal colour).
title = "Catppuccin"
gtk_name = "Catppuccin"
shell_name = "Catppuccin-Shell"
credit = "Catppuccin (MIT), Mocha and Latte"
default_accent = "blue"

[dark]
bg_deep = "#181825"
bg = "#1e1e2e"
surface = "#313244"
surface_high = "#45475a"
fg = "#cdd6f4"
fg_dim = "#a6adc8"
comment = "#7f849c"
selection = "#585b70"
red = "#f38ba8"
orange = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
cyan = "#94e2d5"
blue = "#89b4fa"
magenta = "#f5c2e7"
purple = "#cba6f7"
pink = "#f5c2e7"
[dark.ansi]
orange = "#fab387"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"

[light]
bg_deep = "#eff1f5"
bg = "#e6e9ef"
surface = "#dce0e8"
surface_high = "#ccd0da"
fg = "#4c4f69"
fg_dim = "#6c6f85"
comment = "#8c8fa1"
selection = "#acb0be"
red = "#d20f39"
orange = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
cyan = "#179299"
blue = "#1e66f5"
magenta = "#ea76cb"
purple = "#8839ef"
pink = "#ea76cb"
[light.ansi]
orange = "#fe640b"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#d20f39"
green = "#40a02b"
yellow = "#df8e1d"
blue = "#1e66f5"
magenta = "#ea76cb"
cyan = "#179299"

# Terminal palette overrides (tools/ptyxis-gen.py). Source (checked 2026-11-07 with tools/ptyxis-palette.sh): the Ptyxis built-in palette(s) named below,
# whose six ANSI colours equal this scheme's; their black and REAL brights are taken wherever they differ from the generator defaults
# (a bright black equal to the background is skipped: it would be invisible; the default `comment` stays). Each key notes the Color it is.
# dark variant <- Ptyxis "Catppuccin Mocha"
[dark.terminal]
black = "#45475a"   # Color0
bright_black = "#585b70"   # Color8
bright_white = "#a6adc8"   # Color15
# light variant <- Ptyxis "Catppuccin Latte"
[light.terminal]
black = "#5c5f77"   # Color0
bright_black = "#6c6f85"   # Color8
bright_white = "#bcc0cc"   # Color15
