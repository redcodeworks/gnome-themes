# SPDX-License-Identifier: MIT
# Catppuccin (catppuccin/catppuccin, MIT, Copyright (c) 2021 Catppuccin): Mocha dark + Latte light.
# Ladder dark: view and window Base (Mocha's terminal background; the view was Mantle before, the window step is now DERIVED), headers Surface0, popovers Surface1 (Crust unused). Light: view Base,
# window Mantle, headers Crust, popovers/dialogs Surface0. ANSI six = Ptyxis "Catppuccin Mocha"/"Catppuccin Latte"
# Color1-6 (identical to the Catppuccin terminal tables). Default accent blue (the brand accent mauve is not a terminal colour).
# COLOURS (the Ptyxis built-in palette is the source of truth, ids in tools/ptyxis-ids.py): bg_deep, fg, the six [<variant>.ansi] accents and the real
# black, white and brights in [<variant>.terminal] are the built-in's, so the terminal and the toolkit themes show the same colours. A colour that
# differs from it is a listed nudge ([<variant>.nudge], with the reason; tools/ptyxis-compare.py --check enforces this).
# Built-ins "Catppuccin Mocha" (dark) and "Catppuccin Latte" (light), two flat palettes generated by Ptyxis from Gogh (https://github.com/Gogh-Co/Gogh);
# ptyxis / ptyxis_light name them and switch-theme picks one by the system colour scheme. Mocha bg_deep is Base #1e1e2e (was Mantle #181825).
title = "Catppuccin"
gtk_name = "Catppuccin"
shell_name = "Catppuccin-Shell"
credit = "Catppuccin (MIT), Mocha and Latte"
ptyxis = "Catppuccin Mocha"
ptyxis_light = "Catppuccin Latte"
ptyxis_reason = "two flat built-ins, one per mode; switch-theme picks the id by the system colour scheme."
default_accent = "blue"

[dark]
bg_deep = "#1e1e2e"
surface = "#313244"
surface_high = "#45475a"
fg = "#cdd6f4"
fg_dim = "#a6adc8"
comment = "#7f849c"
selection = "#585b70"
red = "#f38ba8"
orange = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
cyan = "#94e2d5"
blue = "#89b4fa"
magenta = "#f5c2e7"
purple = "#cba6f7"
pink = "#f5c2e7"
[dark.ansi]
orange = "#fab387"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"

[light]
bg_deep = "#eff1f5"
bg = "#e6e9ef"
surface = "#dce0e8"
surface_high = "#ccd0da"
fg = "#4c4f69"
fg_dim = "#6c6f85"
comment = "#8c8fa1"
selection = "#acb0be"
red = "#d20f39"
orange = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
cyan = "#179299"
blue = "#1e66f5"
magenta = "#ea76cb"
purple = "#8839ef"
pink = "#ea76cb"
[light.ansi]
orange = "#fe640b"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#d20f39"
green = "#40a02b"
yellow = "#df8e1d"
blue = "#1e66f5"
magenta = "#ea76cb"
cyan = "#179299"

[dark.terminal]
source = "Catppuccin Mocha"   # Ptyxis built-in id
black = "#45475a"   # Color0
white = "#bac2de"   # Color7
bright_black = "#585b70"   # Color8
bright_white = "#a6adc8"   # Color15

[light.terminal]
source = "Catppuccin Latte"   # Ptyxis built-in id
black = "#5c5f77"   # Color0
white = "#acb0be"   # Color7
bright_black = "#6c6f85"   # Color8
bright_white = "#bcc0cc"   # Color15
