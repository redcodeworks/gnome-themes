# SPDX-License-Identifier: MIT
# Catppuccin (catppuccin/catppuccin, MIT, Copyright (c) 2021 Catppuccin): Mocha dark + Latte light.
# Ladder dark: view and window Base (Mocha's terminal background; the view was Mantle before, the window step is now DERIVED), headers Surface0, popovers Surface1 (Crust unused). Light: view Base,
# window Mantle, headers Crust, popovers/dialogs Surface0. ANSI six = Ptyxis "Catppuccin Mocha"/"Catppuccin Latte"
# Color1-6 (identical to the Catppuccin terminal tables). Default accent blue (the brand accent mauve is not a terminal colour).
# TERMINAL FIRST (2026-11-07): the Ptyxis built-in named in [<variant>.terminal] `source` is the starting point and the source of truth. bg_deep and fg are its
# Background and Foreground, the six accents its Color1-6, the real black, white and brights are in the terminal table. Where an older note above gives other
# values, THIS block and the values below supersede it. A colour that still differs from its source is a listed nudge ([<variant>.nudge], with its reason).
# Sources: Catppuccin Mocha (dark), Catppuccin Latte (light); the six accents already equalled them. Mocha: bg_deep is Base #1e1e2e (was Mantle #181825).
# Latte needed no change. The black, white and brights are the built-ins' (Mocha black #45475a, white #bac2de, bright white #a6adc8).
title = "Catppuccin"
gtk_name = "Catppuccin"
shell_name = "Catppuccin-Shell"
credit = "Catppuccin (MIT), Mocha and Latte"
ptyxis = "generated"
ptyxis_reason = "Mocha (dark) and Latte (light) are the sources and equal the scheme (0.00 dE, no nudges), but they are two flat built-ins and one profile holds one palette name, so the pair cannot follow light/dark; the generated pair palette carries exactly their colours"
default_accent = "blue"

[dark]
bg_deep = "#1e1e2e"
surface = "#313244"
surface_high = "#45475a"
fg = "#cdd6f4"
fg_dim = "#a6adc8"
comment = "#7f849c"
selection = "#585b70"
red = "#f38ba8"
orange = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
cyan = "#94e2d5"
blue = "#89b4fa"
magenta = "#f5c2e7"
purple = "#cba6f7"
pink = "#f5c2e7"
[dark.ansi]
orange = "#fab387"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"

[light]
bg_deep = "#eff1f5"
bg = "#e6e9ef"
surface = "#dce0e8"
surface_high = "#ccd0da"
fg = "#4c4f69"
fg_dim = "#6c6f85"
comment = "#8c8fa1"
selection = "#acb0be"
red = "#d20f39"
orange = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
cyan = "#179299"
blue = "#1e66f5"
magenta = "#ea76cb"
purple = "#8839ef"
pink = "#ea76cb"
[light.ansi]
orange = "#fe640b"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#d20f39"
green = "#40a02b"
yellow = "#df8e1d"
blue = "#1e66f5"
magenta = "#ea76cb"
cyan = "#179299"

# Terminal palette: the Ptyxis built-in named in `source` is the starting point and the source of truth for the variant (the terminal comes first,
# the toolkit themes follow). Background and Foreground are bg_deep and fg above, the six accents are [<variant>.ansi]; the real black, white and brights
# are below. A colour that differs from its source is listed in [<variant>.nudge] with the reason (tools/ptyxis-compare.py --check enforces this).

[dark.terminal]
source = "Catppuccin Mocha"   # Ptyxis built-in, checked 2026-11-07 with tools/ptyxis-palette.sh
black = "#45475a"   # Color0
white = "#bac2de"   # Color7
bright_black = "#585b70"   # Color8
bright_red = "#f38ba8"   # Color9
bright_green = "#a6e3a1"   # Color10
bright_yellow = "#f9e2af"   # Color11
bright_blue = "#89b4fa"   # Color12
bright_magenta = "#f5c2e7"   # Color13
bright_cyan = "#94e2d5"   # Color14
bright_white = "#a6adc8"   # Color15

[light.terminal]
source = "Catppuccin Latte"   # Ptyxis built-in, checked 2026-11-07 with tools/ptyxis-palette.sh
black = "#5c5f77"   # Color0
white = "#acb0be"   # Color7
bright_black = "#6c6f85"   # Color8
bright_red = "#d20f39"   # Color9
bright_green = "#40a02b"   # Color10
bright_yellow = "#df8e1d"   # Color11
bright_blue = "#1e66f5"   # Color12
bright_magenta = "#ea76cb"   # Color13
bright_cyan = "#179299"   # Color14
bright_white = "#bcc0cc"   # Color15
