# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Hipster Green'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Hipster%20Green.yml.
title = "Hipster Green"
gtk_name = "Hipster-Green"
shell_name = "Hipster-Green-Shell"
credit = "Hipster Green (colours of the Ptyxis built-in 'Hipster Green'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Hipster%20Green.yml)"
ptyxis = "Hipster Green"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Hipster Green' (bulk-built by tools/bulk-scheme.py)."
default_accent = "yellow"

[dark]
bg_deep = "#100b05"
fg = "#84c138"
selection = "#272f0f"   # DERIVED
red = "#b6214a"
orange = "#ba7025"   # DERIVED
yellow = "#bfbf00"
green = "#00a600"
cyan = "#00a6b2"
blue = "#246eb2"
magenta = "#b200b2"
purple = "#b200b2"   # = magenta
# palette Color8 (bright black) = #666666: a candidate for `comment`
[dark.ansi]
red = "#b6214a"
green = "#00a600"
yellow = "#bfbf00"
blue = "#246eb2"
magenta = "#b200b2"
cyan = "#00a6b2"
[dark.terminal]
source = "Hipster Green"   # Ptyxis built-in id
black = "#000000"   # Ptyxis Color0
white = "#bfbfbf"   # Ptyxis Color7
bright_black = "#666666"   # Ptyxis Color8
bright_red = "#e50000"   # Ptyxis Color9
bright_green = "#86a93e"   # Ptyxis Color10
bright_yellow = "#e5e500"   # Ptyxis Color11
bright_blue = "#0000ff"   # Ptyxis Color12
bright_magenta = "#e500e5"   # Ptyxis Color13
bright_cyan = "#00e5e5"   # Ptyxis Color14
bright_white = "#e5e5e5"   # Ptyxis Color15
