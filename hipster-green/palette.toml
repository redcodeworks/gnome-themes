# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #100b05 5.5% towards fg
# derived: dark.surface derived: #100b05 16.0% towards fg
# derived: dark.surface_high derived: #100b05 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #bfbf01 (it equals the default accent; keeps accent tokens unique)
title = "Hipster Green"
gtk_name = "Hipster-Green"
shell_name = "Hipster-Green-Shell"
credit = "Hipster Green (colours of the Ptyxis built-in 'Hipster Green'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Hipster%20Green.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#100b05"],[53,"#161508"],[66,"#23280d"],
        [91,"#303e13"],[145,"#48621e"],[238,"#84c138"],[255,"#84c138"]]
fg = "#84c138"
top = "#84c138"
accent_fg = "#100b05"
view = "#100b05"
[dark.fam]
blue = ["#15539e","#bfbf00"]
red = ["#cc0000","#b6214a"]
orange = ["#f57900","#bfbf01"]
green = ["#4e9a06","#00a600"]
[dark.exact]
"#26ab62" = "#00a600"
"#26a269" = "#00a600"      # GTK4 stock success green
"#3584e4" = "#bfbf00"
"#eeeeec" = "#84c138"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#100b05"],[34.67,"#100b05"],[55.33,"#161508"],[66.33,"#23280d"],
        [86.67,"#303e13"],[156,"#638d2a"],[179,"#638d2a"],[250,"#84c138"],
        [255,"#84c138"]]
fg = "#84c138"
top = "#84c138"
accent_fg = "#100b05"
view = "#100b05"
[shell.dark.fam]
blue = ["#3584e4","#bfbf00"]
red = ["#c01c28","#b6214a"]
orange = ["#ff7800","#ba7025"]
green = ["#26a269","#00a600"]
[shell.dark.exact]
"#cd9309" = "#bfbf01"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#638d2a"      # web-login title, dim text
"#54545a" = "#23280d"      # notification/message card: surface
"#45454a" = "#1c1e0a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#b6214a"
fg = "#100b05"
[accents.dark.green]
color = "#00a600"
fg = "#100b05"
[accents.dark.yellow]
color = "#bfbf00"
fg = "#100b05"
[accents.dark.blue]
color = "#246eb2"
fg = "#100b05"
[accents.dark.magenta]
color = "#b200b2"
fg = "#100b05"
[accents.dark.cyan]
color = "#00a6b2"
fg = "#100b05"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#100b05"
bg = "#161508"
surface = "#23280d"
surface_high = "#303e13"
popover = "#303e13"
fg = "#84c138"
red = "#b6214a"
green = "#00a600"
yellow = "#bfbf01"
accent = "#bfbf00"
accent_fg = "#100b05"
warning_fg = "#100b05"
secondary_sidebar = "#161508"
