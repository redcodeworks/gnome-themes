title = "Tokyo Night Storm"
gtk_name = "Tokyo-Night-Storm"
shell_name = "Tokyo-Night-Storm-Shell"
credit = "Tokyo Night Storm (colours of the Ptyxis built-in 'Tokyo Night Storm'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Tokyo%20Night%20Storm.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#24283b"],[53,"#2d3145"],[66,"#3d4259"],
        [91,"#50556f"],[145,"#6f7694"],[238,"#c0caf5"],[255,"#c0caf5"]]
fg = "#c0caf5"
top = "#c0caf5"
accent_fg = "#24283b"
view = "#24283b"
[dark.fam]
blue = ["#15539e","#7dcfff"]
red = ["#cc0000","#f7768e"]
orange = ["#f57900","#e0af68"]
green = ["#4e9a06","#9ece6a"]
[dark.exact]
"#26ab62" = "#9ece6a"
"#26a269" = "#9ece6a"      # GTK4 stock success green
"#3584e4" = "#7dcfff"
"#eeeeec" = "#c0caf5"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#24283b"],[34.67,"#24283b"],[55.33,"#2d3145"],[66.33,"#3d4259"],
        [86.67,"#50556f"],[156,"#949cc0"],[179,"#949cc0"],[250,"#c0caf5"],
        [255,"#c0caf5"]]
fg = "#c0caf5"
top = "#c0caf5"
accent_fg = "#24283b"
view = "#24283b"
[shell.dark.fam]
blue = ["#3584e4","#7dcfff"]
red = ["#c01c28","#f7768e"]
orange = ["#ff7800","#ec927b"]
green = ["#26a269","#9ece6a"]
[shell.dark.exact]
"#cd9309" = "#e0af68"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#949cc0"      # web-login title, dim text
"#54545a" = "#3d4259"      # notification/message card: surface
"#45454a" = "#353a4f"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#f7768e"
fg = "#24283b"
[accents.dark.green]
color = "#9ece6a"
fg = "#24283b"
[accents.dark.yellow]
color = "#e0af68"
fg = "#24283b"
[accents.dark.blue]
color = "#7aa2f7"
fg = "#24283b"
[accents.dark.magenta]
color = "#bb9af7"
fg = "#24283b"
[accents.dark.cyan]
color = "#7dcfff"
fg = "#24283b"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#24283b"
bg = "#2d3145"
surface = "#3d4259"
surface_high = "#50556f"
popover = "#50556f"
fg = "#c0caf5"
