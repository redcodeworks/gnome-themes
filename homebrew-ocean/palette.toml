# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #224fbc 5.5% towards fg
# derived: dark.surface derived: #224fbc 16.0% towards fg
# derived: dark.surface_high derived: #224fbc 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
title = "Homebrew Ocean"
gtk_name = "Homebrew-Ocean"
shell_name = "Homebrew-Ocean-Shell"
credit = "Homebrew Ocean (colours of the Ptyxis built-in 'Homebrew Ocean'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Homebrew%20Ocean.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#224fbc"],[53,"#2e59c0"],[66,"#456bc7"],
        [91,"#6080cf"],[145,"#8ca4dc"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#ffffff"
view = "#224fbc"
[dark.fam]
blue = ["#15539e","#00a6b2"]
red = ["#cc0000","#990000"]
orange = ["#f57900","#999900"]
green = ["#4e9a06","#00a600"]
[dark.exact]
"#26ab62" = "#00a600"
"#26a269" = "#00a600"      # GTK4 stock success green
"#3584e4" = "#00a6b2"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#224fbc"],[34.67,"#224fbc"],[55.33,"#2e59c0"],[66.33,"#456bc7"],
        [86.67,"#6080cf"],[156,"#c0cdec"],[179,"#c0cdec"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#ffffff"
view = "#224fbc"
[shell.dark.fam]
blue = ["#3584e4","#00a6b2"]
red = ["#c01c28","#990000"]
orange = ["#ff7800","#994c00"]
green = ["#26a269","#00a600"]
[shell.dark.exact]
"#cd9309" = "#999900"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c0cdec"      # web-login title, dim text
"#54545a" = "#456bc7"      # notification/message card: surface
"#45454a" = "#3a62c4"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#990000"
fg = "#ffffff"
[accents.dark.green]
color = "#00a600"
fg = "#ffffff"
[accents.dark.yellow]
color = "#999900"
fg = "#ffffff"
[accents.dark.blue]
color = "#0000b2"
fg = "#ffffff"
[accents.dark.magenta]
color = "#b200b2"
fg = "#ffffff"
[accents.dark.cyan]
color = "#00a6b2"
fg = "#ffffff"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#224fbc"
bg = "#2e59c0"
surface = "#456bc7"
surface_high = "#6080cf"
popover = "#6080cf"
fg = "#ffffff"
red = "#990000"
green = "#00a600"
yellow = "#999900"
accent = "#00a6b2"
accent_fg = "#ffffff"
warning_fg = "#ffffff"
secondary_sidebar = "#2e59c0"
