# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #272a34 5.5% towards fg
# derived: dark.surface derived: #272a34 16.0% towards fg
# derived: dark.surface_high derived: #272a34 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #272a34 -> #272a3c (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #fea44d (it equals the default accent; keeps accent tokens unique)
title = "Flat Remix"
gtk_name = "Flat-Remix"
shell_name = "Flat-Remix-Shell"
credit = "Flat Remix (colours of the Ptyxis built-in 'Flat Remix'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Flat%20Remix.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#272a34"],[53,"#33363f"],[66,"#4a4c54"],
        [91,"#63666d"],[145,"#8f9095"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#272a3c"
view = "#272a34"
[dark.fam]
blue = ["#15539e","#fea44c"]
red = ["#cc0000","#d41919"]
orange = ["#f57900","#fea44d"]
green = ["#4e9a06","#5ebdab"]
[dark.exact]
"#26ab62" = "#5ebdab"
"#26a269" = "#5ebdab"      # GTK4 stock success green
"#3584e4" = "#fea44c"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#272a34"],[34.67,"#272a34"],[55.33,"#33363f"],[66.33,"#4a4c54"],
        [86.67,"#63666d"],[156,"#c2c3c5"],[179,"#c2c3c5"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#272a3c"
view = "#272a34"
[shell.dark.fam]
blue = ["#3584e4","#fea44c"]
red = ["#c01c28","#d41919"]
orange = ["#ff7800","#e95e32"]
green = ["#26a269","#5ebdab"]
[shell.dark.exact]
"#cd9309" = "#fea44d"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c2c3c5"      # web-login title, dim text
"#54545a" = "#4a4c54"      # notification/message card: surface
"#45454a" = "#3e414a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#d41919"
fg = "#ffffff"
[accents.dark.green]
color = "#5ebdab"
fg = "#272a3c"
[accents.dark.yellow]
color = "#fea44c"
fg = "#272a3c"
[accents.dark.blue]
color = "#367bf0"
fg = "#ffffff"
[accents.dark.magenta]
color = "#bf2e5d"
fg = "#ffffff"
[accents.dark.cyan]
color = "#49aee6"
fg = "#272a3c"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#272a34"
bg = "#33363f"
surface = "#4a4c54"
surface_high = "#63666d"
popover = "#63666d"
fg = "#ffffff"
red = "#d41919"
green = "#5ebdab"
yellow = "#fea44d"
accent = "#fea44c"
accent_fg = "#272a3c"
warning_fg = "#272a34"
secondary_sidebar = "#33363f"
