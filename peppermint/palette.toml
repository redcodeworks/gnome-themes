# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #000000 5.5% towards fg
# derived: dark.surface derived: #000000 16.0% towards fg
# derived: dark.surface_high derived: #000000 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.green nudged to #89d288 (it equals the default accent; keeps accent tokens unique)
title = "Peppermint"
gtk_name = "Peppermint"
shell_name = "Peppermint-Shell"
credit = "Peppermint (colours of the Ptyxis built-in 'Peppermint'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Peppermint.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#000000"],[53,"#0b0b0b"],[66,"#202020"],
        [91,"#383838"],[145,"#606060"],[238,"#c7c7c7"],[255,"#c7c7c7"]]
fg = "#c7c7c7"
top = "#c7c7c7"
accent_fg = "#000000"
view = "#000000"
[dark.fam]
blue = ["#15539e","#89d287"]
red = ["#cc0000","#e64569"]
orange = ["#f57900","#dab752"]
green = ["#4e9a06","#89d288"]
[dark.exact]
"#26ab62" = "#89d288"
"#26a269" = "#89d288"      # GTK4 stock success green
"#3584e4" = "#89d287"
"#eeeeec" = "#c7c7c7"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#000000"],[34.67,"#000000"],[55.33,"#0b0b0b"],[66.33,"#202020"],
        [86.67,"#383838"],[156,"#8f8f8f"],[179,"#8f8f8f"],[250,"#c7c7c7"],
        [255,"#c7c7c7"]]
fg = "#c7c7c7"
top = "#c7c7c7"
accent_fg = "#000000"
view = "#000000"
[shell.dark.fam]
blue = ["#3584e4","#89d287"]
red = ["#c01c28","#e64569"]
orange = ["#ff7800","#e07e5e"]
green = ["#26a269","#89d288"]
[shell.dark.exact]
"#cd9309" = "#dab752"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#8f8f8f"      # web-login title, dim text
"#54545a" = "#202020"      # notification/message card: surface
"#45454a" = "#161616"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#e64569"
fg = "#000000"
[accents.dark.green]
color = "#89d287"
fg = "#000000"
[accents.dark.yellow]
color = "#dab752"
fg = "#000000"
[accents.dark.blue]
color = "#439ecf"
fg = "#000000"
[accents.dark.magenta]
color = "#d961dc"
fg = "#000000"
[accents.dark.cyan]
color = "#64aaaf"
fg = "#000000"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#000000"
bg = "#0b0b0b"
surface = "#202020"
surface_high = "#383838"
popover = "#383838"
fg = "#c7c7c7"
red = "#e64569"
green = "#89d288"
yellow = "#dab752"
accent = "#89d287"
accent_fg = "#000000"
warning_fg = "#000000"
secondary_sidebar = "#0b0b0b"
