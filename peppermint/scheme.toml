# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Peppermint'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Peppermint.yml.
title = "Peppermint"
gtk_name = "Peppermint"
shell_name = "Peppermint-Shell"
credit = "Peppermint (colours of the Ptyxis built-in 'Peppermint'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Peppermint.yml)"
ptyxis = "Peppermint"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Peppermint' (bulk-built by tools/bulk-scheme.py)."
default_accent = "green"

[dark]
bg_deep = "#000000"
fg = "#c7c7c7"
selection = "#282828"   # DERIVED
red = "#e64569"
orange = "#e07e5e"   # DERIVED
yellow = "#dab752"
green = "#89d287"
cyan = "#64aaaf"
blue = "#439ecf"
magenta = "#d961dc"
purple = "#d961dc"   # = magenta
# palette Color8 (bright black) = #535353: a candidate for `comment`
[dark.ansi]
red = "#e64569"
green = "#89d287"
yellow = "#dab752"
blue = "#439ecf"
magenta = "#d961dc"
cyan = "#64aaaf"
[dark.terminal]
source = "Peppermint"   # Ptyxis built-in id
cursor = "#bbbbbb"   # Ptyxis Cursor
black = "#353535"   # Ptyxis Color0
white = "#b3b3b3"   # Ptyxis Color7
bright_black = "#535353"   # Ptyxis Color8
bright_red = "#e4859a"   # Ptyxis Color9
bright_green = "#a2cca1"   # Ptyxis Color10
bright_yellow = "#e1e387"   # Ptyxis Color11
bright_blue = "#6fbbe2"   # Ptyxis Color12
bright_magenta = "#e586e7"   # Ptyxis Color13
bright_cyan = "#96dcda"   # Ptyxis Color14
bright_white = "#dedede"   # Ptyxis Color15
