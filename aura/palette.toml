# SPDX-License-Identifier: MIT
# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #15141b 5.5% towards fg
# derived: dark.surface derived: #15141b 16.0% towards fg
# derived: dark.surface_high derived: #15141b 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.green nudged to #61ffcb (it equals the default accent; keeps accent tokens unique)
title = "Aura"
gtk_name = "Aura"
shell_name = "Aura-Shell"
credit = "Aura (colours of the Ptyxis built-in 'Aura'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Aura.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#15141b"],[53,"#212027"],[66,"#38373d"],
        [91,"#515056"],[145,"#7d7c81"],[238,"#edecee"],[255,"#edecee"]]
fg = "#edecee"
top = "#edecee"
accent_fg = "#15141b"
view = "#15141b"
[dark.fam]
blue = ["#15539e","#61ffca"]
red = ["#cc0000","#ff6767"]
orange = ["#f57900","#ffca85"]
green = ["#4e9a06","#61ffcb"]
[dark.exact]
"#26ab62" = "#61ffcb"
"#26a269" = "#61ffcb"      # GTK4 stock success green
"#3584e4" = "#61ffca"
"#eeeeec" = "#edecee"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#15141b"],[34.67,"#15141b"],[55.33,"#212027"],[66.33,"#38373d"],
        [86.67,"#515056"],[156,"#b0afb2"],[179,"#b0afb2"],[250,"#edecee"],
        [255,"#edecee"]]
fg = "#edecee"
top = "#edecee"
accent_fg = "#15141b"
view = "#15141b"
[shell.dark.fam]
blue = ["#3584e4","#61ffca"]
red = ["#c01c28","#ff6767"]
orange = ["#ff7800","#ff9876"]
green = ["#26a269","#61ffcb"]
[shell.dark.exact]
"#cd9309" = "#ffca85"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b0afb2"      # web-login title, dim text
"#54545a" = "#38373d"      # notification/message card: surface
"#45454a" = "#2c2c32"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff6767"
fg = "#15141b"
[accents.dark.green]
color = "#61ffca"
fg = "#15141b"
[accents.dark.yellow]
color = "#ffca85"
fg = "#15141b"
[accents.dark.blue]
color = "#a277ff"
fg = "#15141b"
[accents.dark.magenta]
color = "#a277ff"
fg = "#15141b"
[accents.dark.cyan]
color = "#61ffca"
fg = "#15141b"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#15141b"
bg = "#212027"
surface = "#38373d"
surface_high = "#515056"
popover = "#515056"
fg = "#edecee"
red = "#ff6767"
green = "#61ffcb"
yellow = "#ffca85"
accent = "#61ffca"
accent_fg = "#15141b"
warning_fg = "#15141b"
secondary_sidebar = "#212027"
