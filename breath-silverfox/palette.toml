title = "Breath Silverfox"
gtk_name = "Breath-Silverfox"
shell_name = "Breath-Silverfox-Shell"
credit = "Breath Silverfox (colours of the Ptyxis built-in 'Breath Silverfox'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Breath%20Silverfox.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1e2229"],[53,"#272a31"],[66,"#373a40"],
        [91,"#4a4d52"],[145,"#6a6b6f"],[238,"#bbbbbb"],[255,"#bbbbbb"]]
fg = "#bbbbbb"
top = "#bbbbbb"
accent_fg = "#1e2229"
view = "#1e2229"
[dark.fam]
blue = ["#15539e","#1abc9c"]
red = ["#cc0000","#ed1515"]
orange = ["#f57900","#f67400"]
green = ["#4e9a06","#44853a"]
[dark.exact]
"#26ab62" = "#44853a"
"#26a269" = "#44853a"      # GTK4 stock success green
"#3584e4" = "#1abc9c"
"#eeeeec" = "#bbbbbb"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1e2229"],[34.67,"#1e2229"],[55.33,"#272a31"],[66.33,"#373a40"],
        [86.67,"#4a4d52"],[156,"#8f9092"],[179,"#8f9092"],[250,"#bbbbbb"],
        [255,"#bbbbbb"]]
fg = "#bbbbbb"
top = "#bbbbbb"
accent_fg = "#1e2229"
view = "#1e2229"
[shell.dark.fam]
blue = ["#3584e4","#1abc9c"]
red = ["#c01c28","#ed1515"]
orange = ["#ff7800","#f2440a"]
green = ["#26a269","#44853a"]
[shell.dark.exact]
"#cd9309" = "#f67400"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#8f9092"      # web-login title, dim text
"#54545a" = "#373a40"      # notification/message card: surface
"#45454a" = "#2f3238"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ed1515"
fg = "#1e2229"
[accents.dark.green]
color = "#44853a"
fg = "#1e2229"
[accents.dark.yellow]
color = "#f67400"
fg = "#1e2229"
[accents.dark.blue]
color = "#1d99f3"
fg = "#1e2229"
[accents.dark.magenta]
color = "#9b59b6"
fg = "#1e2229"
[accents.dark.cyan]
color = "#1abc9c"
fg = "#1e2229"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#1e2229"
bg = "#272a31"
surface = "#373a40"
surface_high = "#4a4d52"
popover = "#4a4d52"
fg = "#bbbbbb"
