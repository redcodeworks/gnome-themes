# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Breath Silverfox'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Breath%20Silverfox.yml.
title = "Breath Silverfox"
gtk_name = "Breath-Silverfox"
shell_name = "Breath-Silverfox-Shell"
credit = "Breath Silverfox (colours of the Ptyxis built-in 'Breath Silverfox'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Breath%20Silverfox.yml)"
ptyxis = "Breath Silverfox"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Breath Silverfox' (bulk-built by tools/bulk-scheme.py)."
default_accent = "cyan"

[dark]
bg_deep = "#1e2229"
fg = "#bbbbbb"
selection = "#3d4146"   # DERIVED
red = "#ed1515"
orange = "#f2440a"   # DERIVED
yellow = "#f67400"
green = "#44853a"
cyan = "#1abc9c"
blue = "#1d99f3"
magenta = "#9b59b6"
purple = "#9b59b6"   # = magenta
# palette Color8 (bright black) = #7f8c8d: a candidate for `comment`
[dark.ansi]
red = "#ed1515"
green = "#44853a"
yellow = "#f67400"
blue = "#1d99f3"
magenta = "#9b59b6"
cyan = "#1abc9c"
[dark.terminal]
source = "Breath Silverfox"   # Ptyxis built-in id
black = "#1e2229"   # Ptyxis Color0
white = "#fcfcfc"   # Ptyxis Color7
bright_black = "#7f8c8d"   # Ptyxis Color8
bright_red = "#c0392b"   # Ptyxis Color9
bright_green = "#55a649"   # Ptyxis Color10
bright_yellow = "#fdbc4b"   # Ptyxis Color11
bright_blue = "#3daee9"   # Ptyxis Color12
bright_magenta = "#8e44ad"   # Ptyxis Color13
bright_cyan = "#16a085"   # Ptyxis Color14
bright_white = "#ffffff"   # Ptyxis Color15
