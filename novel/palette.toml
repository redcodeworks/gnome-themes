# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: light.bg derived: #dfdbc3 3.0% towards fg
# derived: light.surface derived: #dfdbc3 6.0% towards fg
# derived: light.surface_high derived: #dfdbc3 9.0% towards fg
# derived: light.fg_dim derived: fg 30% towards bg
# derived: light.comment derived: fg 55% towards bg
# derived: light.accent_fg #dfdbc3 -> #dfdbcb (the text colour varies per accent: the default needs its own token)
title = "Novel"
gtk_name = "Novel"
shell_name = "Novel-Shell"
credit = "Novel (colours of the Ptyxis built-in 'Novel'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Novel.yml)"
default_accent = "blue"
dark_only = false
light_only = true

[light]
ramp = [[0,"#3b2322"],[46,"#3b2322"],[145,"#928578"],[224,"#d0cab5"],
        [237,"#d5d0b9"],[246,"#dad5be"],[255,"#dfdbc3"]]
fg = "#3b2322"
top = "#dfdbc3"
accent_fg = "#dfdbcb"
view = "#dfdbc3"
[light.fam]
blue = ["#3584e4","#0000cc"]
red = ["#cc0000","#cc0000"]
orange = ["#f57900","#d06b00"]
green = ["#4e9a06","#009600"]
[light.exact]
"#33d17a" = "#009600"
"#2ec27e" = "#009600"      # GTK4 stock success green (light)
"#2e3436" = "#3b2322"
"#f6f5f4" = "#dad5be"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#3b2322"],[46,"#3b2322"],[145,"#928578"],[224,"#d0cab5"],
        [237,"#d5d0b9"],[250,"#dfdbc3"],[255,"#dfdbc3"]]
fg = "#3b2322"
top = "#dfdbc3"
accent_fg = "#dfdbcb"
view = "#dfdbc3"
[shell.light.fam]
blue = ["#3584e4","#0000cc"]
red = ["#c01c28","#cc0000"]
orange = ["#e66100","#ce3600"]
green = ["#26a269","#009600"]
[shell.light.exact]
"#e5a50a" = "#d06b00"      # warning yellow
"#a5a5b7" = "#928578"

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.light.red]
color = "#cc0000"
fg = "#dfdbcb"
[accents.light.green]
color = "#009600"
fg = "#3b2322"
[accents.light.yellow]
color = "#d06b00"
fg = "#3b2322"
[accents.light.blue]
color = "#0000cc"
fg = "#dfdbcb"
[accents.light.magenta]
color = "#cc00cc"
fg = "#dfdbcb"
[accents.light.cyan]
color = "#0087cc"
fg = "#3b2322"

# roles for tools/libadwaita-gen.py
[roles.light]
bg_deep = "#dfdbc3"
bg = "#dad5be"
surface = "#d5d0b9"
surface_high = "#d0cab5"
popover = "#dfdbc3"
fg = "#3b2322"
red = "#cc0000"
green = "#009600"
yellow = "#d06b00"
accent = "#0000cc"
accent_fg = "#dfdbcb"
warning_fg = "#3b2322"
secondary_sidebar = "#d8d2bc"
