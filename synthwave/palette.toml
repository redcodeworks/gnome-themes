# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #262335 5.5% towards fg
# derived: dark.surface derived: #262335 16.0% towards fg
# derived: dark.surface_high derived: #262335 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #fede5e (it equals the default accent; keeps accent tokens unique)
title = "Synthwave"
gtk_name = "Synthwave"
shell_name = "Synthwave-Shell"
credit = "Synthwave (colours of the Ptyxis built-in 'Synthwave'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Synthwave.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#262335"],[53,"#322f40"],[66,"#494655"],
        [91,"#63616e"],[145,"#8e8d96"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#262335"
view = "#262335"
[dark.fam]
blue = ["#15539e","#fede5d"]
red = ["#cc0000","#fe4450"]
orange = ["#f57900","#fede5e"]
green = ["#4e9a06","#72f1b8"]
[dark.exact]
"#26ab62" = "#72f1b8"
"#26a269" = "#72f1b8"      # GTK4 stock success green
"#3584e4" = "#fede5d"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#262335"],[34.67,"#262335"],[55.33,"#322f40"],[66.33,"#494655"],
        [86.67,"#63616e"],[156,"#c2c1c6"],[179,"#c2c1c6"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#262335"
view = "#262335"
[shell.dark.fam]
blue = ["#3584e4","#fede5d"]
red = ["#c01c28","#fe4450"]
orange = ["#ff7800","#fe9156"]
green = ["#26a269","#72f1b8"]
[shell.dark.exact]
"#cd9309" = "#fede5e"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c2c1c6"      # web-login title, dim text
"#54545a" = "#494655"      # notification/message card: surface
"#45454a" = "#3e3a4a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#fe4450"
fg = "#262335"
[accents.dark.green]
color = "#72f1b8"
fg = "#262335"
[accents.dark.yellow]
color = "#fede5d"
fg = "#262335"
[accents.dark.blue]
color = "#03edf9"
fg = "#262335"
[accents.dark.magenta]
color = "#ff7edb"
fg = "#262335"
[accents.dark.cyan]
color = "#03edf9"
fg = "#262335"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#262335"
bg = "#322f40"
surface = "#494655"
surface_high = "#63616e"
popover = "#63616e"
fg = "#ffffff"
red = "#fe4450"
green = "#72f1b8"
yellow = "#fede5e"
accent = "#fede5d"
accent_fg = "#262335"
warning_fg = "#262335"
secondary_sidebar = "#322f40"
