# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #000000 5.5% towards fg
# derived: dark.surface derived: #000000 16.0% towards fg
# derived: dark.surface_high derived: #000000 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #e7c548 (it equals the default accent; keeps accent tokens unique)
title = "Tomorrow Night Bright"
gtk_name = "Tomorrow-Night-Bright"
shell_name = "Tomorrow-Night-Bright-Shell"
credit = "Tomorrow Night Bright (colours of the Ptyxis built-in 'Tomorrow Night Bright'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Tomorrow%20Night%20Bright.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#000000"],[53,"#0d0d0d"],[66,"#252525"],
        [91,"#414141"],[145,"#707070"],[238,"#e9e9e9"],[255,"#e9e9e9"]]
fg = "#e9e9e9"
top = "#e9e9e9"
accent_fg = "#000000"
view = "#000000"
[dark.fam]
blue = ["#15539e","#e7c547"]
red = ["#cc0000","#d54e53"]
orange = ["#f57900","#e7c548"]
green = ["#4e9a06","#b9ca49"]
[dark.exact]
"#26ab62" = "#b9ca49"
"#26a269" = "#b9ca49"      # GTK4 stock success green
"#3584e4" = "#e7c547"
"#eeeeec" = "#e9e9e9"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#000000"],[34.67,"#000000"],[55.33,"#0d0d0d"],[66.33,"#252525"],
        [86.67,"#414141"],[156,"#a7a7a7"],[179,"#a7a7a7"],[250,"#e9e9e9"],
        [255,"#e9e9e9"]]
fg = "#e9e9e9"
top = "#e9e9e9"
accent_fg = "#000000"
view = "#000000"
[shell.dark.fam]
blue = ["#3584e4","#e7c547"]
red = ["#c01c28","#d54e53"]
orange = ["#ff7800","#de8a4d"]
green = ["#26a269","#b9ca49"]
[shell.dark.exact]
"#cd9309" = "#e7c548"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a7a7a7"      # web-login title, dim text
"#54545a" = "#252525"      # notification/message card: surface
"#45454a" = "#191919"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
