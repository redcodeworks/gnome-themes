red = ["#c01c28","#d2212d"]
orange = ["#e66100","#c05516"]
green = ["#26a269","#489100"]
[shell.light.exact]
"#e5a50a" = "#ad8901"      # warning yellow
"#a5a5b7" = "#adb2a8"

