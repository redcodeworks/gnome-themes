red = ["#cc0000","#d2212d"]
orange = ["#f57900","#ad8901"]
green = ["#4e9a06","#489100"]
[light.exact]
"#33d17a" = "#489100"
"#2ec27e" = "#489100"      # GTK4 stock success green (light)
"#2e3436" = "#53676d"
"#f6f5f4" = "#f6efd8"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#103c48"],[34.67,"#103c48"],[55.33,"#19434e"],[66.33,"#29505b"],
        [86.67,"#3c6068"],[156,"#81989b"],[179,"#81989b"],[250,"#adbcbc"],
        [255,"#adbcbc"]]
fg = "#adbcbc"
top = "#adbcbc"
accent_fg = "#103c48"
view = "#103c48"
[shell.dark.fam]
blue = ["#3584e4","#dbb32d"]
red = ["#c01c28","#fa5750"]
orange = ["#ff7800","#ea853e"]
green = ["#26a269","#75b938"]
[shell.dark.exact]
"#cd9309" = "#dbb32e"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#81989b"      # web-login title, dim text
"#54545a" = "#29505b"      # notification/message card: surface
"#45454a" = "#214a54"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#53676d"],[46,"#53676d"],[145,"#adb2a8"],[224,"#ece6d1"],
        [237,"#f1ebd4"],[250,"#fbf3db"],[255,"#fbf3db"]]
fg = "#53676d"
top = "#fbf3db"
accent_fg = "#103c50"
view = "#fbf3db"
[shell.light.fam]
