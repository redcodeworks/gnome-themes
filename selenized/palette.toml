title = "Selenized"
gtk_name = "Selenized"
shell_name = "Selenized-Shell"
credit = "Selenized (colours of the Ptyxis built-in 'Selenized'; the built-in's header names no origin)"
default_accent = "yellow"
dark_only = false
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#103c48"],[53,"#19434e"],[66,"#29505b"],
        [91,"#3c6068"],[145,"#5c7980"],[238,"#adbcbc"],[255,"#adbcbc"]]
fg = "#adbcbc"
top = "#adbcbc"
accent_fg = "#103c48"
view = "#103c48"
[dark.fam]
blue = ["#15539e","#dbb32d"]
red = ["#cc0000","#fa5750"]
orange = ["#f57900","#dbb32e"]
green = ["#4e9a06","#75b938"]
[dark.exact]
"#26ab62" = "#75b938"
"#26a269" = "#75b938"      # GTK4 stock success green
"#3584e4" = "#dbb32d"
"#eeeeec" = "#adbcbc"

[light]
ramp = [[0,"#53676d"],[46,"#53676d"],[145,"#adb2a8"],[224,"#ece6d1"],
        [237,"#f1ebd4"],[246,"#f6efd8"],[255,"#fbf3db"]]
fg = "#53676d"
top = "#fbf3db"
accent_fg = "#103c50"
view = "#fbf3db"
[light.fam]
