# Icon sources for tools/themectl.sh: name|url|layout|extra   (comments and blank lines allowed)
#   top    : every top-level dir with an index.theme is a set, installed under its index.theme Name= (when that is a
#            plain id without spaces, else the directory name)
#   root   : the repo root is the set (installed under its Name=; extra = fallback name); .git .github preview README* LICENSE* are left out
#   script : sets are built by the repo's own install.sh, one variant per set (extra = the variants, standard first);
#            a set is Tela (standard) or Tela-<variant>, made of the three folders <set>, <set>-dark, <set>-light.
#            The script runs from the clone into a temp dir only (third-party code), never into the real destination.
papirus|https://github.com/PapirusDevelopmentTeam/papirus-icon-theme.git|top|
gruvbox-plus|https://github.com/SylEleuth/gruvbox-plus-icon-pack.git|top|
zafiro|https://github.com/zayronxio/Zafiro-icons.git|top|
candy|https://github.com/EliverLara/candy-icons.git|root|candy-icons
tela|https://github.com/vinceliuice/Tela-icon-theme.git|script|standard black blue brown green grey orange pink purple red yellow manjaro ubuntu dracula nord
fluent|https://github.com/vinceliuice/Fluent-icon-theme.git|script|standard green grey orange pink purple red yellow teal
