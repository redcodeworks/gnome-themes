# Icon sources for tools/themectl.sh: name|url|layout|extra   (comments and blank lines allowed)
# The registry DECLARES every set a source provides, so install-icons, list-icons, switch-icons and remove-icons know
# the set names without cloning anything. A source is cloned (shallow, under ~/.cache/gnome-themes/icons/<source>)
# only when one of its sets is installed or updated; after a clone themectl compares it with the declaration and prints
# one warning line per mismatch ("registry says X, upstream has no X" / "upstream has Y not in the registry"), never failing.
#   top    : extra = the top-level directories (each with an index.theme) that are sets, space separated. A set is installed
#            under its index.theme Name= when that is a plain id without spaces, else under the directory name; when the
#            installed name differs from the directory write dir=SetName (Dark=Zafiro-icons-Dark). Every other top-level
#            directory with an index.theme in the clone is reported as "not in the registry".
#   root   : the repo root is the set; extra = its name (the index.theme Name=, else this text); .git .github preview
#            README* LICENSE* are left out of the installed copy
#   script : sets are built by the repo's own install.sh, one variant per set (extra = the variants, standard first);
#            a set is Tela (standard) or Tela-<variant>, made of the three folders <set>, <set>-dark, <set>-light.
#            The script runs from the clone into a temp dir only (third-party code), never into the real destination.
#            Not verified against the clone (the variants are the script's own arguments).
papirus|https://github.com/PapirusDevelopmentTeam/papirus-icon-theme.git|top|Papirus Papirus-Dark Papirus-Light
gruvbox-plus|https://github.com/SylEleuth/gruvbox-plus-icon-pack.git|top|Gruvbox-Plus-Dark Gruvbox-Plus-Light
zafiro|https://github.com/zayronxio/Zafiro-icons.git|top|Dark=Zafiro-icons-Dark Light=Zafiro-icons-Light
candy|https://github.com/EliverLara/candy-icons.git|root|candy-icons
tela|https://github.com/vinceliuice/Tela-icon-theme.git|script|standard black blue brown green grey orange pink purple red yellow manjaro ubuntu dracula nord
fluent|https://github.com/vinceliuice/Fluent-icon-theme.git|script|standard green grey orange pink purple red yellow teal
