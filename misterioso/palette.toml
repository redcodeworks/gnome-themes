# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #2d3743 5.5% towards fg
# derived: dark.surface derived: #2d3743 16.0% towards fg
# derived: dark.surface_high derived: #2d3743 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #2d3743 -> #2d374b (the text colour varies per accent: the default needs its own token)
title = "Misterioso"
gtk_name = "Misterioso"
shell_name = "Misterioso-Shell"
credit = "Misterioso (colours of the Ptyxis built-in 'Misterioso'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Misterioso.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#2d3743"],[53,"#37404c"],[66,"#4a525c"],
        [91,"#5f676f"],[145,"#84888f"],[238,"#e1e1e0"],[255,"#e1e1e0"]]
fg = "#e1e1e0"
top = "#e1e1e0"
accent_fg = "#2d374b"
view = "#2d3743"
[dark.fam]
blue = ["#15539e","#23d7d7"]
red = ["#cc0000","#ff4242"]
orange = ["#f57900","#ffad29"]
green = ["#4e9a06","#74af68"]
[dark.exact]
"#26ab62" = "#74af68"
"#26a269" = "#74af68"      # GTK4 stock success green
"#3584e4" = "#23d7d7"
"#eeeeec" = "#e1e1e0"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2d3743"],[34.67,"#2d3743"],[55.33,"#37404c"],[66.33,"#4a525c"],
        [86.67,"#5f676f"],[156,"#aeb1b4"],[179,"#aeb1b4"],[250,"#e1e1e0"],
        [255,"#e1e1e0"]]
fg = "#e1e1e0"
top = "#e1e1e0"
accent_fg = "#2d374b"
view = "#2d3743"
[shell.dark.fam]
blue = ["#3584e4","#23d7d7"]
red = ["#c01c28","#ff4242"]
orange = ["#ff7800","#ff7836"]
green = ["#26a269","#74af68"]
[shell.dark.exact]
"#cd9309" = "#ffad29"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#aeb1b4"      # web-login title, dim text
"#54545a" = "#4a525c"      # notification/message card: surface
"#45454a" = "#404954"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff4242"
fg = "#2d374b"
[accents.dark.green]
