[accents.dark.blue]
color = "#338f86"
fg = "#2d374b"
[accents.dark.magenta]
color = "#9414e6"
fg = "#e1e1e0"
[accents.dark.cyan]
color = "#23d7d7"
fg = "#2d374b"

# roles for tools/libadwaita-gen.py
[roles.dark]
