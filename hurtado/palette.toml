# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #000000 5.5% towards fg
# derived: dark.surface derived: #000000 16.0% towards fg
# derived: dark.surface_high derived: #000000 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #000000 -> #000008 (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #fbe74b (it equals the default accent; keeps accent tokens unique)
title = "Hurtado"
gtk_name = "Hurtado"
shell_name = "Hurtado-Shell"
credit = "Hurtado (colours of the Ptyxis built-in 'Hurtado'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Hurtado.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#000000"],[53,"#0c0c0c"],[66,"#232323"],
        [91,"#3d3d3d"],[145,"#696969"],[238,"#dbdbdb"],[255,"#dbdbdb"]]
fg = "#dbdbdb"
top = "#dbdbdb"
accent_fg = "#000008"
view = "#000000"
[dark.fam]
blue = ["#15539e","#fbe74a"]
red = ["#cc0000","#ff1b00"]
orange = ["#f57900","#fbe74b"]
green = ["#4e9a06","#a5e055"]
[dark.exact]
"#26ab62" = "#a5e055"
"#26a269" = "#a5e055"      # GTK4 stock success green
"#3584e4" = "#fbe74a"
"#eeeeec" = "#dbdbdb"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#000000"],[34.67,"#000000"],[55.33,"#0c0c0c"],[66.33,"#232323"],
        [86.67,"#3d3d3d"],[156,"#9d9d9d"],[179,"#9d9d9d"],[250,"#dbdbdb"],
        [255,"#dbdbdb"]]
fg = "#dbdbdb"
top = "#dbdbdb"
accent_fg = "#000008"
view = "#000000"
[shell.dark.fam]
blue = ["#3584e4","#fbe74a"]
red = ["#c01c28","#ff1b00"]
orange = ["#ff7800","#fd8125"]
green = ["#26a269","#a5e055"]
[shell.dark.exact]
"#cd9309" = "#fbe74b"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9d9d9d"      # web-login title, dim text
"#54545a" = "#232323"      # notification/message card: surface
"#45454a" = "#181818"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff1b00"
fg = "#000008"
[accents.dark.green]
color = "#a5e055"
fg = "#000008"
[accents.dark.yellow]
color = "#fbe74a"
fg = "#000008"
[accents.dark.blue]
color = "#496487"
fg = "#dbdbdb"
[accents.dark.magenta]
color = "#fd5ff1"
fg = "#000008"
[accents.dark.cyan]
color = "#86e9fe"
fg = "#000008"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#000000"
bg = "#0c0c0c"
surface = "#232323"
surface_high = "#3d3d3d"
popover = "#3d3d3d"
fg = "#dbdbdb"
red = "#ff1b00"
green = "#a5e055"
yellow = "#fbe74b"
accent = "#fbe74a"
accent_fg = "#000008"
warning_fg = "#000000"
secondary_sidebar = "#0c0c0c"
