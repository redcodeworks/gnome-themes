# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Gotham'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Gotham.yml.
title = "Gotham"
gtk_name = "Gotham"
shell_name = "Gotham-Shell"
credit = "Gotham (colours of the Ptyxis built-in 'Gotham'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Gotham.yml)"
ptyxis = "Gotham"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Gotham' (bulk-built by tools/bulk-scheme.py)."
default_accent = "yellow"

[dark]
bg_deep = "#0a0f14"
fg = "#98d1ce"
selection = "#263639"   # DERIVED
red = "#c33027"
orange = "#d87239"   # DERIVED
yellow = "#edb54b"
green = "#26a98b"
cyan = "#33859d"
blue = "#195465"
magenta = "#4e5165"
purple = "#4e5165"   # = magenta
# palette Color8 (bright black) = #10151b: a candidate for `comment`
[dark.ansi]
red = "#c33027"
green = "#26a98b"
yellow = "#edb54b"
blue = "#195465"
magenta = "#4e5165"
cyan = "#33859d"
[dark.terminal]
source = "Gotham"   # Ptyxis built-in id
black = "#0a0f14"   # Ptyxis Color0
bright_black = "#10151b"   # Ptyxis Color8
bright_red = "#d26939"   # Ptyxis Color9
bright_green = "#081f2d"   # Ptyxis Color10
bright_yellow = "#245361"   # Ptyxis Color11
bright_blue = "#093748"   # Ptyxis Color12
bright_magenta = "#888ba5"   # Ptyxis Color13
bright_cyan = "#599caa"   # Ptyxis Color14
bright_white = "#d3ebe9"   # Ptyxis Color15
