# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #0a0f14 5.5% towards fg
# derived: dark.surface derived: #0a0f14 16.0% towards fg
# derived: dark.surface_high derived: #0a0f14 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #0a0f14 -> #0a0f1c (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #edb54c (it equals the default accent; keeps accent tokens unique)
title = "Gotham"
gtk_name = "Gotham"
shell_name = "Gotham-Shell"
credit = "Gotham (colours of the Ptyxis built-in 'Gotham'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Gotham.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#0a0f14"],[53,"#121a1e"],[66,"#212e32"],
        [91,"#324548"],[145,"#4e6c6d"],[238,"#98d1ce"],[255,"#98d1ce"]]
fg = "#98d1ce"
top = "#98d1ce"
accent_fg = "#0a0f1c"
view = "#0a0f14"
[dark.fam]
blue = ["#15539e","#edb54b"]
red = ["#cc0000","#c33027"]
orange = ["#f57900","#edb54c"]
green = ["#4e9a06","#26a98b"]
[dark.exact]
"#26ab62" = "#26a98b"
"#26a269" = "#26a98b"      # GTK4 stock success green
"#3584e4" = "#edb54b"
"#eeeeec" = "#98d1ce"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#0a0f14"],[34.67,"#0a0f14"],[55.33,"#121a1e"],[66.33,"#212e32"],
        [86.67,"#324548"],[156,"#709a99"],[179,"#709a99"],[250,"#98d1ce"],
        [255,"#98d1ce"]]
fg = "#98d1ce"
top = "#98d1ce"
accent_fg = "#0a0f1c"
view = "#0a0f14"
[shell.dark.fam]
blue = ["#3584e4","#edb54b"]
red = ["#c01c28","#c33027"]
orange = ["#ff7800","#d87239"]
green = ["#26a269","#26a98b"]
[shell.dark.exact]
"#cd9309" = "#edb54c"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#709a99"      # web-login title, dim text
"#54545a" = "#212e32"      # notification/message card: surface
"#45454a" = "#1a2428"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#c33027"
fg = "#0a0f1c"
[accents.dark.green]
color = "#26a98b"
fg = "#0a0f1c"
[accents.dark.yellow]
color = "#edb54b"
fg = "#0a0f1c"
[accents.dark.blue]
color = "#195465"
fg = "#98d1ce"
[accents.dark.magenta]
color = "#4e5165"
fg = "#98d1ce"
[accents.dark.cyan]
color = "#33859d"
fg = "#0a0f1c"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#0a0f14"
bg = "#121a1e"
surface = "#212e32"
surface_high = "#324548"
popover = "#324548"
fg = "#98d1ce"
red = "#c33027"
