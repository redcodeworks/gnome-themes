        [86.67,"#344347"],[156,"#767c7e"],[179,"#767c7e"],[250,"#a1a1a1"],
        [255,"#a1a1a1"]]
fg = "#a1a1a1"
top = "#a1a1a1"
accent_fg = "#0a1e24"
view = "#0a1e24"
[shell.dark.fam]
blue = ["#3584e4","#ecebbe"]
red = ["#c01c28","#e9897c"]
orange = ["#ff7800","#eaba9d"]
green = ["#26a269","#b6377d"]
[shell.dark.exact]
"#cd9309" = "#ecebbf"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#767c7e"      # web-login title, dim text
"#54545a" = "#223338"      # notification/message card: surface
"#45454a" = "#1a2c32"      # message card stacked behind the front one: bg and surface mixed 50 %

