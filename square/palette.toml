title = "Square"
gtk_name = "Square"
shell_name = "Square-Shell"
credit = "Square (colours of the Ptyxis built-in 'Square'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Square.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
