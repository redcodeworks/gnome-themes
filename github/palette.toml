view = "#101216"
[shell.dark.fam]
blue = ["#3584e4","#56d364"]
red = ["#c01c28","#f78166"]
orange = ["#ff7800","#ed9a54"]
green = ["#26a269","#56d365"]
[shell.dark.exact]
"#cd9309" = "#e3b341"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#686f77"      # web-login title, dim text
"#54545a" = "#24272c"      # notification/message card: surface
"#45454a" = "#1e2024"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
