# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #262626 5.5% towards fg
# derived: dark.surface derived: #262626 16.0% towards fg
# derived: dark.surface_high derived: #262626 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #262626 -> #26262e (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #caaf01 (it equals the default accent; keeps accent tokens unique)
title = "Ic Orange Ppl"
gtk_name = "Ic-Orange-Ppl"
shell_name = "Ic-Orange-Ppl-Shell"
credit = "Ic Orange Ppl (colours of the Ptyxis built-in 'Ic Orange Ppl'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Ic%20Orange%20Ppl.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#262626"],[53,"#322f2b"],[66,"#494035"],
        [91,"#635440"],[145,"#8e7553"],[238,"#ffcb83"],[255,"#ffcb83"]]
fg = "#ffcb83"
top = "#ffcb83"
accent_fg = "#26262e"
view = "#262626"
[dark.fam]
blue = ["#15539e","#caaf00"]
red = ["#cc0000","#c13900"]
orange = ["#f57900","#caaf01"]
green = ["#4e9a06","#a4a900"]
[dark.exact]
"#26ab62" = "#a4a900"
"#26a269" = "#a4a900"      # GTK4 stock success green
"#3584e4" = "#caaf00"
"#eeeeec" = "#ffcb83"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#262626"],[34.67,"#262626"],[55.33,"#322f2b"],[66.33,"#494035"],
        [86.67,"#635440"],[156,"#c29c69"],[179,"#c29c69"],[250,"#ffcb83"],
        [255,"#ffcb83"]]
fg = "#ffcb83"
top = "#ffcb83"
accent_fg = "#26262e"
view = "#262626"
[shell.dark.fam]
blue = ["#3584e4","#caaf00"]
red = ["#c01c28","#c13900"]
orange = ["#ff7800","#c67400"]
green = ["#26a269","#a4a900"]
[shell.dark.exact]
"#cd9309" = "#caaf01"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c29c69"      # web-login title, dim text
"#54545a" = "#494035"      # notification/message card: surface
"#45454a" = "#3e3830"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#c13900"
fg = "#ffcb83"
[accents.dark.green]
color = "#a4a900"
fg = "#26262e"
[accents.dark.yellow]
color = "#caaf00"
fg = "#26262e"
[accents.dark.blue]
color = "#bd6d00"
fg = "#26262e"
[accents.dark.magenta]
color = "#fc5e00"
fg = "#26262e"
[accents.dark.cyan]
color = "#f79500"
fg = "#26262e"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#262626"
bg = "#322f2b"
surface = "#494035"
surface_high = "#635440"
popover = "#635440"
fg = "#ffcb83"
red = "#c13900"
green = "#a4a900"
yellow = "#caaf01"
