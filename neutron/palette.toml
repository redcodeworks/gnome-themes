# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #1c1e22 5.5% towards fg
# derived: dark.surface derived: #1c1e22 16.0% towards fg
# derived: dark.surface_high derived: #1c1e22 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #1c1e22 -> #1c1e2a (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #deb567 (it equals the default accent; keeps accent tokens unique)
title = "Neutron"
gtk_name = "Neutron"
shell_name = "Neutron-Shell"
credit = "Neutron (colours of the Ptyxis built-in 'Neutron'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Neutron.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1c1e22"],[53,"#27292d"],[66,"#3c3e43"],
        [91,"#55575b"],[145,"#7d7f84"],[238,"#e6e8ef"],[255,"#e6e8ef"]]
fg = "#e6e8ef"
top = "#e6e8ef"
accent_fg = "#1c1e2a"
view = "#1c1e22"
[dark.fam]
blue = ["#15539e","#deb566"]
red = ["#cc0000","#b54036"]
orange = ["#f57900","#deb567"]
green = ["#4e9a06","#5ab977"]
[dark.exact]
"#26ab62" = "#5ab977"
"#26a269" = "#5ab977"      # GTK4 stock success green
"#3584e4" = "#deb566"
"#eeeeec" = "#e6e8ef"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1c1e22"],[34.67,"#1c1e22"],[55.33,"#27292d"],[66.33,"#3c3e43"],
        [86.67,"#55575b"],[156,"#adafb5"],[179,"#adafb5"],[250,"#e6e8ef"],
        [255,"#e6e8ef"]]
fg = "#e6e8ef"
top = "#e6e8ef"
accent_fg = "#1c1e2a"
view = "#1c1e22"
[shell.dark.fam]
blue = ["#3584e4","#deb566"]
red = ["#c01c28","#b54036"]
orange = ["#ff7800","#ca7a4e"]
green = ["#26a269","#5ab977"]
[shell.dark.exact]
"#cd9309" = "#deb567"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#adafb5"      # web-login title, dim text
"#54545a" = "#3c3e43"      # notification/message card: surface
"#45454a" = "#323438"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#b54036"
fg = "#e6e8ef"
[accents.dark.green]
color = "#5ab977"
fg = "#1c1e2a"
[accents.dark.yellow]
color = "#deb566"
fg = "#1c1e2a"
[accents.dark.blue]
color = "#6a7c93"
fg = "#1c1e2a"
[accents.dark.magenta]
color = "#a4799d"
fg = "#1c1e2a"
[accents.dark.cyan]
color = "#3f94a8"
fg = "#1c1e2a"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#1c1e22"
bg = "#27292d"
surface = "#3c3e43"
surface_high = "#55575b"
popover = "#55575b"
fg = "#e6e8ef"
