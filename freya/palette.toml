# SPDX-License-Identifier: MIT
# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #252e32 5.5% towards fg
# derived: dark.surface derived: #252e32 16.0% towards fg
# derived: dark.surface_high derived: #252e32 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
title = "Freya"
gtk_name = "Freya"
shell_name = "Freya-Shell"
credit = "Freya (colours of the Ptyxis built-in 'Freya'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Freya.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#252e32"],[53,"#2b3438"],[66,"#374144"],
        [91,"#444f52"],[145,"#5a6669"],[238,"#94a3a5"],[255,"#94a3a5"]]
fg = "#94a3a5"
top = "#94a3a5"
accent_fg = "#252e32"
view = "#252e32"
[dark.fam]
blue = ["#15539e","#2aa198"]
red = ["#cc0000","#dc322f"]
orange = ["#f57900","#b58900"]
green = ["#4e9a06","#859900"]
[dark.exact]
"#26ab62" = "#859900"
"#26a269" = "#859900"      # GTK4 stock success green
"#3584e4" = "#2aa198"
"#eeeeec" = "#94a3a5"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#252e32"],[34.67,"#252e32"],[55.33,"#2b3438"],[66.33,"#374144"],
        [86.67,"#444f52"],[156,"#748284"],[179,"#748284"],[250,"#94a3a5"],
        [255,"#94a3a5"]]
fg = "#94a3a5"
top = "#94a3a5"
accent_fg = "#252e32"
view = "#252e32"
[shell.dark.fam]
blue = ["#3584e4","#2aa198"]
red = ["#c01c28","#dc322f"]
orange = ["#ff7800","#c85e18"]
green = ["#26a269","#859900"]
[shell.dark.exact]
"#cd9309" = "#b58900"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#748284"      # web-login title, dim text
"#54545a" = "#374144"      # notification/message card: surface
"#45454a" = "#313a3e"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#dc322f"
fg = "#252e32"
[accents.dark.green]
color = "#859900"
fg = "#252e32"
[accents.dark.yellow]
color = "#b58900"
fg = "#252e32"
[accents.dark.blue]
color = "#268bd2"
fg = "#252e32"
[accents.dark.magenta]
color = "#ec0048"
fg = "#252e32"
[accents.dark.cyan]
color = "#2aa198"
fg = "#252e32"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#252e32"
bg = "#2b3438"
surface = "#374144"
surface_high = "#444f52"
popover = "#444f52"
fg = "#94a3a5"
red = "#dc322f"
green = "#859900"
yellow = "#b58900"
accent = "#2aa198"
accent_fg = "#252e32"
warning_fg = "#252e32"
secondary_sidebar = "#2b3438"
