title = "Broadcast"
gtk_name = "Broadcast"
shell_name = "Broadcast-Shell"
credit = "Broadcast (colours of the Ptyxis built-in 'Broadcast'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Broadcast.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#2b2b2b"],[53,"#353535"],[66,"#494847"],
        [91,"#5f5e5d"],[145,"#858280"],[238,"#e6e1dc"],[255,"#e6e1dc"]]
fg = "#e6e1dc"
top = "#e6e1dc"
accent_fg = "#2b2b2b"
view = "#2b2b2b"
[dark.fam]
blue = ["#15539e","#ffd24a"]
red = ["#cc0000","#da4939"]
orange = ["#f57900","#ffd24b"]
green = ["#4e9a06","#519f50"]
[dark.exact]
"#26ab62" = "#519f50"
"#26a269" = "#519f50"      # GTK4 stock success green
"#3584e4" = "#ffd24a"
"#eeeeec" = "#e6e1dc"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2b2b2b"],[34.67,"#2b2b2b"],[55.33,"#353535"],[66.33,"#494847"],
        [86.67,"#5f5e5d"],[156,"#b1adaa"],[179,"#b1adaa"],[250,"#e6e1dc"],
        [255,"#e6e1dc"]]
fg = "#e6e1dc"
top = "#e6e1dc"
accent_fg = "#2b2b2b"
view = "#2b2b2b"
[shell.dark.fam]
blue = ["#3584e4","#ffd24a"]
red = ["#c01c28","#da4939"]
orange = ["#ff7800","#ec8e42"]
green = ["#26a269","#519f50"]
[shell.dark.exact]
"#cd9309" = "#ffd24b"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#b1adaa"      # web-login title, dim text
"#54545a" = "#494847"      # notification/message card: surface
"#45454a" = "#3f3e3e"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
