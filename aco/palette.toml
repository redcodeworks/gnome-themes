# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #1f1305 5.5% towards fg
# derived: dark.surface derived: #1f1305 16.0% towards fg
# derived: dark.surface_high derived: #1f1305 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #1f1305 -> #1f130d (the text colour varies per accent: the default needs its own token)
# derived: dark.green nudged to #83ff09 (it equals the default accent; keeps accent tokens unique)
title = "Aco"
gtk_name = "Aco"
shell_name = "Aco-Shell"
credit = "Aco (colours of the Ptyxis built-in 'Aco'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Aco.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1f1305"],[53,"#271e13"],[66,"#37342d"],
        [91,"#494d4a"],[145,"#66767c"],[238,"#b4e1fd"],[255,"#b4e1fd"]]
fg = "#b4e1fd"
top = "#b4e1fd"
accent_fg = "#1f130d"
view = "#1f1305"
[dark.fam]
blue = ["#15539e","#83ff08"]
red = ["#cc0000","#ff0883"]
orange = ["#f57900","#ff8308"]
green = ["#4e9a06","#83ff09"]
[dark.exact]
"#26ab62" = "#83ff09"
"#26a269" = "#83ff09"      # GTK4 stock success green
"#3584e4" = "#83ff08"
"#eeeeec" = "#b4e1fd"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1f1305"],[34.67,"#1f1305"],[55.33,"#271e13"],[66.33,"#37342d"],
        [86.67,"#494d4a"],[156,"#8aa6b7"],[179,"#8aa6b7"],[250,"#b4e1fd"],
        [255,"#b4e1fd"]]
fg = "#b4e1fd"
top = "#b4e1fd"
accent_fg = "#1f130d"
view = "#1f1305"
[shell.dark.fam]
blue = ["#3584e4","#83ff08"]
red = ["#c01c28","#ff0883"]
orange = ["#ff7800","#ff4646"]
green = ["#26a269","#83ff09"]
[shell.dark.exact]
"#cd9309" = "#ff8308"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#8aa6b7"      # web-login title, dim text
"#54545a" = "#37342d"      # notification/message card: surface
"#45454a" = "#2f2920"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff0883"
fg = "#1f130d"
[accents.dark.green]
color = "#83ff08"
fg = "#1f130d"
[accents.dark.yellow]
color = "#ff8308"
fg = "#1f130d"
[accents.dark.blue]
color = "#0883ff"
fg = "#1f130d"
[accents.dark.magenta]
color = "#8308ff"
fg = "#b4e1fd"
[accents.dark.cyan]
color = "#08ff83"
fg = "#1f130d"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#1f1305"
bg = "#271e13"
surface = "#37342d"
surface_high = "#494d4a"
popover = "#494d4a"
fg = "#b4e1fd"
red = "#ff0883"
green = "#83ff09"
yellow = "#ff8308"
accent = "#83ff08"
