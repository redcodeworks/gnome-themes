# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Cai'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Cai.yml.
title = "Cai"
gtk_name = "Cai"
shell_name = "Cai-Shell"
credit = "Cai (colours of the Ptyxis built-in 'Cai'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Cai.yml)"
ptyxis = "Cai"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Cai' (bulk-built by tools/bulk-scheme.py)."
default_accent = "cyan"

[dark]
bg_deep = "#09111a"
fg = "#d9e6f2"
selection = "#333c45"   # DERIVED
red = "#ca274d"
orange = "#ca663a"   # DERIVED
yellow = "#caa427"
green = "#4dca27"
cyan = "#27caa4"
blue = "#274dca"
magenta = "#a427ca"
purple = "#a427ca"   # = magenta
# palette Color8 (bright black) = #808080: a candidate for `comment`
[dark.ansi]
red = "#ca274d"
green = "#4dca27"
yellow = "#caa427"
blue = "#274dca"
magenta = "#a427ca"
cyan = "#27caa4"
[dark.terminal]
source = "Cai"   # Ptyxis built-in id
black = "#000000"   # Ptyxis Color0
white = "#808080"   # Ptyxis Color7
bright_black = "#808080"   # Ptyxis Color8
bright_red = "#e98da3"   # Ptyxis Color9
bright_green = "#a3e98d"   # Ptyxis Color10
bright_yellow = "#e9d48d"   # Ptyxis Color11
bright_blue = "#8da3e9"   # Ptyxis Color12
bright_magenta = "#d48de9"   # Ptyxis Color13
bright_cyan = "#8de9d4"   # Ptyxis Color14
bright_white = "#ffffff"   # Ptyxis Color15
