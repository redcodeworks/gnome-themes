fg = "#091122"
[accents.dark.blue]
color = "#274dca"
fg = "#d9e6f2"
[accents.dark.magenta]
color = "#a427ca"
fg = "#d9e6f2"
[accents.dark.cyan]
color = "#27caa4"
fg = "#091122"

# roles for tools/libadwaita-gen.py
[roles.dark]
