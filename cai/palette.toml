title = "Cai"
gtk_name = "Cai"
shell_name = "Cai-Shell"
credit = "Cai (colours of the Ptyxis built-in 'Cai'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Cai.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#09111a"],[53,"#141d26"],[66,"#2a333d"],
        [91,"#434d56"],[145,"#6d7782"],[238,"#d9e6f2"],[255,"#d9e6f2"]]
fg = "#d9e6f2"
top = "#d9e6f2"
accent_fg = "#091122"
view = "#09111a"
[dark.fam]
blue = ["#15539e","#27caa4"]
red = ["#cc0000","#ca274d"]
orange = ["#f57900","#caa427"]
green = ["#4e9a06","#4dca27"]
[dark.exact]
"#26ab62" = "#4dca27"
"#26a269" = "#4dca27"      # GTK4 stock success green
"#3584e4" = "#27caa4"
"#eeeeec" = "#d9e6f2"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#09111a"],[34.67,"#09111a"],[55.33,"#141d26"],[66.33,"#2a333d"],
        [86.67,"#434d56"],[156,"#9eaab5"],[179,"#9eaab5"],[250,"#d9e6f2"],
        [255,"#d9e6f2"]]
fg = "#d9e6f2"
top = "#d9e6f2"
accent_fg = "#091122"
view = "#09111a"
[shell.dark.fam]
blue = ["#3584e4","#27caa4"]
red = ["#c01c28","#ca274d"]
orange = ["#ff7800","#ca663a"]
green = ["#26a269","#4dca27"]
[shell.dark.exact]
"#cd9309" = "#caa427"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#9eaab5"      # web-login title, dim text
"#54545a" = "#2a333d"      # notification/message card: surface
"#45454a" = "#1f2832"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ca274d"
fg = "#d9e6f2"
[accents.dark.green]
