# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #09111a 5.5% towards fg
# derived: dark.surface derived: #09111a 16.0% towards fg
# derived: dark.surface_high derived: #09111a 28.0% towards fg
