# SPDX-License-Identifier: MIT
# Sweet (EliverLara/Sweet), dark only. Only hex values are used; the repository's SCSS/CSS (GPL-3.0) is not used in any way.
# VERIFIED 2026-11-07 against the raw gtk-3.0/gtk-dark.css of EliverLara/Sweet: window #161925, view #181b28, foreground #C3C7D1,
# raised surface #292F45, selection teal #00D3A7. The accents are the Sweet palette (red #ED254E, green #71F79F, yellow #F9DC5C,
# blue #7CB7FF, purple #C74DED, cyan #00C1E4, orange #FF6A00) = Ptyxis "Sweet Eliverlara" Color1-6 (the closest to EliverLara's Sweet;
# Ptyxis' "Sweet Terminal" is a different scheme: #222235, yellow #9700BE).
# Ladder: deep = window #161925 (Sweet's darkest, the view in the toolkit sense), bg = Sweet's view #181b28, surface = #292f45,
# surface_high DERIVED (fixed rule, 28 % towards fg), fg_dim and comment derived. Sweet's window is DARKER than its view, so the
# ladder steps are small until surface. Sweet's selection teal #00D3A7 is not one of the six (nearest: cyan); purple stays the default.
# Default accent magenta = Sweet's primary purple #C74DED (Kevin's brief).
title = "Sweet"
gtk_name = "Sweet"
shell_name = "Sweet-Shell"
credit = "Sweet by EliverLara (palette values only; SCSS GPL-3.0 not used)"
ptyxis = "generated"
ptyxis_reason = "the nearest built-in, Sweet Eliverlara, has a visibly different background (9.6 dE); Sweet Terminal is far off (155 dE)"
default_accent = "magenta"

[dark]
bg_deep = "#161925"
bg = "#181b28"
surface = "#292f45"
fg = "#c3c7d1"
selection = "#00d3a7"
red = "#ed254e"
orange = "#ff6a00"
yellow = "#f9dc5c"
green = "#71f79f"
cyan = "#00c1e4"
blue = "#7cb7ff"
magenta = "#c74ded"
purple = "#c74ded"
[dark.ansi]
orange = "#ff6a00"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#ed254e"
green = "#71f79f"
yellow = "#f9dc5c"
blue = "#7cb7ff"
magenta = "#c74ded"
cyan = "#00c1e4"

# Terminal palette: no overrides. The Ptyxis built-in "Sweet Eliverlara" matches the six ANSI colours, but its black (Color0) is its own
# background #282c34, which on this scheme's darker background would be nearly invisible, and it has no real brights; the defaults stay.
