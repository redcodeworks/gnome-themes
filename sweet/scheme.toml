# SPDX-License-Identifier: MIT
# Sweet (EliverLara/Sweet), dark only. Only hex values are used; the repository's SCSS/CSS (GPL-3.0) is not used in any way.
# VERIFIED 2026-11-07 against the raw gtk-3.0/gtk-dark.css of EliverLara/Sweet: window #161925, view #181b28, foreground #C3C7D1,
# raised surface #292F45, selection teal #00D3A7. The accents are the Sweet palette (red #ED254E, green #71F79F, yellow #F9DC5C,
# blue #7CB7FF, purple #C74DED, cyan #00C1E4, orange #FF6A00) = Ptyxis "Sweet Eliverlara" Color1-6 (the closest to EliverLara's Sweet;
# Ptyxis' "Sweet Terminal" is a different scheme: #222235, yellow #9700BE).
# Ladder (2026-11-07): bg_deep = the built-in's #282c34 and every step above it DERIVED (fixed rules). EliverLara's own greys (window #161925,
# view #181b28, surface #292f45, all darker than #282c34) are no longer used. Sweet's selection teal #00D3A7 is not one of the six (nearest: cyan); purple stays the default.
# Default accent magenta = Sweet's primary purple #C74DED (Kevin's brief).
# TERMINAL FIRST (2026-11-07): the Ptyxis built-in named in [<variant>.terminal] `source` is the starting point and the source of truth. bg_deep and fg are its
# Background and Foreground, the six accents its Color1-6, the real black, white and brights are in the terminal table. Where an older note above gives other
# values, THIS block and the values below supersede it. A colour that still differs from its source is a listed nudge ([<variant>.nudge], with its reason).
# Source: Sweet Eliverlara (flat, dark only). Background #282c34 replaces #161925; bg and surface are derived; the six accents and fg already equalled it.
# Black, white and brights are the built-in's (black and bright black equal the background).
title = "Sweet"
gtk_name = "Sweet"
shell_name = "Sweet-Shell"
credit = "Sweet by EliverLara (palette values only; SCSS GPL-3.0 not used)"
ptyxis = "Sweet Eliverlara"
ptyxis_reason = "Sweet Eliverlara is the source (the closest to EliverLara's Sweet; Sweet Terminal is another scheme) and equals the scheme in every role (0.00 dE, no nudges); flat and dark only, like the scheme"
default_accent = "magenta"

[dark]
bg_deep = "#282c34"
fg = "#c3c7d1"
selection = "#00d3a7"
red = "#ed254e"
orange = "#ff6a00"
yellow = "#f9dc5c"
green = "#71f79f"
cyan = "#00c1e4"
blue = "#7cb7ff"
magenta = "#c74ded"
purple = "#c74ded"
[dark.ansi]
orange = "#ff6a00"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#ed254e"
green = "#71f79f"
yellow = "#f9dc5c"
blue = "#7cb7ff"
magenta = "#c74ded"
cyan = "#00c1e4"

# Terminal palette: the Ptyxis built-in named in `source` is the starting point and the source of truth for the variant (the terminal comes first,
# the toolkit themes follow). Background and Foreground are bg_deep and fg above, the six accents are [<variant>.ansi]; the real black, white and brights
# are below. A colour that differs from its source is listed in [<variant>.nudge] with the reason (tools/ptyxis-compare.py --check enforces this).

[dark.terminal]
source = "Sweet Eliverlara"   # Ptyxis built-in, checked 2026-11-07 with tools/ptyxis-palette.sh
black = "#282c34"   # Color0
white = "#dcdfe4"   # Color7
bright_black = "#282c34"   # Color8
bright_red = "#ed254e"   # Color9
bright_green = "#71f79f"   # Color10
bright_yellow = "#f9dc5c"   # Color11
bright_blue = "#7cb7ff"   # Color12
bright_magenta = "#c74ded"   # Color13
bright_cyan = "#00c1e4"   # Color14
bright_white = "#dcdfe4"   # Color15
