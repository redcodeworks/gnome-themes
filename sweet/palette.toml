title = "Sweet"
gtk_name = "Sweet"
shell_name = "Sweet-Shell"
credit = "Sweet by EliverLara (palette values only; SCSS GPL-3.0 not used)"
default_accent = "magenta"
dark_only = true

[dark]
ramp = [[0,"#000000"],[45,"#161925"],[53,"#181b28"],[66,"#292f45"],
        [91,"#464a55"],[145,"#656874"],[238,"#c3c7d1"],[255,"#c3c7d1"]]
fg = "#c3c7d1"
top = "#c3c7d1"
