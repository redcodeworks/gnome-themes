# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #282c34 5.5% towards fg
# derived: dark.surface derived: #282c34 16.0% towards fg
# derived: dark.surface_high derived: #282c34 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
title = "Sweet"
gtk_name = "Sweet"
shell_name = "Sweet-Shell"
credit = "Sweet by EliverLara (palette values only; SCSS GPL-3.0 not used)"
default_accent = "magenta"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#282c34"],[53,"#31353d"],[66,"#41454d"],
        [91,"#535760"],[145,"#737780"],[238,"#c3c7d1"],[255,"#c3c7d1"]]
fg = "#c3c7d1"
top = "#c3c7d1"
accent_fg = "#282c34"
view = "#282c34"
[dark.fam]
blue = ["#15539e","#c74ded"]
red = ["#cc0000","#ed254e"]
orange = ["#f57900","#f9dc5c"]
green = ["#4e9a06","#71f79f"]
[dark.exact]
"#26ab62" = "#71f79f"
"#26a269" = "#71f79f"      # GTK4 stock success green
"#3584e4" = "#c74ded"
"#eeeeec" = "#c3c7d1"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#282c34"],[34.67,"#282c34"],[55.33,"#31353d"],[66.33,"#41454d"],
        [86.67,"#535760"],[156,"#979ba5"],[179,"#979ba5"],[250,"#c3c7d1"],
        [255,"#c3c7d1"]]
fg = "#c3c7d1"
top = "#c3c7d1"
accent_fg = "#282c34"
view = "#282c34"
[shell.dark.fam]
blue = ["#3584e4","#c74ded"]
red = ["#c01c28","#ed254e"]
orange = ["#ff7800","#ff6a00"]
green = ["#26a269","#71f79f"]
[shell.dark.exact]
"#cd9309" = "#f9dc5c"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#979ba5"      # web-login title, dim text
"#54545a" = "#41454d"      # notification/message card: surface
"#45454a" = "#393d45"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ed254e"
fg = "#282c34"
[accents.dark.green]
color = "#71f79f"
fg = "#282c34"
[accents.dark.yellow]
color = "#f9dc5c"
fg = "#282c34"
[accents.dark.blue]
color = "#7cb7ff"
fg = "#282c34"
[accents.dark.magenta]
color = "#c74ded"
fg = "#282c34"
[accents.dark.cyan]
color = "#00c1e4"
fg = "#282c34"
[accents.dark.orange]
color = "#ff6a00"
fg = "#282c34"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#282c34"
bg = "#31353d"
surface = "#41454d"
surface_high = "#535760"
popover = "#535760"
fg = "#c3c7d1"
red = "#ed254e"
green = "#71f79f"
yellow = "#f9dc5c"
accent = "#c74ded"
