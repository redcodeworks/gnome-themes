view = "#161925"
[dark.fam]
blue = ["#15539e","#c74ded"]
red = ["#cc0000","#ed254e"]
orange = ["#f57900","#f9dc5c"]
green = ["#4e9a06","#71f79f"]
[dark.exact]
"#26ab62" = "#71f79f"
"#26a269" = "#71f79f"      # GTK4 stock success green
"#3584e4" = "#c74ded"
"#eeeeec" = "#c3c7d1"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#161925"],[34.67,"#161925"],[55.33,"#181b28"],[66.33,"#292f45"],
        [86.67,"#464a55"],[156,"#90939e"],[179,"#90939e"],[250,"#c3c7d1"],
        [255,"#c3c7d1"]]
fg = "#c3c7d1"
top = "#c3c7d1"
accent_fg = "#161925"
view = "#161925"
[shell.dark.fam]
blue = ["#3584e4","#c74ded"]
red = ["#c01c28","#ed254e"]
orange = ["#ff7800","#ff6a00"]
green = ["#26a269","#71f79f"]
[shell.dark.exact]
"#cd9309" = "#f9dc5c"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#90939e"      # web-login title, dim text
"#54545a" = "#292f45"      # notification/message card: surface
"#45454a" = "#202536"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
