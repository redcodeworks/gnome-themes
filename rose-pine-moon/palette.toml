# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #232136 5.5% towards fg
# derived: dark.surface derived: #232136 16.0% towards fg
# derived: dark.surface_high derived: #232136 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #f6c178 (it equals the default accent; keeps accent tokens unique)
title = "Rose Pine Moon"
gtk_name = "Rose-Pine-Moon"
shell_name = "Rose-Pine-Moon-Shell"
credit = "Rose Pine Moon (colours of the Ptyxis built-in 'Rosé Pine Moon'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Rosé%20Pine%20Moon.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#232136"],[53,"#2d2b40"],[66,"#413f54"],
        [91,"#58566b"],[145,"#7e7c91"],[238,"#e0def4"],[255,"#e0def4"]]
fg = "#e0def4"
top = "#e0def4"
accent_fg = "#232136"
view = "#232136"
[dark.fam]
blue = ["#15539e","#f6c177"]
red = ["#cc0000","#eb6f92"]
orange = ["#f57900","#f6c178"]
green = ["#4e9a06","#9ccfd8"]
[dark.exact]
"#26ab62" = "#9ccfd8"
"#26a269" = "#9ccfd8"      # GTK4 stock success green
"#3584e4" = "#f6c177"
"#eeeeec" = "#e0def4"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#232136"],[34.67,"#232136"],[55.33,"#2d2b40"],[66.33,"#413f54"],
        [86.67,"#58566b"],[156,"#aaa8be"],[179,"#aaa8be"],[250,"#e0def4"],
        [255,"#e0def4"]]
fg = "#e0def4"
top = "#e0def4"
accent_fg = "#232136"
view = "#232136"
[shell.dark.fam]
blue = ["#3584e4","#f6c177"]
red = ["#c01c28","#eb6f92"]
orange = ["#ff7800","#f09884"]
green = ["#26a269","#9ccfd8"]
[shell.dark.exact]
"#cd9309" = "#f6c178"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#aaa8be"      # web-login title, dim text
"#54545a" = "#413f54"      # notification/message card: surface
"#45454a" = "#37354a"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#eb6f92"
fg = "#232136"
[accents.dark.green]
color = "#9ccfd8"
fg = "#232136"
[accents.dark.yellow]
color = "#f6c177"
fg = "#232136"
[accents.dark.blue]
color = "#3e8fb0"
fg = "#232136"
[accents.dark.magenta]
color = "#c4a7e7"
fg = "#232136"
[accents.dark.cyan]
color = "#ea9a97"
fg = "#232136"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#232136"
bg = "#2d2b40"
surface = "#413f54"
surface_high = "#58566b"
popover = "#58566b"
fg = "#e0def4"
