title = "Dimmed Monokai"
gtk_name = "Dimmed-Monokai"
shell_name = "Dimmed-Monokai-Shell"
credit = "Dimmed Monokai (colours of the Ptyxis built-in 'Dimmed Monokai'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Dimmed%20Monokai.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1f1f1f"],[53,"#272828"],[66,"#383838"],
        [91,"#4a4b4a"],[145,"#696b6a"],[238,"#b9bcba"],[255,"#b9bcba"]]
fg = "#b9bcba"
top = "#b9bcba"
accent_fg = "#1f1f1f"
view = "#1f1f1f"
[dark.fam]
blue = ["#15539e","#c5a635"]
red = ["#cc0000","#be3f48"]
orange = ["#f57900","#c5a636"]
green = ["#4e9a06","#879a3b"]
[dark.exact]
"#26ab62" = "#879a3b"
"#26a269" = "#879a3b"      # GTK4 stock success green
"#3584e4" = "#c5a635"
"#eeeeec" = "#b9bcba"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1f1f1f"],[34.67,"#1f1f1f"],[55.33,"#272828"],[66.33,"#383838"],
        [86.67,"#4a4b4a"],[156,"#8d908e"],[179,"#8d908e"],[250,"#b9bcba"],
        [255,"#b9bcba"]]
fg = "#b9bcba"
top = "#b9bcba"
accent_fg = "#1f1f1f"
view = "#1f1f1f"
[shell.dark.fam]
blue = ["#3584e4","#c5a635"]
red = ["#c01c28","#be3f48"]
orange = ["#ff7800","#c2723e"]
green = ["#26a269","#879a3b"]
[shell.dark.exact]
"#cd9309" = "#c5a636"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#8d908e"      # web-login title, dim text
"#54545a" = "#383838"      # notification/message card: surface
"#45454a" = "#303030"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
