# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #303030 5.5% towards fg
# derived: dark.surface derived: #303030 16.0% towards fg
# derived: dark.surface_high derived: #303030 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
title = "Liquid Carbon"
gtk_name = "Liquid-Carbon"
shell_name = "Liquid-Carbon-Shell"
credit = "Liquid Carbon (colours of the Ptyxis built-in 'Liquid Carbon'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Liquid%20Carbon.yml)"
default_accent = "cyan"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#303030"],[53,"#373838"],[66,"#444747"],
        [91,"#545959"],[145,"#6d7676"],[238,"#afc2c2"],[255,"#afc2c2"]]
fg = "#afc2c2"
top = "#afc2c2"
accent_fg = "#303030"
view = "#303030"
[dark.fam]
blue = ["#15539e","#7ac4cc"]
red = ["#cc0000","#ff3030"]
orange = ["#f57900","#ccac00"]
green = ["#4e9a06","#559a70"]
[dark.exact]
"#26ab62" = "#559a70"
"#26a269" = "#559a70"      # GTK4 stock success green
"#3584e4" = "#7ac4cc"
"#eeeeec" = "#afc2c2"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#303030"],[34.67,"#303030"],[55.33,"#373838"],[66.33,"#444747"],
        [86.67,"#545959"],[156,"#8b9999"],[179,"#8b9999"],[250,"#afc2c2"],
        [255,"#afc2c2"]]
fg = "#afc2c2"
top = "#afc2c2"
accent_fg = "#303030"
view = "#303030"
[shell.dark.fam]
blue = ["#3584e4","#7ac4cc"]
red = ["#c01c28","#ff3030"]
orange = ["#ff7800","#e66e18"]
green = ["#26a269","#559a70"]
[shell.dark.exact]
"#cd9309" = "#ccac00"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#8b9999"      # web-login title, dim text
"#54545a" = "#444747"      # notification/message card: surface
"#45454a" = "#3e4040"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff3030"
fg = "#303030"
[accents.dark.green]
color = "#559a70"
fg = "#303030"
[accents.dark.yellow]
color = "#ccac00"
fg = "#303030"
[accents.dark.blue]
color = "#0099cc"
fg = "#303030"
[accents.dark.magenta]
color = "#cc69c8"
fg = "#303030"
[accents.dark.cyan]
color = "#7ac4cc"
fg = "#303030"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#303030"
bg = "#373838"
surface = "#444747"
surface_high = "#545959"
popover = "#545959"
fg = "#afc2c2"
red = "#ff3030"
green = "#559a70"
yellow = "#ccac00"
accent = "#7ac4cc"
accent_fg = "#303030"
warning_fg = "#303030"
secondary_sidebar = "#373838"
