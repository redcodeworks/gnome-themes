title = "Foxnightly"
gtk_name = "Foxnightly"
shell_name = "Foxnightly-Shell"
credit = "Foxnightly (colours of the Ptyxis built-in 'Foxnightly'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Foxnightly.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#2a2a2e"],[53,"#343438"],[66,"#46464a"],
        [91,"#5a5a5e"],[145,"#7d7d81"],[238,"#d7d7db"],[255,"#d7d7db"]]
fg = "#d7d7db"
top = "#d7d7db"
accent_fg = "#2a2a36"
view = "#2a2a2e"
[dark.fam]
blue = ["#15539e","#ff7de9"]
red = ["#cc0000","#b98eff"]
orange = ["#f57900","#729fcf"]
green = ["#4e9a06","#ff7dea"]
[dark.exact]
"#26ab62" = "#ff7dea"
"#26a269" = "#ff7dea"      # GTK4 stock success green
"#3584e4" = "#ff7de9"
"#eeeeec" = "#d7d7db"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#2a2a2e"],[34.67,"#2a2a2e"],[55.33,"#343438"],[66.33,"#46464a"],
        [86.67,"#5a5a5e"],[156,"#a6a6aa"],[179,"#a6a6aa"],[250,"#d7d7db"],
        [255,"#d7d7db"]]
fg = "#d7d7db"
top = "#d7d7db"
accent_fg = "#2a2a36"
view = "#2a2a2e"
[shell.dark.fam]
blue = ["#3584e4","#ff7de9"]
red = ["#c01c28","#b98eff"]
orange = ["#ff7800","#9696e7"]
green = ["#26a269","#ff7dea"]
[shell.dark.exact]
"#cd9309" = "#729fcf"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a6a6aa"      # web-login title, dim text
"#54545a" = "#46464a"      # notification/message card: surface
"#45454a" = "#3d3d41"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
