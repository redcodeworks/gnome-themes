# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #1f1e1f 5.5% towards fg
# derived: dark.surface derived: #1f1e1f 16.0% towards fg
# derived: dark.surface_high derived: #1f1e1f 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #1f1e1f -> #1f1e27 (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #ada111 (it equals the default accent; keeps accent tokens unique)
title = "Geohot"
gtk_name = "Geohot"
shell_name = "Geohot-Shell"
credit = "Geohot (colours of the Ptyxis built-in 'Geohot'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Geohot.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1f1e1f"],[53,"#2b2a2b"],[66,"#434243"],
        [91,"#5e5d5e"],[145,"#8a8a8a"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#1f1e27"
view = "#1f1e1f"
[dark.fam]
blue = ["#15539e","#ada110"]
red = ["#cc0000","#cc0000"]
orange = ["#f57900","#ada111"]
green = ["#4e9a06","#1f1e1f"]
[dark.exact]
"#26ab62" = "#1f1e1f"
"#26a269" = "#1f1e1f"      # GTK4 stock success green
"#3584e4" = "#ada110"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1f1e1f"],[34.67,"#1f1e1f"],[55.33,"#2b2a2b"],[66.33,"#434243"],
        [86.67,"#5e5d5e"],[156,"#bfbfbf"],[179,"#bfbfbf"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#1f1e27"
view = "#1f1e1f"
[shell.dark.fam]
blue = ["#3584e4","#ada110"]
red = ["#c01c28","#cc0000"]
orange = ["#ff7800","#bc5008"]
green = ["#26a269","#1f1e1f"]
[shell.dark.exact]
"#cd9309" = "#ada111"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#bfbfbf"      # web-login title, dim text
"#54545a" = "#434243"      # notification/message card: surface
"#45454a" = "#373637"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#cc0000"
fg = "#ffffff"
[accents.dark.green]
color = "#1f1e1f"
fg = "#ffffff"
[accents.dark.yellow]
color = "#ada110"
fg = "#1f1e27"
[accents.dark.blue]
color = "#ff004e"
fg = "#1f1e27"
[accents.dark.magenta]
color = "#75507b"
fg = "#ffffff"
[accents.dark.cyan]
color = "#06919a"
fg = "#1f1e27"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#1f1e1f"
bg = "#2b2a2b"
surface = "#434243"
surface_high = "#5e5d5e"
popover = "#5e5d5e"
fg = "#ffffff"
red = "#cc0000"
green = "#1f1e1f"
yellow = "#ada111"
accent = "#ada110"
accent_fg = "#1f1e27"
warning_fg = "#1f1e1f"
secondary_sidebar = "#2b2a2b"
