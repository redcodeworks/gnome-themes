# derived: dark.bg derived: #222222 5.5% towards fg
# derived: dark.surface derived: #222222 16.0% towards fg
# derived: dark.surface_high derived: #222222 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #222222 -> #22222a (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #c4c9c1 (it equals the default accent; keeps accent tokens unique)
title = "Slate"
gtk_name = "Slate"
shell_name = "Slate-Shell"
credit = "Slate (colours of the Ptyxis built-in 'Slate'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Slate.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#222222"],[53,"#232a2c"],[66,"#25393e"],
        [91,"#274a53"],[145,"#2b6777"],[238,"#35b1d2"],[255,"#35b1d2"]]
fg = "#35b1d2"
top = "#35b1d2"
accent_fg = "#22222a"
view = "#222222"
[dark.fam]
blue = ["#15539e","#c4c9c0"]
red = ["#cc0000","#e2a8bf"]
orange = ["#f57900","#c4c9c1"]
green = ["#4e9a06","#81d778"]
[dark.exact]
"#26ab62" = "#81d778"
"#26a269" = "#81d778"      # GTK4 stock success green
"#3584e4" = "#c4c9c0"
"#eeeeec" = "#35b1d2"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#222222"],[34.67,"#222222"],[55.33,"#232a2c"],[66.33,"#25393e"],
        [86.67,"#274a53"],[156,"#3088a0"],[179,"#3088a0"],[250,"#35b1d2"],
        [255,"#35b1d2"]]
fg = "#35b1d2"
top = "#35b1d2"
accent_fg = "#22222a"
view = "#222222"
[shell.dark.fam]
blue = ["#3584e4","#c4c9c0"]
red = ["#c01c28","#e2a8bf"]
orange = ["#ff7800","#d3b8c0"]
green = ["#26a269","#81d778"]
[shell.dark.exact]
"#cd9309" = "#c4c9c1"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#3088a0"      # web-login title, dim text
"#54545a" = "#25393e"      # notification/message card: surface
"#45454a" = "#243235"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
