# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #363537 5.5% towards fg
# derived: dark.surface derived: #363537 16.0% towards fg
# derived: dark.surface_high derived: #363537 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.yellow nudged to #ffd867 (it equals the default accent; keeps accent tokens unique)
title = "Monokai Pro"
gtk_name = "Monokai-Pro"
shell_name = "Monokai-Pro-Shell"
credit = "Monokai Pro (colours of the Ptyxis built-in 'Monokai Pro'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Monokai%20Pro.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#363537"],[53,"#414041"],[66,"#565455"],
        [91,"#6e6c6c"],[145,"#969391"],[238,"#fdf9f3"],[255,"#fdf9f3"]]
fg = "#fdf9f3"
top = "#fdf9f3"
accent_fg = "#363537"
view = "#363537"
[dark.fam]
blue = ["#15539e","#ffd866"]
red = ["#cc0000","#ff6188"]
orange = ["#f57900","#ffd867"]
green = ["#4e9a06","#a9dc76"]
[dark.exact]
"#26ab62" = "#a9dc76"
"#26a269" = "#a9dc76"      # GTK4 stock success green
"#3584e4" = "#ffd866"
"#eeeeec" = "#fdf9f3"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#363537"],[34.67,"#363537"],[55.33,"#414041"],[66.33,"#565455"],
        [86.67,"#6e6c6c"],[156,"#c5c2be"],[179,"#c5c2be"],[250,"#fdf9f3"],
        [255,"#fdf9f3"]]
fg = "#fdf9f3"
top = "#fdf9f3"
accent_fg = "#363537"
view = "#363537"
[shell.dark.fam]
blue = ["#3584e4","#ffd866"]
red = ["#c01c28","#ff6188"]
orange = ["#ff7800","#ff9c77"]
green = ["#26a269","#a9dc76"]
[shell.dark.exact]
"#cd9309" = "#ffd867"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c5c2be"      # web-login title, dim text
"#54545a" = "#565455"      # notification/message card: surface
"#45454a" = "#4c4a4b"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff6188"
fg = "#363537"
[accents.dark.green]
color = "#a9dc76"
fg = "#363537"
[accents.dark.yellow]
color = "#ffd866"
fg = "#363537"
[accents.dark.blue]
color = "#fc9867"
fg = "#363537"
[accents.dark.magenta]
color = "#ab9df2"
fg = "#363537"
[accents.dark.cyan]
color = "#78dce8"
fg = "#363537"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#363537"
bg = "#414041"
surface = "#565455"
surface_high = "#6e6c6c"
popover = "#6e6c6c"
fg = "#fdf9f3"
red = "#ff6188"
green = "#a9dc76"
yellow = "#ffd867"
accent = "#ffd866"
accent_fg = "#363537"
warning_fg = "#363537"
secondary_sidebar = "#414041"
