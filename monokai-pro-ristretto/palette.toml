[dark.exact]
"#26ab62" = "#bbd87e"
"#26a269" = "#bbd87e"      # GTK4 stock success green
"#3584e4" = "#edce73"
"#eeeeec" = "#fbf2f3"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
