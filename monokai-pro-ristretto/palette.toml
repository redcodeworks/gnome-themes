red = ["#c01c28","#df7484"]
orange = ["#ff7800","#e6a17c"]
green = ["#26a269","#bbd87e"]
[shell.dark.exact]
"#cd9309" = "#edce74"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c5bdbe"      # web-login title, dim text
"#54545a" = "#5c5656"      # notification/message card: surface
"#45454a" = "#524c4c"      # message card stacked behind the front one: bg and surface mixed 50 %

