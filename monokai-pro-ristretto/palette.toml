credit = "Monokai Pro Ristretto (colours of the Ptyxis built-in 'Monokai Pro Ristretto'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Monokai%20Pro%20Ristretto.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#3e3838"],[53,"#484242"],[66,"#5c5656"],
        [91,"#736c6c"],[145,"#999192"],[238,"#fbf2f3"],[255,"#fbf2f3"]]
