# derived: light.accent_fg #202124 -> #20212c (the text colour varies per accent: the default needs its own token)
# derived: light.yellow nudged to #fbbc05 (it equals the default accent; keeps accent tokens unique)
title = "Google"
gtk_name = "Google"
shell_name = "Google-Shell"
credit = "Google (colours of the Ptyxis built-in 'Google'; the built-in's header names no origin)"
default_accent = "yellow"
dark_only = false
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#202124"],[53,"#2b2c2f"],[66,"#404144"],
        [91,"#58595c"],[145,"#808284"],[238,"#e8eaed"],[255,"#e8eaed"]]
fg = "#e8eaed"
top = "#e8eaed"
accent_fg = "#20212c"
view = "#202124"
[dark.fam]
blue = ["#15539e","#fbbc04"]
red = ["#cc0000","#ea4335"]
orange = ["#f57900","#fbbc05"]
green = ["#4e9a06","#34a853"]
[dark.exact]
"#26ab62" = "#34a853"
"#26a269" = "#34a853"      # GTK4 stock success green
"#3584e4" = "#fbbc04"
"#eeeeec" = "#e8eaed"

[light]
ramp = [[0,"#5f6368"],[46,"#5f6368"],[145,"#b4b6b8"],[224,"#f1f1f1"],
        [237,"#f5f6f6"],[246,"#fafafa"],[255,"#ffffff"]]
fg = "#5f6368"
top = "#ffffff"
accent_fg = "#20212c"
view = "#ffffff"
[light.fam]
blue = ["#3584e4","#fbbc04"]
red = ["#cc0000","#ea4335"]
orange = ["#f57900","#fbbc05"]
green = ["#4e9a06","#34a853"]
[light.exact]
"#33d17a" = "#34a853"
"#2ec27e" = "#34a853"      # GTK4 stock success green (light)
"#2e3436" = "#5f6368"
"#f6f5f4" = "#fafafa"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#202124"],[34.67,"#202124"],[55.33,"#2b2c2f"],[66.33,"#404144"],
        [86.67,"#58595c"],[156,"#afb1b4"],[179,"#afb1b4"],[250,"#e8eaed"],
        [255,"#e8eaed"]]
fg = "#e8eaed"
top = "#e8eaed"
accent_fg = "#20212c"
view = "#202124"
[shell.dark.fam]
blue = ["#3584e4","#fbbc04"]
red = ["#c01c28","#ea4335"]
orange = ["#ff7800","#f2801c"]
green = ["#26a269","#34a853"]
[shell.dark.exact]
"#cd9309" = "#fbbc05"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#afb1b4"      # web-login title, dim text
"#54545a" = "#404144"      # notification/message card: surface
"#45454a" = "#36363a"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#5f6368"],[46,"#5f6368"],[145,"#b4b6b8"],[224,"#f1f1f1"],
        [237,"#f5f6f6"],[250,"#ffffff"],[255,"#ffffff"]]
fg = "#5f6368"
top = "#ffffff"
accent_fg = "#20212c"
view = "#ffffff"
[shell.light.fam]
blue = ["#3584e4","#fbbc04"]
red = ["#c01c28","#ea4335"]
orange = ["#e66100","#f2801c"]
green = ["#26a269","#34a853"]
[shell.light.exact]
"#e5a50a" = "#fbbc05"      # warning yellow
"#a5a5b7" = "#b4b6b8"

