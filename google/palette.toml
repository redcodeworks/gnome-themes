# derived: dark.bg derived: #202124 5.5% towards fg
# derived: dark.surface derived: #202124 16.0% towards fg
# derived: dark.surface_high derived: #202124 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
