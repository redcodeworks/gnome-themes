# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Oceanic Next'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Oceanic%20Next.yml.
title = "Oceanic Next"
gtk_name = "Oceanic-Next"
shell_name = "Oceanic-Next-Shell"
credit = "Oceanic Next (colours of the Ptyxis built-in 'Oceanic Next'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Oceanic%20Next.yml)"
ptyxis = "Oceanic Next"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Oceanic Next' (bulk-built by tools/bulk-scheme.py)."
default_accent = "yellow"

[dark]
bg_deep = "#121b21"
fg = "#b3b8c3"
selection = "#323a41"   # DERIVED
red = "#e44754"
orange = "#ee8252"   # DERIVED
yellow = "#f7bd51"
green = "#89bd82"
cyan = "#50a5a4"
blue = "#5486c0"
magenta = "#b77eb8"
purple = "#b77eb8"   # = magenta
# palette Color8 (bright black) = #52606b: a candidate for `comment`
[dark.ansi]
red = "#e44754"
green = "#89bd82"
yellow = "#f7bd51"
blue = "#5486c0"
magenta = "#b77eb8"
cyan = "#50a5a4"
[dark.terminal]
source = "Oceanic Next"   # Ptyxis built-in id
black = "#121c21"   # Ptyxis Color0
white = "#ffffff"   # Ptyxis Color7
bright_black = "#52606b"   # Ptyxis Color8
bright_white = "#ffffff"   # Ptyxis Color15
