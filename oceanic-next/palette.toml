# derived: dark.yellow nudged to #f7bd52 (it equals the default accent; keeps accent tokens unique)
title = "Oceanic Next"
gtk_name = "Oceanic-Next"
shell_name = "Oceanic-Next-Shell"
credit = "Oceanic Next (colours of the Ptyxis built-in 'Oceanic Next'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Oceanic%20Next.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#121b21"],[53,"#1b242a"],[66,"#2c343b"],
        [91,"#3f474e"],[145,"#5f676f"],[238,"#b3b8c3"],[255,"#b3b8c3"]]
fg = "#b3b8c3"
top = "#b3b8c3"
accent_fg = "#121b21"
view = "#121b21"
[dark.fam]
blue = ["#15539e","#f7bd51"]
red = ["#cc0000","#e44754"]
orange = ["#f57900","#f7bd52"]
green = ["#4e9a06","#89bd82"]
[dark.exact]
"#26ab62" = "#89bd82"
"#26a269" = "#89bd82"      # GTK4 stock success green
"#3584e4" = "#f7bd51"
"#eeeeec" = "#b3b8c3"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#121b21"],[34.67,"#121b21"],[55.33,"#1b242a"],[66.33,"#2c343b"],
        [86.67,"#3f474e"],[156,"#858c95"],[179,"#858c95"],[250,"#b3b8c3"],
        [255,"#b3b8c3"]]
fg = "#b3b8c3"
top = "#b3b8c3"
accent_fg = "#121b21"
view = "#121b21"
[shell.dark.fam]
blue = ["#3584e4","#f7bd51"]
red = ["#c01c28","#e44754"]
orange = ["#ff7800","#ee8252"]
green = ["#26a269","#89bd82"]
[shell.dark.exact]
"#cd9309" = "#f7bd52"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#858c95"      # web-login title, dim text
"#54545a" = "#2c343b"      # notification/message card: surface
"#45454a" = "#242c32"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
