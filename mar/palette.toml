# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: light.bg derived: #ffffff 3.0% towards fg
# derived: light.surface derived: #ffffff 6.0% towards fg
# derived: light.surface_high derived: #ffffff 9.0% towards fg
# derived: light.fg_dim derived: fg 30% towards bg
# derived: light.comment derived: fg 55% towards bg
# derived: light.accent_fg #ffffff -> #fffff7 (the text colour varies per accent: the default needs its own token)
title = "Mar"
gtk_name = "Mar"
shell_name = "Mar-Shell"
credit = "Mar (colours of the Ptyxis built-in 'Mar'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Mar.yml)"
default_accent = "magenta"
dark_only = false
light_only = true

[light]
ramp = [[0,"#23476a"],[46,"#23476a"],[145,"#98a9ba"],[224,"#ebeef2"],
        [237,"#f2f4f6"],[246,"#f8f9fb"],[255,"#ffffff"]]
fg = "#23476a"
top = "#ffffff"
accent_fg = "#fffff7"
view = "#ffffff"
[light.fam]
blue = ["#3584e4","#7b40b5"]
red = ["#cc0000","#b5407b"]
orange = ["#f57900","#b57b40"]
green = ["#4e9a06","#7bb540"]
[light.exact]
"#33d17a" = "#7bb540"
"#2ec27e" = "#7bb540"      # GTK4 stock success green (light)
"#2e3436" = "#23476a"
"#f6f5f4" = "#f8f9fb"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#23476a"],[46,"#23476a"],[145,"#98a9ba"],[224,"#ebeef2"],
        [237,"#f2f4f6"],[250,"#ffffff"],[255,"#ffffff"]]
fg = "#23476a"
top = "#ffffff"
accent_fg = "#fffff7"
view = "#ffffff"
[shell.light.fam]
blue = ["#3584e4","#7b40b5"]
red = ["#c01c28","#b5407b"]
orange = ["#e66100","#b55e5e"]
green = ["#26a269","#7bb540"]
[shell.light.exact]
"#e5a50a" = "#b57b40"      # warning yellow
"#a5a5b7" = "#98a9ba"

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.light.red]
color = "#b5407b"
fg = "#fffff7"
[accents.light.green]
color = "#7bb540"
fg = "#23476a"
[accents.light.yellow]
color = "#b57b40"
fg = "#fffff7"
[accents.light.blue]
color = "#407bb5"
fg = "#fffff7"
[accents.light.magenta]
color = "#7b40b5"
fg = "#fffff7"
[accents.light.cyan]
color = "#40b57b"
fg = "#23476a"

# roles for tools/libadwaita-gen.py
[roles.light]
bg_deep = "#ffffff"
bg = "#f8f9fb"
surface = "#f2f4f6"
surface_high = "#ebeef2"
popover = "#ffffff"
fg = "#23476a"
red = "#b5407b"
green = "#7bb540"
yellow = "#b57b40"
accent = "#7b40b5"
accent_fg = "#fffff7"
warning_fg = "#ffffff"
secondary_sidebar = "#f5f6f8"
