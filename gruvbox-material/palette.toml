# Palette data for tools/gtk3-theme-gen.py, tools/gtk4-theme-gen.py and tools/shell-theme-gen.py (pass with --palette). Only this file
# changes per theme (Nord, ...); the generators and their engine (tools/themegen.py) are shared. `just generate <theme>` reads gtk_name for the output folder.
gtk_name = "Gruvbox-Material"
shell_name = "Gruvbox-Material-Shell"   # prefix of the Shell theme folders (-Dark / -Light)
#
# ramp   : [stock Adwaita grey level 0..255, theme colour] stops; neutral greys of the
#          stock stylesheet are interpolated along it (stock window = level 53 dark /
#          246 light).
# fg/top : text colour / lightest tint used to lighten accents; accent_fg: text on accents;
#          view: text-view background.
# fam.*  : [stock family anchor, theme accent]; every other shade of the family keeps its
#          stock lightness relation to the anchor.
# exact  : stock colour -> theme colour overrides.

[dark]
ramp = [[0,"#000000"],[45,"#282828"],[53,"#32302f"],[66,"#45403d"],[91,"#5a524c"],
        [145,"#928374"],[238,"#ddc7a1"],[255,"#ddc7a1"]]
fg = "#ddc7a1"
top = "#ddc7a1"
accent_fg = "#282828"
view = "#282828"
[dark.fam]
blue = ["#15539e","#7daea3"]
red = ["#cc0000","#ea6962"]
orange = ["#f57900","#d8a657"]
green = ["#4e9a06","#a9b665"]
[dark.exact]
"#26ab62" = "#a9b665"
"#26a269" = "#a9b665"      # GTK4 stock success green
"#3584e4" = "#7daea3"
"#eeeeec" = "#ddc7a1"

[light]
ramp = [[0,"#4f3829"],[46,"#4f3829"],[145,"#928374"],[224,"#eee0b7"],[237,"#f2e5bc"],
        [246,"#f5edca"],[255,"#f9f5d7"]]
fg = "#4f3829"
top = "#f9f5d7"
accent_fg = "#f9f5d7"
view = "#f9f5d7"
[light.fam]
blue = ["#3584e4","#45707a"]
red = ["#cc0000","#c14a4a"]
orange = ["#f57900","#b47109"]
green = ["#4e9a06","#6c782e"]
[light.exact]
"#33d17a" = "#6c782e"
"#2ec27e" = "#6c782e"      # GTK4 stock success green (light)
"#2e3436" = "#4f3829"
"#f6f5f4" = "#f5edca"

# ---------------------------------------------------------------------------------------------
# [shell.*]: palette for tools/shell-theme-gen.py (GNOME Shell stock stylesheet). Same keys as
# above, but stock Shell's greys differ from GTK's (Shell dark: overview #222226 = level 34.7,
# OSD/dialogs #2e2e33 = 47, popups/buttons #36363a = 55.3, borders/hover #424247 = 66.3, submenus
# #56565c = 86.7, dim text #b2b2b4 = 179, text #fafafb = 250; the panel is #000000), so the ramp
# has its own stops, mapped onto the same Gruvbox Material surface ladder as the GTK themes
# (medium dark: bg0 #282828, bg1 #32302f, bg3 #45403d, bg5 #5a524c). Stock Shell has almost no
# chromatic literals: red (#c01c28 family), orange (#ff7800 / #e66100 family), yellow warning
# (#cd9309 / #e5a50a). Selected/accent states use -st-accent-color, which GNOME Shell sets at
# runtime from the accent-color setting (not a literal in the file, so not recoloured here).
# The theme folder prefix is shell_name at the top of this file.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#282828"],[34.67,"#282828"],[55.33,"#32302f"],[66.33,"#45403d"],[86.67,"#5a524c"],
        [156,"#a89984"],[179,"#a89984"],[250,"#ddc7a1"],[255,"#ddc7a1"]]   # weekend/placeholder text (stock 156) and dim text (179) both grey2: readable (4.7:1 on #32302f)
fg = "#ddc7a1"
top = "#ddc7a1"
accent_fg = "#282828"
view = "#282828"
[shell.dark.fam]
blue = ["#3584e4","#7daea3"]
red = ["#c01c28","#ea6962"]
orange = ["#ff7800","#e78a4e"]
green = ["#26a269","#a9b665"]
[shell.dark.exact]
"#cd9309" = "#d8a657"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a89984"      # web-login title, dim text (slightly blue grey)
"#54545a" = "#45403d"      # notification/message card: bg3 (the ramp would give ~#58504b, too light for the dim header text)
"#45454a" = "#3c3836"      # message card stacked behind the front one: bg2

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#4f3829"],[46,"#4f3829"],[145,"#928374"],[224,"#eee0b7"],[237,"#f2e5bc"],
        [250,"#f9f5d7"],[255,"#f9f5d7"]]
fg = "#4f3829"
top = "#f9f5d7"
accent_fg = "#f9f5d7"
view = "#f9f5d7"
[shell.light.fam]
blue = ["#3584e4","#45707a"]
red = ["#c01c28","#c14a4a"]
orange = ["#e66100","#c35e0a"]
green = ["#26a269","#6c782e"]
[shell.light.exact]
"#e5a50a" = "#b47109"      # warning yellow
"#a5a5b7" = "#928374"
