"#2e3436" = "#4f3829"
"#f6f5f4" = "#f5edca"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#282828"],[34.67,"#282828"],[55.33,"#32302f"],[66.33,"#45403d"],
        [86.67,"#5a524c"],[156,"#a89984"],[179,"#a89984"],[250,"#ddc7a1"],
        [255,"#ddc7a1"]]
fg = "#ddc7a1"
top = "#ddc7a1"
accent_fg = "#282828"
view = "#282828"
[shell.dark.fam]
blue = ["#3584e4","#7daea3"]
red = ["#c01c28","#ea6962"]
orange = ["#ff7800","#e78a4e"]
green = ["#26a269","#a9b665"]
[shell.dark.exact]
"#cd9309" = "#d8a657"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a89984"      # web-login title, dim text
"#54545a" = "#45403d"      # notification/message card: surface
"#45454a" = "#3c3836"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
