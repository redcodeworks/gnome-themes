# SPDX-License-Identifier: MIT
# Role file for tools/palette-from-scheme.py (-> palette.toml). Gruvbox Material (sainnhe/gruvbox-material, MIT).
# The values are the ones the previous hand-written palette.toml used: dark = MEDIUM backgrounds (bg0 #282828),
# light = a hard-contrast block. Terminal accents = the scheme's own terminal colours (Ghostty theme).
# SOURCE ORDER (2026-11-07): official source first, the Ptyxis built-in of the same name second, invented last. Each variant's [<variant>.terminal] says which
# it uses: `source = "official: <repo/url, date verified>"` (with `builtin_differs` where the official palette differs from the built-in: name, max delta E, why
# official wins) or `source = "<built-in name>"` (bg_deep, fg, the six accents and the real black, white and brights ARE the built-in's) or `no_builtin`. A
# colour that still differs from its source is a listed nudge ([<variant>.nudge], with the reason). Where an older note above gives other values, THIS block wins.
# Source dark: Gruvbox Material (fg #d4be98, was the role fg #ddc7a1 with a terminal override; the override is gone). Light: NO built-in exists
# (the built-in of that name is dark only), so the light values below stay as they were; see no_builtin in [light.terminal].
title = "Gruvbox Material"
gtk_name = "Gruvbox-Material"
shell_name = "Gruvbox-Material-Shell"
credit = "sainnhe/gruvbox-material (MIT)"
ptyxis = "generated"
ptyxis_reason = "the Gruvbox Material built-in is the dark source (0.00 dE, no nudges) but it is flat and dark only and there is no light built-in, so a flat built-in would lose light/dark switching; the generated pair palette carries the built-in's dark colours and this scheme's own light ones"
default_accent = "blue"

[dark]
bg_deep = "#282828"
bg = "#32302f"
surface = "#45403d"
surface_high = "#5a524c"
fg = "#d4be98"
fg_dim = "#a89984"
comment = "#928374"
selection = "#504945"
red = "#ea6962"
orange = "#e78a4e"
yellow = "#d8a657"
green = "#a9b665"
cyan = "#89b482"
blue = "#7daea3"
magenta = "#d3869b"
purple = "#d3869b"
warning_fg = "#1d2021"
[dark.ansi]
orange = "#e78a4e"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#ea6962"
green = "#a9b665"
yellow = "#d8a657"
blue = "#7daea3"
magenta = "#d3869b"
cyan = "#89b482"

[light]
bg_deep = "#f9f5d7"
bg = "#f5edca"
surface = "#f2e5bc"
surface_high = "#eee0b7"
fg = "#4f3829"
comment = "#928374"
selection = "#eee0b7"
red = "#c14a4a"
orange = "#c35e0a"
yellow = "#b47109"
green = "#6c782e"
cyan = "#4c7a5d"
blue = "#45707a"
magenta = "#945e80"
purple = "#945e80"
warning_fg = "#1d2021"
[light.ansi]
orange = "#c35e0a"   # seventh accent: the scheme's own orange role colour (not a terminal colour)
red = "#c14a4a"
green = "#6c782e"
yellow = "#b47109"
blue = "#45707a"
magenta = "#945e80"
cyan = "#4c7a5d"
[light.adw]
secondary_sidebar = "#f3eac7"   # hand-picked in the old libadwaita file; the rule (bg/surface mix) would give #f4e9c3

# Terminal palette: the Ptyxis built-in named in `source` is the starting point and the source of truth for the variant (the terminal comes first,
# the toolkit themes follow). Background and Foreground are bg_deep and fg above, the six accents are [<variant>.ansi]; the real black, white and brights
# are below. A colour that differs from its source is listed in [<variant>.nudge] with the reason (tools/ptyxis-compare.py --check enforces this).

[dark.terminal]
source = "Gruvbox Material"   # Ptyxis built-in, checked 2026-11-07 with tools/ptyxis-palette.sh
black = "#3c3836"   # Color0
white = "#d4be98"   # Color7
bright_black = "#3c3836"   # Color8
bright_red = "#ea6962"   # Color9
bright_green = "#a9b665"   # Color10
bright_yellow = "#d8a657"   # Color11
bright_blue = "#7daea3"   # Color12
bright_magenta = "#d3869b"   # Color13
bright_cyan = "#89b482"   # Color14
bright_white = "#d4be98"   # Color15

[light.terminal]
no_builtin = "no Ptyxis built-in has a light Gruvbox Material (the built-in of that name is dark only); the values stay as before"
foreground = "#654735"   # reference (a softer ink than the role fg #4f3829)
background = "#f5edca"   # reference: the window colour
bright_black = "#f2e5bc" # reference: equals Color0
