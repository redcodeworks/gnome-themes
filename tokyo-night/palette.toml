# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #1a1b26 5.5% towards fg
# derived: light.fg_dim derived: fg 30% towards bg
# derived: light.accent_fg #1a1b26 -> #1a1b2e (the text colour varies per accent: the default needs its own token)
title = "Tokyo Night"
gtk_name = "Tokyo-Night"
shell_name = "Tokyo-Night-Shell"
credit = "Tokyo Night by folke (tokyonight.nvim, Apache-2.0), Night and Day"
default_accent = "blue"
dark_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1a1b26"],[53,"#232531"],[66,"#292e42"],
        [91,"#3b4261"],[145,"#737aa2"],[238,"#c0caf5"],[255,"#c0caf5"]]
fg = "#c0caf5"
top = "#c0caf5"
accent_fg = "#1a1b26"
view = "#1a1b26"
[dark.fam]
blue = ["#15539e","#7aa2f7"]
red = ["#cc0000","#f7768e"]
orange = ["#f57900","#e0af68"]
green = ["#4e9a06","#9ece6a"]
[dark.exact]
"#26ab62" = "#9ece6a"
"#26a269" = "#9ece6a"      # GTK4 stock success green
"#3584e4" = "#7aa2f7"
"#eeeeec" = "#c0caf5"

[light]
ramp = [[0,"#3258af"],[46,"#3258af"],[145,"#848cb5"],[224,"#b7c1e3"],
        [237,"#c4c8da"],[246,"#d0d5e3"],[255,"#e1e2e7"]]
fg = "#3258af"
top = "#e1e2e7"
accent_fg = "#1a1b2e"
view = "#e1e2e7"
[light.fam]
blue = ["#3584e4","#2e7de9"]
red = ["#cc0000","#f52a65"]
orange = ["#f57900","#8c6c3e"]
green = ["#4e9a06","#587539"]
[light.exact]
"#33d17a" = "#587539"
"#2ec27e" = "#587539"      # GTK4 stock success green (light)
"#2e3436" = "#3258af"
"#f6f5f4" = "#d0d5e3"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1a1b26"],[34.67,"#1a1b26"],[55.33,"#232531"],[66.33,"#292e42"],
        [86.67,"#3b4261"],[156,"#a9b1d6"],[179,"#a9b1d6"],[250,"#c0caf5"],
        [255,"#c0caf5"]]
fg = "#c0caf5"
top = "#c0caf5"
accent_fg = "#1a1b26"
view = "#1a1b26"
[shell.dark.fam]
blue = ["#3584e4","#7aa2f7"]
red = ["#c01c28","#f7768e"]
orange = ["#ff7800","#ff9e64"]
green = ["#26a269","#9ece6a"]
[shell.dark.exact]
"#cd9309" = "#e0af68"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#a9b1d6"      # web-login title, dim text
"#54545a" = "#292e42"      # notification/message card: surface
"#45454a" = "#262a3a"      # message card stacked behind the front one: bg and surface mixed 50 %

[shell.light]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#3258af"],[46,"#3258af"],[145,"#848cb5"],[224,"#b7c1e3"],
        [237,"#c4c8da"],[250,"#e1e2e7"],[255,"#e1e2e7"]]
fg = "#3258af"
top = "#e1e2e7"
accent_fg = "#1a1b2e"
view = "#e1e2e7"
[shell.light.fam]
blue = ["#3584e4","#2e7de9"]
red = ["#c01c28","#f52a65"]
orange = ["#e66100","#b15c00"]
green = ["#26a269","#587539"]
[shell.light.exact]
"#e5a50a" = "#8c6c3e"      # warning yellow
"#a5a5b7" = "#848cb5"

