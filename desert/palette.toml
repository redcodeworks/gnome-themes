# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #333333 5.5% towards fg
# derived: dark.surface derived: #333333 16.0% towards fg
# derived: dark.surface_high derived: #333333 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #333333 -> #33333b (the text colour varies per accent: the default needs its own token)
# derived: dark.green nudged to #98fb99 (it equals the default accent; keeps accent tokens unique)
title = "Desert"
gtk_name = "Desert"
shell_name = "Desert-Shell"
credit = "Desert (colours of the Ptyxis built-in 'Desert'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Desert.yml)"
default_accent = "green"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#333333"],[53,"#3e3e3e"],[66,"#545454"],
        [91,"#6c6c6c"],[145,"#959595"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#33333b"
view = "#333333"
[dark.fam]
blue = ["#15539e","#98fb98"]
red = ["#cc0000","#ff2b2b"]
orange = ["#f57900","#f0e68c"]
green = ["#4e9a06","#98fb99"]
[dark.exact]
"#26ab62" = "#98fb99"
"#26a269" = "#98fb99"      # GTK4 stock success green
"#3584e4" = "#98fb98"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#333333"],[34.67,"#333333"],[55.33,"#3e3e3e"],[66.33,"#545454"],
        [86.67,"#6c6c6c"],[156,"#c5c5c5"],[179,"#c5c5c5"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#33333b"
view = "#333333"
[shell.dark.fam]
blue = ["#3584e4","#98fb98"]
red = ["#c01c28","#ff2b2b"]
orange = ["#ff7800","#f8885c"]
green = ["#26a269","#98fb99"]
[shell.dark.exact]
"#cd9309" = "#f0e68c"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#c5c5c5"      # web-login title, dim text
"#54545a" = "#545454"      # notification/message card: surface
"#45454a" = "#494949"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#ff2b2b"
fg = "#ffffff"
[accents.dark.green]
color = "#98fb98"
fg = "#33333b"
[accents.dark.yellow]
color = "#f0e68c"
fg = "#33333b"
[accents.dark.blue]
color = "#cd853f"
fg = "#33333b"
[accents.dark.magenta]
color = "#ffdead"
fg = "#33333b"
[accents.dark.cyan]
color = "#ffa0a0"
fg = "#33333b"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#333333"
bg = "#3e3e3e"
surface = "#545454"
surface_high = "#6c6c6c"
popover = "#6c6c6c"
fg = "#ffffff"
red = "#ff2b2b"
green = "#98fb99"
yellow = "#f0e68c"
accent = "#98fb98"
accent_fg = "#33333b"
warning_fg = "#333333"
secondary_sidebar = "#3e3e3e"
