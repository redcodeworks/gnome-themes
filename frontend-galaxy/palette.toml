# GENERATED by tools/palette-from-scheme.py from scheme.toml (edit that, then run `just generate`): the tables read by
# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #1d2837 5.5% towards fg
# derived: dark.surface derived: #1d2837 16.0% towards fg
# derived: dark.surface_high derived: #1d2837 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #1d2837 -> #1d283f (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #fef02b (it equals the default accent; keeps accent tokens unique)
title = "Frontend Galaxy"
gtk_name = "Frontend-Galaxy"
shell_name = "Frontend-Galaxy-Shell"
credit = "Frontend Galaxy (colours of the Ptyxis built-in 'Frontend Galaxy'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Frontend%20Galaxy.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#1d2837"],[53,"#293442"],[66,"#414a57"],
        [91,"#5c646f"],[145,"#898f97"],[238,"#ffffff"],[255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#1d283f"
view = "#1d2837"
[dark.fam]
blue = ["#15539e","#fef02a"]
red = ["#cc0000","#f9555f"]
orange = ["#f57900","#fef02b"]
green = ["#4e9a06","#21b089"]
[dark.exact]
"#26ab62" = "#21b089"
"#26a269" = "#21b089"      # GTK4 stock success green
"#3584e4" = "#fef02a"
"#eeeeec" = "#ffffff"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#1d2837"],[34.67,"#1d2837"],[55.33,"#293442"],[66.33,"#414a57"],
        [86.67,"#5c646f"],[156,"#bfc2c6"],[179,"#bfc2c6"],[250,"#ffffff"],
        [255,"#ffffff"]]
fg = "#ffffff"
top = "#ffffff"
accent_fg = "#1d283f"
view = "#1d2837"
[shell.dark.fam]
blue = ["#3584e4","#fef02a"]
red = ["#c01c28","#f9555f"]
orange = ["#ff7800","#fca244"]
green = ["#26a269","#21b089"]
[shell.dark.exact]
"#cd9309" = "#fef02b"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#bfc2c6"      # web-login title, dim text
"#54545a" = "#414a57"      # notification/message card: surface
"#45454a" = "#353f4c"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#f9555f"
fg = "#1d283f"
[accents.dark.green]
color = "#21b089"
fg = "#1d283f"
[accents.dark.yellow]
color = "#fef02a"
fg = "#1d283f"
[accents.dark.blue]
color = "#589df6"
fg = "#1d283f"
[accents.dark.magenta]
color = "#944d95"
fg = "#ffffff"
[accents.dark.cyan]
color = "#1f9ee7"
fg = "#1d283f"

# roles for tools/libadwaita-gen.py
[roles.dark]
bg_deep = "#1d2837"
bg = "#293442"
surface = "#414a57"
surface_high = "#5c646f"
popover = "#5c646f"
fg = "#ffffff"
red = "#f9555f"
green = "#21b089"
yellow = "#fef02b"
accent = "#fef02a"
accent_fg = "#1d283f"
warning_fg = "#1d2837"
secondary_sidebar = "#293442"
