# SPDX-License-Identifier: MIT
# Built by tools/bulk-scheme.py from the Ptyxis built-in 'Seti'. Orange, the surface ladder, selection, comment and purple are DERIVED (the generated
# palette.toml says which); default_accent is the accent with the best contrast on bg_deep. Origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Seti.yml.
title = "Seti"
gtk_name = "Seti"
shell_name = "Seti-Shell"
credit = "Seti (colours of the Ptyxis built-in 'Seti'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Seti.yml)"
ptyxis = "Seti"
ptyxis_reason = "the colours ARE the Ptyxis built-in 'Seti' (bulk-built by tools/bulk-scheme.py)."
default_accent = "yellow"

[dark]
bg_deep = "#111213"
fg = "#cacecd"
selection = "#363838"   # DERIVED
red = "#c22832"
orange = "#d17740"   # DERIVED
yellow = "#e0c64f"
green = "#8ec43d"
cyan = "#8ec43d"
blue = "#43a5d5"
magenta = "#8b57b5"
purple = "#8b57b5"   # = magenta
# palette Color8 (bright black) = #323232: a candidate for `comment`
[dark.ansi]
red = "#c22832"
green = "#8ec43d"
yellow = "#e0c64f"
blue = "#43a5d5"
magenta = "#8b57b5"
cyan = "#8ec43d"
[dark.terminal]
source = "Seti"   # Ptyxis built-in id
black = "#323232"   # Ptyxis Color0
white = "#eeeeee"   # Ptyxis Color7
bright_black = "#323232"   # Ptyxis Color8
bright_white = "#ffffff"   # Ptyxis Color15
