# tools/gtk3-theme-gen.py, gtk4-theme-gen.py, shell-theme-gen.py and libadwaita-gen.py. Rules: see the script header.
# derived: dark.bg derived: #111213 5.5% towards fg
# derived: dark.surface derived: #111213 16.0% towards fg
# derived: dark.surface_high derived: #111213 28.0% towards fg
# derived: dark.fg_dim derived: fg 30% towards bg
# derived: dark.comment derived: fg 55% towards bg
# derived: dark.accent_fg #111213 -> #11121b (the text colour varies per accent: the default needs its own token)
# derived: dark.yellow nudged to #e0c650 (it equals the default accent; keeps accent tokens unique)
title = "Seti"
gtk_name = "Seti"
shell_name = "Seti-Shell"
credit = "Seti (colours of the Ptyxis built-in 'Seti'; origin named in the built-in's header: https://github.com/Gogh-Co/Gogh/tree/master/themes/Seti.yml)"
default_accent = "yellow"
dark_only = true
light_only = false

[dark]
ramp = [[0,"#000000"],[45,"#111213"],[53,"#1b1c1d"],[66,"#2f3031"],
        [91,"#454747"],[145,"#6a6c6c"],[238,"#cacecd"],[255,"#cacecd"]]
fg = "#cacecd"
top = "#cacecd"
accent_fg = "#11121b"
view = "#111213"
[dark.fam]
blue = ["#15539e","#e0c64f"]
red = ["#cc0000","#c22832"]
orange = ["#f57900","#e0c650"]
green = ["#4e9a06","#8ec43d"]
[dark.exact]
"#26ab62" = "#8ec43d"
"#26a269" = "#8ec43d"      # GTK4 stock success green
"#3584e4" = "#e0c64f"
"#eeeeec" = "#cacecd"

# [shell.*]: stock Shell greys differ from GTK's, so the ramps have their own stops.

[shell.dark]
selected_ctx = false   # Shell's :selected is a plain hover/keyboard-focus state, not text on an accent fill
ramp = [[0,"#111213"],[34.67,"#111213"],[55.33,"#1b1c1d"],[66.33,"#2f3031"],
        [86.67,"#454747"],[156,"#969998"],[179,"#969998"],[250,"#cacecd"],
        [255,"#cacecd"]]
fg = "#cacecd"
top = "#cacecd"
accent_fg = "#11121b"
view = "#111213"
[shell.dark.fam]
blue = ["#3584e4","#e0c64f"]
red = ["#c01c28","#c22832"]
orange = ["#ff7800","#d17740"]
green = ["#26a269","#8ec43d"]
[shell.dark.exact]
"#cd9309" = "#e0c650"      # warning yellow (hue 43, would fall in the orange family)
"#a5a5b7" = "#969998"      # web-login title, dim text
"#54545a" = "#2f3031"      # notification/message card: surface
"#45454a" = "#252627"      # message card stacked behind the front one: bg and surface mixed 50 %

# accents: [accents.<variant>.<name>] color = the terminal's ANSI colour, fg = text on it (contrast in tools/selftest.py)
[accents.dark.red]
color = "#c22832"
fg = "#cacecd"
[accents.dark.green]
color = "#8ec43d"
fg = "#11121b"
[accents.dark.yellow]
color = "#e0c64f"
fg = "#11121b"
[accents.dark.blue]
color = "#43a5d5"
fg = "#11121b"
[accents.dark.magenta]
color = "#8b57b5"
fg = "#11121b"
[accents.dark.cyan]
color = "#8ec43d"
fg = "#11121b"

# roles for tools/libadwaita-gen.py
[roles.dark]
